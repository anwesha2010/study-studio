<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4c1d95">
<title>Class 9 Revision Studio</title>
<style>
:root{
  --bg:#f6f4ff; --card:#ffffff; --ink:#1e1b3a; --muted:#6b6890; --line:#e6e2f7;
  --brand:#4c1d95; --brand2:#7c3aed; --good:#12a150; --goodbg:#e7f8ee; --bad:#e0384b; --badbg:#fdecee;
  --gold:#f5a524; --math:#4f46e5; --sci:#059669; --sst:#d97706;
  --r:20px; --shadow:0 6px 24px rgba(60,40,160,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
html,body{width:100%;min-height:100%;overscroll-behavior-y:none}
.wrap{max-width:1240px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 120px max(18px,env(safe-area-inset-left))}
@media (min-width:1000px){.wrap{padding-left:32px;padding-right:32px}.g2.wide3{grid-template-columns:repeat(3,1fr)}}
.fsbtn{position:absolute;right:14px;top:14px;z-index:2;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.dtcard{border-radius:24px;padding:20px;background:linear-gradient(135deg,#4c1d95,#db2777);color:#fff;position:relative;overflow:hidden;margin-top:14px}
.dtcard h3{font-size:21px}
.dtcard .chs{display:grid;gap:8px;margin:12px 0 14px}
.dtcard .chs div{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 12px;font-size:15px}
.dtcard .btn{background:#fff;color:#4c1d95}
.bigbadge{font-size:96px;line-height:1;animation:pop .5s}
.shelf{display:flex;gap:10px;flex-wrap:wrap}
.shelf .b{flex:1;min-width:110px;text-align:center;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.shelf .b span{font-size:34px;display:block}
.shelf .b b{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal div{background:#f1eefc;border-radius:12px;text-align:center;padding:6px 2px;font-size:11px;color:var(--muted)}
.cal div span{display:block;font-size:22px;height:28px}
.subres{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
h1,h2,h3{margin:0;line-height:1.2}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:22px;display:grid;place-items:center;flex:none}
.top h2{font-size:22px}
.top .sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:700px){.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.hero{background:linear-gradient(135deg,#5b4bdb,#8b5cf6 60%,#c084fc);color:#fff;border-radius:26px;padding:22px 22px 20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .hi{font-size:15px;opacity:.9}
.hero h1{font-size:30px;margin:2px 0 6px}
.hero .date{font-size:14px;opacity:.85}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;font-size:14px;backdrop-filter:blur(4px)}
.stat b{font-size:18px;display:block}
.moral{margin-top:14px;border-radius:22px;padding:18px 18px 16px;background:#fff8e6;border:2px solid #fde7b0;position:relative}
.moral .tag{font-size:12px;font-weight:800;letter-spacing:.08em;color:#b7791f;text-transform:uppercase}
.moral h3{font-size:20px;margin:6px 0 6px;color:#7a4b00}
.moral p{margin:0 0 10px;color:#5d4510}
.moral .task{background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;color:#6b4e12;border:1px dashed #f0cf7a}
.moral .quote{font-style:italic;color:#8a6a24;font-size:15px;margin-top:10px}
.sec{margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:end}
.sec h3{font-size:19px}
.sec span{color:var(--muted);font-size:14px}
.subj{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-align:left;width:100%;border-left:7px solid var(--c)}
.subj .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 14%,#fff);flex:none}
.subj .nm{font-weight:800;font-size:18px}
.subj .bk{color:var(--muted);font-size:13px}
.bar{height:9px;background:#eeeaf9;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,var(--brand));border-radius:9px;transition:width .6s}
.pct{font-weight:800;font-size:15px;color:var(--c)}
.action{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:left;width:100%}
.action .ic{font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.action b{display:block;font-size:17px}
.action small{color:var(--muted);font-size:13.5px}
.chap{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);width:100%;text-align:left}
.ring{--p:0;--c:var(--brand);width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#eeeaf9 0);font-size:13px;font-weight:800}
.ring span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center}
.chap .t{font-weight:700}
.chap .m{color:var(--muted);font-size:13px}
.stars{color:var(--gold);letter-spacing:1px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tab{padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;white-space:nowrap;font-size:15px}
.tab.on{background:var(--c,var(--brand));color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:800;background:var(--brand);color:#fff;font-size:17px;min-height:52px}
.btn.alt{background:#efeafd;color:var(--brand)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#efeafd;color:var(--brand)}
.pill.x{background:#e3f6ff;color:#0369a1}
.pill.imp{background:#fff1d6;color:#b45309}
ul.clean{list-style:none;padding:0;margin:0}
.prio li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prio li:last-child{border:0}
.prio .n{width:30px;height:30px;border-radius:10px;background:#efeafd;color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.trap{border-radius:16px;padding:14px;background:#fff;box-shadow:var(--shadow);border-left:6px solid var(--bad)}
.trap .w{color:var(--bad);font-weight:700}
.trap .r{color:var(--good);font-weight:700;margin-top:6px}
.trap .k{margin-top:8px;font-size:14px;background:#f6f4ff;border-radius:10px;padding:8px 10px;color:var(--brand)}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;border-radius:20px;padding:20px;background:#fff;box-shadow:var(--shadow);text-align:left;width:100%}
.flash .q{font-weight:700;font-size:18px}
.flash .a{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line);color:#14532d;display:none}
.flash.open .a{display:block}
.flash .hint{color:var(--muted);font-size:13px;margin-top:10px}
.flash.open .hint{display:none}
.selfmark{display:none;gap:8px;margin-top:12px}
.flash.open .selfmark{display:flex}
.selfmark button{flex:1;padding:10px;border-radius:12px;font-weight:800;font-size:14px}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qprog{flex:1;height:12px;background:#e9e5fa;border-radius:12px;overflow:hidden}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s}
.qcount{font-weight:800;color:var(--muted);font-size:15px;min-width:64px;text-align:right}
.timer{font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.qcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px}
.qcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qtext{font-size:21px;font-weight:700;line-height:1.4}
.ar{display:grid;gap:10px;margin-top:4px}
.ar div{background:#f6f4ff;border-radius:14px;padding:12px 14px;font-size:17px}
.ar b{color:var(--brand)}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:16px;border:2.5px solid var(--line);background:#fff;text-align:left;font-size:18px;min-height:58px;transition:transform .08s,border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt .l{width:34px;height:34px;border-radius:11px;background:#f1eefc;display:grid;place-items:center;font-weight:800;color:var(--brand);flex:none}
.opt.sel{border-color:var(--brand);background:#f3f0ff}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.no .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tfopts{grid-template-columns:1fr 1fr}
.tfopts .opt{justify-content:center;font-weight:800;font-size:20px}
.feedback{margin-top:16px;border-radius:16px;padding:14px 16px;display:none}
.feedback.show{display:block;animation:pop .25s}
.feedback.good{background:var(--goodbg);color:#0f5132}
.feedback.bad{background:var(--badbg);color:#7a1020}
.feedback b{font-size:18px}
.qfoot{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.res{text-align:center;padding:26px 18px}
.res .big{font-size:64px;font-weight:900;background:linear-gradient(135deg,var(--brand),#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
.res .msg{font-size:20px;font-weight:800;margin:6px 0}
.rev{margin-top:12px;text-align:left}
.rev .item{padding:12px;border-radius:14px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px;font-size:15px}
.rev .item .y{color:var(--bad)} .rev .item .c{color:var(--good);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 10px;border-radius:12px;min-width:68px}
.nav button span{font-size:24px}
.nav button.on{color:var(--brand);background:#f1eefc}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:15px}
.chip.on{border-color:var(--brand);background:#f1eefc;color:var(--brand)}
.kpi{text-align:center}
.kpi b{display:block;font-size:28px;color:var(--brand)}
.kpi small{color:var(--muted)}
.week{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;height:70px;border-radius:10px;background:#eeeaf9;position:relative;overflow:hidden;margin-bottom:4px}
.week i em{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(var(--brand2),var(--brand));border-radius:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#1e1b3a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;transition:transform .35s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.small{font-size:14px;color:var(--muted)}
.note{background:#eef7ff;border-radius:14px;padding:12px 14px;color:#0b4a6f;font-size:15px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-weight:800;font-size:14px}
.note-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;border-top:5px solid var(--c)}
.note-card .nh{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.note-card .nn{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;font-size:14px;flex:none}
.note-card .nt{font-size:16.5px;line-height:1.55}
.dot{color:var(--brand);font-weight:900;margin:0 6px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--brand);margin:0 4px;text-align:center}
.blank.filled{color:var(--good);border-color:var(--good);padding:0 6px}
.fcard{width:100%;min-height:340px;perspective:1200px;padding:0;display:block}
.fcard .fin{position:relative;width:100%;min-height:340px;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.fcard .ff,.fcard .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.fcard .ff{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#c084fc));color:#fff;text-align:center}
.fcard .ff .small{color:rgba(255,255,255,.85)}
.fcard .ft{font-size:26px;font-weight:900;margin-top:12px}
.fcard .fb{background:#fff;transform:rotateY(180deg);font-size:18px;line-height:1.6;text-align:left}
</style>
</head>

<script>
const DATA = {"subjects":[{"name":"Mathematics","book":"Ganita Manjari","icon":"➗","color":"#4f46e5","id":"math","chapters":[{"n":1,"t":"Orienting Yourself: The Use of Coordinates","intro":"Ganita Manjari Part I, Ch 1. The Cartesian plane — axes, origin, quadrants, plotting points, distance between points and the midpoint.","prio":[{"t":"Axes, origin and quadrants","s":3},{"t":"Plotting and reading points","s":3},{"t":"Distance formula","s":3},{"t":"Midpoint formula","s":3}],"notes":[{"h":"Cartesian plane","t":"Named after René Descartes. Two perpendicular number lines: x-axis (horizontal) and y-axis (vertical) meeting at the origin O(0, 0)."},{"h":"Ordered pair","t":"(x, y): x is the abscissa (horizontal distance), y is the ordinate (vertical distance). (2, 5) ≠ (5, 2)."},{"h":"Quadrants","t":"I (+, +) · II (−, +) · III (−, −) · IV (+, −), counted anticlockwise from the top right."},{"h":"Points on axes","t":"On the x-axis y = 0; on the y-axis x = 0. Points on axes lie in no quadrant."},{"h":"Distance formula","t":"Between (x₁, y₁) and (x₂, y₂): d = √[(x₂ − x₁)² + (y₂ − y₁)²]. From the origin: √(x² + y²)."},{"h":"Midpoint formula","t":"M = ((x₁ + x₂)/2, (y₁ + y₂)/2)."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Find the distance between A(−2, 3) and B(4, 11).","a":"√(6² + 8²) = √100 = 10 units.","m":3},{"q":"Find the midpoint of P(−4, 6) and Q(8, −2).","a":"((−4+8)/2, (6−2)/2) = (2, 2).","m":2}],"rq":[],"traps":[{"m":"Swapping x and y","c":"Always (x, y): along first, then up.","t":"—"},{"m":"Forgetting to square the differences","c":"d = √[(Δx)² + (Δy)²].","t":"—"}],"qs":[{"id":"math1m0","k":"mcq","q":"The point (−3, 4) lies in quadrant:","o":["II","I","III","IV"],"a":0,"e":"","sh":1},{"id":"math1m1","k":"mcq","q":"The point (5, −2) lies in quadrant:","o":["IV","II","III","I"],"a":0,"e":"","sh":1},{"id":"math1m2","k":"mcq","q":"The abscissa of (7, −9) is:","o":["7","−9","2","16"],"a":0,"e":"","sh":1},{"id":"math1m3","k":"mcq","q":"The point (0, −6) lies on the:","o":["y-axis","x-axis","origin","quadrant III"],"a":0,"e":"","sh":1},{"id":"math1m4","k":"mcq","q":"Distance of (3, 4) from the origin:","o":["5","7","1","25"],"a":0,"e":"","sh":1},{"id":"math1m5","k":"mcq","q":"Distance between (1, 2) and (4, 6):","o":["5","7","25","3"],"a":0,"e":"","sh":1},{"id":"math1m6","k":"mcq","q":"Midpoint of (2, 4) and (6, 8):","o":["(4, 6)","(8, 12)","(2, 2)","(3, 5)"],"a":0,"e":"","sh":1},{"id":"math1m7","k":"mcq","q":"Signs of coordinates in quadrant III:","o":["(−, −)","(+, −)","(−, +)","(+, +)"],"a":0,"e":"","sh":1},{"id":"math1m8","k":"mcq","q":"The coordinate plane was developed by:","o":["René Descartes","Euclid","Pythagoras","Newton"],"a":0,"e":"","sh":1},{"id":"math1m9","k":"mcq","q":"A point on the x-axis has:","o":["y = 0","x = 0","x = y","y = 1"],"a":0,"e":"","sh":1},{"id":"math1t10","k":"tf","q":"(4, 7) and (7, 4) are the same point.","a":1,"e":""},{"id":"math1t11","k":"tf","q":"The origin lies in no quadrant.","a":0,"e":""},{"id":"math1t12","k":"tf","q":"In quadrant II, the x-coordinate is negative.","a":0,"e":""},{"id":"math1f13","k":"mcq","fill":1,"q":"The y-coordinate of a point is called the ___.","o":["ordinate","abscissa","origin","quadrant"],"a":0,"e":"","sh":1},{"id":"math1f14","k":"mcq","fill":1,"q":"The quadrants are numbered ___.","o":["anticlockwise","clockwise","randomly","alphabetically"],"a":0,"e":"","sh":1},{"id":"math1f15","k":"mcq","fill":1,"q":"Distance of (0, 8) from the origin is ___.","o":["8","0","64","4"],"a":0,"e":"","sh":1}]},{"n":2,"t":"Introduction to Linear Polynomials","intro":"Ganita Manjari Part I, Ch 2. Variables, constants and expressions; linear polynomials; finding rules from patterns; zero of a polynomial; graphs of linear relationships.","prio":[{"t":"Polynomials and degree","s":3},{"t":"Linear polynomial ax + b","s":3},{"t":"Value and zero of a polynomial","s":3},{"t":"Graph of a linear relationship","s":3}],"notes":[{"h":"Polynomial","t":"An expression with whole-number powers of a variable: 3x² + 2x − 5. Degree = highest power."},{"h":"Types by degree","t":"Linear (1): 2x + 3 · Quadratic (2): x² − 4 · Cubic (3): x³ + x."},{"h":"Linear polynomial","t":"p(x) = ax + b, a ≠ 0. Patterns that grow by a constant amount follow linear rules (e.g. 3, 5, 7, 9 → 2n + 1)."},{"h":"Value","t":"p(2) for p(x) = 3x − 1 is 3(2) − 1 = 5."},{"h":"Zero","t":"The value of x for which p(x) = 0. For ax + b, zero = −b/a. A linear polynomial has exactly one zero."},{"h":"Graph","t":"y = ax + b is a straight line; a is the slope (steepness) and b is where it cuts the y-axis."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Find the zero of p(x) = 4x + 10 and verify.","a":"4x + 10 = 0 → x = −5/2; p(−5/2) = −10 + 10 = 0 ✓.","m":2},{"q":"Matchstick triangles in a row need 3, 5, 7, … sticks. Find the rule and the sticks for 20 triangles.","a":"2n + 1; for n = 20: 41 sticks.","m":3}],"rq":[],"traps":[{"m":"Writing the zero of 2x + 6 as 3","c":"Solve 2x + 6 = 0 → x = −3.","t":"—"}],"qs":[{"id":"math2m0","k":"mcq","q":"Degree of 4x³ − 2x + 7:","o":["3","4","1","7"],"a":0,"e":"","sh":1},{"id":"math2m1","k":"mcq","q":"Which is a linear polynomial?","o":["5x − 2","x² + 1","x³","1/x + 2"],"a":0,"e":"","sh":1},{"id":"math2m2","k":"mcq","q":"Value of p(x) = 2x + 3 at x = 4:","o":["11","9","14","24"],"a":0,"e":"","sh":1},{"id":"math2m3","k":"mcq","q":"Zero of 3x − 12:","o":["4","−4","12","3"],"a":0,"e":"","sh":1},{"id":"math2m4","k":"mcq","q":"Zero of 2x + 5:","o":["−5/2","5/2","−2/5","5"],"a":0,"e":"","sh":1},{"id":"math2m5","k":"mcq","q":"Rule for the pattern 4, 7, 10, 13, …:","o":["3n + 1","4n","n + 3","3n"],"a":0,"e":"","sh":1},{"id":"math2m6","k":"mcq","q":"The graph of y = 2x + 1 is a:","o":["straight line","parabola","circle","zig-zag"],"a":0,"e":"","sh":1},{"id":"math2m7","k":"mcq","q":"y = 3x + 2 cuts the y-axis at:","o":["(0, 2)","(2, 0)","(0, 3)","(3, 2)"],"a":0,"e":"","sh":1},{"id":"math2m8","k":"mcq","q":"Number of zeros of a linear polynomial:","o":["1","0","2","infinite"],"a":0,"e":"","sh":1},{"id":"math2m9","k":"mcq","q":"Which is NOT a polynomial?","o":["x + 1/x","x² + 2","7","3x − 4"],"a":0,"e":"","sh":1},{"id":"math2t10","k":"tf","q":"A constant like 7 is a polynomial of degree 0.","a":0,"e":""},{"id":"math2t11","k":"tf","q":"x² + 3x is a linear polynomial.","a":1,"e":"It is quadratic."},{"id":"math2t12","k":"tf","q":"The zero of ax + b is −b/a.","a":0,"e":""},{"id":"math2f13","k":"mcq","fill":1,"q":"A polynomial of degree 2 is called ___.","o":["quadratic","linear","cubic","constant"],"a":0,"e":"","sh":1},{"id":"math2f14","k":"mcq","fill":1,"q":"In y = mx + c, m is the ___.","o":["slope","intercept","zero","degree"],"a":0,"e":"","sh":1},{"id":"math2f15","k":"mcq","fill":1,"q":"The pattern 5, 10, 15, 20 follows the rule ___.","o":["5n","n + 5","5n + 1","10n"],"a":0,"e":"","sh":1}]},{"n":3,"t":"The World of Numbers","intro":"Ganita Manjari Part I, Ch 3. Natural, whole, integer, rational and irrational numbers; real numbers on the number line; decimal expansions; density; the square root spiral.","prio":[{"t":"Rational and irrational numbers","s":3},{"t":"Decimal expansions","s":3},{"t":"Real numbers on the number line","s":3},{"t":"Proof that √2 is irrational","s":2}],"notes":[{"h":"Number families","t":"N ⊂ W ⊂ Z ⊂ Q ⊂ R. Rational numbers: p/q with integers p, q and q ≠ 0. Irrational: cannot be written as p/q (√2, √3, π)."},{"h":"Decimal expansions","t":"Rational → terminating (3/8 = 0.375) or non-terminating repeating (1/3 = 0.333…). Irrational → non-terminating non-repeating (√2 = 1.41421…)."},{"h":"Terminating test","t":"p/q in lowest terms terminates if q has only 2 and/or 5 as prime factors."},{"h":"Recurring to fraction","t":"0.7̅ = 7/9; 0.2̅7̅ = 27/99 = 3/11."},{"h":"Density","t":"Between any two rational numbers there are infinitely many rational numbers (e.g. their average)."},{"h":"Square root spiral","t":"Right triangles with sides 1 build √2, √3, √4, … on the number line. Real numb anisms reproduce, asexual and sexual reproduction in plants and animals, and the biological importance of variation.","prio":[{"t":"Importance of reproduction","s":2},{"t":"Asexual reproduction methods","s":3},{"t":"Sexual reproduction in flowering plants","s":3},{"t":"Variation and continuity of life","s":3}],"notes":[{"h":"Reproduction","t":"Producing new individuals of the same kind — ensures continuity of species. DNA copying is central; small copying errors create variation."},{"h":"Asexual (one parent)","t":"Binary fission (Amoeba), multiple fission (Plasmodium), budding (Hydra, yeast), fragmentation (Spirogyra), regeneration (Planaria), spore formation (Rhizopus), vegetative propagation (potato tuber, Bryophyllum leaves). Offspring are clones."},{"h":"Sexual (two parents)","t":"Fusion of male and female gametes (fertilisation) forms a zygote; produces variation."},{"h":"Flowers","t":"Stamen (anther + filament; makes pollen) — male. Pistil/carpel (stigma, style, ovary) — female. Pollination: transfer of pollen to stigma (self or cross; by wind, insects, water)."},{"h":"After fertilisation","t":"Ovary → fruit; ovule → seed; zygote → embryo."},{"h":"Variation","t":"Sexual reproduction mixes genes, helping species adapt and survive changing environments."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Differentiate between asexual and sexual reproduction.","a":"Asexual: one parent, no gametes, identical offspring, fast. Sexual: two parents, gametes fuse, variation, slower.","m":3},{"q":"Why is variation important for a species?","a":"It helps some individuals survive changes in the environment, ensuring the species continues.","m":2}],"rq":[],"traps":[{"m":"Confusing pollination with fertilisation","c":"Pollination = pollen to stigma; fertilisation = fusion of gametes.","t":"—"}],"qs":[{"id":"sci11m0","k":"mcq","q":"Amoeba reproduces by:","o":["binary fission","budding","spores","fragmentation"],"a":0,"e":"","sh":1},{"id":"sci11m1","k":"mcq","q" t":"Patterns in Life: Diversity and Classification","intro":"Biodiversity, the basis of classification, hierarchy of categories, binomial nomenclature, the five kingdoms, and major groups of plants and animals.","prio":[{"t":"Need and basis of classification","s":3},{"t":"Hierarchy and binomial nomenclature","s":3},{"t":"Five kingdom classification","s":3},{"t":"Plant and animal groups","s":3}],"notes":[{"h":"Why classify","t":"Makes the study of millions of organisms easy and shows evolutionary relationships."},{"h":"Hierarchy","t":"Kingdom → Phylum/Division → Class → Order → Family → Genus → Species. Species = basic unit (can interbreed)."},{"h":"Binomial nomenclature","t":"Carolus Linnaeus: Genus (capital) + species (small), italicised: Homo sapiens, Mangifera indica, Panthera tigris."},{"h":"Five kingdoms (Whittaker, 1969)","t":"Monera (prokaryotes: bacteria) · Protista (unicellular eukaryotes: Amoeba) · Fungi (yeast, mushrooms) · Plantae · Animalia."},{"h":"Plants","t":"Thallophyta (algae), Bryophyta (mosses — ‘amphibians of plants’), Pteridophyta (ferns), Gymnosperms (naked seeds: pine), Angiosperms (seeds in fruits; monocots and dicots)."},{"h":"Animals","t":"Invertebrates (Porifera, Cnidaria, worms, Arthropoda — largest phylum, Mollusca, Echinodermata) and vertebrates (fishes, amphibians, reptiles, birds, mammals)."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Write the hierarchy of classification from kingdom to species.","a":"Kingdom → Phylum → Class → Order → Family → Genus → Species.","m":2},{"q":"Name the five kingdoms with one example each.","a":"Monera (bacteria), Protista (Amoeba), Fungi (yeast), Plantae (mango), Animalia (tiger).","m":3}],"rq":[],"traps":[{"m":"Writing scientific names like ‘Homo Sapiens’","c":"Species name is lowercase: Homo sapiens.","t":"—"}],"qs":[{"id":"sci12m0","k":"mcq","q":"Father of binomial nomenclature:","o":["Carolus Linnaeus","Whittaker","Darwin","Mendel"],"a":0,"e":"","sh":1},{"id":"sci12m1","k":"mc ter, and Life","intro":"Earth’s four spheres, energy from the Sun and its flow, biogeochemical cycles (water, carbon, nitrogen, oxygen), climate and how disturbing one sphere affects others.","prio":[{"t":"Four spheres of Earth","s":3},{"t":"Energy flow and the greenhouse effect","s":3},{"t":"Biogeochemical cycles","s":3},{"t":"Human impact and interconnections","s":3}],"notes":[{"h":"Spheres","t":"Lithosphere (rocks, soil), hydrosphere (water), atmosphere (air), biosphere (life) — all interacting."},{"h":"Energy","t":"The Sun is the main energy source. Producers capture it; energy flows one way through food chains (about 10% passes to the next level)."},{"h":"Greenhouse effect","t":"CO₂, methane and water vapour trap heat, keeping Earth warm (~15 °C average). Extra greenhouse gases cause global warming and climate change."},{"h":"Water cycle","t":"Evaporation, transpiration → condensation → precipitation → runoff and infiltration."},{"h":"Carbon cycle","t":"Photosynthesis removes CO₂; respiration, decomposition and burning fuels release it; oceans store carbon."},{"h":"Nitrogen cycle","t":"Atmospheric N₂ (78%) fixed by Rhizobium and lightning → nitrates used by plants → animals → decomposers → denitrifying bacteria return N₂."},{"h":"Interconnections","t":"A disturbance in one sphere shows up in others (deforestation → more CO₂, soil erosion, less rain)."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Describe the carbon cycle in four steps.","a":"Plants take CO₂ (photosynthesis) → carbon in food chains → respiration/decomposition/burning release CO₂ → oceans and fossils store carbon.","m":3},{"q":"Explain with an example how a change in one sphere affects another.","a":"Deforestation (biosphere) increases CO₂ (atmosphere), causes soil erosion (lithosphere) and less rain/runoff changes (hydrosphere).","m":3}],"rq":[],"traps":[{"m":"Saying the greenhouse effect is entirely bad","c":"Natural greenhouse effect keeps Earth habitable; excess causes warming.","t":"—"}],"qs":[{"id":"sci13m0","k":"mcq","q":"Water bodies of Earth form the:","o":["hydrosphere","lithosphere","atmosphere","biosphere"],"a":0,"e":"","sh":1},{"id":"sci13m1","k":"mcq","q":"Main source of energy for Earth:","o":["the Sun","the Moon","volcanoes","oceans"],"a":0,"e":"","sh":1},{"id":"sci13m2","k":"mcq","q":"About how much energy passes to the next trophic level?","o":["10%","50%","90%","100%"],"a":0,"e":"","sh":1},{"id":"sci13m3","k":"mcq","q":"Gas removed from air in photosynthesis:","o":["carbon dioxide","oxygen","nitrogen","argon"],"a":0,"e":"","sh":1},{"id":"sci13m4","k":"mcq","q":"Nitrogen-fixing bacteria in legume roots:","o":["Rhizobium","Lactobacillus","Yeast","Plasmodium"],"a":0,"e":"","sh":1},{"id":"sci13m5","k":"mcq","q":"Which is a greenhouse gas?","o":["methane","nitrogen","oxygen","argon"],"a":0,"e":"","sh":1},{"id":"sci13m6","k":"mcq","q":"Water loss from leaves:","o":["transpiration","condensation","precipitation","infiltration"],"a":0,"e":"","sh":1},{"id":"sci13m7","k":"mcq","q":"Bacteria that return N₂ to the air:","o":["denitrifying bacteria","nitrogen-fixing bacteria","lactobacilli","cyanobacteria only"],"a":0,"e":"","sh":1},{"id":"sci13m8","k":"mcq","q":"Burning fossil fuels adds ___ to the atmosphere.","o":["carbon dioxide","nitrogen","ozone only","helium"],"a":0,"e":"","sh":1},{"id":"sci13m9","k":"mcq","q":"Rocks and soil form the:","o":["lithosphere","biosphere","hydrosphere","atmosphere"],"a":0,"e":"","sh":1},{"id":"sci13t10","k":"tf","q":"Energy flows in a cycle through ecosystems.","a":1,"e":"Energy flows one way; matter cycles."},{"id":"sci13t11","k":"tf","q":"Lightning can fix atmospheric nitrogen.","a":0,"e":""},{"id":"sci13t12","k":"tf","q":"Deforestation can affect rainfall and soil.","a":0,"e":""},{"id":"sci13f13","k":"mcq","fill":1,"q":"The zone of Earth where life exists is the ___.","o":["biosphere","lithosphere","stratosphere","core"],"a":0,"e":"","sh":1},{"id":"sci13f14","k":"mcq","fill":1,"q":"Rain, snow and hail are forms of ___.","o":["precipitation","evaporation","transpiration","runoff"],"a":0,"e":"","sh":1},{"id":"sci13f15","k":"mcq","fill":1,"q":"Nitrogen makes up about ___% of air.","o":["78","21","1","50"],"a":0,"e":"","sh":1}]}]},{"name":"Social Science","book":"Understanding Society: India and Beyond","icon":"🌏","color":"#d97706","id":"sst","chapters":[{"n":1,"t":"Understanding Social Science","intro":"Part 1, Ch 1. What social science is, its branches, why it matters, its methods and an Indian perspective on studying society.","prio":[{"t":"Meaning and scope of social science","s":3},{"t":"Branches: history, geography, political science, economics, sociology","s":3},{"t":"Sources and methods","s":3},{"t":"Indian knowledge traditions","s":2}],"notes":[{"h":"Social science","t":"The study of human society — how people live, relate, govern themselves, use resources and change over time."},{"h":"Branches","t":"History (the past), Geography (people and places), Political Science (government and power), Economics (production, distribution, choices), Sociology and Anthropology (society and culture)."},{"h":"Interconnected","t":"Real issues — floods, elections, prices — need ideas from many branches together."},{"h":"Sources","t":"Primary sources (inscriptions, coins, archives, interviews) and secondary sources (books written later). Methods: observation, surveys, fieldwork, data analysis, maps."},{"h":"Objectivity","t":"Check facts, use multiple sources, avoid bias, respect different viewpoints."},{"h":"Indian perspective","t":"Long traditions of thinking about society: Arthashastra (statecraft), Thirukkural (ethics), the idea of Vasudhaiva Kutumbakam (world as one family)."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Why is social science useful in daily life?","a":"Helps understand society, rights and duties, economy, environment; makes informed citizens and better decisions.","m":3},{"q":"Differentiate between primary and secondary sources with examples.","a":"Primary: from the time (coins, letters, inscriptions). Secondary: later interpretations (textbooks, articles).","m":2}],"rq":[],"traps":[{"m":"Treating social science as only memorising dates","c":"It is about understanding people, causes and connections.","t":"—"}],"qs":[{"id":"sst1m0","k":"mcq","q":"The study of how humans live together in society:","o":["social science","physics","chemistry","botany"],"a":0,"e":"","sh":1},{"id":"sst1m1","k":"mcq","q":"Branch that studies government and power:","o":["political science","geography","history","economics"],"a":0,"e":"","sh":1},{"id":"sst1m2","k":"mcq","q":"Branch that studies choices about scarce resources:","o":["economics","geography","sociology","history"],"a":0,"e":"","sh":1},{"id":"sst1m3","k":"mcq","q":"An inscription on a pillar is a:","o":["primary source","secondary source","fictional source","map only"],"a":0,"e":"","sh":1},{"id":"sst1m4","k":"mcq","q":"A textbook written today about the Mauryas is a:","o":["secondary source","primary source","archaeological site","coin"],"a":0,"e":"","sh":1},{"id":"sst1m5","k":"mcq","q":"Ancient Indian text on statecraft:","o":["Arthashastra","Rigveda","Thirukkural","Panchatantra"],"a":0,"e":"","sh":1},{"id":"sst1m6","k":"mcq","q":"‘The world is one family’:","o":["Vasudhaiva Kutumbakam","Satyameva Jayate","Ahimsa Paramo Dharma","Sarve Bhavantu Sukhinah"],"a":0,"e":"","sh":1},{"id":"sst1m7","k":"mcq","q":"Collecting data by asking many people questions:","o":["survey","excavation","experiment in a lab","meditation"],"a":0,"e":"","sh":1},{"id":"sst1m8","k":"mcq","q":"Branch that studies people and places on Earth:","o":["geography","political science","economics","history"],"a":0,"e":"","sh":1},{"id":"sst1m9","k":"mcq","q":"Thirukkural is mainly a work on:","o":["ethics and conduct","astronomy","medicine","architecture"],"a":0,"e":"","sh":1},{"id":"sst1t10","k":"tf","q":"Social science issues are often studied using several branches together.","a":0," "a":0,"e":"","sh":1},{"id":"sst2m8","k":"mcq","q":"GLOF stands for:","o":["Glacial Lake Outburst Flood","Ground Level Ocean Flow","Great Land Overflow","Global Lake Overflow"],"a":0,"e":"","sh":1},{"id":"sst2m9","k":"mcq","q":"Plates moving apart form:","o":["divergent boundaries","convergent boundaries","transform faults","deltas"],"a":0,"e":"","sh":1},{"id":"sst2t10","k":"tf","q":"Weathering moves rock material from one place to another.","a":1,"e":"That is erosion; weathering breaks rocks in place."},{"id":"sst2t11","k":"tf","q":"The outer core is liquid.","a":0,"e":""},{"id":"sst2t12","k":"tf","q":"Sea stacks are formed by wave erosion.","a":0,"e":""},{"id":"sst2f13","k":"mcq","fill":1,"q":"Forces acting from inside the Earth are ___ forces.","o":["endogenic","exogenic","magnetic","frictional"],"a":0,"e":"","sh":1},{"id":"sst2f14","k":"mcq","fill":1,"q":"A river deposits sediment at its mouth to form a ___.","o":["delta","cliff","dune","moraine"],"a":0,"e":"","sh":1},{"id":"sst2f15","k":"mcq","fill":1,"q":"Earthquake magnitude is measured on the ___ scale.","o":["Richter","Beaufort","Celsius","Mohs"],"a":0,"e":"","sh":1}]},{"n":3,"t":"Atmosphere and Climate","intro":"Part 1, Ch 3. Structure and composition of the atmosphere, elements of weather and climate, India’s seasons and monsoon, climate change, floods and carbon footprint.","prio":[{"t":"Composition and layers of the atmosphere","s":3},{"t":"Weather vs climate; factors of climate","s":3},{"t":"Indian monsoon and seasons","s":3},{"t":"Climate change and carbon footprint","s":3}],"notes":[{"h":"Composition","t":"Nitrogen ~78%, oxygen ~21%, argon ~0.93%, carbon dioxide ~0.04%, plus water vapour and dust."},{"h":"Layers","t":"Troposphere (weather, temperature falls with height) → stratosphere (ozone layer, jets fly here) → mesosphere (meteors burn) → thermosphere (ionosphere, radio waves) → exosphere."},{"h":"Weather and climate","t":"Weather: short-term conditions. Climate: long-term average (30+ years). Factors: latitude, altitude, distance from sea, winds, relief, ocean currents."},{"h":"Monsoon","t":"Seasonal reversal of winds. South-west monsoon (June–September) brings most rainfall; retreating monsoon (October–November). Mawsynram gets very high rainfall; western Rajasthan very little."},{"h":"India’s seasons","t":"Cold weather (Dec–Feb), hot weather (Mar–May), advancing monsoon (Jun–Sep), retreating monsoon (Oct–Nov)."},{"h":"Climate change","t":"Rising greenhouse gases → global warming, melting glaciers, sea-level rise, extreme weather, floods. Carbon footprint = total greenhouse gases caused by a person or activity — reduce it by saving energy, public transport, less waste."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Name the five layers of the atmosphere and one feature of each.","a":"Troposphere (weather), stratosphere (ozone), mesosphere (meteors burn), thermosphere (ionosphere), exosphere (outermost, thin).","m":3},{"q":"Suggest four ways to reduce your carbon footprint.","a":"Use public transport/cycle, save electricity, reduce/reuse/recycle, avoid food waste, plant trees.","m":2}],"rq":[],"traps":[{"m":"Saying climate changes daily","c":"Weather changes daily; climate is the long-term pattern.","t":"—"}],"qs":[{"id":"sst3m0","k":"mcq","q":"Most abundant gas in the atmosphere:","o":["nitrogen","oxygen","argon","carbon dioxide"],"a":0,"e":"","sh":1},{"id":"sst3m1","k":"mcq","q":"Weather phenomena occur in the:","o":["troposphere","stratosphere","mesosphere","exosphere"],"a":0,"e":"","sh":1},{"id":"sst3m2","k":"mcq","q":"The ozone layer is in the:","o":["stratosphere","troposphere","thermosphere","mesosphere"],"a":0,"e":"","sh":1},{"id":"sst3m3","k":"mcq","q":"Meteors burn up mostly in the:","o":["mesosphere","troposphere","stratosphere","exosphere"],"a":0,"e":"","sh":1},{"id":"sst3m4","k":"mcq","q":"Radio waves are reflected by the:","o":["ionosphere (thermosphere)","troposphere","stratosphere","mesosphere"],"a":0,"e":"","sh":1},{"id":"sst3m5","k":"mcq","q":"Average weather over about 30 years is:","o":["climate","weather","season","forecast"],"a":0,"e":"","sh":1},{"id":"sst3m6","k":"mcq","q":"Most of India’s rainfall comes from the:","o":["south-west monsoon","north-east trade winds only","western disturbances","cyclones only"],"a":0,"e":"","sh":1},{"id":"sst3m7","k":"mcq","q":"Retreating monsoon season:","o":["October–November","June–September","December–February","March–May"],"a":0,"e":"","sh":1},{"id":"sst3m8","k":"mcq","q":"Total greenhouse gas emissions caused by a person:","o":["carbon footprint","ecological niche","greenhouse effect","ozone hole"],"a":0,"e":"","sh":1},{"id":"sst3m9","k":"mcq","q":"Temperature in the troposphere generally ___ with height.","o":["decreases","increases","stays the same","doubles"],"a":0,"e":"","sh":1},{"id":"sst3t10","k":"tf","q":"Places at higher altitude are generally cooler.","a":0,"e":""},{"id":"sst3t11","k":"tf","q":"Carbon dioxide is the most abundant gas in air.","a":1,"e":"Nitrogen is."},{"id":"sst3t12","k":"tf","q":"Climate change can increase extreme weather events.","a":0,"e":""},{"id":"sst3f13","k":"mcq","fill":1,"q":"‘Monsoon’ comes from the Arabic word ___ meaning season.","o":["mausim","monsun","mosam","manas"],"a":0,"e":"","sh":1},{"id":"sst3f14","k":"mcq","fill":1,"q":"Places near the sea have a ___ climate.","o":["moderate","extreme","polar","dry"],"a":0,"e":"","sh":1},{"id":"sst3f15","k":"mcq","fill":1,"q":"Oxygen forms about ___% of air.","o":["21","78","1","50"],"a":0,"e":"","sh":1}]},{"n":4,"t":"Early Humans and Beginning of Civilisation","intro":"Part 1, Ch 4. Human ancestors, archaeological periods, hunter-gatherers, the Neolithic farming revolution, Harappan civilisation, and the Mesopotamian, Egyptian and Chinese civilisations.","prio":[{"t":"Human evolution and Stone Age periods","s":3},{"t":"Neolithic revolution and early farming (Mehrgarh)","s":3},{"t":"Harappan civilisation","s":3},{"t":"Other early civilisations: Mesopotamia, Egypt, China","s":3}],"notes":[{"h":"Early humans","t":"Homo sapiens evolved in Africa about 3 lakh years ago and spread worldwide. Earlier species: Homo habilis, Homo erectus."},{"h":"Stone Age","t":"Palaeolithic (Old: hunter-gatherers, stone tools, Bhimbetka rock shelters with paintings) → Mesolithic (Middle: microliths) → Neolithic (New: farming, polished tools, settled life)."},{"h":"Neolithic revolution","t":"Domestication of plants and animals; Mehrgarh (Balochistan, c. 7000 BCE) — wheat, barley, sheep, goats; pottery and permanent houses."},{"h":"Harappan (Indus–Sarasvati) civilisation","t":"c. 2600–1900 BCE mature phase; cities: Harappa, Mohenjo-daro, Dholavira, Lothal (dockyard), Kalibangan, Rakhigarhi. Grid streets, covered drains, Great Bath, standard weights, seals, script not yet deciphered; trade with Mesopotamia."},{"h":"Mesopotamia","t":"Between Tigris and Euphrates; Sumerians; cuneiform writing; ziggurats; Code of Hammurabi."},{"h":"Egypt","t":"Along the Nile; pharaohs, pyramids, hieroglyphics, mummies."},{"h":"China","t":"Along the Huang He (Yellow River); Shang dynasty, oracle bones, silk, bronze."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Write four features of Harappan town planning.","a":"Grid streets, covered drains, baked brick houses, citadel and lower town, Great Bath, granaries.","m":3},{"q":"Why is the Neolithic revolution important?","a":"Farming gave surplus food, settled villages, pottery, population growth — the base for civilisations.","m":2}],"rq":[],"traps":[{"m":"Thinking Harappans had a deciphered script","c":"The Harappan script is still not deciphered.","t":"—"}],"qs":[{"id":"sst4m0","k":"mcq","q":"Homo sapiens first evolved in:","o":["Africa","India","Europe","Australia"],"a":0,"e":"","sh":1},{"id":"sst4m1","k":"mcq","q":"Bhimbetka is famous for:","o":["rock shelter paintings","pyramids","ziggurats","dockyard"],"a":0,"e":"","sh":1},{"id":"sst4m2","k":"mcq","q":"Farming and settled life began in the:","o":["Neolithic age","Palaeolithic age","Mesolithic age","Iron age"],"a":0,"e":"","sh":1},{"id":"sst4m3","k":"mcq","q":"An early farming site in the subcontinent:","o":["Mehrgarh","Dholavira","Ur","Memphis"],"a":0,"e":"","sh":1},{"id":"sst4m4","k":"mcq","q":"The dockyard of the Harappan civilisation:","o":["Lothal","Mohenjo-daro","Harappa","Kalibangan"],"a":0,"e":"","sh":1},{"id":"sst4m5","k":"mcq","q":"The Great Bath is at:","o":["Mohenjo-daro","Lothal","Rakhigarhi","Mehrgarh"],"a":0,"e":"","sh":1},{"id":"sst4m6","k":"mcq","q":"The Harappan script:","o":["has not been deciphered","is fully read","is Brahmi","is Sanskrit"],"a":0,"e":"","sh":1},{"id":"sst4m7","k":"mcq","q":"Cuneiform writing belongs to:","o":["Mesopotamia","Egypt","China","Harappa"],"a":0,"e":"","sh":1},{"id":"sst4m8","k":"mcq","q":"Hieroglyphics belong to:","o":["Egypt","Mesopotamia","China","Harappa"],"a":0,"e":"","sh":1},{"id":"sst4m9","k":"mcq","q":"The Chinese civilisation grew along the:","o":["Huang He","Nile","Tigris","Indus"],"a":0,"e":"","sh":1},{"id":"sst4t10","k":"tf","q":"Harappan cities had covered drains.","a":0,"e":""},{"id":"sst4t11","k":"tf","q":"Microliths are typical of the Palaeolithic age.","a":1,"e":"They are typical of the Mesolithic."},{"id":"sst4t12","k":"tf","q":"The Code of Hammurabi is from Mesopotamia.","a":0,"e":""},{"id":"sst4f13","k":"mcq","fill":1,"q":"Egyptian kings were called ___.","o":["pharaohs","emperors","sultans","rajas"],"a":0,"e":"","sh":1},{"id":"sst4f14","k":"mcq","fill":1,"q":"Mesopotamia lay between the Tigris and ___.","o":["Euphrates","Nile","Indus","Ganga"],"a":0,"e":"","sh":1},{"id":"sst4f15","k":"mcq","fill":1,"q":"The domestication of plants and animals is called the ___ revolution.","o":["Neolithic","Industrial","Green","French"],"a":0,"e":"","sh":1}]},{"n":5,"t":"State and Society (up to 1000 CE)","intro":"Part 1, Ch 5. The Vedic age — geography, texts, rituals, political and social order; early empires and their administration; education and knowledge traditions; trade routes, guilds and crafts.","prio":[{"t":"Vedic age: texts and society","s":3},{"t":"Early states and empires; administration","s":3},{"t":"Education: gurukulas, Takshashila, Nalanda","s":3},{"t":"Trade, guilds and crafts","s":3}],"notes":[{"h":"Vedic geography","t":"Early Vedic people lived in the Sapta Sindhu region (land of seven rivers); later spread to the Ganga plains."},{"h":"Texts","t":"Four Vedas — Rig, Sama, Yajur, Atharva; Brahmanas, Aranyakas, Upanishads (philosophy). Rigveda is the oldest."},{"h":"Polity","t":"Early tribes (jana) led by a raja; assemblies sabha and samiti. Later janapadas and mahajanapadas, then empires (Mauryas, Guptas)."},{"h":"Mauryan administration","t":"Chandragupta Maurya and Chanakya (Arthashastra); provinces, officials, spies; Ashoka’s dhamma and edicts."},{"h":"Education","t":"Gurukulas; universities at Takshashila (Taxila), Nalanda, Vikramashila, Valabhi drew students from Asia. Scholars: Panini (grammar), Charaka and Sushruta (medicine), Aryabhata (astronomy)."},{"h":"Trade and guilds","t":"Shrenis (guilds) of merchants and artisans regulated work, quality and prices; trade routes like the Uttarapatha and Dakshinapatha; ports like Bharuch and Arikamedu."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Describe the role of guilds (shrenis) in ancient India.","a":"Organised artisans and merchants, set quality and prices, trained apprentices, acted as banks, funded religious works.","m":3},{"q":"Name four ancient Indian centres of learning.","a":"Takshashila, Nalanda, Vikramashila, Valabhi (also Kanchi).","m":2}],"rq":[],"traps":[{"m":"Calling the Upanishads a law book","c":"They are philosophical texts on the self and reality.","t":"—"}],"qs":[{"id":"sst5m0","k":"mcq","q":"The oldest Veda:","o":["Rigveda","Samaveda","Yajurveda","Atharvaveda"],"a":0,"e":"","sh":1},{"id":"sst5m1","k":"mcq","q":"Philosophical texts at the end of the Vedas:","o":["Upanishads","Puranas","Brahmanas","Sutras"],"a":0,"e":"","sh":1},{"id":"sst5m2","k":"mcq","q":"Vedic assemblies:","o":["sabha and samiti","Lok Sabha and Rajya Sabha","panchayat and zila","diwan and wazir"],"a":0,"e":"","sh":1},{"id":"sst5m3","k":"mcq","q":"‘Land of seven rivers’:","o":["Sapta Sindhu","Doab","Deccan","Aryavarta only"],"a":0,"e":"","sh":1},{"id":"sst5m4","k":"mcq","q":"Arthashastra was written by:","o":["Chanakya","Panini","Kalidasa","Megasthenes"],"a":0,"e":"","sh":1},{"id":"sst5m5","k":"mcq","q":"Grammar of Sanskrit (Ashtadhyayi) was written by:","o":["Panini","Charaka","Sushruta","Aryabhata"],"a":0,"e":"","sh":1},{"id":"sst5m6","k":"mcq","q":"Famous ancient surgeon:","o":["Sushruta","Charaka","Aryabhata","Varahamihira"],"a":0,"e":"","sh":1},{"id":"sst5m7","k":"mcq","q":"Guilds of merchants and artisans were called:","o":["shrenis","sanghas","samitis","janas"],"a":0,"e":"","sh":1},{"id":"sst5m8","k":"mcq","q":"Ancient university near present-day Rawalpindi:","o":["Takshashila","Nalanda","Vikramashila","Valabhi"],"a":0,"e":"","sh":1},{"id":"sst5m9","k":"mcq","q":"The northern trade route:","o":["Uttarapatha","Dakshinapatha","Silk Road only","Grand Trunk Road"],"a":0,"e":"","sh":1},{"id":"sst5t10","k":"tf","q":"The Rigveda is the oldest Veda.","a":0,"e":""},{"id":"sst5t11","k":"tf","q":"Nalanda was a university only for Indian students.","a":1,"e":"Students came from many Asian countries."},{"id":"sst5t12","k":"tf","q":"Guilds regulated quality and prices.","a":0,"e":""},{"id":"sst5f13","k":"mcq","fill":1,"q":"Medical text Charaka Samhita is linked to ___.","o":["Charaka","Sushruta","Panini","Ashoka"],"a":0,"e":"","sh":1},{"id":"sst5f14","k":"mcq","fill":1,"q":"A Roman-trade port in south India: ___","o":["Arikamedu","Lothal","Kalibangan","Mehrgarh"],"a":0,"e":"","sh":1},{"id":"sst5f15","k":"mcq","fill":1,"q":"The southern trade route was the ___.","o":["Dakshinapatha","Uttarapatha","Rajpath","Kalinga route"],"a":0,"e":"","sh":1}]},{"n":6,"t":"Democracy","intro":"Part 1, Ch 6. Meaning and features of democracy, direct and representative democracy, India’s democratic roots and challenges, and democracies around the world.","prio":[{"t":"Meaning and features of democracy","s":3},{"t":"Types: direct and representative","s":3},{"t":"Roots of democracy in India","s":3},{"t":"Challenges and strengthening democracy","s":3}],"notes":[{"h":"Meaning","t":"Abraham Lincoln: government ‘of the people, by the people, for the people’."},{"h":"Features","t":"Free and fair elections, universal adult franchise, rule of law, protection of rights, independent judiciary, free media, accountability of rulers, peaceful change of government."},{"h":"Types","t":"Direct (citizens decide directly — Swiss cantons, Gram Sabhas) and representative (citizens elect representatives — India). Parliamentary (India, UK) or presidential (USA)."},{"h":"Indian roots","t":"Ganas and sanghas like the Vajji republic (Vaishali); Buddhist sangha assemblies; Uttaramerur inscriptions (Chola period) describe village elections; sabha and samiti."},{"h":"India today","t":"World’s largest democracy; Constitution came into force on 26 January 1950."},{"h":"Challenges","t":"Corruption, poverty, illiteracy, money and muscle power in elections, communalism, misinformation. Remedies: education, awareness, active citizenship, reforms."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Write four features of democracy.","a":"Elections, universal adult franchise, rule of law, rights protected, independent judiciary, accountability.","m":3},{"q":"What are two challenges to Indian democracy and how can they be addressed?","a":"Corruption and money power — electoral reforms, transparency, RTI, aware voters; illiteracy — education.","m":3}],"rq":[],"traps":[{"m":"Thinking voting alone makes a democracy","c":"Rights, rule of law and accountability are also essential.","t":"—"}],"qs":[{"id":"sst6m0","k":"mcq","q":"‘Government of the people, by the people, for the people’ was said by:","o":["Abraham Lincol  const m=String(ans).match(/^(-?\d+)(.*)$/);let k=1;while(set.length<4&&k<40){const base=m?+m[1]:0,suf=m?m[2]:"";const v=(base+(k%2?1:-1)*Math.ceil(k/2)*(base>20?Math.max(1,Math.round(base/20)):1))+suf;if(!set.includes(v))set.push(v);k++}
 return {id:"gen",k:"mcq",q,o:set,a:0,e,sh:1,gen:1}}
const gcd=(a,b)=>b?gcd(b,a%b):a; const lcm=(a,b)=>a*b/gcd(a,b);
const frac=(n,d)=>{const g=gcd(Math.abs(n),d);n/=g;d/=g;return d===1?String(n):n+"/"+d};
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const IN=n=>n.toLocaleString("en-IN");
const dec=(x,p=3)=>String(+x.toFixed(p));
const SUP=n=>String(n).split("").map(c=>"⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)]||"⁻").join("");
const sgn=v=>v<0?`− ${-v}`:`+ ${v}`;
const pt=(x,y)=>`(${x}, ${y})`;
const TRIP=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[7,24,25],[9,12,15],[12,16,20]];
const GEN={
 1:[()=>{let x=ri(-9,9),y=ri(-9,9);if(!x||!y)return GEN[1][0]();const q=x>0?(y>0?"I":"IV"):(y>0?"II":"III");return mk(`The point ${pt(x,y)} lies in quadrant:`,q,["I","II","III","IV"].filter(v=>v!==q),`Signs: I(+,+), II(−,+), III(−,−), IV(+,−).`)},
    ()=>{const t=pick(TRIP),x1=ri(-6,6),y1=ri(-6,6),sx=pick([1,-1]),sy=pick([1,-1]);const x2=x1+sx*t[0],y2=y1+sy*t[1];return mk(`Distance between ${pt(x1,y1)} and ${pt(x2,y2)}:`,t[2],[t[0]+t[1],t[2]*t[2],t[2]+1],`√(${t[0]}² + ${t[1]}²) = ${t[2]}.`)},
    ()=>{const x1=ri(-8,8)*2,y1=ri(-8,8)*2,x2=ri(-8,8)*2,y2=ri(-8,8)*2;const m=pt((x1+x2)/2,(y1+y2)/2);return mk(`Midpoint of ${pt(x1,y1)} and ${pt(x2,y2)}:`,m,[pt(x1+x2,y1+y2),pt((x2-x1)/2,(y2-y1)/2),pt((y1+y2)/2,(x1+x2)/2)],`Average the x’s and the y’s.`)},
    ()=>{const t=pick(TRIP);const x=t[0]*pick([1,-1]),y=t[1]*pick([1,-1]);return mk(`Distance of ${pt(x,y)} from the origin:`,t[2],[Math.abs(x)+Math.abs(y),t[2]*t[2],t[2]-1],`√(x² + y²).`)}],
 2:[()=>{const a=ri(2,9)*pick([1,-1]),b=ri(1,20)*pick([1,-1]),x=ri(-5,6);return mk(`p(x) = ${a}x ${sgn(b)}. Find p(${x}).`,a*x+b,[a*x-b,a+x+b,a*(x+b)],`${a} × ${x} ${sgn(b)}.`)},
    ()=>{const a=ri(2,9),k=ri(-9,9);const b=-a*k;if(!b)return GEN[2][1]();return mk(`Zero of ${a}x ${sgn(b)}:`,k,[-k,b,k+1],`${a}x ${sgn(b)} = 0 → x = ${k}.`)},
    ()=>{const d=ri(2,9),c=ri(-5,10);const s=[1,2,3,4].map(n=>d*n+c);return mk(`Rule for the pattern ${s.join(", ")}, …:`,`${d}n ${sgn(c)}`.replace("+ 0","").trim(),[`${d+1}n ${sgn(c-1)}`,`n ${sgn(d+c)}`,`${c}n ${sgn(d)}`],`Common difference ${d}, so ${d}n; adjust with ${c}.`)},
    ()=>{const p=pick([["5x³ − 2x + 1",3],["7 − x²",2],["4x + 9",1],["x⁴ + 3x",4],["12",0]]);return mk(`Degree of ${p[0]}:`,p[1],[0,1,2,3,4].filter(v=>v!==p[1]),`Highest power of x.`)}],
 3:[()=>{const r=pick(["√16","√25","0.75","−3","2/7","√49","1.2̅"]),ir=shuffle(["√2","√3","√5","π","√7","√11"]).slice(0,3);return mk(`Which is rational?`,r,ir,`Rational numbers can be written as p/q.`)},
    ()=>{const ir=pick(["√2","√3","√5","π","√7","√10"]),r=shuffle(["√9","0.5","22/7","√36","−4","0.3̅"]).slice(0,3);return mk(`Which is irrational?`,ir,r,`Non-terminating, non-repeating decimal.`)},
    ()=>{const q=pick([2,4,5,8,10,16,20,25,3,6,7,9,11,12,15]);let p=ri(1,q-1);while(gcd(p,q)!==1)p=ri(1,q-1);let t=q;while(t%2===0)t/=2;while(t%5===0)t/=5;const ans=t===1?"terminating":"non-terminating repeating";return mk(`Decimal expansion of ${p}/${q} is:`,ans,[t===1?"non-terminating repeating":"terminating","non-terminating non-repeating","not defined"],`Terminates only if the denominator has prime factors 2 and/or 5.`)},
    ()=>{const d=ri(1,8);return mk(`${"0."+d+"̅"} as a fraction in lowest terms:`,frac(d,9),[`${d}/10`,`${d}/90`,`1/${d}`],`0.${d}${d}${d}… = ${d}/9.`)}],
 4:[()=>{const a=ri(1,5),b=ri(1,9);return mk(`(${a===1?"":a}x + ${b})² =`,`${a*a===1?"":a*a}x² + ${2*a*b}x + ${b*b}`,[`${a*a===1?"":a*a}x² + ${b*b}`,`${a*a===1?"":a*a}x² + ${a*b}x + ${b*b}`,`${a*a===1?"":a*a}x² + ${2*a*b}x + ${2*b}`],`(a + b)² = a² + 2ab + b².`)},
    ()=>{const a=ri(1,6),b=ri(1,9);const A=a*a===1?"":a*a;return mk(`Factorise ${A}x² − ${b*b}:`,`(${a===1?"":a}x + ${b})(${a===1?"":a}x − ${b})`,[`(${a===1?"":a}x − ${b})²`,`(${a===1?"":a}x + ${b})²`,`(${a===1?"":a}x + ${b*b})(x − 1)`],`a² − b² = (a + b)(a − b).`)},
    ()=>{const p=ri(1,9),q=ri(1,9);return mk(`Factorise x² + ${p+q}x + ${p*q}:`,`(x + ${p})(x + ${q})`,[`(x + ${p+q})(x + 1)`,`(x − ${p})(x − ${q})`,`(x + ${p*q})(x + 1)`],`Two numbers with sum ${p+q} and product ${p*q}.`)},
    ()=>{const b=pick([100,1000]),d=ri(1,9);const n=b+d;return mk(`${n}² =`,n*n,[b*b+d*d,n*n+b,b*b+d*b],`(${b} + ${d})² = ${b*b} + ${2*b*d} + ${d*d}.`)},
    ()=>{const a=ri(1,5);return mk(`(x + ${a})³ =`,`x³ + ${3*a}x² + ${3*a*a}x + ${a**3}`,[`x³ + ${a**3}`,`x³ + ${3*a}x² + ${a**3}`,`x³ + ${a}x² + ${a*a}x + ${a**3}`],`(a + b)³ = a³ + 3a²b + 3ab² + b³.`)}],
 5:[()=>{const c=ri(20,160);return mk(`An arc subtends ${2*c}° at the centre${2*c>=360?"":""}. The angle it subtends at a point on the remaining circle:`,c+"°",[(2*c)+"°",(180-c)+"°",(c/2)+"°"],`Half the angle at the centre.`)},
    ()=>{const a=ri(40,140);return mk(`In a cyclic quadrilateral, ∠A = ${a}°. ∠C =`,(180-a)+"°",[a+"°",(360-a)+"°",(90)+"°"],`Opposite angles are supplementary.`)},
    ()=>{const t=pick([[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15]]);return mk(`Radius ${t[2]} cm; a chord is ${t[0]} cm from the centre. Chord length:`,(2*t[1])+" cm",[t[1]+" cm",(2*t[0])+" cm",(t[1]+t[0])+" cm"],`Half-chord = √(${t[2]}² − ${t[0]}²) = ${t[1]}.`)},
    ()=>{const a=ri(20,70);return mk(`AB is a diameter and C is on the circle. ∠CAB = ${a}°. ∠CBA =`,(90-a)+"°",[a+"°",(180-a)+"°","90°"],`∠ACB = 90° (angle in a semicircle).`)}],
 6:[()=>{const r=pick([7,14,21,28,35]);return mk(`Area of a circle of radius ${r} cm (π = 22/7):`,(22*r*r/7)+" cm²",[(44*r/7)+" cm²",(22*r/7)+" cm²",(2*22*r*r/7)+" cm²"],`πr².`)},
    ()=>{const r=pick([7,14,21,35]);return mk(`Circumference of a circle of radius ${r} cm (π = 22/7):`,(44*r/7)+" cm",[(22*r*r/7)+" cm",(22*r/7)+" cm",(88*r/7)+" cm"],`2πr.`)},
    ()=>{const r=pick([7,14,21]);return mk(`Perimeter of a semicircle of radius ${r} cm (π = 22/7):`,(22*r/7+2*r)+" cm",[(22*r/7)+" cm",(44*r/7)+" cm",(22*r/7+r)+" cm"],`πr + 2r.`)},
    ()=>{const a=ri(2,20),b=ri(2,20),h=ri(1,10)*2;return mk(`Trapezium with parallel sides ${a} and ${b} cm, height ${h} cm. Area:`,((a+b)*h/2)+" cm²",[((a+b)*h)+" cm²",(a*b)+" cm²",((a+b)*h/4)+" cm²"],`½(a + b)h.`)},
    ()=>{const R=ri(4,12),r=ri(1,R-1);return mk(`Area of a ring with outer radius ${R} and inner radius ${r} (in terms of π):`,(R*R-r*r)+"π",[((R-r)**2)+"π",(R*R+r*r)+"π",(2*(R-r))+"π"],`π(R² − r²).`)}],
 7:[()=>{const f=pick([["an even number",3],["a number greater than 4",2],["a prime number",3],["a multiple of 3",2],["a number less than 3",2],["the number 6",1]]);return mk(`A die is rolled. P(${f[0]}) =`,frac(f[1],6),[frac(6-f[1],6),frac(f[1]+1,6),frac(f[1],12)],`${f[1]} favourable out of 6.`)},
    ()=>{const r=ri(1,8),b=ri(1,8),g=ri(1,8),T=r+b+g;const c=pick([["red",r],["blue",b],["green",g]]);return mk(`A bag has ${r} red, ${b} blue and ${g} green balls. P(${c[0]}) =`,frac(c[1],T),[frac(T-c[1],T),frac(c[1],T+1),frac(1,3)===frac(c[1],T)?frac(c[1]+1,T):frac(1,3)],`${c[1]} out of ${T}.`)},

let Q=null,timerId=null;
function prepare(q){q=Object.assign({},q);if(q.k==="mcq"){let idx=q.o.map((_,i)=>i);if(q.sh)idx=shuffle(idx);q.oo=idx.map(i=>q.o[i]);q.ca=idx.indexOf(q.a)}else if(q.k==="tf"){q.oo=q.sid==="hin"?["सही","गलत"]:["True","False"];q.ca=q.a}else{q.oo=AR_OPTS;q.ca=q.a}return q}
function startQuiz(list,opts={}){if(!list.length){toast("Nothing here yet! 🎉");return}
 Q={list:list.map(prepare),i:0,ans:[],title:opts.title||"Practice",back:opts.back||{v:"home"},exam:!!opts.exam,gen:opts.gen||null,time:opts.time||0,start:Date.now(),daily:!!opts.daily};
 go("quiz",{daily:!!opts.daily});if(Q.time)startTimer()}
function smartPick(qs,n){const w=q=>{const r=S.q[q.id];if(!r)return 3+Math.random();if(!r.l)return 4+Math.random();return Math.random()*(1/(r.c+1))};return qs.slice().sort((a,b)=>w(b)-w(a)).slice(0,n)}
function startChapter(sid,cn,mode){const s=subj(sid),ch=s.chapters.find(c=>c.n===cn);let l=ch.qs.map(q=>Object.assign({sid,cn},q));
 if(mode==="smart")l=shuffle(smartPick(l,15));else if(mode==="wrong")l=shuffle(l.filter(q=>S.q[q.id]&&!S.q[q.id].l));else if(mode==="tf")l=shuffle(l.filter(q=>q.k!=="mcq"));else if(mode==="fill")l=shuffle(l.filter(q=>q.fill));else l=shuffle(l);
 startQuiz(l,{title:`Ch ${cn} · ${ch.t}`,back:{v:"chapter",s:sid,c:cn,tab:"practice"}})}
function startSubjectMix(sid){const s=subj(sid);const l=ALL.filter(q=>q.sid===sid);startQuiz(shuffle(smartPick(l,20)),{title:`${s.name} mixed practice`,back:{v:"subject",s:sid}})}
function startDaily(){const per=5;let l=[];for(const s of DATA.subjects){l=l.concat(smartPick(ALL.filter(q=>q.sid===s.id),per))}startQuiz(shuffle(l),{title:"⚡ Daily 15 Challenge",back:{v:"home"},daily:true})}
function startGen(cn){const g=GEN[cn];const l=[];for(let i=0;i<10;i++)l.push(Object.assign({sid:"math",cn},pick(g)()));const ch=subj("math").chapters.find(c=>c.n===cn);startQuiz(l,{title:`♾️ Unlimited · Ch ${cn}`,back:{v:"chapter",s:"math",c:cn,tab:"practice"},gen:cn})}
function startTimer(){stopTimer();timerId=setInterval(()=>{const el=$("#tmr");if(!Q){stopTimer();return}const left=Q.time-Math.floor((Date.now()-Q.start)/1000);if(left<=0){stopTimer();finishQuiz();return}if(el)el.textContent=fmtT(left)},1000)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
const fmtT=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function vQuiz(el){const q=Q.list[Q.i];const n=Q.list.length;const answered=Q.ans[Q.i]!==undefined;const s=subj(q.sid);const ch=s&&s.chapters.find(c=>c.n===q.cn);
 const left=Q.time?Q.time-Math.floor((Date.now()-Q.start)/1000):0;
 const meta=`<span class="pill" style="background:color-mix(in srgb,${s.color} 15%,#fff);color:${s.color}">${s.icon} ${s.name} · Ch ${q.cn}</span>${q.fill?'<span class="pill" style="background:#f3e8ff;color:#7e22ce">Fill in the blank</span>':""}${q.k==="tf"?'<span class="pill">'+(q.sid==="hin"?"सही / गलत":"True / False")+'</span>':q.k==="ar"?'<span class="pill">Assertion–Reason</span>':""}${q.imp?'<span class="pill imp">★ Important</span>':""}${q.x||q.gen?'<span class="pill x">Extra practice</span>':""}`;
 const qtext=q.k==="ar"?`<div class="qtext" style="font-size:18px">Read both statements and choose the correct option.</div><div class="ar mt"><div><b>Assertion (A):</b> ${esc(q.A)}</div><div><b>Reason (R):</b> ${esc(q.R)}</div></div>`:`<div class="qtext">${q.fill?esc(q.q).replace(/_{3}/,answered&&!Q.exam?`<span class="blank filled">${esc(q.oo[q.ca])}</span>`:'<span class="blank">&nbsp;</span>'):esc(q.q)}</div>`;
 const chosen=Q.ans[Q.i];
 const opts=q.oo.map((o,i)=>{let c="";if(answered){if(Q.exam){if(i===chosen)c="sel"}else{if(i===q.ca)c="ok";else if(i===chosen)c="no"}}
  return `<button class="opt ${c}" ${answered&&!Q.exam?"disabled":""} onclick="answer(${i})">${q.k==="tf"?"":`<span class="l">${LET[i]}</span>`}<span>${q.k==="tf"?(i===0?"✔ ":"✘ ")+esc(o):esc(o)}</span></button>`}).join("");
 const right=chosen===q.ca;
 const fb=answered&&!Q.exam?`<div class="feedback show ${right?"good":"bad"}"><b>${right?pick(["Correct! 🎉","Super! ⭐","Well done! 👏","Yes! 💯","Brilliant! 🌟"]):"Not quite 🙂"}</b>${!right?`<div>Correct answer: <b>${q.k==="tf"?q.oo[q.ca]:LET[q.ca]+". "+esc(q.oo[q.ca])}</b></div>`:""}${q.e?`<div style="margin-top:4px">💡 ${esc(q.e)}</div>`:""}</div>`:"";
 el.innerHTML=`<div class="qhead"><button class="back" onclick="quitQuiz()">✕</button><div class="qprog"><i style="width:${(Q.i+(answered?1:0))*100/n}%"></i></div>${Q.time?`<div class="timer" id="tmr">⏱ ${fmtT(Math.max(0,left))}</div>`:""}<div class="qcount">${Q.i+1}/${n}</div></div>
 <div class="small" style="margin:-4px 4px 10px;font-weight:700">${esc(Q.title)}</div>

 <div class="qfoot">${Q.exam?`<div class="row"><button class="btn alt" ${Q.i===0?"disabled":""} onclick="Q.i--;render()">‹ Back</button><div class="spacer"></div><button class="btn" onclick="nextQ()">${Q.i===n-1?"Submit test":"Next ›"}</button></div>`
  :`<button class="btn block" ${answered?"":"disabled"} onclick="nextQ()">${Q.i===n-1?"See my score":"Next question ›"}</button>`}</div>`;
}
function answer(i){if(Q.ans[Q.i]!==undefined&&!Q.exam)return;Q.ans[Q.i]=i;const q=Q.list[Q.i];
 if(!Q.exam){record(q,i===q.ca);if(i===q.ca){S.xp+=2}else if(navigator.vibrate){try{navigator.vibrate(80)}catch(e){}}save()}render()}
function record(q,ok){bumpDay();if(q.gen||q.id==="gen")return;const r=S.q[q.id]||{c:0,w:0,l:0};if(ok)r.c++;else r.w++;r.l=ok?1:0;r.t=Date.now();S.q[q.id]=r}
function nextQ(){if(Q.i<Q.list.length-1){Q.i++;render();window.scrollTo(0,0)}else{if(Q.exam&&Q.ans.filter(a=>a!==undefined).length<Q.list.length&&!confirm(`You have ${Q.list.length-Q.ans.filter(a=>a!==undefined).length} unanswered question(s). Submit anyway?`))return;finishQuiz()}}
function quitQuiz(){if(Q&&Q.ans.length&&!confirm("Leave this quiz? Answers so far are saved."))return;const b=Q.back;Q=null;go(b.v,b)}
function finishQuiz(){stopTimer();if(Q.dt){finishDT();return}if(Q.exam){Q.list.forEach((q,i)=>{if(Q.ans[i]!==undefined)record(q,Q.ans[i]===q.ca);else record(q,false)});}
 const correct=Q.list.filter((q,i)=>Q.ans[i]===q.ca).length;const pct=Math.round(correct*100/Q.list.length);
 if(Q.exam){S.xp+=correct*2;S.tests.push({d:today(),t:Q.title,p:pct,n:Q.list.length})}
 if(pct===100)S.xp+=10;save();
 Q.result={correct,pct};go("result");if(pct>=95)confetti()}

 const l=[];const keys=shuffle(Object.keys(by));let i=0;while(l.length<Math.min(EX.n,pool.length)){const k=keys[i%keys.length];if(by[k].length)l.push(by[k].pop());i++}
 startQuiz(shuffle(l),{title:`${s.name} test · ${EX.chs.length===s.chapters.length?"All chapters":"Ch "+EX.chs.sort((a,b)=>a-b).join(", ")}`,exam:true,time:Math.round(l.length*45),back:{v:"exam"}})}

/* ---------- mistakes ---------- */
function vMistakes(el){const wrong=ALL.filter(q=>S.q[q.id]&&!S.q[q.id].l);const by={};wrong.forEach(q=>{const k=q.sid+"|"+q.cn;(by[k]=by[k]||[]).push(q)});
 const wr=Object.entries(S.wr).filter(([k,v])=>v!=="g").length;
 el.innerHTML=`<div class="top"><div><h2>📒 Mistake Notebook</h2><div class="sub">Questions you got wrong last time. Get them right to clear them!</div></div></div>
 ${wrong.length?`<button class="btn block" onclick="startQuiz(shuffle(ALL.filter(q=>S.q[q.id]&&!S.q[q.id].l)).slice(0,25),{title:'📒 Fix my mistakes',back:{v:'mistakes'}})">Practise ${Math.min(25,wrong.length)} mistakes now</button>
 <div class="grid mt">${Object.entries(by).map(([k,l])=>{const [sid,cn]=k.split("|");const s=subj(sid);const ch=s.chapters.find(c=>c.n==cn);return `<button class="chap" onclick="startChapter('${sid}',${cn},'wrong')"><div class="ring" style="--p:100;--c:var(--bad)"><span style="color:var(--bad)">${l.length}</span></div><div style="flex:1"><div class="t">${s.icon} Ch ${cn} · ${esc(ch.t)}</div><div class="m">${s.name}</div></div><span style="color:var(--muted);font-size:22px">›</span></button>`}).join("")}</div>`
 :`<div class="card empty"><div style="font-size:52px">🌈</div><b>No mistakes to fix!</b><p>Practise more chapters — any wrong answers will appear here so you can fix them.</p></div>`}
 ${wr?`<div class="note mt2">✍️ You marked <b>${wr}</b> written answer${wr>1?"s":""} as “Partly” or “Revise”. Open the chapter → <b>Write answers</b> tab to try them again.</div>`:""}`}

/* ---------- progress ---------- */
function vProgress(el){const days=[];const d=new Date();for(let i=6;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const k=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");days.push([x.toLocaleDateString("en-IN",{weekday:"short"}),S.days[k]||0])}
 const mx=Math.max(S.goal,...days.map(x=>x[1]));const attempted=Object.keys(S.q).length;let cr=0,tr=0;Object.values(S.q).forEach(r=>{cr+=r.c;tr+=r.c+r.w});
 const weak=[];DATA.subjects.forEach(s=>s.chapters.forEach(ch=>{const seen=chSeen(ch);if(seen>=3)weak.push({s,ch,m:chMastery(ch)})}));weak.sort((a,b)=>a.m-b.m);
 el.innerHTML=`<div class="top"><div><h2>📈 ${NAME}’s progress</h2><div class="sub">Keep every subject above 95%</div></div></div>
 <div class="grid g3"><div class="card kpi"><b>🔥 ${streak()}</b><small>day streak</small></div><div class="card kpi"><b>${attempted}</b><small>questions tried</small></div><div class="card kpi"><b>${tr?Math.round(cr*100/tr):0}%</b><small>overall accuracy</small></div></div>
 <div class="sec"><h3>🏅 My badges</h3><span>from Daily Chapter Tests</span></div>${badgeShelf()}
 <div class="card mt"><div class="row"><b>This week</b><div class="spacer"></div><span class="small">Daily goal:</span>${[20,30,50].map(g=>`<button class="pill" style="${S.goal===g?"background:var(--brand);color:#fff":""}" onclick="S.goal=${g};save();render()">${g}</button>`).join("")}</div>
 <div class="week">${days.map(([l,v])=>`<div><i><em style="height:${v*100/mx}%"></em></i>${l}<br><b style="color:var(--ink)">${v}</b></div>`).join("")}</div></div>
 <div class="sec"><h3>Subjects</h3></div><div class="grid">${DATA.subjects.map(s=>{const m=subjMastery(s);return `<div class="card" style="--c:${s.color}"><div class="row"><b>${s.icon} ${s.name}</b><div class="spacer"></div><span class="pct">${m}%</span></div><div class="bar"><i style="width:${m}%"></i></div>
  <div class="chips mt">${s.chapters.map(ch=>{const cm=chMastery(ch);return `<button class="chip" style="padding:6px 10px;font-size:13px;border-color:${cm>=95?"var(--good)":cm>=60?s.color:cm>0?"var(--gold)":"var(--line)"}" onclick="go('chapter',{s:'${s.id}',c:${ch.n},tab:'practice'})">Ch ${ch.n} · ${cm}%</button>`}).join("")}</div></div>`}).join("")}</div>
 ${weak.length?`<div class="sec"><h3>Focus next on</h3><span>lowest mastery</span></div><div class="grid">${weak.slice(0,4).map(w=>`<button class="chap" onclick="startChapter('${w.s.id}',${w.ch.n},'smart')"><div class="ring" style="--p:${w.m};--c:var(--gold)"><span>${w.m}%</span></div><div style="flex:1"><div class="t">${w.s.icon} Ch ${w.ch.n} · ${esc(w.ch.t)}</div><div class="m">Tap for smart practice</div></div></button>`).join("")}</div>`:""}
 <div class="mt2" style="text-align:center"><button class="pill" style="margin-right:8px" onclick="go('welcome')">✏️ Change name</button><button class="pill" style="background:var(--badbg);color:var(--bad)" onclick="if(confirm('Reset ALL progress? This cannot be undone.')){localStorage.removeItem(KEY);load();render()}">Reset progress</button></div>`}

/* ---------- confetti ---------- */
function confetti(){const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#5b4bdb","#f5a524","#12a150","#e0384b","#c084fc","#06b6d4"];
 const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:pick(cols),vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6,va:-.2+Math.random()*.4}));
 let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++f<200)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}



function vWelcome(el){el.innerHTML=`<div class="hero" style="background:linear-gradient(135deg,#4c1d95,#7c3aed 55%,#c4b5fd);text-align:center;padding:40px 22px;margin-top:6vh">
 <div style="font-size:64px">🧭</div><h1 style="font-size:30px">Welcome to your Class 9 Revision Studio!</h1>
 <div style="opacity:.9;margin-top:6px">Ganita Manjari · Exploration · Understanding Society: India and Beyond</div></div>
 <div class="card mt2" style="max-width:520px;margin-left:auto;margin-right:auto"><b style="font-size:19px">What’s your name?</b>
 <input id="nm" value="${esc(S.name||"")}" placeholder="Type your name" maxlength="20" style="width:100%;margin-top:12px;padding:16px;font-size:20px;border-radius:14px;border:2px solid var(--line);font-family:inherit">
 <button class="btn block mt" onclick="saveName()">Let’s start →</button></div>`;setTimeout(()=>{const i=$("#nm");if(i)i.focus()},100)}
function saveName(){const v=($("#nm").value||"").trim();if(!v){toast("Please type your name 🙂");return}S.name=v.slice(0,20);NAME=S.name;save();go("home");toast("Hi "+NAME+"! Let’s learn 🌟")}

/* ---------- full screen (iPad) ---------- */
function fsSupported(){const d=document.documentElement;return !window.navigator.standalone&&!!(d.requestFullscreen||d.webkitRequestFullscreen)}
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function toggleFS(){const d=document.documentElement;try{if(isFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(p&&p.catch)p.catch(()=>toast("Full screen not allowed here — see tip in Progress"))}}catch(e){toast("Full screen not allowed here")}}
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{if(route.v==="home")render()}));

/* ---------- Daily Chapter Test ---------- */
const BADGES=[{min:95,e:"🏆",n:"Gold Champion",c:"#db2777"},{min:80,e:"🥈",n:"Silver Star",c:"#64748b"},{min:60,e:"🥉",n:"Bronze Brave",c:"#b45309"},{min:0,e:"🌱",n:"Growing Learner",c:"#16a34a"}];
const badgeFor=p=>BADGES.find(b=>p>=b.min);
function seeded(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);const t=(h^=h>>>16)>>>0;return t/4294967296}}
function sshuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const PER_SUBJ=10;
function dtPlan(date){const r=seeded("class9-"+date);const day=Math.floor(new Date(date+"T12:00:00")/864e5);
 return DATA.subjects.map((s,k)=>{const ch=s.chapters[((day+k*5)%s.chapters.length+s.chapters.length)%s.chapters.length];
  const mcq=sshuffle(ch.qs.filter(q=>q.k==="mcq"),r),oth=sshuffle(ch.qs.filter(q=>q.k!=="mcq"),r);
  const qs=sshuffle([...mcq.slice(0,7),...oth.slice(0,3)].slice(0,PER_SUBJ),r);while(qs.length<PER_SUBJ&&mcq.length>qs.length)qs.push(mcq[qs.length]);
  return {sid:s.id,cn:ch.n,ids:qs.map(q=>q.id)}})}
function dtHomeCard(){const t=today(),done=(S.dt||{})[t],plan=dtPlan(t);
 if(done){const b=badgeFor(done.p);return `<div class="dtcard" style="background:linear-gradient(135deg,#4338ca,#7c3aed)"><div class="row"><div style="font-size:56px">${b.e}</div><div><h3>Today’s test done!</h3><div>${done.c}/${done.n} correct · <b>${b.n}</b></div><div class="small" style="color:rgba(255,255,255,.85)">New chapters unlock tomorrow 🌅</div></div></div></div>`}
 return `<div class="dtcard"><div class="small" style="color:rgba(255,255,255,.85);font-weight:800;letter-spacing:.06em">🏅 TODAY’S DAILY CHAPTER TEST</div><h3 style="margin-top:4px">${plan.length*PER_SUBJ} questions · 1 chapter from each subject</h3>
  <div class="chs">${plan.map(p=>{const s=subj(p.sid),ch=s.chapters.find(c=>c.n===p.cn);return `<div>${s.icon} <b>${s.name}</b> — Ch ${ch.n}: ${esc(ch.t)}</div>`}).join("")}</div>
  <button class="btn block" onclick="go('dtest')">Start today’s test →</button></div>`}
function vDTest(el){const t=today(),done=(S.dt||{})[t],plan=dtPlan(t);
 if(done){go("dtresult",{d:t});return}
 el.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><div><h2>🏅 Daily Chapter Test</h2><div class="sub">${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}</div></div></div>
 <div class="card"><b>Today’s chapters</b><div class="grid mt">${plan.map(p=>{const s=subj(p.sid),ch=s.chapters.find(c=>c.n===p.cn);return `<div class="subres" style="border-left:6px solid ${s.color}"><span style="font-size:28px">${s.icon}</span><div style="flex:1"><b>${s.name}</b><div class="small">Chapter ${ch.n}: ${esc(ch.t)}</div></div><span class="pill">${p.ids.length} Qs</span></div>`}).join("")}</div></div>
 <div class="card mt"><b>Rules</b><ul style="margin:8px 0 0;padding-left:20px;line-height:1.7">
  <li>${plan.reduce((a,p)=>a+p.ids.length,0)} questions — no answers or hints are shown during the test.</li>
  <li>You can go back and change answers before you submit.</li>
  <li>You get <b>one attempt per day</b>. At the end you’ll see how many you got right and your badge.</li></ul>
  <div class="shelf mt">${BADGES.map(b=>`<div class="b"><span>${b.e}</span><div style="font-weight:800;font-size:14px">${b.n}</div><div class="small">${b.min?b.min+"%+":"keep trying"}</div></div>`).join("")}</div>
  <button class="btn block mt2" onclick="startDT()">I’m ready — start the test</button></div>`}
function startDT(){const t=today(),plan=dtPlan(t);const l=[];plan.forEach(p=>p.ids.forEach(id=>QMAP[id]&&l.push(QMAP[id])));
 startQuiz(l,{title:"🏅 Daily Chapter Test",exam:true,back:{v:"home"}});Q.dt=t}
function finishDT(){const t=Q.dt;const per={};let c=0;
 Q.list.forEach((q,i)=>{const ok=Q.ans[i]===q.ca;record(q,ok);if(ok)c++;per[q.sid]=per[q.sid]||[0,0];per[q.sid][1]++;if(ok)per[q.sid][0]++});
 const n=Q.list.length,p=Math.round(c*100/n),att=Q.ans.filter(a=>a!==undefined).length;
 S.dt=S.dt||{};S.dt[t]={c,n,p,att,per,chs:dtPlan(t).map(x=>[x.sid,x.cn])};S.xp+=c*2+(p>=95?20:p>=80?10:5);save();Q=null;go("dtresult",{d:t,fresh:1});if(p>=80)confetti()}
function vDTResult(el){const r=(S.dt||{})[route.d];if(!r){go("dtest");return}const b=badgeFor(r.p);
 const nextB=BADGES.slice().reverse().find(x=>x.min>r.p);
 el.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><div><h2>🏅 Daily Test result</h2><div class="sub">${route.d}</div></div></div>
 <div class="card res"><div class="bigbadge">${b.e}</div><div class="msg" style="color:${b.c}">${b.n}!</div>
  <div style="font-size:22px;font-weight:900;margin-top:4px">${r.c} / ${r.n} correct</div><div class="small">Score ${r.p}% · attempted ${r.att} of ${r.n}</div>
  ${nextB?`<div class="note mt" style="text-align:left">🧭 ${Math.ceil(nextB.min*r.n/100)-r.c} more correct answer${Math.ceil(nextB.min*r.n/100)-r.c>1?"s":""} would have earned <b>${nextB.e} ${nextB.n}</b>. Practise today’s chapters and try again tomorrow!</div>`:`<div class="note mt">🌟 Top badge! ${NAME}, you are exam-ready on these chapters.</div>`}</div>
 <div class="sec"><h3>By subject</h3><span>answers stay hidden</span></div>
 <div class="grid">${DATA.subjects.map(s=>{const v=r.per[s.id];if(!v)return"";const ch=r.chs.find(x=>x[0]===s.id);const sp=Math.round(v[0]*100/v[1]);return `<div class="subres" style="border-left:6px solid ${s.color}"><span style="font-size:28px">${s.icon}</span><div style="flex:1"><b>${s.name}</b> <span class="small">Ch ${ch[1]}</span><div class="bar" style="--c:${s.color}"><i style="width:${sp}%"></i></div></div><div style="text-align:right"><b style="font-size:20px">${v[0]}/${v[1]}</b><div style="font-size:22px">${v[0]===v[1]?"⭐":""}</div></div></div>`}).join("")}</div>
 <div class="grid g2 mt2">${r.chs.map(([sid,cn])=>{const s=subj(sid);return `<button class="btn alt" onclick="startChapter('${sid}',${cn},'smart')">Practise ${s.icon} Ch ${cn}</button>`}).join("")}<button class="btn" onclick="go('home')">Done</button></div>
 <div class="sec"><h3>My badges</h3></div>${badgeShelf()}`}
function badgeShelf(){const dt=S.dt||{};const cnt={};BADGES.forEach(b=>cnt[b.e]=0);Object.values(dt).forEach(r=>cnt[badgeFor(r.p).e]++);
 const days=[];const d=new Date();for(let i=13;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const k=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");days.push([x,k])}
 return `<div class="shelf">${BADGES.map(b=>`<div class="b"><span>${b.e}</span><b>${cnt[b.e]}</b><div class="small">${b.n}</div></div>`).join("")}</div>
 <div class="card mt"><b>Last 14 days</b><div class="cal">${days.map(([x,k])=>`<div ${dt[k]?`onclick="go('dtresult',{d:'${k}'})" style="cursor:pointer;background:#fff;box-shadow:var(--shadow)"`:""}><span>${dt[k]?badgeFor(dt[k].p).e:(k===today()?"⏳":"·")}</span>${x.getDate()} ${x.toLocaleDateString("en-IN",{month:"short"})}</div>`).join("")}</div></div>`}

render();
</script>
