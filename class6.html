iagram of a leaf. What is venation?","m":3,"imp":true,"a":["Parts: lamina (leaf blade), midrib, veins, petiole (stalk joining leaf to stem).","Venation is the pattern of veins on a leaf: reticulate (net-like, e.g. peepal, hibiscus) or parallel (e.g. grass, banana, wheat)."],"k":"Diagram with 4 labels (2) + venation (1).","cm":"Labelling the midrib as petiole."},{"q":"Differentiate between taproot and fibrous roots. How are roots related to leaf venation?","m":3,"imp":true,"a":["Taproot: one main thick root with small side roots; e.g. mustard, carrot, radish, beans.","Fibrous roots: many thin roots of similar size from the base of the stem; e.g. wheat, maize, grass, onion.","Plants with reticulate venation usually have taproots; plants with parallel venation usually have fibrous roots."],"k":"Two root types with examples (2) + link (1).","cm":"Saying carrot has fibrous roots."},{"q":"What are monocots and dicots? Give examples.","m":3,"imp":true,"a":["Dicots: seeds with two cotyledons (seed leaves); e.g. gram, pea, bean, mustard. Usually reticulate venation and taproot.","Monocots: seeds with one cotyledon; e.g. maize, wheat, rice. Usually parallel venation and fibrous roots."],"k":"Meaning + 2 examples each.","cm":"Listing maize as a dicot."},{"q":"How is a camel adapted to live in the desert?","m":3,"imp":true,"a":["Long legs keep its body away from the hot sand.","Hump stores fat, used for energy when food is scarce.","Can go without water for many days; loses very little water (little urine, dry dung, sweats little).","Wide padded feet do not sink in sand; long eyelashes keep out sand."],"k":"Any three adaptations explained.","cm":"Saying the hump stores water."},{"q":"How are fish adapted to live in water?","m":3,"imp":true,"a":["Streamlined body helps them move easily through water.","Fins and tail help swimming and steering.","Gills take in oxygen dissolved in water.","Slippery scales protect the body."],"k":"Three adaptations.","cm":"Saying fish breathe with lungs."},{"q":"What is a habitat? Name two types with examples of animals.","m":2,"imp":false,"a":["A habitat is the natural home of a living being where it gets food, water, shelter. Terrestrial (on land): lion, camel, yak; aquatic (in water): fish, octopus; frogs can live in both (amphibians)."],"k":"Definition + two types with examples.","cm":"Calling a zoo a habitat."},{"q":"How are animals in cold mountain regions (like the yak) adapted?","m":2,"imp":false,"a":["Thick fur/long hair and a layer of fat keep them warm; strong hooves help them walk on rocky slopes; large lungs help in thin air."],"k":"Two adaptations.","cm":"Saying they have thin skin to lose heat."},{"q":"What is biodiversity? Why should we conserve it?","m":3,"imp":false,"a":["Biodiversity is the variety of plants, animals and other living beings in an area.","All living beings depend on each other for food, oxygen, pollination etc.","Loss of one species affects others; we get food, medicines and clean air from nature — so we must protect forests and habitats."],"k":"Definition + two reasons.","cm":"Only defining without reasons."}],"prac":[{"lv":"Level 1: Basic","q":"Give an example of a shrub.","a":"Rose/hibiscus."},{"lv":"Level 1: Basic","q":"What does a fish use to breathe?","a":"Gills."},{"lv":"Level 1: Basic","q":"How many cotyledons does a pea seed have?","a":"Two."},{"lv":"Level 1: Basic","q":"Name the stalk of a leaf.","a":"Petiole."},{"lv":"Level 2: Exam Standard","q":"Which root type does wheat have?","a":"Fibrous."},{"lv":"Level 2: Exam Standard","q":"Name two creepers.","a":"Pumpkin, watermelon."},{"lv":"Level 2: Exam Standard","q":"What is stored in a camel’s hump?","a":"Fat."},{"lv":"Level 2: Exam Standard","q":"Why is banana called a herb though it is tall?","a":"Its stem is soft and not woody."},{"lv":"Level 3: Competency / Application","q":"A leaf has parallel veins. Predict its root type and seed type.","a":"Fibrous roots; monocot."},{"lv":"Level 3: Competency / Application","q":"Why would a polar bear not survive in a desert?","a":"Its thick fur and fat would make it overheat; it is adapted for cold."},{"lv":"Level 3: Competency / Application","q":"Suggest two ways your school can protect biodiversity.","a":"Plant native trees; put water bowls/bird feeders; avoid pesticides; no plastic."},{"lv":"Level 4: Challenge","q":"Frogs live on land and in water. How are they adapted to both?","a":"Webbed feet for swimming, strong legs for jumping; can breathe through skin in water and lungs on land."},{"lv":"Level 4: Challenge","q":"Is every plant with a taproot a dicot? Discuss.","a":"Usually yes; the link is a general pattern, and there are a few exceptions, so we say ‘usually’."}],"comp":[{"q":"You find a plant with a net-like pattern of veins. What would you expect its roots to look like? How can you check without harming it?","a":"A taproot; check a similar weed/uprooted plant or gently dig at the base."},{"q":"Classify: tulsi, mango, grass, money plant, pumpkin.","a":"Shrub: tulsi; tree: mango; herb: grass; climber: money plant; creeper: pumpkin."},{"q":"A new road will cut through a forest. Give two effects on biodiversity.","a":"Animals lose habitat; food chains break; some species may disappear."}],"case":[{"t":"Seed sorting","p":"Meera soaked seeds of gram, maize, pea and wheat overnight and tried to split each into two halves.","q":["(i) Which seeds split into two?","(ii) What are the halves called?","(iii) Maize is a: (a) dicot (b) monocot (c) shrub (d) creeper","(iv) Predict the venation of wheat leaves."],"a":["(i) Gram and pea.","(ii) Cotyledons.","(iii) (b) monocot.","(iv) Parallel."]}],"conc":[{"c":"Herb/shrub/tree","e":"Grouped by height and stem.","x":"Mint/rose/mango.","cf":"Banana is a large herb (soft stem).","t":"Soft–bushy–trunk"},{"c":"Venation","e":"Pattern of veins.","x":"Net in peepal; lines in grass.","cf":"Midrib is part of venation, not a separate stalk.","t":"Net ↔ Tap; Parallel ↔ Fibrous"},{"c":"Cotyledon","e":"Seed leaf storing food.","x":"Gram splits into 2.","cf":"Maize is monocot.","t":"Di = two"},{"c":"Adaptation","e":"Special features helping survival in a habitat.","x":"Camel’s hump.","cf":"Adaptations take a long time; not chosen by the animal.","t":""}],"notes":[{"h":"Grouping plants by stem","t":"Herbs: soft green stems (tomato, mint, wheat). Shrubs: hard woody stems branching near the base (rose, hibiscus, tulsi). Trees: thick woody trunk, tall (mango, neem, banyan)."},{"h":"Weak stems","t":"Climbers climb up a support (money plant, pea, grapevine). Creepers spread on the ground (pumpkin, watermelon, sweet potato)."},{"h":"Leaf parts","t":"Lamina (blade), midrib, veins, petiole (stalk). Venation = pattern of veins: reticulate (net-like: peepal, hibiscus) or parallel (grass, banana, wheat)."},{"h":"Roots","t":"Taproot: one main root + side roots (carrot, mustard, radish). Fibrous: many thin roots of similar size (wheat, maize, grass, onion)."},{"h":"Seeds","t":"Dicots: 2 cotyledons (gram, pea, bean) → usually reticulate venation + taproot. Monocots: 1 cotyledon (maize, wheat, rice) → usually parallel venation + fibrous roots."},{"h":"Habitat and adaptation","t":"Habitat = natural home. Adaptations = special features for survival. Camel: long legs, fat in hump, padded feet. Fish: streamlined body, gills, fins. Yak: thick fur, strong hooves."},{"h":"Biodiversity","t":"Variety of living things in an area. We protect it by saving forests, not polluting, and planting native trees."}]},{"n":3,"t":"Mindful Eating: A Path to a Healthy Body","intro":"Nutrients and their functions, food tests, deficiency diseases and balanced diet. Tables and experiments score heavily.","prio":[{"t":"Nutrients: carbohydrates, fats, proteins, vitamins, minerals + dietary fibre and water","s":3},{"t":"Functions: energy (carbohydrates, fats), body-building (proteins), protection (vitamins, minerals)","s":3},{"t":"Food tests: starch (iodine → blue-black), fat (paper → oily patch), protein (copper sulphate + caustic soda → violet)","s":3},{"t":"Deficiency diseases: scurvy, rickets, night blindness, beriberi, anaemia, goitre","s":3},{"t":"Balanced diet; roughage and water","s":3},{"t":"Millets, local and seasonal food; problems of junk food; mindful eating habits","s":2}],"traps":[{"m":"Starch test colour violet","c":"Starch = blue-black; protein = violet","t":"Iodine–Blue"},{"m":"Rickets ↔ vitamin C","c":"Rickets = D; scurvy = C","t":"Scurvy–C, Rickets–D"},{"m":"Proteins mainly for energy","c":"Proteins build and repair","t":"Protein = Build"},{"m":"Balanced = big","c":"Right amounts","t":"Balance, not bulk"},{"m":"Missing reagent names","c":"Name iodine / copper sulphate / caustic soda","t":"Name it to gain it"}],"rq":[{"q":"Why do sportspersons need more carbohydrates?","a":"They use more energy."},{"q":"Why should we not overcook vegetables?","a":"Some vitamins are lost by heat and in cooking water."},{"q":"Why is milk good for children?","a":"It has proteins and calcium for growth and strong bones."}],"mock":[{"q":"Name the energy-giving nutrients.","m":1,"a":"Carbohydrates and fats."},{"q":"Describe the test for protein.","m":3,"a":"CuSO₄ 2 drops + NaOH 10 drops → violet."},{"q":"Match: vitamin C, vitamin D, iron, iodine with rickets, goitre, scurvy, anaemia.","m":2,"a":"C–scurvy, D–rickets, iron–anaemia, iodine–goitre."},{"q":"What is a balanced diet?","m":2,"a":"All nutrients, roughage, water in right amounts."},{"q":"Why is roughage important?","m":2,"a":"Helps bowel movement, prevents constipation."},{"q":"Give two sources each of proteins and vitamins.","m":2,"a":"Dal, egg; fruits, green vegetables."},{"q":"Describe the test for fat.","m":2,"a":"Rub on paper → oily translucent patch."},{"q":"Suggest three habits of mindful eating.","m":3,"a":"Eat slowly, avoid screens, local/seasonal food."},{"q":"Why are millets good for health?","m":3,"a":"Rich in fibre, iron, calcium; low water needs."}],"qs":[{"id":"sci3p0","k":"mcq","q":"Iodine turns starch:","o":["red","violet","blue-black","yellow"],"a":2,"e":"Starch test.","imp":true},{"id":"sci3p1","k":"mcq","q":"Scurvy is caused by lack of:","o":["vitamin A","vitamin C","vitamin D","iron"],"a":1,"e":"Bleeding gums.","imp":true},{"id":"sci3p2","k":"mcq","q":"Body-building nutrient:","o":["carbohydrate","fat","protein","fibre"],"a":2,"e":"Growth and repair.","imp":true},{"id":"sci3p3","k":"mcq","q":"Goitre is due to lack of:","o":["iron","iodine","calcium","vitamin B1"],"a":1,"e":"Thyroid.","imp":true},{"id":"sci3p4","k":"mcq","q":"Protein test gives:","o":["blue-black","violet","oily patch","green"],"a":1,"e":"CuSO₄ + NaOH.","imp":false},{"id":"sci3p5","k":"mcq","q":"Rickets affects:","o":["eyes","bones","gums","blood"],"a":1,"e":"Vitamin D.","imp":false},{"id":"sci3p6","k":"mcq","q":"Which is a millet?","o":["rice","ragi","wheat","maize"],"a":1,"e":"Finger millet.","imp":false},{"id":"sci3p7","k":"mcq","q":"Roughage helps in:","o":["energy","digestion/bowel movement","vision","blood clotting"],"a":1,"e":"Prevents constipation.","imp":false},{"id":"sci3p8","k":"mcq","q":"Night blindness: lack of:","o":["vitamin A","vitamin B","vitamin C","vitamin D"],"a":0,"e":"Vision.","imp":true},{"id":"sci3p9","k":"mcq","q":"A paper test detects:","o":["protein","fat","starch","vitamin"],"a":1,"e":"Oily patch.","imp":false},{"id":"sci3t0","k":"tf","q":"Fats give more energy than carbohydrates.","a":0,"e":""},{"id":"sci3t1","k":"tf","q":"Iodine test shows violet colour for starch.","a":1,"e":"Blue-black."},{"id":"sci3t2","k":"tf","q":"Deficiency diseases are infectious.","a":1,"e":"They do not spread."},{"id":"sci3t3","k":"tf","q":"Anaemia is due to lack of iron.","a":0,"e":""},{"id":"sci3t4","k":"tf","q":"A balanced diet means eating large amounts.","a":1,"e":"Right amounts of all nutrients."},{"id":"sci3t5","k":"tf","q":"Water is essential for the body.","a":0,"e":""},{"id":"sci3a0","k":"ar","A":"Oranges help prevent scurvy.","R":"Oranges are rich in vitamin C.","a":0,"e":"R explains A."},{"id":"sci3a1","k":"ar","A":"Rice is mainly a protein source.","R":"Rice is rich in starch.","a":3,"e":"A false; R true."},{"id":"sci3a2","k":"ar","A":"Iodised salt prevents goitre.","R":"Iodine is needed by the thyroid gland.","a":0,"e":"R explains A."},{"id":"sci3x0","k":"mcq","q":"Iodine solution turns blue-black in the presence of:","o":["starch","fat","protein","vitamin C"],"a":0,"e":"Test for starch.","sh":1,"x":1},{"id":"sci3x1","k":"mcq","q":"Proteins help in:","o":["growth and repair of the body","giving only energy","digestion only","nothing"],"a":0,"e":"Body-building food.","sh":1,"x":1},{"id":"sci3x2","k":"mcq","q":"Carbohydrates and fats mainly give us:","o":["energy","vitamins","roughage","water"],"a":0,"e":"Energy-giving foods.","sh":1,"x":1},{"id":"sci3x3","k":"mcq","q":"Lack of vitamin C causes:","o":["scurvy","rickets","night blindness","goitre"],"a":0,"e":"Bleeding gums.","sh":1,"x":1},{"id":"sci3x4","k":"mcq","q":"Lack of vitamin D causes:","o":["rickets","scurvy","beriberi","anaemia"],"a":0,"e":"Weak, soft bones.","sh":1,"x":1},{"id":"sci3x5","k":"mcq","q":"Lack of iron causes:","o":["anaemia","goitre","rickets","scurvy"],"a":0,"e":"Low haemoglobin, tiredness.","sh":1,"x":1},{"id":"sci3x6","k":"mcq","q":"Lack of iodine causes:","o":["goitre","anaemia","scurvy","night blindness"],"a":0,"e":"Swelling in the neck.","sh":1,"x":1},{"id":"sci3x7","k":"mcq","q":"Night blindness is due to lack of:","o":["vitamin A","vitamin C","vitamin D","iron"],"a":0,"e":"Carrots and leafy greens help.","sh":1,"x":1},{"id":"sci3x8","k":"mcq","q":"Roughage (dietary fibre) helps:","o":["remove undigested food easily","build muscles","give energy","prevent goitre"],"a":0,"e":"Prevents constipation.","sh":1,"x":1},{"id":"sci3x9","k":"mcq","q":"A diet with all nutrients in the right amounts is:","o":["a balanced diet","junk food","a fast","a protein diet"],"a":0,"e":"Plus roughage and water.","sh":1,"x":1},{"id":"sci3x10","k":"mcq","q":"Millets like ragi and jowar are:","o":["nutritious grains","junk food","fruits","sweets"],"a":0,"e":"Rich in fibre and minerals.","sh":1,"x":1},{"id":"sci3x11","k":"mcq","q":"Fat is tested by rubbing food on paper. A positive result shows:","o":["an oily translucent patch","blue-black colour","violet colour","no change"],"a":0,"e":"Light passes through the oily patch.","sh":1,"x":1},{"id":"sci3y0","k":"tf","q":"Eating only junk food keeps us healthy.","a":1,"e":"Junk food has little nutrition and a lot of fat, salt or sugar.","x":1},{"id":"sci3y1","k":"tf","q":"Copper sulphate and caustic soda give a violet colour with protein.","a":0,"e":"","x":1},{"id":"sci3y2","k":"tf","q":"Water is an important part of our diet.","a":0,"e":"","x":1},{"id":"sci3m0","k":"mcq","q":"Which food is rich in protein?","o":["Dal","Rice","Sugar","Butter"],"a":0,"e":"Body-building food.","sh":1,"x":1},{"id":"sci3m1","k":"mcq","q":"Bleeding gums are a sign of:","o":["scurvy","goitre","rickets","anaemia"],"a":0,"e":"Vitamin C deficiency.","sh":1,"x":1},{"id":"sci3m2","k":"mcq","q":"A violet colour in the copper sulphate test shows:","o":["protein","starch","fat","vitamin C"],"a":0,"e":"Test for protein.","sh":1,"x":1},{"id":"sci3m3","k":"mcq","q":"Which of these gives the most energy?","o":["Ghee","Water","Cucumber","Salt"],"a":0,"e":"Fats are energy-rich.","sh":1,"x":1},{"id":"sci3m4","k":"mcq","q":"Roughage is found in:","o":["whole grains, fruits and vegetables","sugar","oil","salt"],"a":0,"e":"Fibre-rich foods.","sh":1,"x":1},{"id":"sci3f0","k":"mcq","fill":1,"q":"Iodine solution turns ___ with starch.","o":["blue-black","violet","red","green"],"a":0,"e":"","sh":1,"x":1},{"id":"sci3f1","k":"mcq","fill":1,"q":"Lack of iron in the diet causes ___.","o":["anaemia","goitre","scurvy","rickets"],"a":0,"e":"","sh":1,"x":1},{"id":"sci3f2","k":"mcq","fill":1,"q":"Carbohydrates and fats are ___-giving foods.","o":["energy","body-building","protective","water"],"a":0,"e":"","sh":1,"x":1},{"id":"sci3c01","k":"mcq","q":"School lunch survey: A class found that 18 of 40 students often skip breakfast and many eat packaged snacks at break. Several complain of tiredness in class. — Which mineral deficiency causes tiredness and pale skin?","o":["Iodine","Iron","Calcium","Sodium"],"a":1,"e":"(b) Iron."}],"top":[{"q":"Name the main nutrients in food and state one function of each.","m":5,"imp":true,"a":["Carbohydrates: main source of energy — rice, wheat, potato, sugar.","Fats: give more energy than carbohydrates; stored in body — ghee, oil, butter, nuts.","Proteins: body-building and repair — pulses, milk, eggs, paneer, fish.","Vitamins: protect against diseases, keep eyes, bones, gums healthy — fruits, vegetables.","Minerals: needed for bones, teeth, blood (calcium, iron, iodine) — milk, green leafy vegetables, iodised salt. Also dietary fibre (digestion) and water."],"k":"Five nutrients with function + source (1 each).","cm":"Calling proteins ‘energy-giving’ as their main role."},{"q":"Describe the test for starch in a food.","m":3,"imp":true,"a":["Take a small amount of the food (e.g. potato piece) in a dish.","Add 2–3 drops of dilute iodine solution.","A blue-black colour shows starch is present. Final answer: Blue-black colour = starch present"],"k":"Reagent (1) + method (1) + colour (1).","cm":"Writing ‘violet’ (that is for protein)."},{"q":"How will you test a food for (a) fats (b) proteins?","m":4,"imp":true,"a":["Fat: rub the food on a piece of paper and let it dry. An oily, translucent patch shows fat.","Protein: put a little food (paste/solution) in a test tube, add 2 drops of copper sulphate solution and 10 drops of caustic soda (sodium hydroxide) solution, shake. A violet (purple) colour shows protein."],"k":"Method + result for each (2 each).","cm":"Mixing up the colours of starch and protein tests."},{"q":"Name the deficiency diseases caused by lack of: vitamin A, vitamin B1, vitamin C, vitamin D, iron, iodine.","m":3,"imp":true,"a":["Vitamin A → night blindness / poor vision.","Vitamin B1 → beriberi (weak muscles).","Vitamin C → scurvy (bleeding gums).","Vitamin D → rickets (soft, bent bones).","Iron → anaemia (tiredness, pale skin).","Iodine → goitre (swollen neck gland)."],"k":"½ each.","cm":"Linking rickets with vitamin C."},{"q":"What is a balanced diet? Why is it important?","m":3,"imp":true,"a":["A balanced diet contains all the nutrients (carbohydrates, fats, proteins, vitamins, minerals), roughage and water in the right amounts for the body’s needs. It keeps us healthy, active, helps growth, and prevents deficiency diseases and obesity."],"k":"All nutrients + right amount + two benefits.","cm":"Saying ‘eating a lot of everything’."},{"q":"What is dietary fibre (roughage)? Why is it needed?","m":2,"imp":false,"a":["Dietary fibre is the part of plant food our body cannot digest (from whole grains, fruits, vegetables, pulses). It helps food move through the intestines and prevents constipation."],"k":"Meaning + function.","cm":"Saying it gives energy."},{"q":"Why are millets considered good food? Name three millets.","m":3,"imp":false,"a":["Millets like jowar (sorghum), bajra (pearl millet), ragi (finger millet) are rich in fibre, minerals (iron, calcium) and proteins; they grow with little water and suit local climates. The UN declared 2023 the International Year of Millets."],"k":"Three names + two benefits.","cm":"Calling rice a millet."},{"q":"What are the harmful effects of eating too much junk food?","m":3,"imp":false,"a":["Too much fat, salt and sugar → obesity, tooth decay, later diabetes and heart problems.","Very little fibre, vitamins and minerals → poor nutrition.","Often has preservatives; replaces healthy meals."],"k":"Three effects.","cm":"Only ‘it is tasty’."},{"q":"Give four habits of mindful eating.","m":2,"imp":false,"a":["Eat slowly and chew well; eat when hungry and stop when full.","Avoid screens while eating; eat at regular times.","Prefer home-cooked, local and seasonal food; don’t waste food.","Drink enough water; wash hands before eating."],"k":"Four habits (½ each).","cm":"Listing foods instead of habits."},{"q":"Why is iodised salt used in homes?","m":2,"imp":false,"a":["Our body needs iodine for the thyroid gland; lack causes goitre. Adding iodine to common salt is an easy way for everyone to get enough."],"k":"Iodine + goitre.","cm":"Saying it gives calcium."}],"prac":[{"lv":"Level 1: Basic","q":"Which nutrient gives the most energy per gram?","a":"Fats."},{"lv":"Level 1: Basic","q":"Colour in the starch test?","a":"Blue-black."},{"lv":"Level 1: Basic","q":"Lack of vitamin C causes?","a":"Scurvy."},{"lv":"Level 1: Basic","q":"Name one millet.","a":"Ragi/jowar/bajra."},{"lv":"Level 2: Exam Standard","q":"Why do growing children need proteins?","a":"For body-building, growth and repair."},{"lv":"Level 2: Exam Standard","q":"Which disease causes bent, soft bones?","a":"Rickets (vitamin D/calcium)."},{"lv":"Level 2: Exam Standard","q":"Name two sources of iron.","a":"Green leafy vegetables, jaggery, dates, meat."},{"lv":"Level 2: Exam Standard","q":"What does roughage do?","a":"Helps bowel movement; prevents constipation."},{"lv":"Level 3: Competency / Application","q":"A child has bleeding gums. What deficiency could it be and which foods would help?","a":"Vitamin C — citrus fruits, amla, guava, tomatoes."},{"lv":"Level 3: Competency / Application","q":"Plan a balanced breakfast from local foods.","a":"e.g. ragi dosa + sambar (pulses, vegetables) + a fruit + milk."},{"lv":"Level 3: Competency / Application","q":"In the fat test, why should the paper be dried before observing?","a":"Water also makes a patch; it dries away but fat leaves a lasting translucent patch."},{"lv":"Level 4: Challenge","q":"Why can too much of a good nutrient (like fat) be harmful?","a":"Excess is stored as body fat → obesity and heart problems; balance matters."},{"lv":"Level 4: Challenge","q":"Why is sunlight exposure linked to strong bones?","a":"Skin makes vitamin D in sunlight; vitamin D helps the body use calcium for bones."}],"comp":[{"q":"Ravi eats only noodles and chips for lunch every day. Suggest three changes, giving reasons.","a":"• Add dal/sprouts — protein. • Add vegetables and fruit — vitamins, minerals, fibre. • Replace fried chips with roasted chana or fruit — less fat and salt."},{"q":"A food turns blue-black with iodine but shows no violet with the protein test. What does it contain and not contain?","a":"Contains starch; does not contain (much) protein."},{"q":"Why are millets called ‘climate-smart’ crops?","a":"They grow with little water and in poor soils, suiting dry and changing climates."}],"case":[{"t":"School lunch survey","p":"A class found that 18 of 40 students often skip breakfast and many eat packaged snacks at break. Several complain of tiredness in class.","q":["(i) What could cause tiredness?","(ii) Which mineral deficiency causes tiredness and pale skin? (a) Iodine (b) Iron (c) Calcium (d) Sodium","(iii) Suggest a healthy break-time snack.","(iv) What percentage skip breakfast?"],"a":["(i) Lack of energy-giving food / missing breakfast; possibly anaemia.","(ii) (b) Iron.","(iii) Fruit, sprouts, roasted chana, peanut chikki.","(iv) 18 ÷ 40 × 100 = 45%."]}],"conc":[{"c":"Nutrient","e":"Substance in food the body needs.","x":"Protein in dal.","cf":"Water and fibre are not nutrients in the strict sense but are essential.","t":"CFPVM"},{"c":"Deficiency disease","e":"Caused by lack of a nutrient over a long time.","x":"Scurvy.","cf":"Not infectious — doesn’t spread.","t":""},{"c":"Balanced diet","e":"All nutrients in right amounts.","x":"Roti, dal, sabzi, curd, fruit.","cf":"Balanced ≠ large quantity.","t":""},{"c":"Food test","e":"Chemical/physical check for a nutrient.","x":"Iodine for starch.","cf":"Use only a little food and reagent.","t":"Iodine–Blue; Paper–Patch; CuSO₄ –Violet"}],"notes":[{"h":"Nutrients and jobs","t":"Carbohydrates (rice, roti) and fats (ghee, nuts): energy. Proteins (dal, eggs, milk): growth and repair. Vitamins and minerals: protection from diseases. Roughage: helps digestion. Water: carries nutrients, removes waste."},{"h":"Food tests","t":"Starch: iodine → blue-black. Protein: copper sulphate + caustic soda (sodium hydroxide) → violet. Fat: rub on paper → oily translucent patch."},{"h":"Deficiency diseases","t":"Vitamin A → night blindness · B1 → beriberi · C → scurvy (bleeding gums) · D → rickets (weak bones) · Iron → anaemia · Iodine → goitre."},{"h":"Balanced diet","t":"All nutrients in the right amounts + roughage + water. Choose seasonal, local foods; millets (ragi, jowar, bajra) are very nutritious."},{"h":"Mindful eating","t":"Eat slowly, chew well, eat when hungry, avoid wasting food, limit junk food (high fat, salt, sugar). Wash hands before eating."}]},{"n":4,"t":"Exploring Magnets","intro":"Magnetic vs non-magnetic materials, poles, attraction and repulsion, direction-finding, making a magnet and caring for magnets. Diagrams of iron filings and the compass are favourites.","prio":[{"t":"Magnetic (iron, nickel, cobalt) vs non-magnetic materials","s":3},{"t":"Two poles (North, South); attraction is strongest at the poles","s":3},{"t":"Freely suspended magnet rests in North–South direction; compass","s":3},{"t":"Like poles repel, unlike poles attract; repulsion is the sure test of a magnet","s":3},{"t":"Poles always come in pairs — breaking a magnet gives two magnets","s":3},{"t":"Making a magnet by stroking (single-touch method)","s":3},{"t":"Types/shapes of magnets; lodestone (natural magnet); caring for magnets","s":2}],"traps":[{"m":"All metals magnetic","c":"Only iron, nickel, cobalt","t":"INC"},{"m":"Attraction = sure test","c":"Repulsion is the sure test","t":"Repel = Real"},{"m":"Broken magnet → single poles","c":"Each piece has N and S","t":"Always pairs"},{"m":"Stroking back and forth","c":"One direction, one pole","t":"One way only"},{"m":"Storing like poles together","c":"Unlike poles side by side","t":"Opposites together"}],"rq":[{"q":"Why are keepers used with magnets?","a":"They help magnets keep their magnetism for long."},{"q":"Why should a compass be kept away from iron objects while reading?","a":"Iron disturbs the needle and gives a wrong direction."},{"q":"Why does a magnet pick up pins but not paper clips made of plastic?","a":"Pins are iron/steel (magnetic); plastic is non-magnetic."}],"mock":[{"q":"Name three magnetic materials.","m":1,"a":"Iron, nickel, cobalt."},{"q":"State the law of magnetic poles.","m":2,"a":"Like repel, unlike attract."},{"q":"Why is repulsion the sure test of a magnet?","m":2,"a":"Magnets attract iron too; only magnets repel."},{"q":"Describe how to make a magnet from an iron nail.","m":3,"a":"Stroke in one direction with one pole 30–40 times."},{"q":"Draw a bar magnet with iron filings and label the poles.","m":3,"a":"Filings clustered at ends; N, S labelled."},{"q":"How does a compass help find directions?","m":2,"a":"Needle points N–S; dial set to read directions."},{"q":"Give three ways to take care of magnets.","m":3,"a":"No heating/dropping; keepers; away from phones."},{"q":"What happens if a bar magnet is broken into two?","m":2,"a":"Two magnets, each with N and S."}],"qs":[{"id":"sci4p0","k":"mcq","q":"Which is magnetic?","o":["copper","nickel","aluminium","gold"],"a":1,"e":"Iron, nickel, cobalt.","imp":true},{"id":"sci4p1","k":"mcq","q":"Like poles:","o":["attract","repel","do nothing","stick"],"a":1,"e":"Law of poles.","imp":true},{"id":"sci4p2","k":"mcq","q":"A freely suspended magnet points:","o":["E–W","N–S","up–down","any way"],"a":1,"e":"Direction property.","imp":true},{"id":"sci4p3","k":"mcq","q":"Sure test of a magnet:","o":["attraction","repulsion","colour","weight"],"a":1,"e":"Only magnets repel.","imp":true},{"id":"sci4p4","k":"mcq","q":"Attraction is strongest at the:","o":["middle","poles","surface","centre"],"a":1,"e":"Ends.","imp":false},{"id":"sci4p5","k":"mcq","q":"Natural magnet:","o":["steel","lodestone","ferrite","alnico"],"a":1,"e":"Magnetite.","imp":false},{"id":"sci4p6","k":"mcq","q":"A broken bar magnet gives:","o":["one pole each","no poles","two complete magnets","only N poles"],"a":2,"e":"Poles in pairs.","imp":true},{"id":"sci4p7","k":"mcq","q":"Magnets should be kept away from:","o":["wood","mobile phones","books","plastic"],"a":1,"e":"Can damage them.","imp":false},{"id":"sci4p8","k":"mcq","q":"To make a magnet, stroke the nail:","o":["back and forth","in one direction with one pole","with both poles alternately","in circles"],"a":1,"e":"Single-touch method.","imp":false},{"id":"sci4p9","k":"mcq","q":"Magnetic force can act through:","o":["paper","only air","nothing","only iron"],"a":0,"e":"Non-magnetic materials.","imp":false},{"id":"sci4t0","k":"tf","q":"All metals are magnetic.","a":1,"e":"Only iron, nickel, cobalt (and alloys like steel)."},{"id":"sci4t1","k":"tf","q":"Unlike poles attract.","a":0,"e":""},{"id":"sci4t2","k":"tf","q":"Attraction proves an object is a magnet.","a":1,"e":"Repulsion does."},{"id":"sci4t3","k":"tf","q":"Heating can weaken a magnet.","a":0,"e":""},{"id":"sci4t4","k":"tf","q":"A compass needle is a small magnet.","a":0,"e":""},{"id":"sci4t5","k":"tf","q":"A magnet can have only one pole.","a":1,"e":"Always two."},{"id":"sci4a0","k":"ar","A":"A compass shows directions.","R":"Its magnetic needle rests along N–S.","a":0,"e":"R explains A."},{"id":"sci4a1","k":"ar","A":"Iron filings collect mostly at the ends of a bar magnet.","R":"Magnetic attraction is strongest near the poles.","a":0,"e":"R explains A."},{"id":"sci4a2","k":"ar","A":"A copper wire is attracted to a magnet.","R":"Copper is a metal.","a":3,"e":"A false; R true."},{"id":"sci4x0","k":"mcq","q":"A naturally occurring magnet is called:","o":["magnetite (lodestone)","iron","steel","plastic"],"a":0,"e":"Found in rocks.","sh":1,"x":1},{"id":"sci4x1","k":"mcq","q":"Which is attracted by a magnet?","o":["Iron nail","Plastic scale","Wooden pencil","Rubber eraser"],"a":0,"e":"Iron is magnetic.","sh":1,"x":1},{"id":"sci4x2","k":"mcq","q":"Like poles of two magnets:","o":["repel","attract","do nothing","melt"],"a":0,"e":"N–N or S–S push away.","sh":1,"x":1},{"id":"sci4x3","k":"mcq","q":"A freely suspended bar magnet always rests in the:","o":["north–south direction","east–west direction","up–down direction","any direction"],"a":0,"e":"Used in a compass.","sh":1,"x":1},{"id":"sci4x4","k":"mcq","q":"The ends of a magnet where attraction is strongest are:","o":["poles","middle","edges","centre"],"a":0,"e":"N and S poles.","sh":1,"x":1},{"id":"sci4x5","k":"mcq","q":"The surest test to know if an object is a magnet is:","o":["repulsion","attraction","colour","weight"],"a":0,"e":"Only a magnet repels another magnet.","sh":1,"x":1},{"id":"sci4x6","k":"mcq","q":"A compass needle is a:","o":["small magnet","piece of plastic","pointer of copper","wooden stick"],"a":0,"e":"It points north–south.","sh":1,"x":1},{"id":"sci4x7","k":"mcq","q":"Magnets lose their magnetism when:","o":["heated, hammered or dropped","kept in pairs","kept with keepers","kept in a box"],"a":0,"e":"Handle them with care.","sh":1,"x":1},{"id":"sci4x8","k":"mcq","q":"Which material is magnetic?","o":["Nickel","Aluminium","Copper","Glass"],"a":0,"e":"Iron, nickel, cobalt.","sh":1,"x":1},{"id":"sci4x9","k":"mcq","q":"To store bar magnets, place them in pairs with:","o":["unlike poles on the same side and keepers","like poles together","nothing between","iron dust"],"a":0,"e":"Keepers help retain magnetism.","sh":1,"x":1},{"id":"sci4x10","k":"mcq","q":"If a magnet is broken into two pieces, each piece has:","o":["both N and S poles","only N pole","only S pole","no poles"],"a":0,"e":"Poles always come in pairs.","sh":1,"x":1},{"id":"sci4y0","k":"tf","q":"Magnets attract all metals.","a":1,"e":"Copper, aluminium, gold are not attracted.","x":1},{"id":"sci4y1","k":"tf","q":"The north pole of a compass needle points towards the geographic north.","a":0,"e":"","x":1},{"id":"sci4y2","k":"tf","q":"Magnetic force can act through paper.","a":0,"e":"","x":1},{"id":"sci4m0","k":"mcq","q":"A magnet attracts:","o":["iron, nickel and cobalt","copper and gold","plastic and glass","all metals"],"a":0,"e":"INC.","sh":1,"x":1},{"id":"sci4m1","k":"mcq","q":"N pole brought near N pole of another magnet:","o":["they repel","they attract","nothing happens","they stick"],"a":0,"e":"Like poles repel.","sh":1,"x":1},{"id":"sci4m2","k":"mcq","q":"Where are iron filings attracted most on a bar magnet?","o":["At the ends","At the middle","Equally everywhere","Nowhere"],"a":0,"e":"Poles are strongest.","sh":1,"x":1},{"id":"sci4m3","k":"mcq","q":"A compass helps us find:","o":["directions","temperature","weight","time"],"a":0,"e":"Needle points N–S.","sh":1,"x":1},{"id":"sci4m4","k":"mcq","q":"Soft iron pieces used to store magnets are:","o":["keepers","poles","compasses","needles"],"a":0,"e":"They protect magnetism.","sh":1,"x":1},{"id":"sci4f0","k":"mcq","fill":1,"q":"Like poles of magnets ___ each other.","o":["repel","attract","cancel","break"],"a":0,"e":"","sh":1,"x":1},{"id":"sci4f1","k":"mcq","fill":1,"q":"A freely suspended magnet always points in the ___ direction.","o":["north–south","east–west","up–down","any"],"a":0,"e":"","sh":1,"x":1},{"id":"sci4f2","k":"mcq","fill":1,"q":"Magnetite is a ___ magnet.","o":["natural","artificial","plastic","ring"],"a":0,"e":"","sh":1,"x":1},{"id":"sci4c01","k":"mcq","q":"The floating magnets: Ayan slid three ring magnets onto a pencil. The top two floated above the bottom one, leaving gaps. — If he turns the middle magnet over, what happens?","o":["floats higher","sticks to one neighbour","falls off","nothing"],"a":1,"e":"(b) — unlike poles now face and attract."}],"top":[{"q":"What are magnetic and non-magnetic materials? Give examples.","m":2,"imp":true,"a":["Magnetic: attracted by a magnet — iron, nickel, cobalt and things made of them (iron nail, steel pin).","Non-magnetic: not attracted — wood, plastic, rubber, paper, glass, copper, aluminium, gold."],"k":"Definitions + examples.","cm":"Calling all metals magnetic (copper, aluminium are not)."},{"q":"Where is the attraction of a bar magnet strongest? Describe an activity to show it.","m":3,"imp":true,"a":["Spread iron filings on a paper and place a bar magnet on them (or roll the magnet in filings).","Most filings stick near the two ends; very few in the middle.","So attraction is strongest at the poles (near the ends)."],"k":"Activity + observation + conclusion.","cm":"Saying attraction is strongest in the middle."},{"q":"What happens when a bar magnet is freely suspended? How is this used?","m":3,"imp":true,"a":["A freely suspended bar magnet always comes to rest in the North–South direction.","The end pointing north is the north-seeking pole (N); the other is the south pole (S).","This is used in a magnetic compass to find directions — sailors, travellers, pilots."],"k":"Direction + naming poles + compass.","cm":"Saying East–West."},{"q":"State the rule of attraction and repulsion between magnetic poles. Why is repulsion the sure test for a magnet?","m":3,"imp":true,"a":["Like poles repel (N–N, S–S); unlike poles attract (N–S).","A magnet attracts both a magnet and an ordinary iron piece, so attraction does not prove an object is a magnet.","Only a magnet can repel a magnet — so repulsion is the sure test."],"k":"Rule (1) + attraction not enough (1) + repulsion only for magnets (1).","cm":"Saying attraction is the sure test."},{"q":"Describe how you would make a magnet from an iron nail.","m":3,"imp":true,"a":["Place the iron nail on a table.","Take a bar magnet and stroke the nail from one end to the other with one pole, always in the same direction; lift the magnet away at the end and bring it back to the start.","Repeat 30–40 times. Test with iron pins — the nail now attracts them. (It is a temporary magnet.)"],"k":"Same pole, same direction (2) + repeat & test (1).","cm":"Rubbing back and forth."},{"q":"A bar magnet is broken into two pieces. How many poles does each piece have?","m":2,"imp":true,"a":["Each piece becomes a complete magnet with its own N and S poles. Magnetic poles always exist in pairs; a single pole cannot be separated."],"k":"Two poles each + pairs.","cm":"Saying one piece is N and the other is S only."},{"q":"How does a magnetic compass work? Draw one.","m":3,"imp":true,"a":["A compass has a small magnetised needle pivoted so it can turn freely, in a box with a glass cover and a dial marked N, S, E, W.","The needle always points North–South; the dial is turned so N matches the needle’s north end, and other directions are read."],"k":"Needle + free rotation + N–S + reading directions.","cm":"Placing the compass near iron objects while reading."},{"q":"How should magnets be stored and cared for?","m":3,"imp":false,"a":["Magnets lose magnetism if heated, hammered or dropped repeatedly.","Store bar magnets in pairs with unlike poles on the same side, separated by wood, with soft iron keepers across the ends; horseshoe magnet with a keeper across its poles.","Keep them away from mobile phones, TVs, cards, computers."],"k":"What spoils + how to store + what to keep away.","cm":"Storing like poles together."},{"q":"What is a lodestone? How were magnets discovered?","m":2,"imp":false,"a":["Lodestone (magnetite) is a natural magnet — a rock that attracts iron. A story says a shepherd named Magnes found his iron-tipped stick sticking to such a rock; the rocks came to be called magnetite."],"k":"Natural magnet + story/discovery.","cm":"Calling it a man-made magnet."},{"q":"Name four shapes of magnets and one use of magnets in daily life.","m":2,"imp":false,"a":["Bar, horseshoe (U-shaped), ring, cylindrical/button magnets. Uses: refrigerator door seals, pencil boxes, toys, compass, magnetic stickers."],"k":"Four shapes (1) + use (1).","cm":"Listing ‘iron’ as a shape."}],"prac":[{"lv":"Level 1: Basic","q":"Name a magnetic material.","a":"Iron."},{"lv":"Level 1: Basic","q":"How many poles does a magnet have?","a":"Two."},{"lv":"Level 1: Basic","q":"What happens when two N poles face each other?","a":"They repel."},{"lv":"Level 1: Basic","q":"Name a natural magnet.","a":"Lodestone/magnetite."},{"lv":"Level 2: Exam Standard","q":"Why is a compass needle made of a magnet?","a":"So it can align N–S and show direction."},{"lv":"Level 2: Exam Standard","q":"Name two things that weaken magnets.","a":"Heating, hammering, dropping."},{"lv":"Level 2: Exam Standard","q":"Can a magnet attract through paper?","a":"Yes, magnetic force acts through paper, cloth, wood."},{"lv":"Level 2: Exam Standard","q":"How are bar magnets stored?","a":"In pairs, unlike poles together, with wooden piece and keepers."},{"lv":"Level 3: Competency / Application","q":"You have three identical iron bars; one is a magnet. How can you find it without another magnet or filings?","a":"Hang each freely; the magnet settles N–S every time. Or: touch the middle of one bar with the end of another — a magnet’s middle attracts weakly."},{"lv":"Level 3: Competency / Application","q":"Pins fell in a pile of sand. How can you collect them quickly?","a":"Move a magnet through the sand; pins stick to it."},{"lv":"Level 3: Competency / Application","q":"Why shouldn’t you keep a magnet near your mobile phone?","a":"It can damage the phone’s parts/data."},{"lv":"Level 4: Challenge","q":"Two bar magnets: end A of one attracts end B of the other, and end A repels end C. What can you say about B and C?","a":"A and B are unlike; A and C are like. So B and C are unlike poles (they would attract)."},{"lv":"Level 4: Challenge","q":"A ring magnet floats above another on a pencil. Explain.","a":"Like poles face each other; repulsion pushes the upper magnet up against gravity."}],"comp":[{"q":"You are lost in a forest with a compass. The needle points towards a tall tree. Which direction is the tree?","a":"North (if the needle’s north end points to it)."},{"q":"A shopkeeper says a ‘steel’ spoon is pure silver. How can a magnet help check?","a":"Silver is non-magnetic; if the spoon is strongly attracted, it contains iron/steel, not silver."},{"q":"Why do refrigerator doors shut tightly?","a":"A magnetic strip in the door seal attracts the iron body of the fridge."}],"case":[{"t":"The floating magnets","p":"Ayan slid three ring magnets onto a pencil. The top two floated above the bottom one, leaving gaps.","q":["(i) Why do they float?","(ii) If he turns the middle magnet over, what happens? (a) floats higher (b) sticks to one neighbour (c) falls off (d) nothing","(iii) How many poles does each ring magnet have?","(iv) Which force pulls the magnets down?"],"a":["(i) Like poles face each other and repel.","(ii) (b) — unlike poles now face and attract.","(iii) Two.","(iv) Gravity (their weight)."]}],"conc":[{"c":"Pole","e":"End where magnetic force is strongest.","x":"Filings crowd at ends.","cf":"Every magnet has 2 poles.","t":""},{"c":"Magnetic material","e":"Attracted by magnets.","x":"Iron nail.","cf":"Not all metals.","t":"INC: Iron, Nickel, Cobalt"},{"c":"Compass","e":"Pivoted magnetic needle.","x":"Used by sailors.","cf":"Keep away from iron.","t":""},{"c":"Repulsion test","e":"Only magnets repel magnets.","x":"Two N poles push apart.","cf":"Attraction is not proof.","t":"Repel = Real magnet"}],"notes":[{"h":"Magnets","t":"Natural magnet: magnetite (lodestone). Magnets come in shapes: bar, horseshoe, ring, U-shaped, button."},{"h":"Magnetic materials","t":"Attracted by magnets: iron, nickel, cobalt (and steel). Non-magnetic: wood, plastic, glass, rubber, copper, aluminium."},{"h":"Poles","t":"Attraction is strongest at the two ends (poles): North and South. Poles always come in pairs — even a broken magnet has N and S."},{"h":"Attraction and repulsion","t":"Unlike poles attract (N–S); like poles repel (N–N, S–S). Repulsion is the sure test of a magnet."},{"h":"Direction","t":"A freely suspended magnet rests North–South. A compass is a small magnetic needle used to find directions."},{"h":"Care of magnets","t":"Heating, hammering or dropping weakens them. Store bar magnets in pairs with unlike poles together and keepers (soft iron pieces) across the ends."}]},{"n":5,"t":"Measurement of Length and Motion","intro":"Standard units, conversions, correct use of a scale (and a broken scale), measuring curved lines, reference point and types of motion. Show conversion steps and write units.","prio":[{"t":"Measurement = comparison with a standard unit; problems with body units (handspan, cubit, footstep)","s":3},{"t":"SI unit of length: metre (m); 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm","s":3},{"t":"Correct measuring: eye directly above the mark; start from a clear mark if zero is broken","s":3},{"t":"Measuring a curved line with a thread","s":3},{"t":"Rest and motion relative to a reference point","s":3},{"t":"Types of motion: linear (rectilinear), circular, oscillatory (periodic)","s":3},{"t":"Traditional Indian units (angul, hasta, etc.)","s":1}],"traps":[{"m":"Writing numbers without units","c":"Always write m/cm/mm","t":"Number + Unit"},{"m":"Multiplying when going to a bigger unit","c":"Divide","t":"Big→small ×; small→big ÷"},{"m":"Broken scale: using end reading","c":"Subtract start reading","t":"End − Start"},{"m":"Swing as circular","c":"Oscillatory","t":"To-and-fro"},{"m":"No reference point in motion answers","c":"Name the reference","t":"Relative!"}],"rq":[{"q":"Why must the eye be directly above the mark?","a":"Viewing at an angle gives a wrong reading."},{"q":"Why are curved lengths measured with a thread?","a":"A thread can follow the curve; a ruler cannot bend."}],"mock":[{"q":"State the SI unit of length.","m":1,"a":"Metre."},{"q":"Convert 4.25 km to m and 380 cm to m.","m":2,"a":"4250 m; 3.8 m."},{"q":"A scale is broken; the object’s ends are at 3.0 cm and 14.8 cm. Find the length.","m":2,"a":"11.8 cm."},{"q":"Give three precautions while measuring length.","m":3,"a":"Along object, eye above, start from full mark."},{"q":"How will you m
