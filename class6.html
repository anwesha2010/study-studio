,"a":0,"e":"The difference is why one standard time is needed."},{"id":"sst1a3","k":"ar","A":"The Poles are shown as points.","R":"Latitude circles become smaller towards the Poles.","a":0,"e":"At 90° the circle shrinks to a point."},{"id":"sst1x0","k":"mcq","q":"The Equator is at latitude:","o":["0°","90°","23.5° N","66.5° N"],"a":0,"e":"It divides North and South Hemispheres.","sh":1,"x":1},{"id":"sst1x1","k":"mcq","q":"The Prime Meridian passes through:","o":["Greenwich","New Delhi","Paris","Mirzapur"],"a":0,"e":"0° longitude, near London.","sh":1,"x":1},{"id":"sst1x2","k":"mcq","q":"The Tropic of Cancer is at:","o":["23.5° N","23.5° S","66.5° N","0°"],"a":0,"e":"It passes through India.","sh":1,"x":1},{"id":"sst1x3","k":"mcq","q":"Indian Standard Time is based on the longitude:","o":["82.5° E","0°","90° E","68° E"],"a":0,"e":"Passes near Mirzapur.","sh":1,"x":1},{"id":"sst1x4","k":"mcq","q":"Every 1° of longitude makes a time difference of:","o":["4 minutes","1 hour","15 minutes","1 minute"],"a":0,"e":"360° = 24 hours.","sh":1,"x":1},{"id":"sst1x5","k":"mcq","q":"A model of the Earth is a:","o":["globe","map","atlas","sketch"],"a":0,"e":"Shows the Earth’s true shape.","sh":1,"x":1},{"id":"sst1x6","k":"mcq","q":"The ratio between map distance and real distance is the:","o":["scale","symbol","direction","legend only"],"a":0,"e":"e.g. 1 cm = 10 km.","sh":1,"x":1},{"id":"sst1x7","k":"mcq","q":"The four main directions are called:","o":["cardinal directions","intermediate directions","tropics","meridians"],"a":0,"e":"N, S, E, W.","sh":1,"x":1},{"id":"sst1x8","k":"mcq","q":"Lines joining the North and South Poles are:","o":["longitudes (meridians)","latitudes","tropics","circles"],"a":0,"e":"Used to find time.","sh":1,"x":1},{"id":"sst1x9","k":"mcq","q":"The International Date Line is roughly along:","o":["180°","0°","90° E","82.5° E"],"a":0,"e":"Date changes when crossing it.","sh":1,"x":1},{"id":"sst1x10","k":"mcq","q":"A drawing of an area without scale is a:","o":["sketch","map","globe","plan to scale"],"a":0,"e":"Rough drawing from memory.","sh":1,"x":1},{"id":"sst1x11","k":"mcq","q":"The northern half of the Earth is called:","o":["Northern Hemisphere","Eastern Hemisphere","Southern Hemisphere","Western Hemisphere"],"a":0,"e":"Divided by the Equator.","sh":1,"x":1},{"id":"sst1y0","k":"tf","q":"Latitudes are parallel to the Equator.","a":0,"e":"","x":1},{"id":"sst1y1","k":"tf","q":"Places east of Greenwich are ahead in time.","a":0,"e":"4 minutes ahead per degree.","x":1},{"id":"sst1y2","k":"tf","q":"The Arctic Circle lies at 66.5° S.","a":1,"e":"66.5° N; the Antarctic Circle is 66.5° S.","x":1},{"id":"sst1m0","k":"mcq","q":"23.5° S is the:","o":["Tropic of Capricorn","Tropic of Cancer","Arctic Circle","Equator"],"a":0,"e":"Southern tropic.","sh":1,"x":1},{"id":"sst1m1","k":"mcq","q":"IST is ahead of GMT by:","o":["5 h 30 min","4 h","6 h","5 h"],"a":0,"e":"82.5 × 4 min = 330 min.","sh":1,"x":1},{"id":"sst1m2","k":"mcq","q":"Which divides Earth into Eastern and Western Hemispheres?","o":["Prime Meridian","Equator","Tropic of Cancer","Arctic Circle"],"a":0,"e":"0° longitude.","sh":1,"x":1},{"id":"sst1m3","k":"mcq","q":"A place 30° east of Greenwich is ahead by:","o":["2 hours","30 minutes","4 hours","1 hour"],"a":0,"e":"30 × 4 = 120 min.","sh":1,"x":1},{"id":"sst1m4","k":"mcq","q":"The hottest heat zone is the:","o":["Torrid zone","Frigid zone","Temperate zone","Polar zone"],"a":0,"e":"Between the tropics.","sh":1,"x":1},{"id":"sst1f0","k":"mcq","fill":1,"q":"The Equator is ___ latitude.","o":["0°","90°","23.5°","180°"],"a":0,"e":"","sh":1,"x":1},{"id":"sst1f1","k":"mcq","fill":1,"q":"The three components of a map are distance, direction and ___.","o":["symbols","colours","time","names"],"a":0,"e":"","sh":1,"x":1},{"id":"sst1f2","k":"mcq","fill":1,"q":"Indian Standard Time is calculated from ___ longitude.","o":["82.5° E","0°","90° E","68° E"],"a":0,"e":"","sh":1,"x":1},{"id":"sst1c00","k":"mcq","q":"How many minutes does the time change for each degree of longitude?","o":["1","4","15",""],"a":1,"e":"(b) 4 minutes."},{"id":"sst1c11","k":"mcq","q":"The Tropic of Cancer: The Tropic of Cancer at 23.5° N passes through the middle of India. Places south of it lie in the Torrid Zone and receive the vertical rays of the Sun at least once a year. Places to its north lie in the Northern Temperate Zone. — In which heat zone does Chennai lie?","o":["Frigid","Torrid","Northern Temperate","Southern Temperate"],"a":1,"e":"(b) Torrid."}],"top":[{"q":"What is a map? Name its three components.","m":3,"imp":true,"a":["A map is a drawing of the Earth’s surface or a part of it, drawn on a flat surface to scale.","Distance: shown using a scale (e.g. 1 cm = 1 km) because real distances must be reduced.","Direction: shown by a north arrow; four cardinal directions N, S, E, W.","Symbols: conventional signs and colours for roads, rivers, railways, buildings etc."],"k":"Definition with ‘to scale’ + all three components named with one line each.","cm":"Writing ‘scale, colour, title’ — colour is part of symbols, title is not a component."},{"q":"Differentiate between a map and a globe.","m":3,"imp":true,"a":["Globe: a 3-D true model of the Earth; shows shapes, sizes and directions correctly; cannot show small areas in detail; difficult to carry.","Map: a 2-D flat drawing; can show the whole world or a small area (village) in detail; easy to carry and fold; some distortion of shape/size when the round Earth is drawn flat."],"k":"At least 3 matching points of comparison (shape/dimension, detail, portability).","cm":"Listing points for only one side; always write in pairs."},{"q":"What are latitudes? Name the important parallels of latitude with their values.","m":3,"imp":true,"a":["Latitudes (parallels) are imaginary circles drawn on the globe parallel to the Equator, running east–west. They measure distance north or south of the Equator in degrees.","Equator 0° (largest circle), Tropic of Cancer 23.5° N, Tropic of Capricorn 23.5° S, Arctic Circle 66.5° N, Antarctic Circle 66.5° S, North Pole 90° N and South Pole 90° S (points, not circles)."],"k":"Definition + ‘parallel to Equator’ + five important lines with N/S values.","cm":"Writing 23.5° without N or S, or calling the Poles circles."},{"q":"What are longitudes? What is the Prime Meridian?","m":2,"imp":true,"a":["Longitudes (meridians) are imaginary lines joining the North Pole to the South Pole. They measure distance east or west of the Prime Meridian.","The Prime Meridian (0°) passes through Greenwich, near London (UK). Longitudes go from 0° to 180° E and 180° W; 180° E and 180° W are the same line.","All meridians are equal in length (half-circles)."],"k":"Pole-to-pole; 0° at Greenwich; range 0–180° E/W.","cm":"Saying longitudes are parallel to each other — they meet at the Poles."},{"q":"Give four differences between latitudes and longitudes.","m":3,"imp":true,"a":["Latitudes run east–west; longitudes run north–south (pole to pole).","Latitudes are parallel to each other; longitudes meet at the Poles.","Latitude circles become smaller towards the Poles; all longitudes are equal in length.","Latitudes: 0° to 90° N/S; longitudes: 0° to 180° E/W.","Latitudes help find climate/heat zones; longitudes help find time."],"k":"Four clear pairs; use a table.","cm":"Mixing up the ranges (90° vs 180°)."},{"q":"Why does the time change by 4 minutes for every degree of longitude?","m":2,"imp":true,"a":["The Earth rotates 360° in 24 hours. So in 1 hour it turns 360 ÷ 24 = 15°, and 1° takes 60 ÷ 15 = 4 minutes. Places to the east see the Sun first, so their time is ahead; places to the west are behind."],"k":"360° / 24 h = 15° per hour; 60 min / 15 = 4 min per degree; east ahead.","cm":"Saying west is ahead. Remember: Sun rises in the east."},{"q":"What is Indian Standard Time? Why does India need one standard time?","m":3,"imp":true,"a":["India stretches about 30° of longitude from Gujarat to Arunachal Pradesh, so local times differ by about 2 hours (30 × 4 = 120 min).","To avoid confusion in trains, offices, broadcasts etc., India uses the local time of 82.5° E, which passes near Mirzapur in Uttar Pradesh, as its Indian Standard Time (IST).","82.5 × 4 = 330 minutes, so IST = GMT + 5 hours 30 minutes."],"k":"Longitude extent → time difference → one standard meridian 82.5° E → +5:30.","cm":"Writing 82.5° W or saying IST is 5 hours ahead (it is 5 h 30 min)."},{"q":"When it is 12 noon at Greenwich, what is the time in India (82.5° E)? Show working.","m":2,"imp":true,"a":["Difference in longitude = 82.5° − 0° = 82.5°.","Time difference = 82.5 × 4 min = 330 min = 5 h 30 min.","India is east, so add: 12:00 noon + 5 h 30 min = 5:30 p.m."],"k":"Longitude difference, × 4 min, convert to hours, add for east.","cm":"Subtracting instead of adding for a place east of Greenwich."},{"q":"Name the heat zones of the Earth and state where each lies.","m":3,"imp":false,"a":["Torrid Zone: between the Tropic of Cancer and Tropic of Capricorn; Sun is overhead at least once a year; hottest.","Temperate Zones: between the Tropic of Cancer and Arctic Circle (north) and between the Tropic of Capricorn and Antarctic Circle (south); moderate temperatures.","Frigid Zones: between the Arctic Circle and North Pole, and the Antarctic Circle and South Pole; very cold."],"k":"Three zones + the two bounding lines of each.","cm":"Forgetting there are TWO temperate and TWO frigid zones."},{"q":"What are cardinal and intermediate directions? Why is a north arrow needed on a map?","m":2,"imp":false,"a":["Cardinal directions: North, South, East, West. Intermediate directions: North-East, North-West, South-East, South-West. A north arrow tells the reader which way is north so all other directions can be found."],"k":"4 + 4 directions; purpose of the arrow.","cm":"Writing ‘East-North’ instead of North-East."},{"q":"What was the ‘madhya rekha’ of Indian astronomers?","m":1,"imp":false,"a":["Centuries before Greenwich was chosen, Indian astronomers used a prime meridian passing through Ujjain (Madhya Pradesh), called the madhya rekha (middle line), to calculate time and positions of planets."],"k":"Ujjain + used for time/astronomy calculations + earlier than Greenwich.","cm":"Confusing Ujjain with Mirzapur (IST)."},{"q":"What is a scale on a map? Explain with an example.","m":2,"imp":false,"a":["A scale is the ratio between the distance on the map and the actual distance on the ground. Example: if 1 cm = 5 km, then 4 cm on the map = 4 × 5 = 20 km on the ground."],"k":"Definition as ratio + worked example.","cm":"Forgetting units (cm on map, km on ground)."}],"prac":[{"lv":"Level 1: Basic","q":"Name the three components of a map.","a":"Distance (scale), direction and symbols."},{"lv":"Level 1: Basic","q":"What is the latitude of the Equator?","a":"0°."},{"lv":"Level 1: Basic","q":"Through which place does the Prime Meridian pass?","a":"Greenwich, near London (UK)."},{"lv":"Level 1: Basic","q":"How many degrees does the Earth rotate in one hour?","a":"15°."},{"lv":"Level 2: Exam Standard","q":"Write two differences between a globe and a map.","a":"Globe is 3-D and shows true shape; cannot show details of small areas. Map is flat, portable and can show small areas in detail."},{"lv":"Level 2: Exam Standard","q":"Why is IST taken at 82.5° E?","a":"It is roughly in the middle of India’s longitude extent, so the difference from local time is at most about 1 hour anywhere in India."},{"lv":"Level 2: Exam Standard","q":"Name the heat zone in which most of south India lies.","a":"Torrid Zone (south of the Tropic of Cancer)."},{"lv":"Level 2: Exam Standard","q":"What is a sketch map? How is it different from a plan?","a":"A sketch map is a rough drawing from memory, not to scale. A plan is a large-scale drawing of a small area such as a room or building, drawn to scale."},{"lv":"Level 3: Competency / Application","q":"A place A is at 30° E and place B at 60° E. Which place sees sunrise first, and by how many minutes?","a":"B, because it is further east. Difference = 30° × 4 = 120 minutes = 2 hours."},{"lv":"Level 3: Competency / Application","q":"On a map with scale 1 cm = 10 km, two towns are 3.5 cm apart. Find the real distance.","a":"3.5 × 10 = 35 km."},{"lv":"Level 3: Competency / Application","q":"Riya calls her uncle in London (0°) at 9:30 p.m. IST. What time is it in London?","a":"IST is 5 h 30 min ahead, so London time = 9:30 p.m. − 5:30 = 4:00 p.m."},{"lv":"Level 4: Challenge","q":"If India used the local time of Gujarat (about 68° E) instead of 82.5° E, would clocks in Arunachal Pradesh (about 97° E) be more or less wrong? Explain.","a":"More wrong. Difference 97 − 68 = 29° → about 116 minutes, nearly 2 hours; with 82.5° E the maximum difference is only about 1 hour (97 − 82.5 = 14.5° → 58 min)."},{"lv":"Level 4: Challenge","q":"Why are the Poles shown as points and not circles?","a":"Because the latitude circles become smaller towards the Poles; at 90° the ‘circle’ shrinks to a single point."}],"comp":[{"q":"A ship’s radio says its position is 10° N, 70° E. Which ocean is it most likely in, and in which hemispheres?","a":"It is north of the Equator and east of Greenwich, in the Northern and Eastern Hemispheres. 70° E and 10° N lie west of south India, so it is in the Arabian Sea / Indian Ocean."},{"q":"A cricket match in Mumbai starts at 2:00 p.m. IST. A fan in London (0°) wants to watch live. At what London time should she switch on the TV?","a":"IST is GMT + 5:30. London time = 2:00 p.m. − 5 h 30 min = 8:30 a.m."},{"q":"Your school is making a map for new students. Which three things must it have so that anyone can use it? Give one example of each.","a":"• Scale — e.g. 1 cm = 10 m, to judge distance. • Direction — a north arrow, to know which way to walk. • Symbols — e.g. a cross for the medical room, blue for the water tank."}],"case":[{"t":"Why India needs one clock","p":"India extends from about 68° E in Gujarat to about 97° E in Arunachal Pradesh. The Sun rises in Arunachal Pradesh nearly two hours before it rises in Gujarat. To avoid confusion in railway timetables and offices, the country uses one standard time based on the 82.5° E meridian.","q":["(i) How many minutes does the time change for each degree of longitude? (a) 1 (b) 4 (c) 15 (d)","(ii) Calculate the time difference between 68° E and 97° E.","(iii) Near which town does the IST meridian pass?","(iv) Give one problem that would arise if every Indian state kept its own local time."],"a":["(i) (b) 4 minutes.","(ii) 29° × 4 = 116 minutes ≈ 1 h 56 min (nearly 2 hours).","(iii) Near Mirzapur, Uttar Pradesh.","(iv) Train timetables, flight schedules, TV programmes and office timings would be confusing; people could miss trains."]},{"t":"The Tropic of Cancer","p":"The Tropic of Cancer at 23.5° N passes through the middle of India. Places south of it lie in the Torrid Zone and receive the vertical rays of the Sun at least once a year. Places to its north lie in the Northern Temperate Zone.","q":["(i) Name any two Indian states through which the Tropic of Cancer passes.","(ii) In which heat zone does Chennai lie? (a) Frigid (b) Torrid (c) Northern Temperate (d) Southern Temperate","(iii) Why is the Torrid Zone the hottest?","(iv) Which latitude line marks the southern edge of the Torrid Zone?"],"a":["(i) Any two of Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, Mizoram.","(ii) (b) Torrid.","(iii) It gets the vertical (direct) rays of the Sun, which concentrate heat on a small area.","(iv) Tropic of Capricorn, 23.5° S."]}],"conc":[{"c":"Map","e":"Flat drawing of all or part of Earth, to scale.","x":"School sketch map showing classrooms.","cf":"A sketch map is NOT drawn to scale; a map is.","t":"DDS = Distance, Direction, Symbols"},{"c":"Latitude","e":"Imaginary east–west circles parallel to the Equator; 0°–90° N/S.","x":"Delhi is about 28.6° N.","cf":"Latitude measures N/S position, not E/W.","t":"LATitude lies FLAT (like ladder steps)."},{"c":"Longitude","e":"Imaginary pole-to-pole half-circles; 0°–180° E/W.","x":"Greenwich 0°; India about 68° E to 97° E.","cf":"Longitudes are not parallel; they meet at the Poles.","t":"LONGitudes are LONG, pole to pole."},{"c":"Grid","e":"The network of latitudes and longitudes; the crossing point gives an exact location.","x":"A place at 20° N, 80° E.","cf":"Always write latitude first, then longitude.","t":""},{"c":"Local vs Standard time","e":"Local time depends on the Sun at that longitude; standard time is one agreed time for a whole country.","x":"IST from 82.5° E.","cf":"Standard time is chosen, not natural.","t":"1° = 4 min; 15° = 1 h"},{"c":"Heat zones","e":"Belts of different heat set by latitude lines.","x":"India lies partly in the Torrid and partly in the Temperate zone (Tropic of Cancer crosses India).","cf":"There are 2 temperate and 2 frigid zones, but only 1 torrid zone.","t":"T-T-F from Equator outward: Torrid, Temperate, Frigid"}],"notes":[{"h":"Maps and globes","t":"Globe: true model of the Earth (round). Map: flat drawing of all or part of the Earth. Components of a map: Distance (scale), Direction, Symbols (DDS)."},{"h":"Directions","t":"Cardinal: N, S, E, W. Intermediate: NE, SE, SW, NW. Maps usually show north at the top with an arrow."},{"h":"Latitudes","t":"Imaginary east–west circles parallel to the Equator (0°). Tropic of Cancer 23.5° N (passes through India), Tropic of Capricorn 23.5° S, Arctic Circle 66.5° N, Antarctic Circle 66.5° S, Poles 90°."},{"h":"Longitudes","t":"Half-circles from pole to pole. Prime Meridian 0° at Greenwich (London), up to 180° E and W. Equator divides N/S hemispheres; Prime Meridian divides E/W."},{"h":"Time","t":"Earth turns 360° in 24 hours → 15° = 1 hour, 1° = 4 minutes. Places to the east are ahead in time."},{"h":"Indian Standard Time","t":"Based on 82.5° E (near Mirzapur, UP). IST = GMT + 5 h 30 min. One time for the whole country."},{"h":"Heat zones","t":"Torrid zone (between the two tropics, hottest), Temperate zones, Frigid zones (near poles, coldest)."}]},{"n":2,"t":"Oceans and Continents","intro":"This chapter is the richest source of map questions in the whole book. Learn the five oceans and seven continents on a blank map before anything else.","prio":[{"t":"Five oceans in order of size: Pacific, Atlantic, Indian, Southern, Arctic","s":3},{"t":"Seven continents in order of size: Asia, Africa, N. America, S. America, Antarctica, Europe, Australia","s":3},{"t":"Earth is the ’blue planet’: about 71% water, 29% land; most water is salty ocean","s":3},{"t":"Movements of ocean water: waves, tides, currents (causes + effects)","s":3},{"t":"One special fact for each continent and ocean","s":3},{"t":"Tsunami: cause and the 2004 Indian Ocean tsunami","s":2},{"t":"Antarctica and India’s research stations (Maitri, Bharati)","s":2}],"traps":[{"m":"Putting Indian Ocean 2nd","c":"Order: Pacific, Atlantic, Indian, Southern, Arctic","t":"PAISA — Pacific, Atlantic, Indian, Southern, Arctic"},{"m":"Europe larger than Antarctica","c":"Antarctica is 5th, Europe 6th","t":"Ice (Antarctica) beats Europe"},{"m":"Wind causes tides","c":"Wind → waves; Moon → tides","t":"Moon Makes tides"},{"m":"Mixing Maitri (Antarctic) with Himadri (Arctic)","c":"Maitri, Bharati = Antarctica","t":"Himadri = Himalaya-cold North"},{"m":"Marking the Arctic Ocean at the bottom of the map","c":"Arctic is at the TOP (North Pole)","t":"ARC-tic = top arc"},{"m":"Writing ’Andaman in Arabian Sea’","c":"Andaman & Nicobar = Bay of Bengal","t":"A&N on the East"},{"m":"Saying 71% of water is drinkable","c":"Most water is salty; little is fresh","t":"Salty 97"},{"m":"Unlabelled map features","c":"Name + number every feature neatly","t":"Label, don’t just dot"}],"rq":[{"q":"Why do good fishing grounds form where warm and cold currents meet?","a":"The mixing brings nutrients that allow plankton to grow; fish feed on plankton."},{"q":"Why is Asia sometimes grouped with Europe?","a":"They share one continuous landmass, called Eurasia; only the Ural Mountains separate them."},{"q":"Why are tides useful for ports?","a":"High tide raises water level so large ships can enter harbours."},{"q":"Why is fresh water precious?","a":"Only a very small part of Earth’s water is fresh and easily available; most is salty or frozen."}],"mock":[],"qs":[{"id":"sst2p0","k":"mcq","q":"The largest and deepest ocean is the:","o":["Atlantic","Indian","Pacific","Arctic"],"a":2,"e":"Pacific has the Mariana Trench.","imp":true},{"id":"sst2p1","k":"mcq","q":"The S-shaped ocean is the:","o":["Pacific","Atlantic","Indian","Southern"],"a":1,"e":"Atlantic lies between the Americas and Europe–Africa.","imp":false},{"id":"sst2p2","k":"mcq","q":"The only ocean named after a country is the:","o":["Arctic","Atlantic","Indian","Pacific"],"a":2,"e":"Named after India.","imp":true},{"id":"sst2p3","k":"mcq","q":"The largest continent is:","o":["Africa","Asia","North America","Europe"],"a":1,"e":"About one-third of land.","imp":true},{"id":"sst2p4","k":"mcq","q":"The continent crossed by the Equator and both Tropics is:","o":["Asia","Australia","Africa","South America"],"a":2,"e":"Only Africa has all three.","imp":false},{"id":"sst2p5","k":"mcq","q":"Tides are caused mainly by:","o":["wind","earthquakes","the Moon’s pull","ocean currents"],"a":2,"e":"Gravitational pull of Moon (and Sun).","imp":true},{"id":"sst2p6","k":"mcq","q":"Waves are mainly caused by:","o":["wind","the Moon","the Sun","the Earth’s rotation"],"a":0,"e":"Wind blowing over water.","imp":false},{"id":"sst2p7","k":"mcq","q":"Asia and Europe are separated by the:","o":["Alps","Andes","Ural Mountains","Himalayas"],"a":2,"e":"Urals mark the boundary.","imp":false},{"id":"sst2p8","k":"mcq","q":"The smallest ocean is the:","o":["Southern","Arctic","Indian","Atlantic"],"a":1,"e":"Arctic, around the North Pole.","imp":true},{"id":"sst2p9","k":"mcq","q":"Which is the correct order (largest first)?","o":["Europe, Antarctica, Australia","Antarctica, Europe, Australia","Australia, Europe, Antarctica","Antarctica, Australia, Europe"],"a":1,"e":"5th Antarctica, 6th Europe, 7th Australia.","imp":true},{"id":"sst2p10","k":"mcq","q":"India’s first Antarctic station was:","o":["Maitri","Bharati","Dakshin Gangotri","Himadri"],"a":2,"e":"Himadri is in the Arctic.","imp":false},{"id":"sst2p11","k":"mcq","q":"Lakshadweep islands lie in the:","o":["Bay of Bengal","Arabian Sea","Pacific","Southern Ocean"],"a":1,"e":"West of Kerala.","imp":false},{"id":"sst2t0","k":"tf","q":"About 71% of Earth’s surface is land.","a":1,"e":"71% is water; 29% is land."},{"id":"sst2t1","k":"tf","q":"Australia lies entirely in the Southern Hemisphere.","a":0,"e":""},{"id":"sst2t2","k":"tf","q":"Tides occur once a month.","a":1,"e":"Twice a day."},{"id":"sst2t3","k":"tf","q":"Warm currents flow from the Equator towards the Poles.","a":0,"e":""},{"id":"sst2t4","k":"tf","q":"Antarctica is larger than Europe.","a":0,"e":""},{"id":"sst2t5","k":"tf","q":"The Andaman and Nicobar Islands are in the Arabian Sea.","a":1,"e":"They are in the Bay of Bengal."},{"id":"sst2t6","k":"tf","q":"The Southern Ocean surrounds the Arctic.","a":1,"e":"It surrounds Antarctica."},{"id":"sst2t7","k":"tf","q":"A tsunami is caused by strong winds.","a":1,"e":"Mainly by undersea earthquakes."},{"id":"sst2a0","k":"ar","A":"Australia is called an island continent.","R":"It is surrounded by water on all sides.","a":0,"e":"R directly explains A."},{"id":"sst2a1","k":"ar","A":"The Pacific is the deepest ocean.","R":"The Pacific is S-shaped.","a":2,"e":"R is false — the Atlantic is S-shaped."},{"id":"sst2a2","k":"ar","A":"High tides help big ships enter harbours.","R":"At high tide the water near the coast is deeper.","a":0,"e":"Deeper water lets large ships sail in."},{"id":"sst2a3","k":"ar","A":"Antarctica has no permanent human population.","R":"It is covered with thick ice and is extremely cold.","a":0,"e":"Harsh conditions explain A."},{"id":"sst2x0","k":"mcq","q":"The largest continent is:","o":["Asia","Africa","Europe","Antarctica"],"a":0,"e":"India is in Asia.","sh":1,"x":1},{"id":"sst2x1","k":"mcq","q":"The smallest continent is:","o":["Australia","Europe","Antarctica","South America"],"a":0,"e":"Also an island continent.","sh":1,"x":1},{"id":"sst2x2","k":"mcq","q":"About how much of the Earth’s surface is water?","o":["71%","29%","50%","90%"],"a":0,"e":"That’s why Earth is the ‘Blue Planet’.","sh":1,"x":1},{"id":"sst2x3","k":"mcq","q":"Number of continents:","o":["7","5","6","8"],"a":0,"e":"Asia, Africa, N. America, S. America, Antarctica, Europe, Australia.","sh":1,"x":1},{"id":"sst2x4","k":"mcq","q":"The deepest point on Earth is in the:","o":["Mariana Trench (Pacific)","Indian Ocean","Arctic Ocean","Atlantic Ocean"],"a":0,"e":"Nearly 11 km deep.","sh":1,"x":1},{"id":"sst2x5","k":"mcq","q":"The rise and fall of sea water twice a day is called:","o":["tides","waves","currents","tsunami"],"a":0,"e":"Caused mainly by the Moon’s pull.","sh":1,"x":1},{"id":"sst2x6","k":"mcq","q":"Huge waves caused by undersea earthquakes are called:","o":["tsunamis","tides","currents","cyclones"],"a":0,"e":"2004 tsunami hit India.","sh":1,"x":1},{"id":"sst2x7","k":"mcq","q":"The smallest ocean is the:","o":["Arctic Ocean","Indian Ocean","Pacific Ocean","Atlantic Ocean"],"a":0,"e":"Around the North Pole.","sh":1,"x":1},{"id":"sst2x8","k":"mcq","q":"The only ocean named after a country is the:","o":["Indian Ocean","Pacific Ocean","Atlantic Ocean","Southern Ocean"],"a":0,"e":"India’s long coastline.","sh":1,"x":1},{"id":"sst2x9","k":"mcq","q":"Steady flow of ocean water in a fixed direction is:","o":["ocean current","tide","wave","tsunami"],"a":0,"e":"Warm or cold currents.","sh":1,"x":1},{"id":"sst2x10","k":"mcq","q":"The continent covered with thick ice is:","o":["Antarctica","Asia","Australia","Africa"],"a":0,"e":"No permanent human population.","sh":1,"x":1},{"id":"sst2x11","k":"mcq","q":"Africa is separated from Asia by the:","o":["Red Sea (and Suez Canal)","Pacific Ocean","Arctic Ocean","Bay of Bengal"],"a":0,"e":"North-east of Africa.","sh":1,"x":1},{"id":"sst2y0","k":"tf","q":"The Pacific Ocean is the largest ocean.","a":0,"e":"","x":1},{"id":"sst2y1","k":"tf","q":"Waves are mainly caused by the Moon.","a":1,"e":"Wind causes waves; the Moon causes tides.","x":1},{"id":"sst2y2","k":"tf","q":"Europe and Asia together are sometimes called Eurasia.","a":0,"e":"","x":1},{"id":"sst2m0","k":"mcq","q":"The second largest continent is:","o":["Africa","North America","Europe","Asia"],"a":0,"e":"After Asia.","sh":1,"x":1},{"id":"sst2m1","k":"mcq","q":"Tides are mainly caused by the:","o":["Moon","wind","earthquakes","rivers"],"a":0,"e":"Gravitational pull.","sh":1,"x":1},{"id":"sst2m2","k":"mcq","q":"Which ocean surrounds Antarctica?","o":["Southern Ocean","Arctic Ocean","Indian Ocean","Atlantic Ocean"],"a":0,"e":"Southern Ocean.","sh":1,"x":1},{"id":"sst2m3","k":"mcq","q":"India is surrounded on three sides by the:","o":["Arabian Sea, Bay of Bengal and Indian Ocean","Pacific Ocean","Atlantic Ocean","Arctic Ocean"],"a":0,"e":"Peninsula.","sh":1,"x":1},{"id":"sst2m4","k":"mcq","q":"Fishing grounds are good where:","o":["warm and cold currents meet","only warm water","ice is thick","no current exists"],"a":0,"e":"Plankton grows.","sh":1,"x":1},{"id":"sst2f0","k":"mcq","fill":1,"q":"The deepest point on Earth is the ___ Trench.","o":["Mariana","Indian","Arctic","Atlantic"],"a":0,"e":"","sh":1,"x":1},{"id":"sst2f1","k":"mcq","fill":1,"q":"Waves are caused mainly by ___.","o":["wind","the Moon","earthquakes","rivers"],"a":0,"e":"","sh":1,"x":1},{"id":"sst2f2","k":"mcq","fill":1,"q":"The smallest continent is ___.","o":["Australia","Europe","Antarctica","Asia"],"a":0,"e":"","sh":1,"x":1},{"id":"sst2c00","k":"mcq","q":"What caused the giant waves?","o":["Cyclone","Undersea earthquake","High tide","Heavy rain"],"a":1,"e":"(b) Undersea earthquake."}],"top":[{"q":"Why is the Earth called the ‘blue planet’?","m":2,"imp":true,"a":["About 71% of the Earth’s surface is covered with water, mostly oceans. From space the Earth therefore looks blue, so it is called the blue planet."],"k":"71% + water/oceans + looks blue from space.","cm":"Writing ‘because the sky is blue’."},{"q":"Name the five oceans in decreasing order of size and give one feature of each.","m":5,"imp":true,"a":["Pacific Ocean: largest and deepest; covers about one-third of the Earth; the Mariana Trench (about 11 km deep) is its deepest point.","Atlantic Ocean: second largest; S-shaped; busiest ocean for shipping, between the Americas and Europe–Africa.","Indian Ocean: the only ocean named after a country (India); warm ocean south of Asia.","Southern Ocean: surrounds Antarctica; very cold.","Arctic Ocean: smallest and shallowest; around the North Pole; frozen for most of the year."],"k":"Correct order + one correct fact each.","cm":"Putting the Indian Ocean before the Atlantic."},{"q":"Name the seven continents in decreasing order of size.","m":2,"imp":true,"a":["Asia, Africa, North America, South America, Antarctica, Europe, Australia."],"k":"Exact order; Antarctica is 5th, larger than Europe and Australia.","cm":"Placing Europe above Antarctica."},{"q":"Write a short note on Asia and Africa.","m":3,"imp":true,"a":["Asia: largest continent (about one-third of land); in the Northern and Eastern Hemispheres; separated from Europe by the Ural Mountains; has Mount Everest, the highest peak.","Africa: second largest; the Equator, Tropic of Cancer and Tropic of Capricorn all pass through it; has the Sahara, the largest hot desert, and the Nile, the longest river."],"k":"Size rank + location + two special features each.","cm":"Saying Asia is in the Southern Hemisphere."},{"q":"Why is Australia called an ‘island continent’?","m":2,"imp":true,"a":["Australia is the smallest continent and it is surrounded by water on all sides (oceans and seas), like an island. It lies entirely in the Southern Hemisphere."],"k":"Smallest + surrounded by water on all sides.","cm":"Writing ‘because it is small’ only."},{"q":"Describe Antarctica. Name India’s research stations there.","m":3,"imp":false,"a":["Antarctica is around the South Pole, completely in the Southern Hemisphere.","It is covered with thick ice sheets; no permanent human population; only scientists stay at research stations.","India’s stations: Maitri and Bharati (the first was Dakshin Gangotri)."],"k":"Location + ice + scientists + station names.","cm":"Placing Antarctica at the North Pole."},{"q":"What are tides? What causes them?","m":3,"imp":true,"a":["Tides are the regular rise and fall of the sea level twice a day.","High tide: water covers much of the shore. Low tide: water falls back.","Caused mainly by the gravitational pull of the Moon, and also of the Sun, on the Earth’s water.","Uses: help ships enter harbours at high tide; help fishing."],"k":"Definition + high/low tide + Moon’s (and Sun’s) gravitational pull.","cm":"Saying wind causes tides (wind causes waves)."},{"q":"Differentiate between waves, tides and currents.","m":3,"imp":true,"a":["Waves: up-and-down movement of the surface water, caused mainly by wind.","Tides: rise and fall of sea level twice a day, caused by the pull of the Moon and Sun.","Ocean currents: streams of water flowing in a definite direction over long distances; warm currents from the Equator, cold currents from the Poles."],"k":"One definition + one cause for each.","cm":"Mixing causes of waves and tides."},{"q":"What is a tsunami? Describe the 2004 tsunami briefly.","m":3,"imp":false,"a":["A tsunami is a series of huge sea waves caused by an undersea earthquake (or volcano/- landslide).","On 26 December 2004, an undersea earthquake near Sumatra (Indonesia) caused a tsunami in the Indian Ocean; coasts of India (Tamil Nadu, Andaman and Nicobar Islands), Sri Lanka, Indonesia and Thailand were badly hit."],"k":"Cause + year + ocean + affected areas.","cm":"Calling it a cyclone."},{"q":"How are ocean currents useful to people?","m":3,"imp":false,"a":["Warm currents keep nearby coasts warmer and ports ice-free.","Where warm and cold currents meet, there are rich fishing grounds (plenty of plankton).","Ships can save fuel and time by moving with currents."],"k":"Any three uses.","cm":"Listing only one use for 3 marks."},{"q":"Why is most water on Earth not usable for drinking?","m":2,"imp":false,"a":["Most of the Earth’s water (about 97%) is salty ocean water. Much of the small freshwater share is locked as ice in glaciers and ice caps, so very little is available in rivers, lakes and underground."],"k":"Salty oceans + fresh water locked in ice.","cm":"Saying 71% of water is fresh."},{"q":"Name the continents through which the Equator passes.","m":2,"imp":false,"a":["The Equator passes through South America, Africa and Asia (through Indonesia’s islands)."],"k":"All three continents.","cm":"Writing Australia (it lies south of the Equator)."}],"prac":[{"lv":"Level 1: Basic","q":"Which is the largest ocean?","a":"Pacific Ocean."},{"lv":"Level 1: Basic","q":"Which is the smallest continent?","a":"Australia."},{"lv":"Level 1: Basic","q":"What percentage of Earth’s surface is water?","a":"About 71%."},{"lv":"Level 1: Basic","q":"Name India’s research station in Antarctica.","a":"Maitri or Bharati."},{"lv":"Level 2: Exam Standard","q":"Name the three types of movement of ocean water.","a":"Waves, tides and ocean currents."},{"lv":"Level 2: Exam Standard","q":"Why is the Arctic Ocean frozen for most of the year?","a":"It lies around the North Pole, which gets very little heat from the Sun."},{"lv":"Level 2: Exam Standard","q":"Which ocean is named after a country? Why?","a":"Indian Ocean — named after India, which is at its head and was important in its trade."},{"lv":"Level 2: Exam Standard","q":"Name two continents lying entirely in the Southern Hemisphere.","a":"Australia and Antarctica."},{"lv":"Level 3: Competency / Application","q":"A fisherman wants to take his boat out of a shallow harbour. Should he go at high tide or low tide? Why?","a":"High tide — the water is deeper, so the boat will not get stuck."},{"lv":"Level 3: Competency / Application","q":"Why do the coasts of Europe near a warm current have milder winters?","a":"The warm current carries warm water from near the Equator, warming the air over the coast."},{"lv":"Level 3: Competency / Application","q":"Give two safety steps for people living on a coast if a tsunami warning is issued.","a":"Move quickly to high ground/away from the shore; follow official warnings; do not go to the beach to watch the sea retreat."},{"lv":"Level 4: Challenge","q":"If sea levels rose due to melting ice, which Indian island groups would be most at risk and why?","a":"Lakshadweep and some low-lying Andaman & Nicobar islands — they are small, flat coral/low islands only a few metres above sea level."},{"lv":"Level 4: Challenge","q":"Why does Antarctica have no permanent population even though it is a large continent?","a":"It is covered by thick ice, extremely cold and has no farming land; only scientists live there for short periods."}],"comp":[{"q":"A ship leaves Mumbai for New York. Name the two oceans it will cross (via the Suez Canal route) and one continent it passes.","a":"It sails through the Indian Ocean (Arabian Sea), then the Mediterranean, then the Atlantic Ocean; it passes Africa/Europe."},{"q":"Look at this data: Pacific 165 million sq km, Atlantic 106, Indian 73, Southern 20, Arctic 14. Which ocean is about 12 times the Arctic? What does the data show about the Pacific?","a":"Pacific (165 ÷ 14 ≈ 12). The Pacific is about 1.6 times the Atlantic (165 ÷ 106) and larger than the Indian, Southern and Arctic Oceans put together (73 + 20 + 14 = 107) — by far the largest ocean."},{"q":"Only a small part of Earth’s water is fresh and usable. Suggest two ways your family can save water.","a":"• Close taps while brushing; fix leaking taps. • Reuse RO/washing water for plants; collect rainwater."}],"case":[{"t":"The day the sea came in","p":"On 26 December 2004, a powerful earthquake shook the floor of the Indian Ocean near Sumatra. Within hours, giant waves struck the coasts of Indonesia, Sri Lanka, India and Thailand. In India, the coast of Tamil Nadu and the Andaman and Nicobar Islands were badly affected. Since then, India has set up a tsunami warning centre.","q":["(i) What caused the giant waves? (a) Cyclone (b) Undersea earthquake (c) High tide (d) Heavy rain","(ii) In which ocean did this happen?","(iii) Name the two areas of India most affected.","(iv) How does a warning centre save lives?"],"a":["(i) (b) Undersea earthquake.","(ii) Indian Ocean.","(iii) Tamil Nadu coast and Andaman & Nicobar Islands.","(iv) It detects earthquakes/waves early and warns people to move to safe high ground in time."]},{"t":"Life by the tides","p":"In a coastal village in Gujarat, fishermen plan their day by the tides. At high tide, their boats float easily out of the creek. At low tide, the creek becomes shallow and mud flats appear, where women collect shellfish.","q":["(i) What are tides?","(ii) Which heavenly body mainly causes tides?","(iii) Why do boats leave at high tide?","(iv) Give one benefit of low tide for the villagers."],"a":["(i) Regular rise and fall of sea level, twice a day.","(ii) The Moon (its gravitational pull).","(iii) The water is deeper, so boats float and do not get stuck in mud.","(iv) Mud flats are exposed for collecting shellfish/crabs."]}],"conc":[{"c":"Ocean vs sea","e":"An ocean is a huge water body; a sea is a smaller part of an ocean, partly enclosed by land.","x":"Arabian Sea is part of the Indian Ocean.","cf":"The Indian Ocean is not a sea.","t":""},{"c":"Continent","e":"A very large, continuous landmass.","x":"Asia, Africa.","cf":"Europe and Asia together form Eurasia but are counted separately.","t":"Order: A-A-N-S-A-E-A (Asia, Africa, N. Am., S. Am., Antarctica, Europe, Australia)"},{"c":"Tides","e":"Rise and fall of sea level twice a day due to Moon’s and Sun’s pull.","x":"Fishing boats return at high tide.","cf":"Waves ≠ tides.","t":"Moon Makes tides"},{"c":"Ocean currents","e":"Rivers within the ocean moving in a fixed direction.","x":"Warm currents from the Equator; cold from the Poles.","cf":"Currents are not caused by the Moon.","t":"Warm from the Waist (Equator)"},{"c":"Tsunami","e":"Giant waves from undersea earthquakes.","x":"2004 Indian Ocean tsunami.","cf":"A tsunami is not a storm.","t":""}],"notes":[{"h":"Continents (largest → smallest)","t":"Asia, Africa, North America, South America, Antarctica, Europe, Australia."},{"h":"Oceans (largest → smallest)","t":"Pacific, Atlantic, Indian, Southern, Arctic (PAISA). About 71% of Earth is water, 29% land — the “Blue Planet”."},{"h":"Facts","t":"Pacific: largest and deepest (Mariana Trench ~11 km). Indian Ocean: only ocean named after a country. Australia: island continent. Antarctica: covered in ice, no permanent residents."},{"h":"Movements of ocean water","t":"Waves: caused by wind. Tides: regular rise and fall twice a day, mainly due to the Moon’s pull. Ocean currents: rivers of warm or cold water in the ocean."},{"h":"Tsunami","t":"Giant waves caused by undersea earthquakes or volcanoes — e.g. the 2004 Indian Ocean tsunami."},{"h":"Importance of oceans","t":"Food (fish), trade routes, salt, minerals, control climate, oxygen from marine plants."}]},{"n":3,"t":"Landforms and Life","intro":"Every question here is either ’describe a landform’, ’compare two landforms’ or ’how do people live there’. Master the three big landforms first.","prio":[{"t":"Three major landforms: mountains, plateaus, plains — definition + example","s":3},{"t":"Differences: mountain vs plateau vs plain (table)","s":3},{"t":"Life in the mountains: terrace farming, herding, tourism, pilgrimage; challenges","s":3},{"t":"Plateaus: minerals, waterfalls; Deccan, Chota Nagpur, Tibetan","s":3},{"t":"Plains: fertile alluvium, farming, dense population; Indo-Gangetic Pla g roads and railways.","a":0,"e":""},{"id":"sst3t4","k":"tf","q":"Ladakh is a hot desert.","a":1,"e":"Ladakh is a cold desert."},{"id":"sst3t5","k":"tf","q":"Terrace farming reduces soil erosion.","a":0,"e":""},{"id":"sst3t6","k":"tf","q":"Mountains are usually thickly populated.","a":1,"e":"Thinly populated — steep, cold, less farmland."},{"id":"sst3t7","k":"tf","q":"Waterfalls are common at the edges of plateaus.","a":0,"e":""},{"id":"sst3a0","k":"ar","A":"Plains are densely populated.","R":"Plains have fertile soil and flat land.","a":0,"e":"Fertile flat land supports farming and settlement."},{"id":"sst3a1","k":"ar","A":"Terrace farming is done on slopes.","R":"Terraces prevent soil erosion.","a":0,"e":"Preventing erosion is why terraces are made."},{"id":"sst3a2","k":"ar","A":"The Aravalli range is higher than the Himalayas.","R":"The Aravallis are very old mountains.","a":3,"e":"A is false; R is true — being old, they are worn down and lower."},{"id":"sst3a3","k":"ar","A":"Chota Nagpur Plateau has many industries.","R":"It is rich in minerals.","a":0,"e":"Minerals attract industries."},{"id":"sst3x0","k":"mcq","q":"High landforms with steep slopes and peaks are:","o":["mountains","plains","plateaus","valleys"],"a":0,"e":"e.g. the Himalayas.","sh":1,"x":1},{"id":"sst3x1","k":"mcq","q":"A flat, raised land with steep sides is a:","o":["plateau","plain","valley","delta"],"a":0,"e":"Table-land.","sh":1,"x":1},{"id":"sst3x2","k":"mcq","q":"Flat, low land formed by river deposits is a:","o":["plain","plateau","mountain","glacier"],"a":0,"e":"Very fertile.","sh":1,"x":1},{"id":"sst3x3","k":"mcq","q":"The Deccan is an example of a:","o":["plateau","plain","mountain","desert"],"a":0,"e":"In peninsular India.","sh":1,"x":1},{"id":"sst3x4","k":"mcq","q":"Most people live in plains because:","o":["land is fertile and flat for farming and transport","it is cold","there are no rivers","it is rocky"],"a":0,"e":"Easy living conditions.","sh":1,"x":1},{"id":"sst3x5","k":"mcq","q":"Terrace farming is done on:","o":["hill slopes","deserts","plains","oceans"],"a":0,"e":"Steps cut to hold water and soil.","sh":1,"x":1},{"id":"sst3x6","k":"mcq","q":"Plateaus are often rich in:","o":["minerals","snow","coral","sea water"],"a":0,"e":"e.g. Chhota Nagpur plateau.","sh":1,"x":1},{"id":"sst3x7","k":"mcq","q":"Rivers of ice are called:","o":["glaciers","deltas","waterfalls","lakes"],"a":0,"e":"Found in high mountains.","sh":1,"x":1},{"id":"sst3x8","k":"mcq","q":"The Indo-Gangetic plain is famous for:","o":["fertile soil and farming","deserts","snow","coal only"],"a":0,"e":"Rice and wheat grow well.","sh":1,"x":1},{"id":"sst3x9","k":"mcq","q":"The Himalayas are:","o":["young fold mountains","old plateaus","plains","islands"],"a":0,"e":"Highest mountain range.","sh":1,"x":1},{"id":"sst3x10","k":"mcq","q":"Ladakh is a cold:","o":["desert","plain","forest","ocean"],"a":0,"e":"High-altitude cold desert.","sh":1,"x":1},{"id":"sst3y0","k":"tf","q":"Mountains are thickly populated.","a":1,"e":"Harsh climate and steep slopes — few people.","x":1},{"id":"sst3y1","k":"tf","q":"Plains are good for building roads and railways.","a":0,"e":"","x":1},{"id":"sst3y2","k":"tf","q":"Waterfalls are often seen at the edges of plateaus.","a":0,"e":"","x":1},{"id":"sst3m0","k":"mcq","q":"The Chhota Nagpur plateau is rich in:","o":["minerals","snow","sea fish","sand dunes"],"a":0,"e":"Coal, iron ore.","sh":1,"x":1},{"id":"sst3m1","k":"mcq","q":"Steps cut on hill slopes for farming are:","o":["terraces","deltas","plateaus","dunes"],"a":0,"e":"Terrace farming.","sh":1,"x":1},{"id":"sst3m2","k":"mcq","q":"Plains are usually formed by:","o":["rivers","volcanoes","glaciers only","wind only"],"a":0,"e":"River deposits (alluvium).","sh":1,"x":1},{"id":"sst3m3","k":"mcq","q":"The Thar is a:","o":["hot desert","cold desert","plateau","plain"],"a":0,"e":"In Rajasthan.","sh":1,"x":1},{"id":"sst3m4","k":"mcq","q":"Highest plateau in the world:","o":["Tibetan Plateau","Deccan Plateau","Malwa Plateau","Chhota Nagpur"],"a":0,"e":"“Roof of the world”.","sh":1,"x":1},{"id":"sst3f0","k":"mcq","fill":1,"q":"A flat-topped raised land is called a ___.","o":["plateau","plain","valley","delta"],"a":0,"e":"","sh":1,"x":1},{"id":"sst3f1","k":"mcq","fill":1,"q":"The Himalayas are ___ fold mountains.","o":["young","old","flat","small"],"a":0,"e":"","sh":1,"x":1},{"id":"sst3f2","k":"mcq","fill":1,"q":"Most people live in the ___ because they are fertile and flat.","o":["plains","mountains","deserts","plateaus"],"a":0,"e":"","sh":1,"x":1},{"id":"sst3c02","k":"mcq","q":"Steps on the hillside: In the hills of Uttarakhand, farmers cut the slopes into flat steps. They grow rice, millets and vegetables on these steps. During winter, many families move down to warmer valleys with their sheep and goats and return to high pastures in summer. — What is the seasonal movement of herders called?","o":["Migration","Transhumance","Tourism","Pilgrimage"],"a":1,"e":"(b) Transhumance."}],"top":[{"q":"What is a mountain? Give two examples from India and one from the world.","m":2,"imp":true,"a":["A mountain is a natural elevation of the Earth’s surface that rises much higher than the surrounding area, usually with steep slopes and a peak. India: Himalayas, Western Ghats (Sahyadri), Aravalli. World: Alps (Europe), Andes (South America), Rockies (North America)."],"k":"High + steep slopes + peak + correct examples.","cm":"Calling a hill a mountain without mentioning height/steepness."},{"q":"What is a plateau? Why are plateaus useful to people?","m":3,"imp":true,"a":["A plateau is a raised area of land with a flat top, often called a tableland, standing above the surrounding area with steep sides.","Uses: rich in minerals (e.g. Chota Nagpur Plateau — coal, iron ore); waterfalls used for hydro-electricity and tourism; some have fertile black soil (Deccan) good for cotton.","Examples: Deccan Plateau (India), Tibetan Plateau (highest, ‘roof of the world’)."],"k":"Flat-topped + raised + two uses + one example.","cm":"Saying plateaus are low-lying."},{"q":"Why are plains densely populated?","m":3,"imp":true,"a":["Plains are flat, low-lying lands, usually formed by rivers depositing fertile alluvial soil.","Flat land and fertile soil make farming easy; rivers give water.","It is easy to build roads, railways, houses and industries, so towns and cities grow. Example: Indo-Gangetic Plain."],"k":"Fertile soil + water + easy transport/building = dense population.","cm":"Writing only ‘because land is flat’."},{"q":"Differentiate between mountains, plateaus and plains.","m":3,"imp":true,"a":["Height: mountains very high; plateaus raised; plains low-lying.","Surface: mountains steep with peaks; plateaus flat top with steep sides; plains flat and level.","Formation/soil: mountains rocky, thin soil; plateaus rocky, minerals; plains fertile river soil.","Population: mountains thin; plateaus moderate; plains dense.","Example: Himalayas; Deccan Plateau; Indo-Gangetic Plain."],"k":"At least 4 points in a table with an example for each.","cm":"Comparing only two of the three."},{"q":"How do people adapt to life in the mountains?","m":5,"imp":true,"a":["Terrace farming: slopes are cut into steps so that soil and water do not wash away.","Herding/transhumance: herders move animals to high pastures in summer and down to valleys in winter.","Houses: built of stone and wood with sloping roofs to let snow/rain slide off.","Clothing and food: warm woollen clothes; stored food for long winters.","Livelihoods: tourism, trekking, pilgrimages, handicrafts; challenges: landslides, cold, difficult transport."],"k":"Five different adaptations with a one-line explanation each.","cm":"Listing problems only, without adaptations."},{"q":"What is terrace farming? Why is it practised?","m":2,"imp":true,"a":["Terrace farming means cutting flat steps (terraces) on hill slopes to grow crops. It is practised because steep slopes lose soil and water quickly; terraces slow down water, stop soil erosion and create flat land for crops like rice and tea."],"k":"Steps on slopes + prevents soil erosion + creates flat land.","cm":"Writing ‘farming on rooftops’."},{"q":"Write a short note on the Himalayas.","m":3,"imp":true,"a":["The Himalayas (’abode of snow’) are young fold mountains along India’s northern border.","They include the world’s highest peak, Mount Everest (about 8,849 m), called Sagarmatha in Nepal.","They are the source of rivers like the Ganga and Brahmaputra, block cold winds from Central Asia and bring monsoon rain; they are sacred to many communities and have pilgrimage sites."],"k":"Meaning + Everest + three importance points.","cm":"Calling the Himalayas the oldest mountains (the Aravallis are among the oldest)."},{"q":"What are deserts? Distinguish between a hot desert and a cold desert with examples.","m":3,"imp":false,"a":["A desert is a dry region with very little rainfall and little vegetation.","Hot desert: very hot days, sandy; e.g. Thar (Rajasthan), Sahara (Africa).","Cold desert: very cold, high altitude, rocky; e.g. Ladakh."],"k":"Definition + one feature and example each.","cm":"Thinking all deserts are hot and sandy."},{"q":"How do rivers form plains?","m":2,"imp":false,"a":["Rivers flowing down from mountains carry silt, sand and soil. When they reach low, flat areas they slow down and deposit this material. Over thousands of years layers of fertile alluvium build up to form plains."],"k":"Carry → slow down → deposit → layers of alluvium.","cm":"Saying plains are formed by wind only."},{"q":"Why should we protect fragile landforms like mountains?","m":3,"imp":false,"a":["Cutting forests and building roads carelessly on slopes causes landslides and floods.","Mountains are the source of rivers that millions depend on; glaciers are melting.","They are home to rare plants and animals and to communities whose ways of life depend on them. So we must plant trees, limit construction, and follow responsible tourism."],"k":"Two dangers + one reason + one action.","cm":"Giving only ‘they are beautiful’."},{"q":"Name any three other landforms and describe them in one line each.","m":3,"imp":false,"a":["Valley: low land between hills/mountains, often with a river.","Island: land surrounded by water on all sides (e.g. Andaman).","Glacier: a slow-moving river of ice (e.g. Gangotri glacier).","Coast: land along the sea (e.g. Konkan coast)."],"k":"Three correct landforms with correct one-line meanings.","cm":"Writing ‘ocean’ as a landform."}],"prac":[{"lv":"Level 1: Basic","q":"What is the highest mountain peak in the world?","a":"Mount Everest."},{"lv":"Level 1: Basic","q":"Which plateau is called the ‘roof of the world’?","a":"Tibetan Plateau."},{"lv":"Level 1: Basic","q":"Name a cold desert in India.","a":"Ladakh."},{"lv":"Level 1: Basic","q":"What is a plateau also called?","a":"Tableland."},{"lv":"Level 2: Exam Standard","q":"Give two reasons why plains are good for farming.","a":"Fertile alluvial soil; flat land; water from rivers (any two)."},{"lv":"Level 2: Exam Standard","q":"Name two minerals found in the Chota Nagpur Plateau.","a":"Coal and iron ore."},{"lv":"Level 2: Exam Standard","q":"Why do mountain houses have sloping roofs?","a":"So that snow and rain slide off easily."},{"lv":"Level 2: Exam Standard","q":"Name two ways people earn a living in the mountains.","a":"Tourism, herding, terrace farming, handicrafts (any two)."},{"lv":"Level 3: Competency / Application","q":"A company wants to build a large factory. Would you advise a plain or a mountain? Give two reasons.","a":"A plain — flat land makes building easy; roads and railways are easy to lay; water and workers are available."},{"lv":"Level 3: Competency / Application","q":"Tourists leave plastic on a mountain trek. Explain two harms and suggest one solution.","a":"Plastic chokes streams and harms animals; spoils the beauty. Solution: carry back all waste / ban single-use plastic on treks."},{"lv":"Level 3: Competency / Application","q":"Why do waterfalls often occur at the edge of plateaus?","a":"Rivers flowing across the flat top fall steeply over the plateau’s steep edge."},{"lv":"Level 4: Challenge","q":"Why is the Indo-Gangetic Plain called the ‘food bowl’ of India, and what problem does heavy population create there?","a":"It produces large amounts of wheat and rice from fertile alluvial soil. Heavy population causes pressure on land and water, pollution of rivers, and crowded cities."},{"lv":"Level 4: Challenge","q":"Himalayas are young mountains while Aravallis are old. What difference would you expect in their shape?","a":"Young mountains are high with sharp, jagged peaks; old mountains have been worn down by erosion and are lower and rounded."}],"comp":[{"q":"After heavy rain, a road in a hill town is blocked by a landslide. Give two human actions that may have caused it and two ways to prevent it.","a":"• Causes: cutting trees on slopes; blasting hills to widen roads/build hotels. • Prevention: plant trees; build retaining walls and drains; limit construction on steep slopes."},{"q":"Your family is choosing between a trip to Ladakh and the Thar Desert. Compare the weather you should pack for.","a":"Ladakh — cold desert: very cold especially at night, thin air, strong sun; pack woollens. Thar — hot desert: hot days, cold nights, sand; pack light cotton plus something warm for nights."},{"q":"Why do you think many old cities of India grew on plains along rivers?","a":"Rivers gave water for drinking and farming; fertile soil produced food; flat land and rivers made trade and travel easy."}],"case":[{"t":"Steps on the hillside","p":"In the hills of Uttarakhand, farmers cut the slopes into flat steps. They grow rice, millets and vegetables on these steps. During winter, many families move down to warmer valleys with their sheep and goats and return to high pastures in summer.","q":["(i) What is this method of farming called?","(ii) How do the steps help farmers?","(iii) What is the seasonal movement of herders called? (a) Migration (b) Transhumance (c) Tourism (d) Pilgrimage","(iv) Give one difficulty of living in such hills."],"a":["(i) Terrace (step) farming.","(ii) They stop soil being washed away and hold water for crops.","(iii) (b) Transhumance.","(iv) Cold winters / landslides / difficult transport / less flat land."]},{"t":"The river’s gift","p":"For thousands of years, the Ganga and its tributaries have brought soil down from the Himalayas and spread it over North India. Today this flat land grows much of India’s wheat and rice, and cities such as Kanpur, Prayagraj and Patna stand on it.","q":["(i) Name the landform described.","(ii) What kind of soil do rivers deposit?","(iii) Why are there many cities here?","(iv) State one problem caused by too many people in plains."],"a":["(i) Plain (Indo-Gangetic / Ganga Plain).","(ii) Fertile alluvial soil (alluvium).","(iii) Flat land, water and good farming make it easy to live, build and trade.","(iv) River pollution / crowding / pressure on land and water."]}],"conc":[{"c":"Mountain","e":"Very high land with steep slopes and peaks.","x":"Himalayas.","cf":"Hills are lower and more rounded.","t":"Mountains = Maximum height"},{"c":"Plateau","e":"Raised, flat-topped tableland.","x":"Deccan Plateau.","cf":"A plateau is high but flat on top, unlike a mountain.","t":"PLATE-au = flat like a plate, but raised"},{"c":"Plain","e":"Flat, low land, often made by rivers.","x":"Indo-Gangetic Plain.","cf":"Plains are not always near the sea.","t":"Plains = Plenty of people"},{"c":"Transhumance","e":"Seasonal movement of herders and animals between high and low pastures.","x":"Gaddi and Bakarwal herders.","cf":"It is seasonal, not permanent migration.","t":""},{"c":"Terrace farming","e":"Step-like fields on slopes.","x":"Rice terraces in hills.","cf":"Not the same as rooftop gardening.","t":""}],"notes":[{"h":"Three main landforms","t":"Mountains (high, steep, peaks), Plateaus (raised flat table-land with steep sides), Plains (low, flat, fertile land made by river deposits)."},{"h":"Mountains","t":"Himalayas: young fold mountains, highest in the world. Life: cold, terrace farming on slopes, few people, tourism, rivers start from glaciers."},{"h":"Plateaus","t":"Deccan Plateau, Chhota Nagpur Plateau (rich in minerals like coal and iron), Tibetan Plateau (highest). Waterfalls often form at plateau edges."},{"h":"Plains","t":"Indo-Gangetic plain: fertile alluvial soil, farming (rice, wheat), dense population, easy transport — many big cities."},{"h":"Other landforms","t":"Valleys (between mountains), deserts (Thar — hot; Ladakh — cold desert), coasts and deltas (Sundarbans)."},{"h":"People adapt","t":"Clothing, houses, food and work change with landforms: woollens and sloping roofs in mountains, mining on plateaus, farming on plains."}]},{"n":4,"t":"Timeline and Sources of History","intro":"Easy full marks if you can count years across BCE/CE and name the sources of history. Practise the counting questions until you never slip.","prio":[{"t":"BCE and CE; counting backwards in BCE; no year 0","s":3},{"t":"Decade (10), century (100), millennium (1,000); which years form a century","s":3},{"t":"Sources of history: archaeological (artefacts, monuments, coins, inscriptions) and literary (manuscripts, texts) + oral traditions","s":3},{"t":"Archaeology and excavation; what archaeologists study","s":3},{"t":"Early humans: hunter-gatherers, stone tools, fire; Bhimbetka rock shelters","s":3},{"t":"Beginning of farming and domestication; Mehrgarh","s":2},{"t":"Indian calendars: Vikram Samvat (57 BCE), Shaka Samvat (78 CE)","s":2},{"t":"Timeline: drawing and reading","s":2}],"traps":[{"m":"300 BCE to 200 CE = 100 years","c":"Opposite eras: add, then subtract 1 → 499","t":"Cross the line? Add −1"},{"m":"21st century = 2000–2099","c":"2001–2100","t":"Centuries end in 00"},{"m":"Bigger BCE = more recent","c":"Bigger BCE = older","t":"BCE: bigger is back"},{"m":"Coins as literary sources","c":"Coins, inscriptions, tools = archaeological","t":"If you can touch it, it’s archaeological"},{"m":"Manuscript = inscription","c":"Manuscript: hand-written on leaf/paper; inscription: carved on stone/metal","t":"Manu = hand"},{"m":"Mehrgarh = Harappan city","c":"Mehrgarh = early farming village","t":"Mehr-garh = early home"},{"m":"Swapping Vikram and Shaka Samvat dates","c":"Vikram 57 BCE; Shaka 78 CE","t":"V comes before S — V is older"},{"m":"Timeline with unequal gaps","c":"Equal spaces for equal time","t":"Ruler first, then dates"}],"rq":[{"q":"Why are BCE years counted backwards?","a":"They are counted from the dividing year going back into the past, so larger numbers are further back."},{"q":"Why did farming lead to villages?","a":"Crops need looking after for months, so people stayed in one place and built permanent homes."},{"q":"Why are inscriptions more reliable than stories for dates?","a":"They were written at that time on lasting material and often mention rulers and dates directly."},{"q":"Why did early humans use fire?","a":"For warmth, cooking, light and to scare away wild animals."}],"mock":[],"qs":[{"id":"sst4p0","k":"mcq","q":"BCE stands for:","o":["Before Christian Era","Before Common Era","Beyond Common Era","Before Century Era"],"a":1,"e":"Before Common Era.","imp":true},{"id":"sst4p1","k":"mcq","q":"Which is the oldest date?","o":["200 BCE","1200 BCE","100 CE","700 BCE"],"a":1,"e":"Largest BCE number is oldest.","imp":true},{"id":"sst4p2","k":"mcq","q":"A millennium is:","o":["10 years","100 years","1,000 years","10,000 years"],"a":2,"e":"Mille = thousand.","imp":false},{"id":"sst4p3","k":"mcq","q":"The 21st century covers:","o":["2000–2099","2001–2100","2100–2199","1901–2000"],"a":1,"e":"Centuries end in ’00’.","imp":true},{"id":"sst4p4","k":"mcq","q":"Writing on stone or metal is a/an:","o":["manuscript","inscription","oral tradition","coin"],"a":1,"e":"Hard surface = inscription.","imp":true},{"id":"sst4p5","k":"mcq","q":"Bhimbetka i
