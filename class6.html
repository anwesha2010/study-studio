s 1/8 smaller than 1/5?","a":"The same whole is cut into more pieces, so each piece is smaller."},{"q":"Why must we convert mixed numbers before subtracting sometimes?","a":"The fraction part being subtracted can be bigger than the one we subtract from."}],"mock":[{"q":"Write 29/6 as a mixed fraction.","a":"4 5/6 (29 = 4 × 6 + 5)","m":1},{"q":"Reduce 42/56 to lowest terms.","a":"HCF is 14 → 3/4","m":2},{"q":"Compare 4/7 and 5/9.","a":"Common denominator 63: 36/63 and 35/63, so 4/7 > 5/9.","m":2},{"q":"Arrange in descending order: 5/6, 5/9, 7/9, 1/2.","a":"In 18ths: 15, 10, 14, 9 → 5/6, 7/9, 5/9, 1/2.","m":2},{"q":"Add 3/8 + 1/2.","a":"3/8 + 4/8 = 7/8.","m":2},{"q":"Subtract 4 1/5 − 2 2/3.","a":"21/5 − 8/3 = 63/15 − 40/15 = 23/15 = 1 8/15.","m":3},{"q":"Riya read 2/5 of a book on Monday and 1/3 on Tuesday. What fraction is still unread?","a":"Read 6/15 + 5/15 = 11/15; unread 4/15.","m":3},{"q":"Find 3/5 of 45.","a":"45 ÷ 5 × 3 = 27.","m":2},{"q":"Mark 2/3 and 1 1/3 on a number line.","a":"Divide each unit into 3 equal parts; 2/3 is the 2nd mark after 0, 1 1/3 is the 1st mark after 1.","m":2}],"qs":[{"id":"math7x0","k":"mcq","q":"Which fraction is equivalent to 1/2?","o":["3/6","2/3","1/3","2/5"],"a":0,"e":"Multiply top and bottom by 3.","sh":1,"x":1},{"id":"math7x1","k":"mcq","q":"2/3 is equivalent to:","o":["4/6","3/4","2/6","4/3"],"a":0,"e":"× 2 on top and bottom.","sh":1,"x":1},{"id":"math7x2","k":"mcq","q":"1/2 + 1/3 =","o":["5/6","2/5","2/6","1/5"],"a":0,"e":"LCD 6: 3/6 + 2/6.","sh":1,"x":1},{"id":"math7x3","k":"mcq","q":"Which is the largest?","o":["3/4","2/3","1/2","5/8"],"a":0,"e":"In 24ths: 18, 16, 12, 15.","sh":1,"x":1},{"id":"math7x4","k":"mcq","q":"Which is smaller: 1/8 or 1/5?","o":["1/8","1/5","Both equal","Cannot say"],"a":0,"e":"Same numerator — bigger denominator means smaller pieces.","sh":1,"x":1},{"id":"math7x5","k":"mcq","q":"22/7 as a mixed fraction:","o":["3 1/7","3 2/7","2 8/7","4 1/7"],"a":0,"e":"22 = 3 × 7 + 1.","sh":1,"x":1},{"id":"math7x6","k":"mcq","q":"Lowest terms of 12/36:","o":["1/3","2/6","4/12","1/4"],"a":0,"e":"Divide top and bottom by 12.","sh":1,"x":1},{"id":"math7x7","k":"mcq","q":"5/6 − 1/6 =","o":["2/3","4/0","1","5/36"],"a":0,"e":"4/6 = 2/3.","sh":1,"x":1},{"id":"math7x8","k":"mcq","q":"3/4 of 20 is:","o":["15","12","16","5"],"a":0,"e":"20 ÷ 4 × 3.","sh":1,"x":1},{"id":"math7x9","k":"mcq","q":"2 3/5 as an improper fraction:","o":["13/5","11/5","10/5","6/5"],"a":0,"e":"2 × 5 + 3 = 13.","sh":1,"x":1},{"id":"math7x10","k":"mcq","q":"3/8 + 3/8 =","o":["3/4","6/16","9/8","3/16"],"a":0,"e":"6/8 = 3/4.","sh":1,"x":1},{"id":"math7x11","k":"mcq","q":"Which is less than 1/2?","o":["3/7","4/7","5/8","2/3"],"a":0,"e":"3/7 < 3.5/7.","sh":1,"x":1},{"id":"math7x12","k":"mcq","q":"A fraction whose numerator is bigger than its denominator is called:","o":["improper fraction","proper fraction","unit fraction","mixed number"],"a":0,"e":"e.g. 7/4.","sh":1,"x":1},{"id":"math7x13","k":"mcq","q":"1/4 + 1/4 + 1/4 + 1/4 =","o":["1","4/16","1/16","4/4 + 1"],"a":0,"e":"Four quarters make a whole.","sh":1,"x":1},{"id":"math7x14","k":"mcq","q":"A unit fraction has numerator:","o":["1","0","10","equal to denominator"],"a":0,"e":"e.g. 1/2, 1/7.","sh":1,"x":1},{"id":"math7y0","k":"tf","q":"3/5 and 6/10 are equivalent fractions.","a":0,"e":"Both × 2.","x":1},{"id":"math7y1","k":"tf","q":"To add 1/2 and 1/3 we add the denominators: 2/5.","a":1,"e":"Use a common denominator: 5/6.","x":1},{"id":"math7y2","k":"tf","q":"1/9 is greater than 1/7.","a":1,"e":"Same numerator — bigger denominator means smaller fraction.","x":1},{"id":"math7y3","k":"tf","q":"7/7 = 1.","a":0,"e":"","x":1},{"id":"math7y4","k":"tf","q":"Every improper fraction is greater than or equal to 1.","a":0,"e":"","x":1},{"id":"math7y5","k":"tf","q":"3 1/2 = 7/2.","a":0,"e":"3 × 2 + 1 = 7.","x":1},{"id":"math7z0","k":"ar","A":"6/9 and 2/3 are equivalent.","R":"Both simplify to 2/3.","a":0,"e":"R explains A.","x":1},{"id":"math7z1","k":"ar","A":"1/7 > 1/5.","R":"7 is greater than 5.","a":3,"e":"A is false (1/7 is smaller); R is true.","x":1},{"id":"math7z2","k":"ar","A":"1/2 + 1/3 = 5/6.","R":"We convert both to sixths before adding.","a":0,"e":"Common denominator explains it.","x":1},{"id":"math7z3","k":"ar","A":"17/5 = 3 2/5.","R":"17 = 3 × 5 + 2.","a":0,"e":"Division gives quotient 3 and remainder 2.","x":1},{"id":"math7m0","k":"mcq","q":"5/8 − 3/8 =","o":["1/4","2/0","2/16","1/8"],"a":0,"e":"2/8 = 1/4.","sh":1,"x":1},{"id":"math7m1","k":"mcq","q":"2/5 + 1/10 =","o":["1/2","3/15","3/10","2/10"],"a":0,"e":"4/10 + 1/10 = 5/10.","sh":1,"x":1},{"id":"math7m2","k":"mcq","q":"Which fraction is in lowest terms?","o":["5/9","4/6","6/9","10/15"],"a":0,"e":"5 and 9 have only 1 as common factor.","sh":1,"x":1},{"id":"math7m3","k":"mcq","q":"Arrange in ascending order: 1/2, 1/4, 1/3","o":["1/4, 1/3, 1/2","1/2, 1/3, 1/4","1/3, 1/4, 1/2","1/4, 1/2, 1/3"],"a":0,"e":"Same numerator: bigger denominator = smaller.","sh":1,"x":1},{"id":"math7m4","k":"mcq","q":"1 3/4 as an improper fraction:","o":["7/4","4/7","5/4","13/4"],"a":0,"e":"1 × 4 + 3 = 7.","sh":1,"x":1},{"id":"math7m5","k":"mcq","q":"2/3 of 18 =","o":["12","6","9","27"],"a":0,"e":"18 ÷ 3 × 2.","sh":1,"x":1},{"id":"math7f0","k":"mcq","fill":1,"q":"In 3/7, the number 7 is the ___.","o":["denominator","numerator","whole","quotient"],"a":0,"e":"","sh":1,"x":1},{"id":"math7f1","k":"mcq","fill":1,"q":"A fraction with numerator 1 is called a ___ fraction.","o":["unit","proper","improper","mixed"],"a":0,"e":"","sh":1,"x":1},{"id":"math7f2","k":"mcq","fill":1,"q":"To add 1/4 and 1/6 we first find a common ___.","o":["denominator","numerator","factor","whole"],"a":0,"e":"","sh":1,"x":1},{"id":"math7f3","k":"mcq","fill":1,"q":"9/4 written as a mixed number is ___.","o":["2 1/4","4 1/2","2 1/2","1 5/4"],"a":0,"e":"","sh":1,"x":1}],"top":[],"prac":[],"comp":[],"case":[],"conc":[],"notes":[{"h":"What is a fraction?","t":"A fraction shows equal parts of a whole: 3/4 means 3 parts out of 4 equal parts. Top = numerator, bottom = denominator. 1/n is a unit fraction (fractional unit)."},{"h":"Types","t":"Proper: numerator < denominator (3/5). Improper: numerator ≥ denominator (7/4). Mixed number: whole + fraction (1 3/4). 7/4 = 1 3/4 because 7 = 1 × 4 + 3."},{"h":"Equivalent fractions","t":"Multiply or divide top AND bottom by the same number: 1/2 = 2/4 = 3/6 = 4/8. Never add the same number to both!"},{"h":"Lowest terms","t":"Divide top and bottom by their HCF: 12/18 → ÷ 6 → 2/3."},{"h":"Comparing fractions","t":"Same denominator: bigger numerator is bigger (5/8 > 3/8). Same numerator: smaller denominator is bigger (1/3 > 1/5). Otherwise make denominators equal first."},{"h":"Adding and subtracting","t":"Like fractions: add/subtract numerators, keep denominator (2/7 + 3/7 = 5/7). Unlike: change to a common denominator first (1/2 + 1/3 = 3/6 + 2/6 = 5/6)."},{"h":"Mixed numbers","t":"Convert to improper fractions before subtracting: 3 1/4 − 1 1/2 = 13/4 − 6/4 = 7/4 = 1 3/4."},{"h":"Fraction of a quantity","t":"2/5 of 30 = 30 ÷ 5 × 2 = 12."},{"h":"Brahmagupta’s method","t":"To add a/b + c/d, use the common denominator b × d (or the LCM): a/b + c/d = (a × d + c × b) / (b × d). Brahmagupta described this over 1,300 years ago!"}]},{"n":8,"t":"Playing with Constructions","intro":"Marks come from accurate constructions with ruler and compass, clearly shown arcs and correct properties of rectangles and squares. Always keep construction marks; never rub them out.","prio":[{"t":"Circle: centre, radius, diameter (d = 2r); drawing with compass","s":3},{"t":"Points at given distances from two points (intersecting arcs)","s":3},{"t":"Properties of a rectangle: opposite sides equal, all angles 90°, diagonals equal and bisect each other","s":3},{"t":"Properties of a square: all sides equal, angles 90°, diagonals equal, perpendicular, bisect each other","s":3},{"t":"Constructing a rectangle/square of given sides","s":3},{"t":"Constructing a rectangle from one side and a diagonal","s":2},{"t":"Curvy patterns and designs with arcs","s":1}],"traps":[{"m":"Compass opened to diameter","c":"Open to radius","t":"Half the diameter"},{"m":"Right angle by eye","c":"Use protractor/set square or compass","t":"Measure, don’t guess"},{"m":"Erasing arcs","c":"Keep all construction marks","t":"Arcs = marks"},{"m":"Diagonals ⊥ in rectangle","c":"Only square","t":"⊥ = square only"},{"m":"Unlabelled vertices","c":"Label every point","t":"Name every corner"}],"rq":[{"q":"Why does a compass draw a circle?","a":"The pencil stays at a fixed distance (radius) from the fixed point (centre)."},{"q":"Why do two arcs give the required point?","a":"Each arc contains all points at the given distance from its centre; the crossing is at both distances."},{"q":"Why is a square a rectangle?","a":"It has all the rectangle’s properties (four right angles, opposite sides equal)."}],"mock":[{"q":"Find the radius of a circle of diameter 13 cm.","m":1,"a":"6.5 cm."},{"q":"Write three properties of a square.","m":2,"a":"All sides equal; all angles 90°; diagonals equal, perpendicular, bisect each other (any three)."},{"q":"Construct a rectangle with sides 7 cm and 3 cm. Measure its diagonals.","m":4,"a":"Correct rectangle; diagonals equal (≈ 7.6 cm)."},{"q":"P and Q are 6 cm apart. Construct a point R with PR = 5 cm and QR = 3 cm.","m":3,"a":"Arcs 5 cm from P and 3 cm from Q meet at R."},{"q":"The diagonals of rectangle WXYZ meet at O. If WY = 14 cm, find OX.","m":2,"a":"7 cm."},{"q":"Draw a circle of radius 3 cm and mark a radius and a diameter.","m":2,"a":"Correct circle with labels."},{"q":"State one difference between the diagonals of a rectangle and those of a square.","m":2,"a":"Square’s diagonals are perpendicular; rectangle’s are not (in general)."},{"q":"Why should construction arcs not be rubbed out?","m":1,"a":"They show the method; marks are given for them."}],"qs":[{"id":"math8p0","k":"mcq","q":"Diameter =","o":["r","2r","r ÷ 2","3r"],"a":1,"e":"Twice radius.","imp":true},{"id":"math8p1","k":"mcq","q":"Diagonals of a rectangle are:","o":["always perpendicular","equal","unequal","parallel"],"a":1,"e":"Equal and bisect.","imp":true},{"id":"math8p2","k":"mcq","q":"Diagonals of a square:","o":["equal only","perpendicular only","equal and perpendicular","neither"],"a":2,"e":"And bisect.","imp":true},{"id":"math8p3","k":"mcq","q":"Circles with the same centre are:","o":["equal","concentric","intersecting","parallel"],"a":1,"e":"Same centre.","imp":false},{"id":"math8p4","k":"mcq","q":"Rectangle diagonal AC = 12 cm; OA =","o":["12 cm","6 cm","24 cm","3 cm"],"a":1,"e":"Bisect.","imp":false},{"id":"math8p5","k":"mcq","q":"Points 4 cm from A form a:","o":["line","square","circle","triangle"],"a":2,"e":"Centre A.","imp":true},{"id":"math8p6","k":"mcq","q":"Every square is a:","o":["rectangle","triangle","circle","pentagon"],"a":0,"e":"Special rectangle.","imp":false},{"id":"math8p7","k":"mcq","q":"To draw a circle of diameter 8 cm, the compass is opened to:","o":["8 cm","4 cm","16 cm","2 cm"],"a":1,"e":"Radius.","imp":true},{"id":"math8t0","k":"tf","q":"Every rectangle is a square.","a":1,"e":"Only if all sides are equal."},{"id":"math8t1","k":"tf","q":"All radii of a circle are equal.","a":0,"e":""},{"id":"math8t2","k":"tf","q":"The diagonals of a rectangle bisect each other.","a":0,"e":""},{"id":"math8t3","k":"tf","q":"Diagonals of every rectangle are perpendicular.","a":1,"e":"Only in a square."},{"id":"math8t4","k":"tf","q":"Construction arcs should be erased.","a":1,"e":"Keep them."},{"id":"math8t5","k":"tf","q":"A diameter passes through the centre.","a":0,"e":""},{"id":"math8a0","k":"ar","A":"The diameter of a circle is twice its radius.","R":"A diameter is made of two radii in a straight line.","a":0,"e":"R explains A."},{"id":"math8a1","k":"ar","A":"A rectangle’s diagonals meet at 90°.","R":"Diagonals of a rectangle are equal.","a":3,"e":"A false (only squares); R true."},{"id":"math8a2","k":"ar","A":"Every square is a rectangle.","R":"A square has four right angles and opposite sides equal.","a":0,"e":"R explains A."},{"id":"math8x0","k":"mcq","q":"The fixed point of a circle is its:","o":["centre","radius","diameter","arc"],"a":0,"e":"All points are equally far from it.","sh":1,"x":1},{"id":"math8x1","k":"mcq","q":"Radius of a circle of diameter 10 cm:","o":["5 cm","20 cm","10 cm","2.5 cm"],"a":0,"e":"Radius = diameter ÷ 2.","sh":1,"x":1},{"id":"math8x2","k":"mcq","q":"A part of a circle is called a/an:","o":["arc","chord","radius","angle"],"a":0,"e":"An arc is a piece of the boundary.","sh":1,"x":1},{"id":"math8x3","k":"mcq","q":"Number of right angles in a rectangle:","o":["4","2","3","1"],"a":0,"e":"All four angles are 90°.","sh":1,"x":1},{"id":"math8x4","k":"mcq","q":"The diagonals of a square:","o":["are equal and perpendicular","are unequal","never meet","are parallel"],"a":0,"e":"And they bisect each other.","sh":1,"x":1},{"id":"math8x5","k":"mcq","q":"Opposite sides of a rectangle are:","o":["equal","unequal","perpendicular","curved"],"a":0,"e":"Rectangle property.","sh":1,"x":1},{"id":"math8x6","k":"mcq","q":"To draw a circle we use a:","o":["compass","protractor","set square","ruler only"],"a":0,"e":"The compass keeps a fixed radius.","sh":1,"x":1},{"id":"math8x7","k":"mcq","q":"A line segment joining two points on a circle through the centre is a:","o":["diameter","radius","arc","tangent"],"a":0,"e":"Longest chord.","sh":1,"x":1},{"id":"math8x8","k":"mcq","q":"A square has how many equal sides?","o":["4","2","3","0"],"a":0,"e":"All sides equal.","sh":1,"x":1},{"id":"math8x9","k":"mcq","q":"The radius of a circle is 7 cm. Its diameter is:","o":["14 cm","3.5 cm","7 cm","21 cm"],"a":0,"e":"2 × 7.","sh":1,"x":1},{"id":"math8y0","k":"tf","q":"All diameters of a circle are equal.","a":0,"e":"","x":1},{"id":"math8y1","k":"tf","q":"A rectangle with all sides equal is a square.","a":0,"e":"","x":1},{"id":"math8y2","k":"tf","q":"We should rub out construction arcs to keep the drawing neat.","a":1,"e":"Arcs show the method and earn marks.","x":1},{"id":"math8m0","k":"mcq","q":"Diameter of a circle is 18 cm. Radius =","o":["9 cm","36 cm","18 cm","6 cm"],"a":0,"e":"Half the diameter.","sh":1,"x":1},{"id":"math8m1","k":"mcq","q":"Which statement is true for every rectangle?","o":["Diagonals are equal","Diagonals are perpendicular","All sides are equal","It has no right angle"],"a":0,"e":"Perpendicular diagonals only in a square.","sh":1,"x":1},{"id":"math8m2","k":"mcq","q":"How many radii can a circle have?","o":["Infinitely many","1","2","4"],"a":0,"e":"From the centre in every direction.","sh":1,"x":1},{"id":"math8m3","k":"mcq","q":"Points 3 cm from a fixed point form a:","o":["circle of radius 3 cm","line 3 cm long","square","circle of diameter 3 cm"],"a":0,"e":"Definition of a circle.","sh":1,"x":1},{"id":"math8m4","k":"mcq","q":"Square diagonals meet at:","o":["90°","60°","45°","120°"],"a":0,"e":"They are perpendicular.","sh":1,"x":1},{"id":"math8f0","k":"mcq","fill":1,"q":"A line segment from the centre to any point on the circle is a ___.","o":["radius","diameter","chord","arc"],"a":0,"e":"","sh":1,"x":1},{"id":"math8f1","k":"mcq","fill":1,"q":"Diameter = 2 × ___.","o":["radius","area","arc","centre"],"a":0,"e":"","sh":1,"x":1},{"id":"math8f2","k":"mcq","fill":1,"q":"In a rectangle, the diagonals ___ each other.","o":["bisect","never meet","are perpendicular to","are parallel to"],"a":0,"e":"","sh":1,"x":1},{"id":"math8f3","k":"mcq","fill":1,"q":"A part of a circle is called an ___.","o":["arc","angle","axis","area"],"a":0,"e":"","sh":1,"x":1},{"id":"math8c02","k":"mcq","q":"Designing a rangoli: Priya draws a circle of radius 5 cm with centre O. She then draws a square inside so that its four corners lie on the circle. — At what angle do the diagonals meet?","o":["45°","60°","90°","180°"],"a":2,"e":"(c) 90°."}],"top":[{"q":"Define centre, radius and diameter of a circle. If the radius is 4.5 cm, find the diameter.","m":2,"imp":true,"a":["Step 1: Centre: fixed point from which every point of the circle is at the same distance. Radius: that distance (centre to circle). Diameter: a segment through the centre joining two points of the circle; d = 2r.","Step 2: d = 2 × 4.5 = 9 cm. Final answer: 9 cm"],"k":"Definitions (1) + diameter (1).","cm":"Halving instead of doubling."},{"q":"Construct a rectangle PQRS with PQ = 6 cm and QR = 4 cm. Write the steps.","m":4,"imp":true,"a":["Step 1: Draw PQ = 6 cm.","Step 2: At P and Q draw right angles (using a protractor or set square) and draw lines perpendicular to PQ.","Step 3: With compass, cut 4 cm on both perpendiculars: mark S and R.","Step 4: Join SR. Check: SR should measure 6 cm and diagonals PR and QS should be equal."],"k":"Accurate figure (2) + steps (1) + check (1).","cm":"Drawing 90° by eye."},{"q":"Write four properties of a rectangle.","m":2,"imp":true,"a":["Step 1: Opposite sides are equal.","Step 2: All four angles are 90°.","Step 3: Diagonals are equal in length.","Step 4: Diagonals bisect each other (cut each other into two equal halves)."],"k":"½ each.","cm":"Saying diagonals are perpendicular (true only for a square)."},{"q":"How is a square different from a rectangle? Give two extra properties of a square.","m":2,"imp":true,"a":["Step 1: A square is a rectangle with all four sides equal.","Step 2: Its diagonals are perpendicular to each other (meet at 90°) — not true for a general rectangle."],"k":"Two correct extra properties.","cm":"Saying a square’s diagonals are unequal."},{"q":"A and B are 7 cm apart. Construct a point C that is 5 cm from A and 4 cm from B.","m":3,"imp":true,"a":["Step 1: Draw AB = 7 cm.","Step 2: With centre A and radius 5 cm, draw an arc.","Step 3: With centre B and radius 4 cm, draw an arc cutting the first arc at C. Join AC and BC (a triangle forms). There is also a second point below AB."],"k":"Two correct arcs (2) + point marked (1).","cm":"Using the wrong radius at each centre."},{"q":"Construct a square of side 5 cm and measure its diagonals. What do you notice?","m":3,"imp":true,"a":["Step 1: Draw AB = 5 cm; draw right angles at A and B; cut 5 cm on each to get D and C; join DC.","Step 2: Measure AC and BD: each ≈ 7.1 cm — the diagonals are equal, and they meet at 90°, bisecting each other."],"k":"Construction (2) + observation (1).","cm":"Rubbing out the construction arcs."},{"q":"Construct a rectangle ABCD with AB = 4 cm and diagonal AC = 5 cm.","m":4,"imp":false,"a":["Step 1: Draw AB = 4 cm and a right angle at B (line BX ⊥ AB).","Step 2: With centre A and radius 5 cm, cut BX at C (BC comes out 3 cm).","Step 3: From A draw a perpendicular and cut 3 cm (= BC) to get D, or draw arcs of 3 cm from A and 4 cm from C to meet at D.","Step 4: Join CD. ABCD is the required rectangle."],"k":"Right angle at B (1) + arc for C (1) + D (1) + completed figure (1).","cm":"Drawing the 5 cm along BX instead of from A."},{"q":"The diagonals of a rectangle meet at O. If AC = 10 cm, find OA, OB and BD.","m":2,"imp":false,"a":["Step 1: Diagonals are equal: BD = AC = 10 cm.","Step 2: They bisect each other: OA = OB = 10 ÷ 2 = 5 cm. Final answer: OA = OB = 5 cm; BD = 10 cm"],"k":"Properties used (1) + values (1).","cm":"Taking OB = 10 cm."},{"q":"Draw three circles with the same centre O and radii 2 cm, 3 cm and 4 cm. What are such circles called?","m":2,"imp":false,"a":["Keep the compass point at O and change the radius each time. Circles with the same centre are called concentric circles."],"k":"Drawing (1) + name (1).","cm":"Moving the centre."},{"q":"Why are construction arcs not erased?","m":1,"imp":false,"a":["They show the examiner how the construction was done and that measurements were made with the compass; marks are given for them."],"k":"Reason.","cm":"Erasing arcs for neatness."}],"prac":[{"lv":"Level 1: Basic","q":"Diameter of a circle of radius 6 cm?","a":"12 cm."},{"lv":"Level 1: Basic","q":"How many right angles in a rectangle?","a":"4."},{"lv":"Level 1: Basic","q":"Do a square’s diagonals meet at 90°?","a":"Yes."},{"lv":"Level 1: Basic","q":"Radius if diameter is 9 cm?","a":"4.5 cm."},{"lv":"Level 2: Exam Standard","q":"The diagonals of a square meet at O; BD = 8 cm. Find OC.","a":"4 cm."},{"lv":"Level 2: Exam Standard","q":"Construct a circle of radius 3.5 cm and draw a diameter. What is its length?","a":"7 cm."},{"lv":"Level 2: Exam Standard","q":"Is a rectangle with all sides equal a square?","a":"Yes."},{"lv":"Level 2: Exam Standard","q":"A and B are 6 cm apart. How many points are 4 cm from both?","a":"Two (arcs of 4 cm from A and B meet on both sides)."},{"lv":"Level 3: Competency / Application","q":"A garden gate must be a rectangle. How can a carpenter check it without a protractor?","a":"Measure both diagonals; if equal (and opposite sides equal), it is a rectangle."},{"lv":"Level 3: Competency / Application","q":"A robot must stand 3 m from pole A and 3 m from pole B, which are 4 m apart. Describe how to find the spot.","a":"Draw circles/arcs of radius 3 m around A and B; the robot stands where they meet (two possible places)."},{"lv":"Level 3: Competency / Application","q":"Construct a square whose diagonal is 6 cm (hint: diagonals are equal, ⊥ and bisect).","a":"Draw two perpendicular lines through O; mark 3 cm on each side along both; join the four points."},{"lv":"Level 4: Challenge","q":"Why can’t a rectangle have diagonals of different lengths?","a":"Opposite sides are equal and all angles are 90°, so the two right triangles formed by each diagonal are identical — the diagonals must be equal."},{"lv":"Level 4: Challenge","q":"Draw 5 circles each touching the previous one at a single point, with radii 1, 2, 3, 4, 5 cm on one straight line. How long is the line from end to end?","a":"Sum of diameters: 2 + 4 + 6 + 8 + 10 = 30 cm."}],"comp":[{"q":"A dog is tied to a pole with a 3 m rope. Draw (to scale 1 cm = 1 m) the region it can reach. What shape is it?","a":"A circle of radius 3 cm (on the drawing) around the pole — the dog can reach every point inside it."},{"q":"A carpenter makes a square table top. How can she check it is a square using a tape only?","a":"All four sides equal and both diagonals equal."},{"q":"Two towers are 8 km apart. A phone must be within 5 km of both. Show the possible region using arcs.","a":"Draw circles of radius 5 (scaled) around both towers; the phone must be in the overlap region between the arcs."}],"case":[{"t":"Designing a rangoli","p":"Priya draws a circle of radius 5 cm with centre O. She then draws a square inside so that its four corners lie on the circle.","q":["(i) Diameter of the circle?","(ii) The square’s diagonals pass through O. How long is each diagonal?","(iii) At what angle do the diagonals meet? (a) 45° (b) 60° (c) 90° (d) 180°","(iv) Distance from O to each corner?"],"a":["(i) 10 cm.","(ii) 10 cm (a diameter).","(iii) (c) 90°.","(iv) 5 cm (radius)."]}],"conc":[],"notes":[{"h":"Circle words","t":"Centre: fixed middle point. Radius: centre to the circle. Diameter = 2 × radius (passes through the centre). Arc: part of the circle. All radii of a circle are equal."},{"h":"Using a compass","t":"Open it to the radius on a ruler, keep the needle fixed on the centre, rotate the pencil. Keep construction arcs — they earn marks!"},{"h":"Rectangle properties","t":"Opposite sides equal and parallel; all angles 90°; diagonals are equal and bisect each other."},{"h":"Square properties","t":"All sides equal; all angles 90°; diagonals equal, bisect each other AND are perpendicular. Every square is a rectangle (not every rectangle is a square)."},{"h":"Locating a point using two arcs","t":"To find R with PR = 5 cm and QR = 3 cm: draw an arc of 5 cm from P and 3 cm from Q; they meet at R."},{"h":"Constructing a rectangle","t":"Draw the base, make 90° at both ends (protractor or compass), mark equal heights, join the top. Check that diagonals are equal."}]},{"n":9,"t":"Symmetry","intro":"Two kinds of symmetry: line (reflection) symmetry and rotational symmetry. Learn the number of lines and the angles of symmetry for standard shapes and capital letters, and practise completing figures.","prio":[{"t":"Line of symmetry: fold → two halves match exactly (mirror image)","s":3},{"t":"Lines of symmetry: square 4, rectangle 2, equilateral triangle 3, isosceles 1, circle infinitely many, regular n-gon n","s":3},{"t":"Rotational symmetry: angles of symmetry, smallest angle, order","s":3},{"t":"Angles of symmetry: square 90°, equilateral triangle 120°, rectangle 180°, regular hexagon 60°","s":3},{"t":"Symmetry in capital letters and digits","s":3},{"t":"Completing a figure about a line of symmetry (grid)","s":3},{"t":"Shapes with both kinds / only one kind of symmetry","s":2}],"traps":[{"m":"Rectangle given 4 lines","c":"Only 2 (midpoint lines)","t":"Fold the diagonal — it fails"},{"m":"Counting 0° or only 360°","c":"Count angles less than 360° plus 360° for order","t":"Order = 360 ÷ smallest"},{"m":"S/N/Z given lines of symmetry","c":"Rotation only","t":"SNZ spin, don’t fold"},{"m":"Translating on grid","c":"Reflect: same distance other side","t":"Mirror flips"},{"m":"Rectangle smallest angle 90°","c":"180°","t":"Rectangle = half turn"}],"rq":[{"q":"Why is a rectangle’s diagonal not a line of symmetry?","a":"Folding along it does not make the halves overlap exactly."},{"q":"Why is the order of a square 4?","a":"It matches itself at 4 positions in a full turn: 90°, 180°, 270°, 360°."},{"q":"Why does a regular n-gon have n lines of symmetry?","a":"Each line passes through a vertex or a side-midpoint and the opposite part; there are n such lines."}],"mock":[{"q":"How many lines of symmetry does a rectangle have?","m":1,"a":"2."},{"q":"Draw all lines of symmetry of a square.","m":2,"a":"4 lines: 2 through midpoints of opposite sides, 2 diagonals."},{"q":"Find the smallest angle and order of rotational symmetry of a regular hexagon.","m":2,"a":"60°; order 6."},{"q":"Name two letters with both horizontal and vertical lines of symmetry.","m":2,"a":"H, I, O, X (any two)."},{"q":"Name two letters with rotational symmetry but no line of symmetry.","m":2,"a":"N, S, Z (any two)."},{"q":"Complete a given grid figure about a vertical mirror line (teacher to give figure) — describe the method.","m":3,"a":"Equal distances on the other side, straight across; join in order."},{"q":"Why is the diagonal of a rectangle not a line of symmetry?","m":2,"a":"Folding along it does not make the halves match."},{"q":"A fan has 5 identical blades. Find its angles of symmetry.","m":3,"a":"72°, 144°, 216°, 288°, 360°."},{"q":"Does a parallelogram have line symmetry? Rotational symmetry?","m":2,"a":"No line symmetry; rotational yes (180°)."}],"qs":[{"id":"math9p0","k":"mcq","q":"Lines of symmetry of a square:","o":["2","4","1","infinitely many"],"a":1,"e":"2 through midpoints + 2 diagonals.","imp":true},{"id":"math9p1","k":"mcq","q":"Lines of symmetry of a rectangle:","o":["1","2","4","0"],"a":1,"e":"Diagonals are not.","imp":true},{"id":"math9p2","k":"mcq","q":"Smallest angle of symmetry of an equilateral triangle:","o":["60°","90°","120°","180°"],"a":2,"e":"360 ÷ 3.","imp":true},{"id":"math9p3","k":"mcq","q":"Letter with rotational symmetry only:","o":["H","Z","A","T"],"a":1,"e":"Half turn.","imp":true},{"id":"math9p4","k":"mcq","q":"A circle has ____ lines of symmetry.","o":["1","2","4","infinitely many"],"a":3,"e":"Every diameter.","imp":false},{"id":"math9p5","k":"mcq","q":"Order of rotational symmetry of a rectangle:","o":["1","2","4","0"],"a":1,"e":"180°, 360°.","imp":false},{"id":"math9p6","k":"mcq","q":"Regular octagon — lines of symmetry:","o":["4","6","8","16"],"a":2,"e":"n lines.","imp":false},{"id":"math9p7","k":"mcq","q":"Letter with both horizontal and vertical lines:","o":["A","B","H","M"],"a":2,"e":"H.","imp":true},{"id":"math9p8","k":"mcq","q":"An isosceles (not equilateral) triangle has:","o":["0 lines","1 line","2 lines","3 lines"],"a":1,"e":"Through the apex.","imp":false},{"id":"math9p9","k":"mcq","q":"A parallelogram (not rectangle) has lines of symmetry:","o":["0","1","2","4"],"a":0,"e":"Rotation only.","imp":true},{"id":"math9t0","k":"tf","q":"The diagonals of a rectangle are lines of symmetry.","a":1,"e":"Only for a square."},{"id":"math9t1","k":"tf","q":"A square has rotational symmetry of order 4.","a":0,"e":""},{"id":"math9t2","k":"tf","q":"The letter S has a line of symmetry.","a":1,"e":"Rotational only (180°)."},{"id":"math9t3","k":"tf","q":"A regular pentagon has 5 lines of symmetry.","a":0,"e":""},{"id":"math9t4","k":"tf","q":"A rectangle has rotational symmetry of order 2.","a":0,"e":""},{"id":"math9t5","k":"tf","q":"A circle looks the same after any turn about its centre.","a":0,"e":""},{"id":"math9a0","k":"ar","A":"A square has 4 lines of symmetry.","R":"Its diagonals are lines of symmetry.","a":1,"e":"True, but diagonals give only 2 of the 4 lines."},{"id":"math9a1","k":"ar","A":"The letter Z has rotational symmetry.","R":"Z looks the same after a half turn.","a":0,"e":"R explains A."},{"id":"math9a2","k":"ar","A":"An equilateral triangle’s smallest angle of symmetry is 60°.","R":"360° ÷ 3 = 120°.","a":3,"e":"A false; R true."},{"id":"math9x0","k":"mcq","q":"Lines of symmetry of an equilateral triangle:","o":["3","1","2","0"],"a":0,"e":"One through each vertex.","sh":1,"x":1},{"id":"math9x1","k":"mcq","q":"Lines of symmetry of a regular hexagon:","o":["6","3","4","12"],"a":0,"e":"A regular n-gon has n lines.","sh":1,"x":1},{"id":"math9x2","k":"mcq","q":"Smallest angle of rotational symmetry of a square:","o":["90°","45°","180°","360°"],"a":0,"e":"360° ÷ 4.","sh":1,"x":1},{"id":"math9x3","k":"mcq","q":"Which letter has a vertical line of symmetry?","o":["A","F","G","J"],"a":0,"e":"A folds onto itself left–right.","sh":1,"x":1},{"id":"math9x4","k":"mcq","q":"Which letter has a horizontal line of symmetry?","o":["B","A","N","Z"],"a":0,"e":"Top and bottom match.","sh":1,"x":1},{"id":"math9x5","k":"mcq","q":"Smallest angle of symmetry of a regular hexagon:","o":["60°","90°","120°","45°"],"a":0,"e":"360° ÷ 6.","sh":1,"x":1},{"id":"math9x6","k":"mcq","q":"A scalene triangle has how many lines of symmetry?","o":["0","1","2","3"],"a":0,"e":"No equal sides.","sh":1,"x":1},{"id":"math9x7","k":"mcq","q":"Order of rotational symmetry of an equilateral triangle:","o":["3","1","2","6"],"a":0,"e":"Matches at 120°, 240°, 360°.","sh":1,"x":1},{"id":"math9x8","k":"mcq","q":"Which shape has infinitely many lines of symmetry?","o":["Circle","Square","Rectangle","Hexagon"],"a":0,"e":"Every diameter works.","sh":1,"x":1},{"id":"math9x9","k":"mcq","q":"A shape matching itself only after a full 360° turn has:","o":["no rotational symmetry","order 2","order 4","order 3"],"a":0,"e":"Order 1 means no rotational symmetry.","sh":1,"x":1},{"id":"math9y0","k":"tf","q":"The letter X has two lines of symmetry.","a":0,"e":"","x":1},{"id":"math9y1","k":"tf","q":"A kite shape has 2 lines of symmetry.","a":1,"e":"A kite has only 1.","x":1},{"id":"math9y2","k":"tf","q":"The smallest angle of symmetry of a regular pentagon is 72°.","a":0,"e":"360° ÷ 5.","x":1},{"id":"math9m0","k":"mcq","q":"Lines of symmetry of a rhombus:","o":["2","4","0","1"],"a":0,"e":"Along both diagonals.","sh":1,"x":1},{"id":"math9m1","k":"mcq","q":"Order of rotational symmetry of a regular pentagon:","o":["5","1","2","10"],"a":0,"e":"360° ÷ 72°.","sh":1,"x":1},{"id":"math9m2","k":"mcq","q":"Which letter has NO line of symmetry?","o":["S","M","E","O"],"a":0,"e":"S has only rotational symmetry.","sh":1,"x":1},{"id":"math9m3","k":"mcq","q":"Smallest angle of symmetry of a rectangle:","o":["180°","90°","45°","360°"],"a":0,"e":"Half turn.","sh":1,"x":1},{"id":"math9m4","k":"mcq","q":"Lines of symmetry of the letter H:","o":["2","1","0","4"],"a":0,"e":"Vertical and horizontal.","sh":1,"x":1},{"id":"math9f0","k":"mcq","fill":1,"q":"A regular hexagon has ___ lines of symmetry.","o":["6","3","4","12"],"a":0,"e":"","sh":1,"x":1},{"id":"math9f1","k":"mcq","fill":1,"q":"The smallest angle of rotational symmetry of a square is ___.","o":["90°","45°","180°","60°"],"a":0,"e":"","sh":1,"x":1},{"id":"math9f2","k":"mcq","fill":1,"q":"A circle has ___ lines of symmetry.","o":["infinitely many","4","1","0"],"a":0,"e":"","sh":1,"x":1},{"id":"math9f3","k":"mcq","fill":1,"q":"A parallelogram has ___ lines of symmetry.","o":["0","2","4","1"],"a":0,"e":"","sh":1,"x":1},{"id":"math9c02","k":"mcq","q":"Rangoli design: Kavya makes a rangoli shaped like a regular hexagon with a flower in each corner, all identical. — Order of rotational symmetry?","o":["2","3","6","12"],"a":2,"e":"(c) 6."}],"top":[{"q":"What is a line of symmetry? How many lines of symmetry do these have: square, rectangle, equilateral triangle, isosceles triangle, circle?","m":3,"imp":true,"a":["Step 1: A line of symmetry divides a figure into two parts that match exactly when folded along it (each is the mirror image of the other).","Step 2: Square 4, rectangle 2, equilateral triangle 3, isosceles triangle 1, circle infinitely many."],"k":"Definition (1) + five numbers (2).","cm":"Giving a rectangle 4 lines (its diagonals are NOT lines of symmetry)."},{"q":"Why are the diagonals of a rectangle not lines of symmetry?","m":2,"imp":true,"a":["If you fold a (non-square) rectangle along a diagonal, the two triangles do not lie on top of each other — the corners stick out. So the halves are not mirror images."],"k":"Fold test + mismatch.","cm":"Saying ‘because they are slanted’."},{"q":"What is rotational symmetry? Find the angles of symmetry of a square and state its order.","m":3,"imp":true,"a":["Step 1: A figure has rotational symmetry if it looks exactly the same after being turned about its centre by some angle less than a full turn.","Step 2: Square: looks the same after 90°, 180°, 270° (and 360°).","Step 3: Smallest angle of symmetry 90°; order = 360° ÷ 90° = 4. Final answer: 90°, 180°, 270°, 360°; order 4"],"k":"Definition (1) + angles (1) + order (1).","cm":"Counting 0° as an angle of symmetry."},{"q":"Find the smallest angle of rotational symmetry for: equilateral triangle, rectangle, regular hexagon.","m":3,"imp":true,"a":["Step 1: Equilateral triangle: 360° ÷ 3 = 120°.","Step 2: Rectangle: 180° (it matches after a half turn).","Step 3: Regular hexagon: 360° ÷ 6 = 60°. Final answer: 120°, 180°, 60°"],"k":"1 each.","cm":"Giving the rectangle 90°."},{"q":"Which capital letters (A–Z, in plain block style) have (a) a vertical line of symmetry (b) a horizontal line (c) both?","m":3,"imp":true,"a":["Step 1: (a) Vertical: A, H, I, M, O, T, U, V, W, X, Y.","Step 2: (b) Horizontal: B, C, D, E, H, I, K, O, X.","Step 3: (c) Both: H, I, O, X."],"k":"1 per part (allow ± one letter depending on font).","cm":"Including N, S or Z — they have rotational symmetry only."},{"q":"Name three capital letters with rotational symmetry but no line of symmetry. What is their angle of symmetry?","m":2,"imp":true,"a":["N, S, Z — they look the same after a half turn (180°), but no fold makes them match. Final answer: N, S, Z; 180°"],"k":"Letters (1) + angle (1).","cm":"Listing H or X (they also have lines of symmetry)."},{"q":"How many lines of symmetry does a regular pentagon have? A regular octagon?","m":2,"imp":false,"a":["A regular polygon with n sides has n lines of symmetry: pentagon 5, octagon 8. Final answer: 5 and 8"],"k":"Rule (1) + answers (1).","cm":"Counting only lines through vertices."},{"q":"Complete the figure on a grid so that the dotted line is a line of symmetry. Explain your method.","m":3,"imp":true,"a":["Step 1: For each corner point, count its distance (in grid squares) from the mirror line.","Step 2: Mark a point at the same distance on the other side, straight across (perpendicular to the line).","Step 3: Join the new points in the same order as the original."],"k":"Correct image (2) + method (1).","cm":"Shifting the shape instead of reflecting it (image faces the same way)."},{"q":"Does a circle have rotational symmetry? What about a parallelogram (not a rectangle)?","m":2,"imp":false,"a":["Step 1: Circle: yes — it looks the same after turning by any angle.","Step 2: Parallelogram: yes, angle 180° (order 2), but it has no line of symmetry."],"k":"1 + 1.","cm":"Saying a parallelogram has 2 lines of symmetry."},{"q":"Which digits 0–9 (in digital-clock style) have a horizontal line of symmetry?","m":2,"imp":false,"a":["0, 1, 3, 8 (in common digital style; 1 as a single line also works)."],"k":"Correct digits.","cm":"Including 6 or 9 — they need a half-turn, not a fold."},{"q":"A figure has angles of symmetry 72°, 144°, 216°, 288°, 360°. What regular shape could it be?","m":2,"imp":false,"a":["Smallest angle 72°; 360° ÷ 72° = 5 → a regular pentagon (order 5). Final answer: Regular pentagon"],"k":"Division (1) + name (1).","cm":"Answering hexagon."}],"prac":[{"lv":"Level 1: Basic","q":"Lines of symmetry of an equilateral triangle?","a":"3."},{"lv":"Level 1: Basic","q":"Lines of symmetry of the letter T?","a":"1 (vertical)."},{"lv":"Level 1: Basic","q":"Smallest angle of rotational symmetry of a square?","a":"90°."},{"lv":"Level 1: Basic","q":"Does the letter S have a line of symmetry?","a":"No."},{"lv":"Level 2: Exam Standard","q":"Order of rotational symmetry of a regular hexagon?","a":"6."},{"lv":"Level 2: Exam Standard","q":"Angles of symmetry of an equilateral triangle?","a":"120°, 240°, 360°."},{"lv":"Level 2: Exam Standard","q":"Which has more lines of symmetry: a rectangle or a square?","a":"Square (4 vs 2)."},{"lv":"Level 2: Exam Standard","q":"Name a letter with exactly one horizontal line of symmetry.","a":"B, C, D, E or K."},{"lv":"Level 3: Competency / Application","q":"A 3-blade fan and a 4-blade fan: smallest angle of symmetry of each?","a":"120° and 90°."},{"lv":"Level 3: Competency / Application","q":"Does the word MOM (written in capitals) have a vertical line of symmetry?","a":"Yes — M, O, M each symmetric and the word is a mirror image about the middle O."},{"lv":"Level 3: Competency / Application","q":"A rangoli has 8 identical petals around the centre. What is its smallest angle of symmetry?","a":"360° ÷ 8 = 45°."},{"lv":"Level 4: Challenge","q":"Can a shape have rotational symmetry of order 2 and exactly 2 lines of symmetry? Give an example.","a":"Yes — a rectangle (or a rhombus)."},{"lv":"Level 4: Challenge","q":"A figure has exactly 3 lines of symmetry. What is its smallest angle of rotational symmetry likely to be?","a":"120° (like an equilateral triangle)."}],"comp":[{"q":"A logo designer wants a design that looks the same after turning 90°. Which shapes could she base it on?","a":"A square, a regular octagon, a 4-petal flower, a plus sign — any shape with angle of symmetry 90° or a divisor of it (45°)."},{"q":"Why do many road signs and logos use symmetric shapes?","a":"Symmetric shapes are balanced and easy to recognise quickly, even from a distance."},{"q":"Ambulance vans often have ‘AMBULANCE’ written reversed on the front. Why?","a":"A driver ahead sees it in the rear-view mirror, which reflects it; the mirror image reads correctly."}],"case":[{"t":"Rangoli design","p":"Kavya makes a rangoli shaped like a regular hexagon with a flower in each corner, all identical.","q":["(i) Lines of symmetry?","(ii) Smallest angle of rotational symmetry?","(iii) Order of rotational symmetry? (a) 2 (b) 3 (c) 6 (d) 12","(iv) If she removes one flower, will the design still have rotational symmetry?"],"a":["(i) 6.","(ii) 60°.","(iii) (c) 6.","(iv) No — turning would move the empty corner."]}],"conc":[],"notes":[{"h":"Line symmetry","t":"A shape has a line of symmetry if folding along that line makes both halves overlap exactly (mirror image)."},{"h":"Lines of symmetry to remember","t":"Equilateral triangle 3 · Isosceles triangle 1 · Scalene 0 · Square 4 · Rectangle 2 (diagonals are NOT lines of symmetry) · Rhombus 2 · Parallelogram 0 · Circle infinitely many · Regular n-sided polygon n."},{"h":"Rotational symmetry","t":"A shape has rotational symmetry if it looks the same after turning less than a full turn about its centre."},{"h":"Angle and order","t":"Smallest angle of symmetry of a regular n-gon = 360° ÷ n. Order = number of times it matches in one full turn. Square: 90°, order 4. Equilateral triangle: 120°, order 3."},{"h":"Letters","t":"Vertical line: A, H, I, M, O, T, U, V, W, X, Y. Horizontal line: B, C, D, E, H, I, K, O, X. Rotational only (no line): N, S, Z."},{"h":"Completing a symmetric figure","t":"Each point is the same distance on the other side of the mirror line, straight across."}]},{"n":10,"t":"The Other Side of Zero","intro":"Negative numbers and integers: number line, comparing, and adding/subtracting with tokens or number-line moves. Sign mistakes are the biggest source of lost marks — practise many short sums.","prio":[{"t":"Negative numbers in life: floors below ground, temperature, sea level, money owed","s":3},{"t":"Integers..., −3, −2, −1, 0, 1, 2, 3,... on the number line","s":3},{"t":"Comparing: further right is greater; −2 > −7","s":3},{"t":"Adding integers: same signs add; different signs subtract and keep the sign of the bigger","s":3},{"t":"Subtracting = adding the opposite: a − b = a + (−b); a − (−b) = a + b","s":3},{"t":"Tokens: positive and negative tokens cancel (zero pairs)","s":2},{"t":"Word problems: lifts, temperature, bank balance, heights","s":3}],"traps":[{"m":"−3 − (−8) = −11","c":"Change to −3 + 8 = 5","t":"Minus a minus = plus"},{"m":"Thinking −15 > −9","c":"Right on the number line is greater","t":"Warmer is greater"},{"m":"Wrong sign for different-sign sums","c":"Keep sign of bigger size","t":"Winner’s sign"},{"m":"Reading ’goes down’ as positive","c":"Down/below/owe/loss → negative","t":"Down = minus"},{"m":"Unequal spacing on number lines","c":"Use a ruler, equal gaps","t":"Ruler rules"}],"rq":[{"q":"Why is −2 greater than −6?","a":"It lies to the right on the number line (closer to zero)."},{"q":"Why does subtracting a negative increase the number?","a":"Taking away a debt/negative token leaves you better off: removing negatives is like adding positives."},{"q":"Why do a positive and a negative token cancel?","a":"+1 and −1 together make 0 (a zero pair)."}],"mock":[{"q":"Write the opposite of −23.","m":1,"a":"23."},{"q":"Arrange in ascending order: 4, −9, 0, −2, 7, −15.","m":2,"a":"−15, −9, −2, 0, 4, 7."},{"q":"Evaluate (−11) + 6 and (−5) + (−8).","m":2,"a":"−5; −13."},{"q":"Evaluate 7 − 12 and (−4) − (−10).","m":2,"a":"−5; 6."},{"q":"Evaluate 15 + (−8) − (−6) − 20.","m":3,"a":"15 − 8 + 6 − 20 = −7."},{"q":"The temperature was 4°C at 8 p.m. and fell by 2°C every hour. What was it at 1 a.m.?","m":3,"a":"5 hours → 4 − 10 = −6 °C."},{"q":"A lift at floor 6 goes down 9 floors. Which floor does it reach? Show on a number line.","m":3,"a":"6 − 9 = −3 (third basement)."},{"q":"Fill in: □ − (−4) = −3.","m":2,"a":"−3 + (−4) = −7."},{"q":"Which is greater, −30 or −3? Why?","m":2,"a":"−3; it is to the right on the number line."}],"qs":[{"id":"math10p0","k":"mcq","q":"(−7) + 4 =","o":["−11","−3","3","11"],"a":1,"e":"Different signs.","imp":true},{"id":"math10p1","k":"mcq","q":"(−5) − (−9) =","o":["−14","−4","4","14"],"a":2,"e":"−5 + 9.","imp":true},{"id":"math10p2","k":"mcq","q":"Greatest:","o":["−1","−10","−100","−5"],"a":0,"e":"Closest to zero.","imp":false},{"id":"math10p3","k":"mcq","q":"Opposite of 0 is:","o":["1","−1","0","none"],"a":2,"e":"0 is its own opposite.","imp":false},{"id":"math10p4","k":"mcq","q":"0 − 8 =","o":["8","−8","0","80"],"a":1,"e":"Add −8.","imp":true},{"id":"math10p5","k":"mcq","q":"Temperature −3°C drops by 5°C:","o":["2°C","−2°C","−8°C","8°C"],"a":2,"e":"−3 − 5.","imp":true},{"id":"math10p6","k":"mcq","q":"Which is an integer?","o":["½","−0.5","−4","2.5"],"a":2,"e":"Whole numbers and negatives.","imp":false},{"id":"math10p7","k":"mcq","q":"(−2) + (−3) + 5 =","o":["0","10","−10","−5"],"a":0,"e":"−5 + 5.","imp":false},{"id":"math10p8","k":"mcq","q":"A lift at −1 goes up 4 floors to:","o":["−5","3","4","5"],"a":1,"e":"−1 + 4.","imp":true},{"id":"math10p9","k":"mcq","q":"Number of integers between −3 and 3 (not including them):","o":["4","5","6","7"],"a":1,"e":"−2, −1, 0, 1, 2.","imp":false},{"id":"math10t0","k":"tf","q":"−8 is greater than −3.","a":1,"e":"−3 is greater."},{"id":"math10t1","k":"tf","q":"The sum of a number and its opposite is 0.","a":0,"e":""},{"id":"math10t2","k":"tf","q":"(−4) − (−4) = −8.","a":1,"e":"= 0."},{"id":"math10t3","k":"tf","q":"0 is neither positive nor negative.","a":0,"e":""},{"id":"math10t4","k":"tf","q":"Subtracting a negative number makes the result bigger.","a":0,"e":""},{"id":"math10t5","k":"tf","q":"There is a smallest integer.","a":1,"e":"Integers go on forever to the left."},{"id":"math10a0","k":"ar","A":"−3 − (−5) = 2.","R":"Subtracting −5 is the same as adding 5.","a":0,"e":"R explains A."},{"id":"math10a1","k":"ar","A":"−12 < −4.","R":"−12 lies to the left of −4 on the number line.","a":0,"e":"Left is smaller."},{"id":"math10a2","k":"ar","A":"(−6) + (−2) = −4.","R":"When signs are the same we add and keep the sign.","a":3,"e":"A false (−8); R true."},{"id":"math10x0","k":"mcq","q":"(−3) + (−4) =","o":["−7","7","−1","1"],"a":0,"e":"Same signs: add and keep the sign.","sh":1,"x":1},{"id":"math10x1","k":"mcq","q":"8 + (−5) =","o":["3","13","−3","−13"],"a":0,"e":"Different signs: subtract, take sign of bigger.","sh":1,"x":1},{"id":"math10x2","k":"mcq","q":"(−6) − (−2) =","o":["−4","−8","4","8"],"a":0,"e":"−6 + 2.","sh":1,"x":1},{"id":"math10x3","k":"mcq","q":"Which is the smallest?","o":["−9","−2","0","3"],"a":0,"e":"Furthest left on the number line.","sh":1,"x":1},{"id":"math10x4","k":"mcq","q":"Opposite of −15 is:","o":["15","−15","0","1/15"],"a":0,"e":"Opposite has the same distance from 0.","sh":1,"x":1},{"id":"math10x5","k":"mcq","q":"5 − 9 =","o":["−4","4","14","−14"],"a":0,"e":"Go 9 steps left from 5.","sh":1,"x":1},{"id":"math10x6","k":"mcq","q":"A diver at −20 m rises 8 m. New position:","o":["−12 m","−28 m","12 m","28 m"],"a":0,"e":"−20 + 8.","sh":1,"x":1},{"id":"math10x7","k":"mcq","q":"Which is greater: −1 or −10?","o":["−1","−10","Both equal","Cannot say"],"a":0,"e":"−1 is closer to zero.","sh":1,"x":1},{"id":"math10x8","k":"mcq","q":"(−7) + 7 =","o":["0","14","−14","7"],"a":0,"e":"A number plus its opposite is 0.","sh":1,"x":1},{"id":"math10x9","k":"mcq","q":"Temperature 5°C falls by 8°C. New temperature:","o":["−3°C","3°C","13°C","−13°C"],"a":0,"e":"5 − 8.","sh":1,"x":1},{"id":"math10x10","k":"mcq","q":"Floors below the ground floor are shown with:","o":["negative numbers","positive numbers","fractions","zero only"],"a":0,"e":"e.g. −1 for the first basement.","sh":1,"x":1},{"id":"math10x11","k":"mcq","q":"0 − (−6) =","o":["6","−6","0","60"],"a":0,"e":"Subtracting a negative = adding.","sh":1,"x":1},{"id":"math10y0","k":"tf","q":"Every positive integer is greater than every negative integer.","a":0,"e":"","x":1},{"id":"math10y1","k":"tf","q":"−5 lies to the right of −2 on the number line.","a":1,"e":"−5 is to the left.","x":1},{"id":"math10y2","k":"tf","q":"(−3) + (−3) = −6.","a":0,"e":"","x":1},{"id":"math10m0","k":"mcq","q":"(−9) + 4 =","o":["−5","5","−13","13"],"a":0,"e":"Different signs.","sh":1,"x":1},{"id":"math10m1","k":"mcq","q":"(−2) − 7 =","o":["−9","5","−5","9"],"a":0,"e":"−2 + (−7).","sh":1,"x":1},{"id":"math10m2","k":"mcq","q":"3 − (−6) =","o":["9","−3","3","−9"],"a":0,"e":"3 + 6.","sh":1,"x":1},{"id":"math10m3","k":"mcq","q":"Ascending order: 2, −5, 0, −1","o":["−5, −1, 0, 2","2, 0, −1, −5","−1, −5, 0, 2","0, −1, 2, −5"],"a":0,"e":"Left to right on the number line.","sh":1,"x":1},{"id":"math10m4","k":"mcq","q":"Sum of an integer and its opposite is:","o":["0","1","double the number","−1"],"a":0,"e":"Zero pair.","sh":1,"x":1},{"id":"math10f0","k":"mcq","fill":1,"q":"Numbers to the ___ on the number line are smaller.","o":["left","right","top","middle"],"a":0,"e":"","sh":1,"x":1},{"id":"math10f1","k":"mcq","fill":1,"q":"The opposite of −12 is ___.","o":["12","−12","0","1/12"],"a":0,"e":"","sh":1,"x":1},{"id":"math10f2","k":"mcq","fill":1,"q":"0 is ___ positive nor negative.","o":["neither","both","always","only"],"a":0,"e":"","sh":1,"x":1},{"id":"math10f3","k":"mcq","fill":1,"q":"(−5) + (−5) = ___.","o":["−10","0","10","−25"],"a":0,"e":"","sh":1,"x":1},{"id":"math10c02","k":"mcq","q":"Bela’s building: A building has floors +1 to +10 above ground (0) and basements −1 to −3. A lift button marked ‘+’ moves up and ‘−’ moves down. Bela enters at floor −2. — Which is lower: floor −1 or floor −3?","o":["−1","−3","same","cannot say"],"a":1,"e":"(b) −3."}],"top":[{"q":"In a building, ground floor is 0, floors above are +1, +2, … and basements −1, −2, … A lift starts at +4 and goes down 6 floors. Where does it stop? Show on a number line.","m":2,"imp":true,"a":["Step 1: Going down 6 floors means adding −6: (+4) + (−6).","Step 2: On the number line, move 6 steps left from +4: 3, 2, 1, 0, −1, −2. Final answer: Floor −2 (second basement)"],"k":"Correct expression/moves (1) + answer (1).","cm":"Answering −10 or +2."},{"q":"Arrange in ascending order: −5, 3, 0, −12, 7, −1.","m":2,"imp":true,"a":["On the number line, numbers increase to the right: −12 < −5 < −1 < 0 < 3 < 7. Final answer: −12, −5, −1, 0, 3, 7"],"k":"Correct order.","cm":"Putting −1 before −5 (−5 is smaller)."},{"q":"Evaluate: (a) (−4) + (−6) (b) (+9) + (−14) (c) (−8) + (+3) (d) (+7) + (−7).","m":4,"imp":true,"a":["Step 1: (a) Same signs: add, keep sign → −10.","Step 2: (b) Different signs: 14 − 9 = 5, sign of bigger (−14) → −5.","Step 3: (c) 8 − 3 = 5, sign of bigger (−8) → −5.","Step 4: (d) Zero pair → 0. Final answer: −10, −5, −5, 0"],"k":"1 each.","cm":"(b) answering +5 or −23."},{"q":"Evaluate: (a) 5 − 9 (b) (−3) − (−8) (c) 0 − (−6) (d) (−4) − 7.","m":4,"imp":true,"a":["Step 1: (a) 5 + (−9) = −4.","Step 2: (b) Subtracting −8 = adding +8: −3 + 8 = 5.","Step 3: (c) 0 + 6 = 6.","Step 4: (d) −4 + (−7) = −11. Final answer: −4, 5, 6, −11"],"k":"Rewrite as addition of opposite (1 mark each with answer).","cm":"(−3) − (−8) = −11 ✗."},{"q":"The temperature at 6 a.m. was −5 °C. By noon it rose by 12°C, and by midnight it fell by 9°C. Find the noon and midnight temperatures.","m":3,"imp":true,"a":["Step 1: Noon: −5 + 12 = 7 °C.","Step 2: Midnight: 7 − 9 = −2 °C. Final answer: Noon 7°C; midnight −2°C"],"k":"Each step (1½).","cm":"Writing midnight as 2°C."},{"q":"Explain using positive and negative tokens: (+3) + (−5).","m":2,"imp":false,"a":["Step 1: Take 3 positive tokens and 5 negative tokens.","Step 2: Pair 3 positives with 3 negatives → 3 zero pairs cancel. 2 negative tokens remain → −2. Final answer: −2"],"k":"Zero pairs (1) + answer (1).","cm":"Adding all 8 tokens."},{"q":"Mount Everest is about 8,849 m above sea level and the shore of the Dead Sea about 430 m below sea level. Write both as integers and find the difference in height.","m":3,"imp":true,"a":["Step 1: Everest: +8849 m; Dead Sea shore: −430 m.","Step 2: Difference = 8849 − (−430) = 8849 + 430 = 9279 m. Final answer: 9,279 m"],"k":"Integers (1) + subtraction of a negative (1) + answer (1).","cm":"8849 − 430 = 8419."},{"q":"Riya has Rs. 500 in her account. She withdraws Rs. 800 (the bank allows an overdraft) and later deposits Rs. 450. What is her balance after each step?","m":3,"imp":false,"a":["Step 1: After withdrawal: 500 − 800 = −300 (she owes Rs. 300).","Step 2: After deposit: −300 + 450 = 150. Final answer: −300, then Rs. 150"],"k":"Each step (1½).","cm":"Writing +300 for money owed."},{"q":"Fill in the boxes: (a) −7 + □ = 2 (b) □ − 5 = −9 (c) 3 − □ = 10.","m":3,"imp":false,"a":["Step 1: (a) 2 − (−7) = 9 → □ = 9.","Step 2: (b) −9 + 5 = −4 → □ = −4.","Step 3: (c) 3 − 10 = −7 → □ = −7 (check: 3 − (−7) = 10 ✓). Final answer: 9, −4, −7"],"k":"1 each.","cm":"(c) writing 7."},{"q":"Which is greater: −15 or −9? Give a reason using a real example.","m":2,"imp":true,"a":["−9 > −15. On the number line −9 is to the right. Example: −9°C is warmer than −15°C; being 9 m below sea level is higher than 15 m below. Final answer: −9 > −15"],"k":"Answer (1) + reason/example (1).","cm":"Thinking −15 is bigger because 15 > 9."},{"q":"Find the sum of all integers from −6 to +8.","m":2,"imp":false,"a":["Step 1: Pairs −6 + 6, −5 + 5, … , −1 + 1 all make 0; 0 adds nothing.","Step 2: Remaining: 7 + 8 = 15. Final answer: 15"],"k":"Pairing (1) + answer (1).","cm":"Forgetting that +7 and +8 have no partners."}],"prac":[{"lv":"Level 1: Basic","q":"Opposite of −9?","a":"9."},{"lv":"Level 1: Basic","q":"(−3) + (−2) =","a":"−5."},{"lv":"Level 1: Basic","q":"Greater: −4 or −1?","a":"−1."},{"lv":"Level 1: Basic","q":"6 − 10 =","a":"−4."},{"lv":"Level 2: Exam Standard","q":"(−12) + 5 =","a":"−7."},{"lv":"Level 2: Exam Standard","q":"(−6) − (−10) =","a":"4."},{"lv":"Level 2: Exam Standard","q":"8 − (−3) + (−5) =","a":"8 + 3 − 5 = 6."},{"lv":"Level 2: Exam Standard","q":"Descending order: −3, 4, −8, 0, −1.","a":"4, 0, −1, −3, −8."},{"lv":"Level 3: Competency / Application","q":"A submarine is at −120 m. It rises 45 m and then dives 70 m. Where is it?","a":"−120 + 45 − 70 = −145 m."},{"lv":"Level 3: Competency / Application","q":"In a quiz, +5 for correct and −2 for wrong. Asha gets 6 correct and 9 wrong. Her score?","a":"30 − 18 = 12."},{"lv":"Level 3: Competency / Application","q":"The temperature in Leh is −8°C and in Delhi 17°C. How much warmer is Delhi?","a":"17 − (−8) = 25 °C."},{"lv":"Level 4: Challenge","q":"Find two integers whose sum is −3 and difference is 11.","a":"4 and −7 (4 + (−7) = −3; 4 − (−7) = 11)."},{"lv":"Level 4: Challenge","q":"The integers −4 to 4 are placed once each in a 3 × 3 magic grid so that every row, column and diagonal has the same sum. What is that sum and which number is in the centre?","a":"Total of −4 to 4 is 0, shared by 3 rows → magic sum 0. The centre is always one-third of the magic sum → 0."}],"comp":[{"q":"A freezer is at −18°C. The power fails and the temperature rises 3°C every hour. What is it after 5 hours? Is frozen food still safe below −10°C?","a":"−18 + 15 = −3 °C; it went above −10°C after 3 hours (−9°C), so food may not be safe."},{"q":"A diver starts at sea level, goes down 25 m, rises 10 m, then goes down 8 m. Final position?","a":"0 − 25 + 10 − 8 = −23 m (23 m below sea level)."},{"q":"A shop’s profit/loss for 4 days: +250, −120, −300, +410 rupees. Net result?","a":"250 − 120 − 300 + 410 = 240 → profit Rs. 240."}],"case":[{"t":"Bela’s building","p":"A building has floors +1 to +10 above ground (0) and basements −1 to −3. A lift button marked ‘+’ moves up and ‘−’ moves down. Bela enters at floor −2.","q":["(i) She presses +7. Which floor does she reach?","(ii) From there she goes to −3. Write the movement as an integer.","(iii) Which is lower: floor −1 or floor −3? (a) −1 (b) −3 (c) same (d) cannot say","(iv) Total floors between the top floor and the lowest basement?"],"a":["(i) −2 + 7 = 5.","(ii) −3 − 5 = −8 (8 floors down).","(iii) (b) −3.","(iv) 10 − (−3) = 13."]},{"t":"Winter temperatures","p":"Minimum temperatures one day: Srinagar −4°C, Shimla 1°C, Leh −11°C, Delhi 6°C.","q":["(i) Coldest city?","(ii) Arrange warmest to coldest.","(iii) Difference between Delhi and Leh?","(iv) Srinagar warms by 7°C next day. New temperature?"],"a":["(i) Leh.","(ii) Delhi 6, Shimla 1, Srinagar −4, Leh −11.","(iii) 6 − (−11) = 17 °C.","(iv) 3°C."]}],"conc":[],"notes":[{"h":"Integers","t":"…, −3, −2, −1, 0, 1, 2, 3, … Positive numbers, negative numbers and zero together. 0 is neither positive nor negative."},{"h":"Number line","t":"Numbers increase to the right. −2 > −7 because −2 is to the right. Every positive number > every negative number."},{"h":"Opposites (additive inverse)","t":"5 and −5 are opposites; their sum is 0. The opposite of 0 is 0."},{"h":"Adding integers","t":"Same signs: add and keep the sign ((−3) + (−4) = −7). Different signs: subtract the smaller from the bigger, keep the sign of the bigger ((−9) + 4 = −5)."},{"h":"Subtracting integers","t":"Subtracting = adding the opposite: 3 − (−5) = 3 + 5 = 8; (−2) − 6 = (−2) + (−6) = −8."},{"h":"Token model","t":"A positive token and a negative token make a zero pair. (+3) + (−5): 3 zero pairs cancel, 2 negatives left → −2."},{"h":"Real life","t":"Floors below ground (−1, −2), temperatures below 0 °C, depth below sea level, money owed (debt) are all shown with negative numbers."}]}]},{"name":"Science","book":"Curiosity","icon":"🔬","color":"#059669","id":"sci","chapters":[{"n":1,"t":"The Wonderful World of Science","intro":"A short, thinking chapter. Learn the steps of the scientific method with one everyday example, and be ready to apply them to any new situation.","prio":[{"t":"Science = a way of observing, questioning and testing to understand the world","s":3},{"t":"Scientific method: observe → question → guess (hypothesis) → test (experiment) → analyse → conclude","s":3},{"t":"Applying the method to a daily-life problem","s":3},{"t":"Qualities of a scientist: curiosity, patience, honesty, careful observation","s":2},{"t":"Science is everywhere: kitchen, farms, sky, our body","s":2},{"t":"A good experiment changes only one thing at a time (fair test)","s":2}],"traps":[{"m":"Wrong order of steps","c":"O-Q-H-T-A-C","t":"Only Quiet Heroes Test And Conclude"},{"m":"Hypothesis written as a question","c":"Write it as a statement to test","t":"Guess = statement"},{"m":"Unfair test","c":"Change one thing only","t":"One change"}],"rq":[{"q":"Why do scientists share their results?","a":"So others can check them and build on them."},{"q":"Why is honesty important in science?","a":"False results mislead everyone and waste effort."}],"mock":[{"q":"Name the steps of the scientific method.","m":3,"a":"Observe, question, hypothesis, test, analyse, conclude."},{"q":"What is a hypothesis?","m":1,"a":"A testable guess."},{"q":"Why must only one factor change in an experiment?","m":2,"a":"To know which factor caused the result (fair test)."},{"q":"Use the scientific method: your bicycle tyre is flat every morning.","m":4,"a":"Observe flat tyre → question why → guess puncture → test by dipping tube in water for bubbles → conclude."},{"q":"Give two qualities of a scientist.","m":2,"a":"Curiosity, honesty (any two)."}],"qs":[{"id":"sci1p0","k":"mcq","q":"The first step of the scientific method is:","o":["conclusion","observation","experiment","hypothesis"],"a":1,"e":"We start by noticing.","imp":true},{"id":"sci1p1","k":"mcq","q":"A hypothesis is:","o":["a fact","a testable guess","a conclusion","a question"],"a":1,"e":"Possible answer.","imp":true},{"id":"sci1p2","k":"mcq","q":"In a fair test we change:","o":["everything","two things","one thing only","nothing"],"a":2,"e":"One factor.","imp":true},{"id":"sci1p3","k":"mcq","q":"After testing, a scientist:","o":["hides results","analyses results","stops asking","changes data"],"a":1,"e":"Then concludes.","imp":false},{"id":"sci1p4","k":"mcq","q":"Which is an observation?","o":["The milk tastes sour","Milk turns sour due to bacteria","Milk is food","Milk will spoil"],"a":0,"e":"Noticed with senses.","imp":false},{"id":"sci1p5","k":"mcq","q":"Most important quality of a scientist:","o":["speed","curiosity","wealth","strength"],"a":1,"e":"Asking why.","imp":false},{"id":"sci1t0","k":"tf","q":"A hypothesis must be testable.","a":0,"e":""},{"id":"sci1t1","k":"tf","q":"We can change many factors at once in a fair test.","a":1,"e":"Only one."},{"id":"sci1t2","k":"tf","q":"Science is only done in laboratories.","a":1,"e":"It is all around us."},{"id":"sci1t3","k":"tf","q":"A wrong guess is useless.","a":1,"e":"It helps make a better guess."},{"id":"sci1a0","k":"ar","A":"Experiments must be repeated.","R":"Repeating makes results reliable.","a":0,"e":"R explains A."},{"id":"sci1a1","k":"ar","A":"Observation comes after the conclusion.","R":"We conclude from evidence.","a":3,"e":"A false; R true."},{"id":"sci1x0","k":"mcq","q":"A careful noticing of things with our senses is:","o":["observation","hypothesis","conclusion","experiment"],"a":0,"e":"Science starts with observing.","sh":1,"x":1},{"id":"sci1x1","k":"mcq","q":"Which is the correct order?","o":["Observe → Question → Hypothesis → Test → Conclude","Test → Observe → Conclude → Question","Hypothesis → Observe → Test","Conclude → Test → Observe"],"a":0,"e":"Remember OQHTAC.","sh":1,"x":1},{"id":"sci1x2","k":"mcq","q":"‘Plants kept in the dark will turn yellow’ is a:","o":["hypothesis","observation","conclusion","question"],"a":0,"e":"A testable guess.","sh":1,"x":1},{"id":"sci1x3","k":"mcq","q":"Scientists repeat experiments to:","o":["make results reliable","waste time","change the answer","avoid writing"],"a":0,"e":"Same result again = trustworthy.","sh":1,"x":1},{"id":"sci1x4","k":"mcq","q":"Which is a good scientific question?","o":["Does salt dissolve faster in hot water?","Is salt nice?","Who likes salt?","Is salt pretty?"],"a":0,"e":"It can be tested.","sh":1,"x":1},{"id":"sci1x5","k":"mcq","q":"If results do not match the hypothesis, a scientist should:","o":["make a new hypothesis and test again","hide the results","stop working","change the data"],"a":0,"e":"Wrong guesses also teach us.","sh":1,"x":1},{"id":"sci1x6","k":"mcq","q":"Science is:","o":["a way of finding out about the world","only done in labs","only memorising facts","only for adults"],"a":0,"e":"Science is all around us.","sh":1,"x":1},{"id":"sci1x7","k":"mcq","q":"Keeping everything the same except one thing makes an experiment:","o":["fair","unfair","faster","harder"],"a":0,"e":"Fair test = one change.","sh":1,"x":1},{"id":"sci1y0","k":"tf","q":"Curiosity is an important quality of a scientist.","a":0,"e":"","x":1},{"id":"sci1y1","k":"tf","q":"A hypothesis does not need to be tested.","a":1,"e":"It must be testable.","x":1},{"id":"sci1y2","k":"tf","q":"Everyday activities like cooking involve science.","a":0,"e":"","x":1},{"id":"sci1m0","k":"mcq","q":"‘Why do leaves fall in autumn?’ is a:","o":["question","conclusion","observation","experiment"],"a":0,"e":"It starts an investigation.","sh":1,"x":1},{"id":"sci1m1","k":"mcq","q":"In a fair test of plant growth with water, we change only:","o":["the amount of water","soil, pot and light","everything","nothing"],"a":0,"e":"One variable at a time.","sh":1,"x":1},{"id":"sci1m2","k":"mcq","q":"A conclusion is based on:","o":["results of the test","a wish","guessing only","what friends say"],"a":0,"e":"Evidence-based.","sh":1,"x":1},{"id":"sci1m3","k":"mcq","q":"Which step comes right after the hypothesis?","o":["Testing","Observing","Concluding","Asking a question"],"a":0,"e":"O-Q-H-T-A-C.","sh":1,"x":1},{"id":"sci1f0","k":"mcq","fill":1,"q":"A testable guess is called a ___.","o":["hypothesis","conclusion","result","fact"],"a":0,"e":"","sh":1,"x":1},{"id":"sci1f1","k":"mcq","fill":1,"q":"Changing only one thing at a time makes a test ___.","o":["fair","fast","unfair","difficult"],"a":0,"e":"","sh":1,"x":1},{"id":"sci1f2","k":"mcq","fill":1,"q":"Using our senses to notice things is called ___.","o":["observation","conclusion","analysis","hypothesis"],"a":0,"e":"","sh":1,"x":1},{"id":"sci1c02","k":"mcq","q":"The mouldy bread: Kiran noticed that bread in a warm cupboard grew green fungus in 3 days, but bread in the fridge stayed fresh for a week. — Which step comes next?","o":["Conclusion","Test","Question only","Nothing"],"a":1,"e":"(b) Test."}],"top":[{"q":"What is science?","m":2,"imp":true,"a":["Science is a way of understanding the world around us by observing carefully, asking questions, making guesses, testing them with experiments and drawing conclusions from evidence."],"k":"Observing + questioning + testing + evidence.","cm":"Defining science only as ‘a school subject’."},{"q":"Write the steps of the scientific method in the correct order.","m":3,"imp":true,"a":["Observe something carefully.","Ask a question about it.","Make a guess (hypothesis) — a possible answer.","Test the guess with an experiment.","Analyse the results.","Draw a conclusion; share it, and ask new questions."],"k":"Six steps in order (½ each).","cm":"Putting ‘conclusion’ before ‘test’."},{"q":"Riya’s potted plant is drooping. Use the scientific method to find out why.","m":5,"imp":true,"a":["Observe: leaves are drooping; soil looks dry.","Question: Why is the plant drooping?","Guess: It is not getting enough water.","Test: Water the plant regularly for 2–3 days, keeping everything else (sunlight, pot, place) the same.","Analyse and conclude: If the leaves become fresh again, the guess was correct; if not, make a new guess (e.g. too much sun, pests) and test again."],"k":"All steps applied to the example (1 each).","cm":"Changing sunlight and water together — then you cannot tell which one helped."},{"q":"What is a hypothesis? Give an example.","m":2,"imp":false,"a":["A hypothesis is a possible answer (educated guess) to a question that can be tested. Example: ‘Ice melts faster in the sun than in the shade.’"],"k":"Meaning + testable example.","cm":"Writing a question instead of a guess."},{"q":"Why should only one thing be changed at a time in an experiment?","m":2,"imp":true,"a":["If we change two things together, we cannot tell which one caused the result. Changing only one factor and keeping the others the same makes it a fair test."],"k":"Cause cannot be identified + fair test.","cm":"Saying ‘to save time’."},{"q":"Give three qualities of a good scientist.","m":3,"imp":false,"a":["Curiosity — asks ‘why’ and ‘how’.","Careful observation and patience — repeats experiments.","Honesty — reports results truthfully, even when the guess was wrong."],"k":"Three qualities with one line each.","cm":"Listing only ‘intelligent’."},{"q":"Give three examples of science in your daily life.","m":3,"imp":false,"a":["Kitchen: boiling, cooking, curd setting.","Home: a fan, electric lights, a refrigerator.","Nature: rain, day and night, plants growing towards light."],"k":"Three different examples.","cm":"Three examples from the same area only."},{"q":"What should a scientist do if the experiment does not support the guess?","m":2,"imp":false,"a":["Accept the result honestly, make a new guess and test again. A guess that turns out wrong still teaches us something."],"k":"Honesty + new hypothesis + retest.","cm":"Saying ‘change the results’."}],"prac":[{"lv":"Level 1: Basic","q":"What is the first step of the scientific method?","a":"Observation."},{"lv":"Level 1: Basic","q":"What is a hypothesis?","a":"A testable guess."},{"lv":"Level 1: Basic","q":"Name one quality of a scientist.","a":"Curiosity/honesty/patience."},{"lv":"Level 1: Basic","q":"Is ‘Why do stars twinkle?’ a question or a hypothesis?","a":"A question."},{"lv":"Level 2: Exam Standard","q":"Write a hypothesis for: ‘Why does ice melt faster on a sunny day?’","a":"Ice melts faster when the temperature is higher."},{"lv":"Level 2: Exam Standard","q":"Why do scientists repeat experiments?","a":"To make sure the results are reliable and not due to chance."},{"lv":"Level 2: Exam Standard","q":"In testing whether water helps a seed grow, what must be kept the same?","a":"Type of seed, soil, pot, light, temperature — only water is changed."},{"lv":"Level 2: Exam Standard","q":"Give one example of science in the kitchen.","a":"Milk turning into curd / boiling water."},{"lv":"Level 3: Competency / Application","q":"Aman thinks sugar dissolves faster in hot water. Design a fair test.","a":"Take equal amounts of hot and cold water in similar glasses, add the same amount of sugar, stir equally, and time how long it takes to dissolve."},{"lv":"Level 3: Competency / Application","q":"A student gets an unexpected result. Should she hide it? Why?","a":"No — honesty is essential; unexpected results can lead to new discoveries."},{"lv":"Level 3: Competency / Application","q":"Turn this observation into a question and a hypothesis: ‘Bread kept outside gets fungus faster than bread in the fridge.’","a":"Question: Does temperature affect fungus growth? Hypothesis: Fungus grows faster in warmer places."},{"lv":"Level 4: Challenge","q":"Why can’t one experiment always prove a hypothesis forever?","a":"New observations or better experiments may show something different; science keeps testing."},{"lv":"Level 4: Challenge","q":"How is the scientific method useful outside science class?","a":"It helps solve everyday problems logically — e.g. finding why a bicycle chain slips."}],"comp":[{"q":"Your torch is not working. Use the scientific method to solve the problem.","a":"• Observe: no light. • Guess: batteries are dead. • Test: replace batteries. • Conclude: if it works, guess correct; if not, test the bulb next."},{"q":"Two students test if plants grow better with music. One plant is kept by a window with music, the other in a dark room without music. Is this a fair test?","a":"No — light is also different. Both plants must be in the same light; only music should change."},{"q":"Why is it important to write down observations immediately?","a":"Memory can be wrong; written records are accurate and can be checked by others."}],"case":[{"t":"The mouldy bread","p":"Kiran noticed that bread in a warm cupboard grew green fungus in 3 days, but bread in the fridge stayed fresh for a week.","q":["(i) What did Kiran observe?","(ii) Write a hypothesis.","(iii) Which step comes next? (a) Conclusion (b) Test (c) Question only (d) Nothing","(iv) What must be the same in both places for a fair test?"],"a":["(i) Bread grows fungus faster in the warm cupboard.","(ii) Fungus grows faster at higher temperature.","(iii) (b) Test.","(iv) Same kind of bread, same packaging, same moisture — only temperature different."]}],"conc":[{"c":"Observation","e":"Using senses carefully to notice things.","x":"Noticing that shadows change length during the day.","cf":"Observation is not a guess.","t":"See before you ask"},{"c":"Hypothesis","e":"Testable guess.","x":"Plants need sunlight to stay green.","cf":"It must be testable.","t":"If . . . then . . ."},{"c":"Experiment","e":"A fair test of the guess.","x":"Keep one plant in dark, one in light.","cf":"Change only one thing.","t":"One change at a time"},{"c":"Conclusion","e":"What the results tell us.","x":"Plants need light to stay green.","cf":"Conclusions come after testing.","t":""}],"notes":[{"h":"What is science?","t":"A way of understanding the world by observing, asking questions, guessing and testing. Science is all around us — in the kitchen, garden and playground."},{"h":"Scientific method","t":"Observe → Question → Hypothesis (testable guess) → Test (experiment) → Analyse → Conclude. Memory trick: “Only Quiet Heroes Test And Conclude”."},{"h":"Fair test","t":"Change only ONE thing (variable) and keep everything else the same, so you know what caused the result."},{"h":"Repeat and share","t":"Repeat experiments to get reliable results. Share results honestly so others can check them."},{"h":"Qualities of a scientist","t":"Curious, observant, patient, honest, open to new ideas, does not give up when a guess is wrong."}]},{"n":2,"t":"Diversity in the Living World","intro":"Grouping plants (by stem, leaves, roots, seeds) and animals (by habitat and adaptations). Differences and diagrams give most of the marks.","prio":[{"t":"Plants by stem: herbs, shrubs, trees; climbers and creepers","s":3},{"t":"Leaf parts: lamina (leaf blade), midrib, veins, petiole; venation: reticulate vs parallel","s":3},{"t":"Roots: taproot vs fibrous; link with venation","s":3},{"t":"Seeds: dicots (2 cotyledons) vs monocots (1 cotyledon)","s":3},{"t":"Animals grouped by habitat; adaptations (camel, fish, yak, frog... )","s":3},{"t":"Biodiversity and why we must conserve it","s":2}],"traps":[{"m":"Rose/tulsi called herb","c":"They are shrubs","t":"Bushy = shrub"},{"m":"Hump stores water","c":"Stores fat","t":"Hump = fuel"},{"m":"Maize as dicot","c":"Monocot","t":"Cereals = one"},{"m":"Climber vs creeper swap","c":"Climb up vs creep along","t":"Creep = crawl"},{"m":"Unlabelled leaf diagram","c":"Label all 4 parts","t":"L-M-V-P"}],"rq":[{"q":"Why do fish have streamlined bodies?","a":"To move through water with less resistance."},{"q":"Why do climbers need support?","a":"Their stems are too weak to stand upright."},{"q":"Why are desert plants’ leaves small or spiny?","a":"To reduce water loss."}],"mock":[{"q":"Give one example each of a herb, shrub and tree.","m":3,"a":"Mint; rose; mango."},{"q":"Draw a labelled diagram of a leaf.","m":3,"a":"Lamina, midrib, veins, petiole labelled."},{"q":"Differentiate between taproot and fibrous roots.","m":3,"a":"See difference table."},{"q":"What are monocots? Give two examples.","m":2,"a":"One cotyledon; maize, wheat."},{"q":"Give three adaptations of a camel.","m":3,"a":"Long legs, fat in hump, padded feet (any three)."},{"q":"What is a habitat?","m":1,"a":"Natural home of an organism."},{"q":"Why should we conserve biodiversity?","m":2,"a":"Living beings depend on each other; nature gives food, medicine, clean air."}],"qs":[{"id":"sci2p0","k":"mcq","q":"A plant with a soft green stem is a:","o":["tree","shrub","herb","climber"],"a":2,"e":"Herbs are soft.","imp":true},{"id":"sci2p1","k":"mcq","q":"Taproot is found in:","o":["wheat","grass","carrot","maize"],"a":2,"e":"Main root.","imp":true},{"id":"sci2p2","k":"mcq","q":"Parallel venation is found in:","o":["peepal","banana","hibiscus","mango"],"a":1,"e":"Monocot leaf.","imp":true},{"id":"sci2p3","k":"mcq","q":"Camel’s hump stores:","o":["water","fat","sand","blood"],"a":1,"e":"Energy reserve.","imp":true},{"id":"sci2p4","k":"mcq","q":"Fish breathe through:","o":["lungs","skin only","gills","nostrils"],"a":2,"e":"Dissolved oxygen.","imp":false},{"id":"sci2p5","k":"mcq","q":"Pumpkin is a:","o":["climber","creeper","shrub","tree"],"a":1,"e":"Spreads on ground.","imp":false},{"id":"sci2p6","k":"mcq","q":"Dicot seed:","o":["maize","rice","gram","wheat"],"a":2,"e":"Two cotyledons.","imp":true},{"id":"sci2p7","k":"mcq","q":"The natural home of an organism:","o":["habitat","zoo","shelter","nest only"],"a":0,"e":"Definition.","imp":false},{"id":"sci2p8","k":"mcq","q":"Stalk of a leaf:","o":["midrib","vein","petiole","lamina"],"a":2,"e":"Joins leaf to stem.","imp":false},{"id":"sci2p9","k":"mcq","q":"Fibrous roots usually go with:","o":["reticulate venation","parallel venation","two cotyledons","woody trunk"],"a":1,"e":"Monocot pattern.","imp":false},{"id":"sci2t0","k":"tf","q":"Rose is a shrub.","a":0,"e":""},{"id":"sci2t1","k":"tf","q":"Maize has two cotyledons.","a":1,"e":"One."},{"id":"sci2t2","k":"tf","q":"Creepers need a support to climb.","a":1,"e":"Climbers do; creepers spread on the ground."},{"id":"sci2t3","k":"tf","q":"Camel’s hump stores water.","a":1,"e":"It stores fat."},{"id":"sci2t4","k":"tf","q":"Leaves with parallel venation usually have fibrous roots.","a":0,"e":""},{"id":"sci2t5","k":"tf","q":"Biodiversity means variety of living things.","a":0,"e":""},{"id":"sci2a0","k":"ar","A":"Wheat has fibrous roots.","R":"Wheat leaves have parallel venation.","a":1,"e":"Both true; venation is a linked pattern, not the cause."},{"id":"sci2a1","k":"ar","A":"A camel can live in the desert.","R":"It has long legs and stores fat in its hump.","a":0,"e":"Adaptations explain survival."},{"id":"sci2a2","k":"ar","A":"Mango is a herb.","R":"Mango has a thick woody trunk.","a":3,"e":"A false; R true."},{"id":"sci2x0","k":"mcq","q":"Mango is an example of a:","o":["tree","herb","shrub","creeper"],"a":0,"e":"Thick, woody trunk.","sh":1,"x":1},{"id":"sci2x1","k":"mcq","q":"Pumpkin plant with a weak stem spreading on the ground is a:","o":["creeper","climber","tree","shrub"],"a":0,"e":"Creepers spread on the ground.","sh":1,"x":1},{"id":"sci2x2","k":"mcq","q":"Money plant climbs using support. It is a:","o":["climber","creeper","herb","tree"],"a":0,"e":"Climbers grow upward with support.","sh":1,"x":1},{"id":"sci2x3","k":"mcq","q":"Leaves with net-like veins have:","o":["reticulate venation","parallel venation","no venation","fibrous venation"],"a":0,"e":"Seen in dicots like hibiscus.","sh":1,"x":1},{"id":"sci2x4","k":"mcq","q":"Plants with fibrous roots usually have leaves with:","o":["parallel venation","reticulate venation","no veins","thorns"],"a":0,"e":"e.g. grass, wheat, maize.","sh":1,"x":1},{"id":"sci2x5","k":"mcq","q":"Seeds with two cotyledons are called:","o":["dicots","monocots","tricots","spores"],"a":0,"e":"Di = two.","sh":1,"x":1},{"id":"sci2x6","k":"mcq","q":"The flat broad part of a leaf is:","o":["lamina","petiole","midrib","vein"],"a":0,"e":"Lamina = leaf blade.","sh":1,"x":1},{"id":"sci2x7","k":"mcq","q":"The natural home of an organism is its:","o":["habitat","nest","food","shelter only"],"a":0,"e":"Where it lives and gets food.","sh":1,"x":1},{"id":"sci2x8","k":"mcq","q":"Camel’s long legs help it to:","o":["keep its body away from hot sand","swim","climb trees","dig burrows"],"a":0,"e":"Adaptation to deserts.","sh":1,"x":1},{"id":"sci2x9","k":"mcq","q":"Fish breathe using:","o":["gills","lungs","skin only","nose"],"a":0,"e":"Gills take oxygen from water.","sh":1,"x":1},{"id":"sci2x10","k":"mcq","q":"Special features that help an organism survive in its habitat are called:","o":["adaptations","habitats","diversity","seeds"],"a":0,"e":"e.g. thick fur in polar bears.","sh":1,"x":1},{"id":"sci2x11","k":"mcq","q":"Wheat and maize seeds are:","o":["monocots","dicots","spores","bulbs"],"a":0,"e":"One cotyledon.","sh":1,"x":1},{"id":"sci2y0","k":"tf","q":"Grass has a taproot.","a":1,"e":"Grass has fibrous roots.","x":1},{"id":"sci2y1","k":"tf","q":"Biodiversity means the variety of living things in an area.","a":0,"e":"","x":1},{"id":"sci2y2","k":"tf","q":"A cactus stores water in its stem.","a":0,"e":"","x":1},{"id":"sci2m0","k":"mcq","q":"Rose is a:","o":["shrub","herb","tree","creeper"],"a":0,"e":"Woody stem branching near the base.","sh":1,"x":1},{"id":"sci2m1","k":"mcq","q":"Carrot has a:","o":["taproot","fibrous root","no root","climbing root"],"a":0,"e":"One thick main root.","sh":1,"x":1},{"id":"sci2m2","k":"mcq","q":"Gram seed has:","o":["two cotyledons","one cotyledon","no cotyledon","three cotyledons"],"a":0,"e":"Dicot.","sh":1,"x":1},{"id":"sci2m3","k":"mcq","q":"Banana leaves show:","o":["parallel venation","reticulate venation","no venation","net venation"],"a":0,"e":"Monocot pattern.","sh":1,"x":1},{"id":"sci2m4","k":"mcq","q":"A camel’s hump stores:","o":["fat","water","air","milk"],"a":0,"e":"Not water — a common trap.","sh":1,"x":1},{"id":"sci2f0","k":"mcq","fill":1,"q":"The stalk that joins a leaf to the stem is the ___.","o":["petiole","lamina","midrib","vein"],"a":0,"e":"","sh":1,"x":1},{"id":"sci2f1","k":"mcq","fill":1,"q":"Plants with weak stems that spread on the ground are ___.","o":["creepers","climbers","shrubs","trees"],"a":0,"e":"","sh":1,"x":1},{"id":"sci2f2","k":"mcq","fill":1,"q":"Maize is a ___ because its seed has one cotyledon.","o":["monocot","dicot","shrub","creeper"],"a":0,"e":"","sh":1,"x":1},{"id":"sci2c02","k":"mcq","q":"Seed sorting: Meera soaked seeds of gram, maize, pea and wheat overnight and tried to split each into two halves. — Maize is a:","o":["dicot","monocot","shrub","creeper"],"a":1,"e":"(b) monocot."}],"top":[{"q":"Differentiate between herbs, shrubs and trees with one example each.","m":3,"imp":true,"a":["Herbs: small plants with soft, green, tender stems; e.g. tomato, mint, wheat.","Shrubs: medium height; hard, woody stems that branch near the base; e.g. rose, hibiscus (gudhal), tulsi.","Trees: tall; thick, hard, woody trunk; branches high above the ground; e.g. mango, neem, banyan."],"k":"Stem feature + example for each.","cm":"Calling rose a herb."},{"q":"What are climbers and creepers? Give examples.","m":2,"imp":true,"a":["Climbers: weak stems that climb up a support using tendrils or twining; e.g. money plant, grapevine, pea, bottle gourd (on support).","Creepers: weak stems that spread on the ground; e.g. pumpkin, watermelon, sweet potato."],"k":"Meaning + example each.","cm":"Swapping climbers and creepers."},{"q":"Draw a labelled d
