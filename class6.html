ment officer (often an IAS officer) — the administrative/executive head; implements decisions, manages staff and the day-to-day running of the corporation."],"k":"Elected vs appointed + role of each.","cm":"Saying the Commissioner is elected."},{"q":"What are the main functions of a Municipal Corporation?","m":5,"imp":true,"a":["Water supply and drainage/sewerage.","Solid waste management — collecting, segregating and disposing of garbage; cleaning streets.","Roads, bridges, street lights; traffic signals in many cities.","Public health — hospitals/dispensaries, vaccination, controlling mosquitoes; parks and markets.","Records of births and deaths; building permissions; primary schools; fire services in many cities."],"k":"Five different functions.","cm":"Listing state/union duties like police or defence."},{"q":"How does a Municipal Corporation raise money?","m":3,"imp":true,"a":["Taxes: property/house tax (main source), water tax, tax on advertisements, entertainment etc.","Fees and charges: building permissions, market stalls, parking, licences.","Grants from the state and central governments; sometimes loans/bonds for big projects."],"k":"Taxes (property tax) + fees + grants.","cm":"Saying the Corporation collects income tax."},{"q":"What is the 74th Amendment? What did it do for cities?","m":2,"imp":false,"a":["The 74th Constitutional Amendment (1992) gave constitutional status to urban local bodies. It made three types of urban bodies, regular elections every 5 years, ward committees and reservation of seats for women (at least one-third) and SC/ST compulsory."],"k":"Year + urban + key provisions.","cm":"Mixing with the 73rd (rural)."},{"q":"What is a ward committee? How can citizens participate in urban governance?","m":3,"imp":false,"a":["A ward committee includes the ward councillor and local residents’ representatives; it discusses and solves problems of the ward.","Citizens can vote, attend ward/area meetings, join Resident Welfare Associations (RWAs), complain through helplines/apps, pay taxes on time and segregate waste."],"k":"Ward committee meaning + 3 ways of participating.","cm":"Only ‘voting’."},{"q":"Why do cities need separate local government from villages?","m":3,"imp":false,"a":["Cities have dense populations, large amounts of waste, heavy traffic, big water and sewerage networks, slums, markets and industries. These problems are different and bigger than in villages and need specialised urban bodies with trained staff and more funds."],"k":"Features of cities + need for specialised bodies.","cm":"Saying ‘because cities are rich’."},{"q":"How has Indore become one of India’s cleanest cities? What can other cities learn?","m":3,"imp":false,"a":["The Indore Municipal Corporation arranged door-to-door garbage collection, segregation of wet and dry waste, composting and recycling plants.","Citizens cooperated — they segregated waste, stopped littering; the city was ranked the cleanest city in the Swachh Survekshan survey for several years in a row.","Lesson: good planning + citizen participation makes local government effective."],"k":"Steps taken + citizens’ role + lesson.","cm":"Giving credit only to the government."},{"q":"Compare urban and rural local government.","m":3,"imp":true,"a":["Area: villages vs towns/cities.","Bodies: Gram Panchayat, Panchayat Samiti, Zila Parishad vs Municipal Corporation, Municipal Council, Nagar Panchayat.","Heads: Sarpanch vs Mayor/Chairperson.","Amendment: 73rd vs 74th (both 1992).","Base of participation: Gram Sabha vs ward committees."],"k":"Four-five matching points in a table.","cm":"Mixing up heads and amendments."}],"prac":[{"lv":"Level 1: Basic","q":"Who is the elected head of a Municipal Corporation?","a":"The Mayor."},{"lv":"Level 1: Basic","q":"Which Amendment deals with urban local bodies?","a":"74th Amendment (1992)."},{"lv":"Level 1: Basic","q":"What is the main source of income of a Municipal Corporation?","a":"Property tax."},{"lv":"Level 1: Basic","q":"What is the local body for a small town called?","a":"Municipal Council (Nagar Palika)."},{"lv":"Level 2: Exam Standard","q":"Name three functions of a Municipal Corporation.","a":"Water supply, waste management, street lights, roads, birth/death records (any three)."},{"lv":"Level 2: Exam Standard","q":"Who appoints the Municipal Commissioner?","a":"The state government."},{"lv":"Level 2: Exam Standard","q":"What is a Nagar Panchayat?","a":"An urban local body for an area changing from rural to urban."},{"lv":"Level 2: Exam Standard","q":"Give two ways citizens can help keep their city clean.","a":"Segregate waste; don’t litter; join clean-up drives; report overflowing bins."},{"lv":"Level 3: Competency / Application","q":"Garbage has not been collected on your street for a week. List the steps you would take.","a":"Complain on the municipal helpline/app; inform the ward councillor; raise it in the RWA/ward committee; follow up."},{"lv":"Level 3: Competency / Application","q":"Why is property tax fair as a source of city income?","a":"Those who own property use city services like roads, water and drains, so they contribute according to property value."},{"lv":"Level 3: Competency / Application","q":"A city has many mosquitoes after rain. Which body should act and what should it do?","a":"The Municipal Corporation’s health department — clear stagnant water, spray/fog, spread awareness."},{"lv":"Level 4: Challenge","q":"Why is it useful to have both an elected Mayor and an appointed Commissioner?","a":"The Mayor represents people’s wishes; the Commissioner brings expertise to carry out decisions; each checks the other."},{"lv":"Level 4: Challenge","q":"How does citizen cooperation affect the success of a city’s cleanliness drive? Use Indore as an example.","a":"Without citizens segregating waste and not littering, even good systems fail; Indore succeeded because citizens and the corporation worked together."}],"comp":[{"q":"Match: (i) Delhi (ii) a small district town (iii) a large village turning into a town — with the right urban body.","a":"(i) Municipal Corporation (ii) Municipal Council/Nagar Palika (iii) Nagar Panchayat."},{"q":"Your RWA wants a park repaired. Who should they approach and how?","a":"The ward councillor and the Municipal Corporation’s horticulture/parks department; write a petition, raise it in the ward committee, follow up through the helpline."},{"q":"List three things you use every day that the municipal body provides.","a":"• Tap water • Street lights • Garbage collection / clean roads / drains"}],"case":[{"t":"The cleanest city","p":"A few years ago, Indore had overflowing garbage bins. The Municipal Corporation started door-to-door collection with separate compartments for wet and dry waste. Residents learnt to segregate waste at home. Wet waste was turned into compost. Indore has been ranked the cleanest city in India many times.","q":["(i) Which body organised the collection?","(ii) What does segregation of waste mean?","(iii) What was made from wet waste? (a) Plastic (b) Compost (c) Bricks (d) Glass","(iv) What was the role of citizens?"],"a":["(i) Indore Municipal Corporation.","(ii) Separating wet (kitchen) waste from dry waste (paper, plastic) at home.","(iii) (b) Compost.","(iv) They segregated waste and stopped littering, cooperating with the corporation."]}],"conc":[{"c":"Municipal Corporation","e":"Urban body for big cities.","x":"Bhubaneswar Municipal Corporation.","cf":"Not the same as a company.","t":""},{"c":"Ward","e":"Small part of a city electing one councillor.","x":"Ward No. 12.","cf":"Ward ≠ hospital ward here.","t":""},{"c":"Mayor vs Commissioner","e":"Elected head vs appointed administrative head.","x":"Mayor chairs meetings; Commissioner runs offices.","cf":"Commissioner is not elected.","t":"Mayor = Majority chose; Commissioner = Chosen by govt"},{"c":"Property tax","e":"Tax paid by owners of houses/buildings to the city.","x":"Main income of corporations.","cf":"Not the same as income tax (Union).","t":""}],"notes":[{"h":"Urban local bodies","t":"Municipal Corporation (big cities, e.g. Bhubaneswar, Delhi), Municipal Council/Nagar Palika (smaller towns), Nagar Panchayat (areas changing from rural to urban). Given status by the 74th Amendment (1992)."},{"h":"Wards and councillors","t":"A city is divided into wards; each ward elects a councillor. Councillors together form the council and elect/choose the Mayor."},{"h":"Mayor and Commissioner","t":"Mayor: elected head (political). Municipal Commissioner: appointed officer (usually IAS) who runs the administration."},{"h":"Functions","t":"Water supply, garbage collection, drainage, street lights, roads, parks, markets, primary schools, hospitals, birth/death certificates."},{"h":"Funds","t":"Property tax, water tax, fees, and grants from the state government."},{"h":"Citizens’ role","t":"Pay taxes, don’t litter, segregate waste, report problems, attend ward meetings."}]},{"n":13,"t":"The Value of Work","intro":"One big idea: work can be economic (for money or payment in kind) or non-economic (for love, care, duty, service). Most questions ask you to classify and explain.","prio":[{"t":"Economic activities: done in exchange for money or payment in kind; produce income","s":3},{"t":"Non-economic activities: done out of love, care, duty, social or religious reasons; no payment","s":3},{"t":"Same activity can be either — it depends on purpose/payment","s":3},{"t":"Payment in kind (e.g. grain instead of money)","s":2},{"t":"Value of non-economic work: care at home, seva, volunteering, shramdaan","s":3},{"t":"Classifying activities (practise many examples)","s":3}],"traps":[{"m":"Classifying by job title","c":"Classify by payment/purpose","t":"Ask: paid? why?"},{"m":"Unpaid = useless","c":"Unpaid work has great value","t":"Heart work matters"},{"m":"Payment in kind = being kind","c":"Goods instead of money","t":"Kind = goods"},{"m":"Shramdaan as paid work","c":"Voluntary labour","t":"Daan = gift"},{"m":"Examples without reasons","c":"Add ’(paid)’ or ’(out of love)’","t":"Example + Reason"}],"rq":[{"q":"Why is cooking in a hotel economic but cooking at home non-economic?","a":"The hotel cook is paid; home cooking is done out of love without payment."},{"q":"Why should household chores be shared?","a":"They take effort and time; sharing is fair and shows respect for the work."},{"q":"Why is volunteering important for society?","a":"It helps people in need, builds community bonds and fills gaps the government or market can’t."}],"mock":[],"qs":[{"id":"sst13p0","k":"mcq","q":"An activity done to earn money is:","o":["non-economic","economic","social only","religious"],"a":1,"e":"Income is the key.","imp":true},{"id":"sst13p1","k":"mcq","q":"A mother teaching her own child at home is doing:","o":["economic activity","non-economic activity","business","trade"],"a":1,"e":"Unpaid, out of love.","imp":true},{"id":"sst13p2","k":"mcq","q":"Payment in kind means payment in:","o":["cash","cheque","goods","kindness"],"a":2,"e":"Goods instead of money.","imp":true},{"id":"sst13p3","k":"mcq","q":"Serving food in a langar voluntarily is:","o":["economic","seva","trade","tax"],"a":1,"e":"Selfless service.","imp":false},{"id":"sst13p4","k":"mcq","q":"Which is economic?","o":["playing with friends","a tailor stitching for customers","helping grandma","praying"],"a":1,"e":"Paid work.","imp":false},{"id":"sst13p5","k":"mcq","q":"Deciding factor for classifying an activity:","o":["time taken","payment and purpose","place","age of person"],"a":1,"e":"Why and whether paid.","imp":true},{"id":"sst13p6","k":"mcq","q":"A doctor treating people free at a camp is doing:","o":["economic activity","non-economic activity","illegal work","business"],"a":1,"e":"Unpaid service.","imp":false},{"id":"sst13p7","k":"mcq","q":"Shramdaan means:","o":["paid labour","voluntary physical work","tax","loan"],"a":1,"e":"Donation of labour.","imp":false},{"id":"sst13p8","k":"mcq","q":"Economic activities are counted in the country’s:","o":["income","population","area","forests"],"a":0,"e":"Monetary value.","imp":false},{"id":"sst13p9","k":"mcq","q":"Which statement is true?","o":["Unpaid work has no value","Only office work is work","Care work has great value","Volunteering is economic"],"a":2,"e":"Care work keeps families running.","imp":true},{"id":"sst13t0","k":"tf","q":"All work done at home is economic.","a":1,"e":"Unpaid home work is non-economic."},{"id":"sst13t1","k":"tf","q":"Payment in kind is a type of payment for economic activity.","a":0,"e":""},{"id":"sst13t2","k":"tf","q":"Non-economic activities have no value.","a":1,"e":"They have great social and emotional value."},{"id":"sst13t3","k":"tf","q":"A teacher can do both economic and non-economic activities.","a":0,"e":""},{"id":"sst13t4","k":"tf","q":"Seva is done for a salary.","a":1,"e":"Seva is selfless and unpaid."},{"id":"sst13t5","k":"tf","q":"Selling vegetables at a market is economic.","a":0,"e":""},{"id":"sst13a0","k":"ar","A":"Cooking can be economic or non-economic.","R":"Classification depends on payment and purpose.","a":0,"e":"R is the rule that explains A."},{"id":"sst13a1","k":"ar","A":"Seva is a non-economic activity.","R":"It is done without expecting payment.","a":0,"e":"R explains A."},{"id":"sst13a2","k":"ar","A":"Home care work has no value.","R":"It is not paid.","a":3,"e":"A false — it has great value; R true."},{"id":"sst13x0","k":"mcq","q":"Work done for money is called:","o":["economic activity","non-economic activity","hobby","rest"],"a":0,"e":"Earns income.","sh":1,"x":1},{"id":"sst13x1","k":"mcq","q":"Cooking for the family at home without pay is:","o":["non-economic activity","economic activity","business","trade"],"a":0,"e":"Done out of love and care.","sh":1,"x":1},{"id":"sst13x2","k":"mcq","q":"Payment in the form of goods (like grain) instead of money is:","o":["payment in kind","salary","tax","loan"],"a":0,"e":"Common in villages.","sh":1,"x":1},{"id":"sst13x3","k":"mcq","q":"A doctor treating patients in a hospital for a salary does:","o":["economic activity","non-economic activity","volunteering","nothing"],"a":0,"e":"Paid work.","sh":1,"x":1},{"id":"sst13x4","k":"mcq","q":"A doctor treating poor people free in a camp does:","o":["non-economic activity (service)","economic activity","business","trade"],"a":0,"e":"No payment.","sh":1,"x":1},{"id":"sst13x5","k":"mcq","q":"Helping others without expecting payment is:","o":["volunteering","selling","banking","taxing"],"a":0,"e":"Social service.","sh":1,"x":1},{"id":"sst13x6","k":"mcq","q":"Unpaid care work at home is mostly done by:","o":["women in many families","machines","government","nobody"],"a":0,"e":"It is valuable though unpaid.","sh":1,"x":1},{"id":"sst13x7","k":"mcq","q":"All work deserves:","o":["dignity and respect","less respect if small","no respect","only money"],"a":0,"e":"Dignity of labour.","sh":1,"x":1},{"id":"sst13x8","k":"mcq","q":"A farmer selling vegetables in the market does:","o":["economic activity","non-economic activity","charity","nothing"],"a":0,"e":"Earns income.","sh":1,"x":1},{"id":"sst13x9","k":"mcq","q":"A child playing cricket for fun is doing a:","o":["non-economic activity","economic activity","business","job"],"a":0,"e":"No money involved.","sh":1,"x":1},{"id":"sst13y0","k":"tf","q":"Non-economic activities have no value.","a":1,"e":"They are valuable for families and society.","x":1},{"id":"sst13y1","k":"tf","q":"Payment in kind is a form of economic activity.","a":0,"e":"","x":1},{"id":"sst13y2","k":"tf","q":"Every kind of honest work is valuable.","a":0,"e":"","x":1},{"id":"sst13m0","k":"mcq","q":"A mother teaching her own child at home is doing:","o":["non-economic activity","economic activity","business","trade"],"a":0,"e":"No payment.","sh":1,"x":1},{"id":"sst13m1","k":"mcq","q":"A tailor stitching clothes for customers does:","o":["economic activity","non-economic activity","volunteering","charity"],"a":0,"e":"Earns money.","sh":1,"x":1},{"id":"sst13m2","k":"mcq","q":"Getting rice as wages is an example of:","o":["payment in kind","salary","tax","loan"],"a":0,"e":"Goods instead of money.","sh":1,"x":1},{"id":"sst13m3","k":"mcq","q":"‘Dignity of labour’ means:","o":["respect for all honest work","only office work is respectable","work is bad","only rich people work"],"a":0,"e":"Every job matters.","sh":1,"x":1},{"id":"sst13f0","k":"mcq","fill":1,"q":"Activities done for money are called ___ activities.","o":["economic","non-economic","social","leisure"],"a":0,"e":"","sh":1,"x":1},{"id":"sst13f1","k":"mcq","fill":1,"q":"Volunteering at a flood relief camp is a ___ activity.","o":["non-economic","economic","primary","secondary"],"a":0,"e":"","sh":1,"x":1},{"id":"sst13f2","k":"mcq","fill":1,"q":"Payment in goods instead of money is payment in ___.","o":["kind","cash","cheque","credit"],"a":0,"e":"","sh":1,"x":1},{"id":"sst13c02","k":"mcq","q":"Two kinds of cooking: Meena works as a cook in a school canteen and earns a monthly salary. After returning home, she cooks dinner for her family. On festival days, she volunteers at the community kitchen of her neighbourhood. — Volunteering at the community kitchen is an example of:","o":["payment in kind","seva","business","tax"],"a":1,"e":"(b) Seva."}],"top":[{"q":"What are economic activities? Give three examples.","m":3,"imp":true,"a":["Economic activities are activities done to earn money or get payment in kind (goods instead of money). They add to a person’s income and to the country’s economy. Examples: a teacher teaching in a school for salary, a farmer selling vegetables, a tailor stitching clothes for customers."],"k":"Definition with money/payment in kind + three examples.","cm":"Giving ‘playing cricket with friends’ as economic."},{"q":"What are non-economic activities? Give three examples.","m":3,"imp":true,"a":["Non-economic activities are done without expecting money, out of love, care, duty, or for social/religious reasons. Examples: a mother cooking for her family, volunteering at a flood relief camp, serving food in a langar (seva), helping a neighbour."],"k":"Definition + three examples.","cm":"Thinking non-economic means ‘useless’."},{"q":"Differentiate between economic and non-economic activities.","m":3,"imp":true,"a":["Purpose: economic — earn money/income | non-economic — love, care, service, duty.","Payment: economic — money or payment in kind | non-economic — no payment.","Measured: economic — given a monetary value and counted in the country’s income | non-economic — not counted in money terms, but still valuable.","Example: a cook in a hotel | a parent cooking at home."],"k":"Four matching points in a table.","cm":"Only examples without the basis of difference."},{"q":"Can the same activity be economic and non-economic? Explain with examples.","m":3,"imp":true,"a":["Yes. It depends on whether payment is received and why it is done.","A doctor treating patients in a hospital for fees → economic; the same doctor treating people free at a health camp → non-economic.","A teacher teaching in school → economic; teaching her own child at home → non-economic.","Cooking in a restaurant → economic; cooking for family → non-economic."],"k":"Yes + rule (payment/purpose) + two pairs of examples.","cm":"Saying an activity is fixed as economic because of the job title."},{"q":"What is ‘payment in kind’? Give an example.","m":2,"imp":true,"a":["Payment in kind is payment made in the form of goods or services instead of money. Example: a farm worker is paid with a share of grain at harvest; a potter gives pots in exchange for rice."],"k":"Goods instead of money + example.","cm":"Saying it is ‘payment with kindness’."},{"q":"Why is non-economic work valuable even though it is unpaid?","m":3,"imp":true,"a":["It keeps families running — cooking, cleaning, caring for children and elders.","It builds communities — volunteering, seva, shramdaan, disaster relief.","It gives emotional support, values and well-being that money cannot buy.","If people had to be paid for it, it would cost a great deal — so it has huge hidden value."],"k":"Family + community + emotional value + hidden economic value.","cm":"Saying unpaid work is not ‘real work’."},{"q":"What is seva? Give an example.","m":2,"imp":false,"a":["Seva means selfless service to others without expecting anything in return. Example: volunteers cooking and serving free food in a gurudwara langar, or cleaning a temple, mosque, church or public place."],"k":"Meaning + example.","cm":"Treating seva as a paid job."},{"q":"Classify: (a) a shopkeeper selling groceries (b) a grandfather telling stories to grandchildren (c) a nurse working in a hospital (d) students cleaning their school on a shramdaan day (e) a potter selling pots at a fair (f) a girl helping her mother water plants.","m":3,"imp":true,"a":["Economic: (a), (c), (e). Non-economic: (b), (d), (f)."],"k":"All six correct; reason: payment or not.","cm":"Putting (d) as economic because it is ‘work’."},{"q":"How does work give us more than money?","m":3,"imp":false,"a":["Work gives dignity and self-respect.","It lets us use our skills and contribute to society.","It creates connections with others and a sense of purpose; all work — from farming to teaching to cleaning — deserves respect."],"k":"Dignity + skills/contribution + purpose/respect.","cm":"Answering only ‘we get salary’."}],"prac":[{"lv":"Level 1: Basic","q":"What is an economic activity?","a":"An activity done to earn money or payment in kind."},{"lv":"Level 1: Basic","q":"Is cooking for your family economic or non-economic?","a":"Non-economic."},{"lv":"Level 1: Basic","q":"What is payment in kind?","a":"Payment in goods instead of money."},{"lv":"Level 1: Basic","q":"What does seva mean?","a":"Selfless service."},{"lv":"Level 2: Exam Standard","q":"Give two examples each of economic and non-economic activities.","a":"Economic: teacher in school, shopkeeper selling. Non-economic: helping a neighbour, volunteering in relief work."},{"lv":"Level 2: Exam Standard","q":"Why is a doctor at a free medical camp doing non-economic work?","a":"She is not paid; she does it to serve people."},{"lv":"Level 2: Exam Standard","q":"What is shramdaan?","a":"Voluntary physical work done for the community, e.g. cleaning a pond."},{"lv":"Level 2: Exam Standard","q":"Name one way non-economic work helps a family.","a":"Care for children and elders / cooking / keeping the home clean."},{"lv":"Level 3: Competency / Application","q":"Your aunt stitches clothes for customers and also for her own children. Classify both and explain.","a":"For customers — economic (paid). For her children — non-economic (done out of love, unpaid)."},{"lv":"Level 3: Competency / Application","q":"If a family had to pay someone for cooking, cleaning and childcare, what would this show about home work?","a":"Home work has a large economic value even though it is unpaid; it deserves recognition and sharing."},{"lv":"Level 3: Competency / Application","q":"A boy sells lemonade on his street on Sunday. Is this economic? Why?","a":"Yes — he sells it to earn money."},{"lv":"Level 4: Challenge","q":"Why do you think household work is often not counted as ‘work’? Is this fair?","a":"Because it is unpaid and not sold in the market. It is not fair — it takes time and effort and keeps families going; it should be valued and shared by all members."},{"lv":"Level 4: Challenge","q":"Suggest two ways your school can encourage respect for all kinds of work.","a":"Invite workers (gardeners, cleaners, farmers) to share their work; hold a shramdaan day where everyone does cleaning; thank support staff publicly."}],"comp":[{"q":"Ravi’s father is a bus driver. On Sundays he drives elderly neighbours to the temple for free. Classify both activities.","a":"Driving the bus — economic (salary). Sunday drives — non-economic (free service)."},{"q":"Make a table of 3 economic and 3 non-economic activities done by members of your family this week.","a":"Economic: e.g. father’s office work, mother’s tuition classes, uncle’s shop. Noneconomic: grandmother’s cooking, helping sister with homework, watering plants. (Any correct examples.)"},{"q":"Why do many people volunteer during floods even though they are not paid?","a":"Out of care, compassion and duty to help others in trouble — the value of such work is in saving lives and building community."}],"case":[{"t":"Two kinds of cooking","p":"Meena works as a cook in a school canteen and earns a monthly salary. After returning home, she cooks dinner for her family. On festival days, she volunteers at the community kitchen of her neighbourhood.","q":["(i) Which of Meena’s activities is economic?","(ii) Why is cooking at home non-economic?","(iii) Volunteering at the community kitchen is an example of: (a) payment in kind (b) seva (c) business (d) tax","(iv) What does this case show about activities?"],"a":["(i) Cooking in the school canteen (she is paid a salary).","(ii) It is done out of love and care for her family, without payment.","(iii) (b) Seva.","(iv) The same activity (cooking) can be economic or non-economic depending on payment and purpose."]}],"conc":[{"c":"Economic activity","e":"Done for money or goods.","x":"Carpenter making a table for a customer.","cf":"It depends on payment, not on the kind of task.","t":"Money (or goods) = Economic"},{"c":"Non-economic activity","e":"Done for love, care, duty, service.","x":"Grandmother knitting a sweater for you.","cf":"Unpaid ≠ unimportant.","t":"Heart = Non-economic"},{"c":"Payment in kind","e":"Paid in goods, not cash.","x":"Grain as wages.","cf":"Not about being kind.","t":"Kind = goods"},{"c":"Monetary value","e":"Value measured in money.","x":"Salary of Rs. 20,000 = monetary value of a job.","cf":"Non-economic work has value but not usually measured in money.","t":""}],"notes":[{"h":"Economic activities","t":"Done for money or payment in kind: a farmer selling crops, a teacher teaching for salary, a shopkeeper selling goods."},{"h":"Non-economic activities","t":"Done out of love, care, duty or service, without payment: cooking for family, helping a neighbour, volunteering, playing."},{"h":"Payment in kind","t":"Being paid in goods instead of money (e.g. grain as wages to farm workers)."},{"h":"Same work, different type","t":"A doctor in a hospital (paid) = economic; the same doctor treating people free in a camp = non-economic. It depends on payment, not on the task."},{"h":"Value of all work","t":"Unpaid care work at home (often by women) is valuable. Every honest job deserves dignity — dignity of labour."}]},{"n":14,"t":"Economic Activities Around Us","intro":"Three sectors, many examples, and how they depend on each other. Draw one ’farm-to-shop’ flowchart and you can answer almost anything.","prio":[{"t":"Primary sector: uses natural resources directly — farming, fishing, mining, forestry, animal rearing","s":3},{"t":"Secondary sector: turns raw materials into products — manufacturing, processing, construction","s":3},{"t":"Tertiary sector: provides services — transport, trade, banking, teaching, health, communication","s":3},{"t":"Interdependence of sectors: e.g. cotton → cloth → shop","s":3},{"t":"Classifying activities into sectors","s":3},{"t":"Other names: agriculture/industry/services","s":2}],"traps":[{"m":"Mining in secondary","c":"Mining = primary","t":"Mine = Mother nature"},{"m":"Construction in tertiary","c":"Construction = secondary","t":"Build = make a product"},{"m":"Making and selling in same sector","c":"Making = secondary; selling = tertiary","t":"Make vs Market"},{"m":"One-way interdependence","c":"Show both directions","t":"Arrows both ways"},{"m":"Unlabelled flowchart","c":"Label each box with its sector","t":"P-S-T labels"},{"m":"Dairy farming in secondary","c":"Dairy/poultry = primary; paneer making = secondary","t":"Animal = primary"}],"rq":[{"q":"Why is transport called the backbone of the tertiary sector?","a":"It moves raw materials and goods between farms, factories and markets."},{"q":"Why does the secondary sector need the tertiary sector?","a":"For transport, banking, storage, advertising and selling its products."},{"q":"Why does the primary sector depend on nature?","a":"Crops, fish and forests depend on rain, soil, climate and natural resources."}],"mock":[],"qs":[{"id":"sst14p0","k":"mcq","q":"Mining belongs to the:","o":["primary sector","secondary sector","tertiary sector","none"],"a":0,"e":"Directly from nature.","imp":true},{"id":"sst14p1","k":"mcq","q":"Making sugar from sugarcane is:","o":["primary","secondary","tertiary","non-economic"],"a":1,"e":"Processing.","imp":true},{"id":"sst14p2","k":"mcq","q":"Teaching is a ____ activity.","o":["primary","secondary","tertiary","non-economic always"],"a":2,"e":"A service.","imp":true},{"id":"sst14p3","k":"mcq","q":"Construction of buildings is:","o":["primary","secondary","tertiary","none"],"a":1,"e":"Makes a new product.","imp":true},{"id":"sst14p4","k":"mcq","q":"Transport belongs to the:","o":["primary","secondary","tertiary","none"],"a":2,"e":"Service.","imp":false},{"id":"sst14p5","k":"mcq","q":"The service sector is another name for the:","o":["primary","secondary","tertiary","industrial"],"a":2,"e":"Tertiary.","imp":false},{"id":"sst14p6","k":"mcq","q":"Which is a primary activity?","o":["baking bread","poultry farming","banking","weaving"],"a":1,"e":"Animal rearing.","imp":false},{"id":"sst14p7","k":"mcq","q":"A doctor’s work is:","o":["primary","secondary","tertiary","none"],"a":2,"e":"Health service.","imp":false},{"id":"sst14p8","k":"mcq","q":"Interdependence means the sectors:","o":["work alone","depend on each other","compete only","are the same"],"a":1,"e":"Need each other.","imp":true},{"id":"sst14p9","k":"mcq","q":"Flour milling is:","o":["primary","secondary","tertiary","none"],"a":1,"e":"Processing wheat.","imp":false},{"id":"sst14t0","k":"tf","q":"Fishing is a secondary activity.","a":1,"e":"Primary."},{"id":"sst14t1","k":"tf","q":"A bakery is a secondary activity.","a":0,"e":""},{"id":"sst14t2","k":"tf","q":"Banks belong to the tertiary sector.","a":0,"e":""},{"id":"sst14t3","k":"tf","q":"Construction is a primary activity.","a":1,"e":"Secondary."},{"id":"sst14t4","k":"tf","q":"The three sectors work independently.","a":1,"e":"They are interdependent."},{"id":"sst14t5","k":"tf","q":"Selling vegetables in a market is tertiary.","a":0,"e":""},{"id":"sst14a0","k":"ar","A":"Mining is a primary activity.","R":"It takes resources directly from nature.","a":0,"e":"R explains A."},{"id":"sst14a1","k":"ar","A":"A bakery belongs to the tertiary sector.","R":"It turns flour into bread.","a":3,"e":"A false — it is secondary; R true."},{"id":"sst14a2","k":"ar","A":"Farmers depend on the tertiary sector.","R":"They need transport and banks.","a":0,"e":"R explains A."},{"id":"sst14x0","k":"mcq","q":"Farming, fishing and mining belong to the:","o":["primary sector","secondary sector","tertiary sector","service sector"],"a":0,"e":"Use natural resources directly.","sh":1,"x":1},{"id":"sst14x1","k":"mcq","q":"Making cloth from cotton belongs to the:","o":["secondary sector","primary sector","tertiary sector","no sector"],"a":0,"e":"Manufacturing.","sh":1,"x":1},{"id":"sst14x2","k":"mcq","q":"Banking, teaching and transport belong to the:","o":["tertiary sector","primary sector","secondary sector","mining"],"a":0,"e":"Services.","sh":1,"x":1},{"id":"sst14x3","k":"mcq","q":"Making sugar from sugarcane is:","o":["secondary activity","primary activity","tertiary activity","non-economic"],"a":0,"e":"Processing.","sh":1,"x":1},{"id":"sst14x4","k":"mcq","q":"A truck carrying vegetables to market is part of the:","o":["tertiary sector","primary sector","secondary sector","none"],"a":0,"e":"Transport is a service.","sh":1,"x":1},{"id":"sst14x5","k":"mcq","q":"The three sectors are:","o":["interdependent","completely separate","the same","unrelated"],"a":0,"e":"Each needs the others.","sh":1,"x":1},{"id":"sst14x6","k":"mcq","q":"Growing cotton is ___ and stitching shirts is ___.","o":["primary; secondary","secondary; primary","tertiary; primary","primary; tertiary"],"a":0,"e":"Farm to factory.","sh":1,"x":1},{"id":"sst14x7","k":"mcq","q":"The tertiary sector is also called the:","o":["service sector","industrial sector","agriculture sector","mining sector"],"a":0,"e":"Gives services.","sh":1,"x":1},{"id":"sst14x8","k":"mcq","q":"A baker making bread works in the:","o":["secondary sector","primary sector","tertiary sector","no sector"],"a":0,"e":"Turns flour into bread.","sh":1,"x":1},{"id":"sst14x9","k":"mcq","q":"Which is a primary activity?","o":["Dairy farming","Running a shop","Making furniture","Teaching"],"a":0,"e":"Directly from nature.","sh":1,"x":1},{"id":"sst14x10","k":"mcq","q":"A shopkeeper selling clothes is in the:","o":["tertiary sector","primary sector","secondary sector","mining"],"a":0,"e":"Trade is a service.","sh":1,"x":1},{"id":"sst14y0","k":"tf","q":"Factories depend on farms for raw materials.","a":0,"e":"","x":1},{"id":"sst14y1","k":"tf","q":"Teaching belongs to the primary sector.","a":1,"e":"It is a service — tertiary sector.","x":1},{"id":"sst14y2","k":"tf","q":"Mining is a primary activity.","a":0,"e":"","x":1},{"id":"sst14m0","k":"mcq","q":"Making furniture from wood is:","o":["secondary","primary","tertiary","non-economic"],"a":0,"e":"Manufacturing.","sh":1,"x":1},{"id":"sst14m1","k":"mcq","q":"A bank clerk works in the:","o":["tertiary sector","primary sector","secondary sector","mining"],"a":0,"e":"Service.","sh":1,"x":1},{"id":"sst14m2","k":"mcq","q":"Cutting trees in a forest for timber is:","o":["primary","secondary","tertiary","none"],"a":0,"e":"Direct from nature.","sh":1,"x":1},{"id":"sst14m3","k":"mcq","q":"Which shows interdependence?","o":["Farmer → flour mill → shop","Only a farmer","Only a shop","A single factory"],"a":0,"e":"Chain of sectors.","sh":1,"x":1},{"id":"sst14f0","k":"mcq","fill":1,"q":"Fishing belongs to the ___ sector.","o":["primary","secondary","tertiary","service"],"a":0,"e":"","sh":1,"x":1},{"id":"sst14f1","k":"mcq","fill":1,"q":"Construction of buildings is a ___ activity.","o":["secondary","primary","tertiary","non-economic"],"a":0,"e":"","sh":1,"x":1},{"id":"sst14f2","k":"mcq","fill":1,"q":"Transport and banking belong to the ___ sector.","o":["tertiary","primary","secondary","mining"],"a":0,"e":"","sh":1,"x":1},{"id":"sst14c01","k":"mcq","q":"Which step is secondary?","o":["Picking cotton","Weaving cloth","Truck transport","UPI payment"],"a":1,"e":"(b) Weaving cloth (also stitching)."}],"top":[{"q":"What are the three sectors of economic activities? Explain each with examples.","m":5,"imp":true,"a":["Primary sector: activities that directly use natural resources — farming, fishing, mining, forestry, animal rearing (dairy, poultry). Also called the agriculture and allied sector.","Secondary sector: activities that change raw materials into finished goods — making cloth from cotton, sugar from sugarcane, furniture from wood, steel from iron ore; also construction. Also called the industrial sector.","Tertiary sector: activities that provide services — transport, trade/shops, banking, teaching, health care, communication, tourism. Also called the service sector."],"k":"All three with definitions + two examples each.","cm":"Putting mining in the secondary sector."},{"q":"Why is the primary sector called ‘primary’?","m":2,"imp":true,"a":["Because it is the first step of all production: it provides the basic raw materials and food (crops, fish, minerals, timber) on which the secondary and tertiary sectors depend."],"k":"First step + raw materials for other sectors.","cm":"Saying it is the ‘most important’ only."},{"q":"Explain the interdependence of the three sectors with an example.","m":3,"imp":true,"a":["Cotton example: a farmer grows cotton (primary) → a mill spins and weaves it into cloth, a factory stitches shirts (secondary) → trucks transport them, a shop sells them, a bank gives loans, ads promote them (tertiary).","The farmer needs seeds, tools, fertiliser (secondary) and transport, market, bank loans (tertiary).","So no sector can work alone — each needs the others."],"k":"Complete chain + two-way dependence.","cm":"Showing only a one-way chain."},{"q":"Classify into sectors: fishing, bakery, teaching, coal mining, a bus conductor, making furniture, a bank clerk, dairy farming, building a house.","m":3,"imp":true,"a":["Primary: fishing, coal mining, dairy farming. Secondary: bakery, making furniture, building a house. Tertiary: teaching, bus conductor, bank clerk."],"k":"All nine correct.","cm":"Construction in tertiary; dairy in secondary."},{"q":"Trace the journey of wheat from the farm to your plate, naming the sector at each step.","m":3,"imp":true,"a":["Farmer grows wheat (primary) → transported to a mandi, sold by traders (tertiary) → flour mill grinds it into atta, a bakery makes bread (secondary) → transported and sold in shops (tertiary) → reaches our home."],"k":"Correct order + sector for each step.","cm":"Labelling the flour mill as tertiary."},{"q":"Differentiate between the primary and secondary sectors.","m":3,"imp":false,"a":["Primary: uses natural resources directly; produces raw materials; e.g. farming, mining; depends heavily on nature (rain, soil).","Secondary: processes raw materials into finished goods; e.g. sugar mill, car factory; depends on machines, power and raw materials."],"k":"Three matching points.","cm":"No examples."},{"q":"Why has the tertiary sector grown in recent years?","m":3,"imp":false,"a":["As more goods are produced, more transport, storage, trade and banking are needed.","Growth of education, health, tourism, and IT/mobile/internet services.","People’s incomes rise and they spend more on services (restaurants, travel, entertainment)."],"k":"Three reasons.","cm":"Only ‘because of computers’."},{"q":"Give examples of economic activities in your locality for each sector.","m":3,"imp":false,"a":["Primary: vegetable farming on the outskirts, a dairy, fishing in a pond.","Secondary: a bakery, a furniture workshop, a tailoring unit, a brick kiln.","Tertiary: shops, schools, a hospital, auto-rickshaw drivers, a bank, a mobile repair shop."],"k":"At least two correct examples per sector.","cm":"Mixing a mobile-repair shop into secondary."},{"q":"Why do many people in India still work in the primary sector?","m":2,"imp":false,"a":["Most people live in villages where farming, animal rearing and fishing are the main work available; skills are passed down in families, and there are fewer factories or offices nearby."],"k":"Villages + available work + fewer other jobs.","cm":"Saying primary work is easy."}],"prac":[{"lv":"Level 1: Basic","q":"To which sector does fishing belong?","a":"Primary."},{"lv":"Level 1: Basic","q":"Name one secondary activity.","a":"Making cloth/bread/furniture; construction (any one)."},{"lv":"Level 1: Basic","q":"To which sector does a bank belong?","a":"Tertiary."},{"lv":"Level 1: Basic","q":"What is the tertiary sector also called?","a":"Service sector."},{"lv":"Level 2: Exam Standard","q":"Why is construction secondary?","a":"It uses materials like cement, steel and bricks to make a new product (building)."},{"lv":"Level 2: Exam Standard","q":"Give two examples of tertiary activities.","a":"Teaching, transport, banking, health care, shopkeeping (any two)."},{"lv":"Level 2: Exam Standard","q":"How does the secondary sector depend on the primary sector?","a":"It gets raw materials (cotton, sugarcane, iron ore) from the primary sector."},{"lv":"Level 2: Exam Standard","q":"How does a farmer depend on the tertiary sector?","a":"Transport to take crops to market, banks for loans, shops for seeds/tools."},{"lv":"Level 3: Competency / Application","q":"A truck strike stops all transport for a week. How will the three sectors be affected?","a":"Primary: crops/milk rot, farmers can’t sell. Secondary: factories lack raw materials, goods pil let Q=null,timerId=null;
function prepare(q){q=Object.assign({},q);if(q.k==="mcq"){let idx=q.o.map((_,i)=>i);if(q.sh)idx=shuffle(idx);q.oo=idx.map(i=>q.o[i]);q.ca=idx.indexOf(q.a)}else if(q.k==="tf"){q.oo=["True","False"];q.ca=q.a}else{q.oo=AR_OPTS;q.ca=q.a}return q}
  // --- FOCUS TIMER LOGIC ---
let focusInterval;
function startFocusTimer() {
  stopFocusTimer();
  let timeLeft = 15 * 60; // 15 minutes
  const timerEl = document.getElementById('focus-timer');
  if(!timerEl) return;
  timerEl.style.display = 'block';

  focusInterval = setInterval(() => {
    if(!Q) { stopFocusTimer(); return; }
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    timerEl.innerHTML = `⏱️ ${m}:${s.toString().padStart(2, '0')}`;
    
    if (timeLeft <= 0) {
      stopFocusTimer();
      timerEl.innerHTML = `⏱️ Time's up!`;
      // Auto-submit the quiz
      finishQuiz();
    }
  }, 1000);
}

function stopFocusTimer() {
  clearInterval(focusInterval);
  const timerEl = document.getElementById('focus-timer');
  if(timerEl) timerEl.style.display = 'none';

function confetti(){const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#5b4bdb","#f5a524","#12a150","#e0384b","#c084fc","#06b6d4"];
 const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:pick(cols),vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6,va:-.2+Math.random()*.4}));
 let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++f<200)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

function sshuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

 if(done){go("dtresult",{d:t});return}
 el.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><div><h2>🏅 Daily Chapter Test</h2><div class="sub">${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}</div></div></div>
 <div class="card"><b>Today’s chapters</b><div class="grid mt">${plan.map(p=>{const s=subj(p.sid),ch=s.chapters.find(c=>c.n===p.cn);return `<div class="subres" style="border-left:6px solid ${s.color}"><span style="font-size:28px">${s.icon}</span><div style="flex:1"><b>${s.name}</b><div class="small">Chapter ${ch.n}: ${esc(ch.t)}</div></div><span class="pill">${p.ids.length} Qs</span></div>`}).join("")}</div></div>
 <div class="card mt"><b>Rules</b><ul style="margin:8px 0 0;padding-left:20px;line-height:1.7">
  <li>${plan.reduce((a,p)=>a+p.ids.length,0)} questions — no answers or hints are shown during the test.</li>
  <li>You can go back and change answers before you submit.</li>
  <li>You get <b>one attempt per day</b>. At the end you’ll see how many you got right and your badge.</li></ul>
  <div class="shelf mt">${BADGES.map(b=>`<div class="b"><span>${b.e}</span><div style="font-weight:800;font-size:14px">${b.n}</div><div class="small">${b.min?b.min+"%+":"keep trying"}</div></div>`).join("")}</div>
  <button class="btn block mt2" onclick="startDT()">I’m ready — start the test</button></div>`}
function startDT(){const t=today(),plan=dtPlan(t);const l=[];plan.forEach(p=>p.ids.forEach(id=>QMAP[id]&&l.push(QMAP[id])));
 startQuiz(l,{title:"🏅 Daily Chapter Test",exam:true,back:{v:"home"}});Q.dt=t}
function finishDT(){const t=Q.dt;const per={};let c=0;
 Q.list.forEach((q,i)=>{const ok=Q.ans[i]===q.ca;record(q,ok);if(ok)c++;per[q.sid]=per[q.sid]||[0,0];per[q.sid][1]++;if(ok)per[q.sid][0]++});
 const n=Q.list.length,p=Math.round(c*100/n),att=Q.ans.filter(a=>a!==undefined).length;
 S.dt=S.dt||{};S.dt[t]={c,n,p,att,per,chs:dtPlan(t).map(x=>[x.sid,x.cn])};S.xp+=c*2+(p>=95?20:p>=80?10:5);save();Q=null;go("dtresult",{d:t,fresh:1});if(p>=80)confetti()}
function vDTResult(el){const r=(S.dt||{})[route.d];if(!r){go("dtest");return}const b=badgeFor(r.p);
 const nextB=BADGES.slice().reverse().find(x=>x.min>r.p);
 el.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><div><h2>🏅 Daily Test result</h2><div class="sub">${route.d}</div></div></div>
 <div class="card res"><div class="bigbadge">${b.e}</div><div class="msg" style="color:${b.c}">${b.n}!</div>
  <div style="font-size:22px;font-weight:900;margin-top:4px">${r.c} / ${r.n} correct</div><div class="small">Score ${r.p}% · attempted ${r.att} of ${r.n}</div>
  ${nextB?`<div class="note mt" style="text-align:left">🎯 ${Math.ceil(nextB.min*r.n/100)-r.c} more correct answer${Math.ceil(nextB.min*r.n/100)-r.c>1?"s":""} would have earned <b>${nextB.e} ${nextB.n}</b>. Practise today’s chapters and try again tomorrow!</div>`:`<div class="note mt">🌟 Top badge! ${NAME}, you are exam-ready on these chapters.</div>`}</div>
 <div class="sec"><h3>By subject</h3><span>answers stay hidden</span></div>
 <div class="grid">${DATA.subjects.map(s=>{const v=r.per[s.id];if(!v)return"";const ch=r.chs.find(x=>x[0]===s.id);const sp=Math.round(v[0]*100/v[1]);return `<div class="subres" style="border-left:6px solid ${s.color}"><span style="font-size:28px">${s.icon}</span><div style="flex:1"><b>${s.name}</b> <span class="small">Ch ${ch[1]}</span><div class="bar" style="--c:${s.color}"><i style="width:${sp}%"></i></div></div><div style="text-align:right"><b style="font-size:20px">${v[0]}/${v[1]}</b><div style="font-size:22px">${v[0]===v[1]?"⭐":""}</div></div></div>`}).join("")}</div>
 <div class="grid g2 mt2">${r.chs.map(([sid,cn])=>{const s=subj(sid);return `<button class="btn alt" onclick="startChapter('${sid}',${cn},'smart')">Practise ${s.icon} Ch ${cn}</button>`}).join("")}<button class="btn" onclick="go('home')">Done</button></div>
 <div class="sec"><h3>My badges</h3></div>${badgeShelf()}`}
function badgeShelf(){const dt=S.dt||{};const cnt={};BADGES.forEach(b=>cnt[b.e]=0);Object.values(dt).forEach(r=>cnt[badgeFor(r.p).e]++);
 const days=[];const d=new Date();for(let i=13;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const k=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");days.push([x,k])}
 return `<div class="shelf">${BADGES.map(b=>`<div class="b"><span>${b.e}</span><b>${cnt[b.e]}</b><div class="small">${b.n}</div></div>`).join("")}</div>
 <div class="card mt"><b>Last 14 days</b><div class="cal">${days.map(([x,k])=>`<div ${dt[k]?`onclick="go('dtresult',{d:'${k}'})" style="cursor:pointer;background:#fff;box-shadow:var(--shadow)"`:""}><span>${dt[k]?badgeFor(dt[k].p).e:(k===today()?"⏳":"·")}</span>${x.getDate()} ${x.toLocaleDateString("en-IN",{month:"short"})}</div>`).join("")}</div></div>`}

render();
</script>
