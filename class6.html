,"q":"We can measure from the 1 cm mark if zero is broken.","a":0,"e":""},{"id":"sci5t5","k":"tf","q":"A falling stone shows oscillatory motion.","a":1,"e":"Linear."},{"id":"sci5a0","k":"ar","A":"A cubit is not a reliable unit.","R":"Arm lengths differ between people.","a":0,"e":"R explains A."},{"id":"sci5a1","k":"ar","A":"A pendulum shows linear motion.","R":"It moves to and fro.","a":3,"e":"A false; R true."},{"id":"sci5a2","k":"ar","A":"3 km = 3000 m.","R":"1 km = 1000 m.","a":0,"e":"R explains A."},{"id":"sci5x0","k":"mcq","q":"SI unit of length is:","o":["metre","centimetre","kilometre","foot"],"a":0,"e":"Standard unit.","sh":1,"x":1},{"id":"sci5x1","k":"mcq","q":"1 km =","o":["1000 m","100 m","10 m","10,000 m"],"a":0,"e":"Kilo = 1000.","sh":1,"x":1},{"id":"sci5x2","k":"mcq","q":"1 m =","o":["100 cm","10 cm","1000 cm","1 cm"],"a":0,"e":"Centi = one hundredth.","sh":1,"x":1},{"id":"sci5x3","k":"mcq","q":"1 cm =","o":["10 mm","100 mm","1 mm","1000 mm"],"a":0,"e":"Milli = one thousandth of a metre.","sh":1,"x":1},{"id":"sci5x4","k":"mcq","q":"Hand span and cubit are not reliable because:","o":["they differ from person to person","they are too long","they are new units","they are SI units"],"a":0,"e":"Need standard units.","sh":1,"x":1},{"id":"sci5x5","k":"mcq","q":"While measuring, the eye should be:","o":["vertically above the mark","to the left","to the right","closed"],"a":0,"e":"Avoid parallax error.","sh":1,"x":1},{"id":"sci5x6","k":"mcq","q":"A curved line can be measured using a:","o":["thread and a scale","scale only","compass","protractor"],"a":0,"e":"Lay thread along the curve, then measure the thread.","sh":1,"x":1},{"id":"sci5x7","k":"mcq","q":"Motion of a car on a straight road is:","o":["linear motion","circular motion","periodic motion","no motion"],"a":0,"e":"Along a straight line.","sh":1,"x":1},{"id":"sci5x8","k":"mcq","q":"Motion of a pendulum is:","o":["periodic (oscillatory)","linear","circular only","random"],"a":0,"e":"Repeats after equal intervals.","sh":1,"x":1},{"id":"sci5x9","k":"mcq","q":"Motion of a merry-go-round is:","o":["circular","linear","no motion","zig-zag only"],"a":0,"e":"Moves in a circle.","sh":1,"x":1},{"id":"sci5x10","k":"mcq","q":"25 cm in metres:","o":["0.25 m","2.5 m","25 m","0.025 m"],"a":0,"e":"Divide by 100.","sh":1,"x":1},{"id":"sci5x11","k":"mcq","q":"A broken scale starting at 2 cm reads 9.5 cm at the end of an object. Length:","o":["7.5 cm","9.5 cm","11.5 cm","2 cm"],"a":0,"e":"Subtract the start mark: 9.5 − 2.","sh":1,"x":1},{"id":"sci5y0","k":"tf","q":"An object is in motion when its position changes with time.","a":0,"e":"","x":1},{"id":"sci5y1","k":"tf","q":"The Earth’s movement around the Sun is an example of periodic motion.","a":0,"e":"","x":1},{"id":"sci5y2","k":"tf","q":"We should start measuring from the broken end of a scale.","a":1,"e":"Start from a clear full mark and subtract.","x":1},{"id":"sci5m0","k":"mcq","q":"1.5 km =","o":["1500 m","150 m","15 m","15,000 m"],"a":0,"e":"× 1000.","sh":1,"x":1},{"id":"sci5m1","k":"mcq","q":"350 cm =","o":["3.5 m","35 m","0.35 m","3500 m"],"a":0,"e":"÷ 100.","sh":1,"x":1},{"id":"sci5m2","k":"mcq","q":"A swing moving to and fro shows:","o":["oscillatory motion","linear motion","circular motion","no motion"],"a":0,"e":"To-and-fro motion.","sh":1,"x":1},{"id":"sci5m3","k":"mcq","q":"Error from looking at a scale at an angle is:","o":["parallax error","zero error","unit error","time error"],"a":0,"e":"Keep eye vertically above.","sh":1,"x":1},{"id":"sci5m4","k":"mcq","q":"A fixed object used to judge motion is a:","o":["reference point","unit","scale","standard"],"a":0,"e":"e.g. a tree by the road.","sh":1,"x":1},{"id":"sci5f0","k":"mcq","fill":1,"q":"The SI unit of length is the ___.","o":["metre","centimetre","kilometre","foot"],"a":0,"e":"","sh":1,"x":1},{"id":"sci5f1","k":"mcq","fill":1,"q":"1 cm = ___ mm.","o":["10","100","1000","1"],"a":0,"e":"","sh":1,"x":1},{"id":"sci5f2","k":"mcq","fill":1,"q":"The motion of a ball rolling on a straight floor is ___ motion.","o":["linear","circular","periodic","oscillatory"],"a":0,"e":"","sh":1,"x":1},{"id":"sci5c02","k":"mcq","q":"School sports day: In the long jump, Neha jumped 3 m 45 cm and Riya 3.5 m. In the 400 m race, runners run one round of the track. The swings in the park were in constant use. — Type of motion of a swing?","o":["linear","circular","oscillatory","random"],"a":2,"e":"(c) oscillatory."}],"top":[{"q":"Why do we need standard units of measurement?","m":2,"imp":true,"a":["Body parts like handspan, cubit and footstep differ from person to person, so measurements using them give different results. A standard unit (like the metre) is the same everywhere, so everyone gets the same measurement."],"k":"Body units vary + standard is uniform.","cm":"Saying ‘because rulers are cheaper’."},{"q":"Convert: (a) 3.5 km to m (b) 245 cm to m (c) 7.8 cm to mm (d) 4 m 25 cm to cm.","m":4,"imp":true,"a":["(a) 3.5 × 1000 = 3500 m.","(b) 245 ÷ 100 = 2.45 m.","(c) 7.8 × 10 = 78 mm.","(d) 4 × 100 + 25 = 425 cm. Final answer: 3500 m; 2.45 m; 78 mm; 425 cm"],"k":"1 each with working.","cm":"Multiplying when converting to a bigger unit."},{"q":"What precautions should be taken while measuring length with a scale?","m":3,"imp":true,"a":["Place the scale along (in contact with) the object, straight.","Keep your eye directly above the point being read (not at an angle).","If the zero mark is broken, start from another full mark (e.g. 1 cm) and subtract it from the reading."],"k":"Three precautions.","cm":"Reading from a slant."},{"q":"A pencil is measured with a broken scale. One end is at 1.0 cm and the other at 12.6 cm. Find its length.","m":2,"imp":true,"a":["Length = final reading − initial reading.","12.6 − 1.0 = 11.6 cm. Final answer: 11.6 cm"],"k":"Subtraction (1) + answer with unit (1).","cm":"Writing 12.6 cm."},{"q":"How can you measure the length of a curved line?","m":2,"imp":true,"a":["Place a thread carefully along the curved line, making small marks; mark the thread at both ends, then straighten the thread and measure it with a scale."],"k":"Thread along curve + measure straightened thread.","cm":"Measuring the curve directly with a straight scale."},{"q":"What is motion? Explain rest and motion with a reference point.","m":3,"imp":true,"a":["An object is in motion if its position changes with time with respect to a reference point; it is at rest if its position does not change.","Example: a passenger sitting in a moving bus is at rest with respect to the bus but in motion with respect to a tree outside.","So rest and motion are relative — they depend on the reference point."],"k":"Definitions + example + relative.","cm":"Not naming the reference point."},{"q":"Name the types of motion with two examples each.","m":3,"imp":true,"a":["Linear (rectilinear): along a straight line — a car on a straight road, a falling stone, marchpast.","Circular: along a circle, distance from a centre stays the same — tip of a fan blade, a stone whirled on a string.","Oscillatory (periodic): to-and-fro about a fixed point, repeating — pendulum, swing."],"k":"Three types with examples (1 each).","cm":"Calling a swing circular motion."},{"q":"What is the SI unit of length? Give the full form of SI.","m":1,"imp":true,"a":["Metre (m). SI = International System of Units (Système International)."],"k":"Both parts.","cm":"Writing cm."},{"q":"Riya’s handspan is 18 cm and she measures a table as 7 handspans. Aman’s handspan is 20 cm. How many handspans will Aman measure? What does this show?","m":3,"imp":false,"a":["Table length = 7 × 18 = 126 cm.","Aman’s handspans = 126 ÷ 20 = 6.3.","Different people get different counts — body units are not reliable. Final answer: 6.3 handspans"],"k":"Length (1) + division (1) + conclusion (1).","cm":"Answering 7."},{"q":"Classify the motion: wheel of a moving bicycle (at its rim), a child on a swing, a train on a straight track, hands of a clock.","m":2,"imp":false,"a":["Rim of wheel — circular (while the bicycle as a whole moves linearly); swing — oscillatory; train on straight track — linear; clock hands — circular (and periodic)."],"k":"½ each.","cm":"Swing as linear."}],"prac":[{"lv":"Level 1: Basic","q":"SI unit of length?","a":"Metre."},{"lv":"Level 1: Basic","q":"1 m = ? cm","a":"100 cm."},{"lv":"Level 1: Basic","q":"Motion of a pendulum?","a":"Oscillatory."},{"lv":"Level 1: Basic","q":"Motion of a falling apple?","a":"Linear."},{"lv":"Level 2: Exam Standard","q":"Convert 6.4 km to m.","a":"6400 m."},{"lv":"Level 2: Exam Standard","q":"Convert 85 mm to cm.","a":"8.5 cm."},{"lv":"Level 2: Exam Standard","q":"A rod reads from 3.0 cm to 17.4 cm. Length?","a":"14.4 cm."},{"lv":"Level 2: Exam Standard","q":"Give one example of periodic motion.","a":"Pendulum/Earth’s revolution/heartbeat."},{"lv":"Level 3: Competency / Application","q":"A running track is 400 m around. How many rounds make 2 km?","a":"2000 ÷ 400 = 5 rounds."},{"lv":"Level 3: Competency / Application","q":"A girl walks 750 m to school and back each day. How many km in 6 days?","a":"1500 × 6 = 9000 m = 9 km."},{"lv":"Level 3: Competency / Application","q":"Is the driver of a moving car at rest or in motion? Explain.","a":"At rest relative to the car; in motion relative to the road."},{"lv":"Level 4: Challenge","q":"Why is a swing’s motion called periodic as well as oscillatory?","a":"It moves to and fro and repeats after equal intervals of time."},{"lv":"Level 4: Challenge","q":"Arrange in increasing order: 1.2 m, 115 cm, 1250 mm, 0.0011 km.","a":"1.1 m (0.0011 km), 1.15 m, 1.2 m, 1.25 m → 0.0011 km, 115 cm, 1.2 m, 1250 mm."}],"comp":[{"q":"A tailor measures cloth with a metre tape but the tape’s first 2 cm are torn. She reads 87 cm at the other end. What is the real length?","a":"87 − 2 = 85 cm."},{"q":"Why can’t a shop sell cloth by ‘handspans’?","a":"Handspans differ; customers would get different amounts — unfair. A standard unit is needed."},{"q":"You sit in a train at a station and feel your train moving, but it is the other train. Explain.","a":"Motion is relative; with the other train as reference, you appear to move."}],"case":[{"t":"School sports day","p":"In the long jump, Neha jumped 3 m 45 cm and Riya 3.5 m. In the 400 m race, runners run one round of the track. The swings in the park were in constant use.","q":["(i) Who jumped farther and by how much?","(ii) Express 400 m in km.","(iii) Type of motion of a swing? (a) linear (b) circular (c) oscillatory (d) random","(iv) Runners on a straight part of the track show which motion?"],"a":["(i) Riya, by 350 − 345 = 5 cm.","(ii) 0.4 km.","(iii) (c) oscillatory.","(iv) Linear."]}],"conc":[{"c":"Measurement","e":"Comparison with a standard unit.","x":"Book = 25 cm.","cf":"Number + unit; never write only a number.","t":"Number + Unit"},{"c":"Reference point","e":"Fixed object used to judge motion.","x":"Tree by the road.","cf":"Depends on the reference.","t":""},{"c":"Oscillatory motion","e":"To-and-fro repeated.","x":"Pendulum.","cf":"Not circular.","t":""},{"c":"Periodic motion","e":"Repeats after equal time.","x":"Earth going round the Sun; pendulum.","cf":"Circular motion can also be periodic.","t":""}],"notes":[{"h":"Measurement","t":"Comparing an unknown quantity with a standard unit. Every measurement = number + unit (e.g. 25 cm)."},{"h":"Units of length","t":"SI unit: metre (m). 1 km = 1000 m · 1 m = 100 cm · 1 cm = 10 mm. Going to a smaller unit → multiply; to a bigger unit → divide."},{"h":"Old body units","t":"Hand span, cubit, foot, step — not reliable because they differ from person to person. That is why we need standard units."},{"h":"Measuring correctly","t":"Start from 0 (or a clear mark and subtract), keep the scale along the object, eye exactly above the mark (avoid parallax error). Curved lines: use a thread."},{"h":"Motion","t":"An object is in motion if its position changes with time compared to a reference point."},{"h":"Types of motion","t":"Linear/straight-line (car on a straight road, falling ball) · Circular (merry-go-round, blades of a fan) · Oscillatory/periodic (pendulum, swing) — repeats after equal intervals."}]},{"n":6,"t":"Materials Around Us","intro":"Objects, materials and their properties. Most questions ask you to classify materials by a property and explain why a material is chosen for a use.","prio":[{"t":"Object vs material; one object from many materials and one material for many objects","s":3},{"t":"Properties: appearance (lustre), hardness, solubility in water","s":3},{"t":"Transparent, translucent, opaque","s":3},{"t":"Float or sink in water","s":3},{"t":"Grouping materials by properties","s":3},{"t":"Choosing materials for a purpose","s":2}],"traps":[{"m":"Object vs material confusion","c":"Material = what it’s made of","t":"Made of = material"},{"m":"Translucent vs transparent","c":"Translucent = partly","t":"Lucent = little"},{"m":"Oil soluble","c":"Oil insoluble, floats","t":"Oil on top"},{"m":"Size decides floating","c":"Material decides","t":"Not big or small"}],"rq":[{"q":"Why are cooking utensils made of metals?","a":"Metals conduct heat well."},{"q":"Why is glass used for spectacles?","a":"It is transparent."}],"mock":[{"q":"Differentiate between object and material.","m":2,"a":"Object: thing with use; material: what it is made of."},{"q":"Classify as transparent, translucent or opaque: glass, oiled paper, wood.","m":3,"a":"Transparent; translucent; opaque."},{"q":"Name two soluble and two insoluble substances.","m":2,"a":"Sugar, salt; sand, chalk."},{"q":"Why are pans made of metal with plastic handles?","m":2,"a":"Metal conducts heat; plastic is a poor conductor."},{"q":"Name two materials that float on water.","m":2,"a":"Wood, oil."},{"q":"What is lustre? Give an example.","m":2,"a":"Natural shine; gold."},{"q":"Why is frosted glass used in bathroom windows?","m":2,"a":"Translucent: light + privacy."}],"qs":[{"id":"sci6p0","k":"mcq","q":"Butter paper is:","o":["transparent","translucent","opaque","lustrous"],"a":1,"e":"Partly lets light.","imp":true},{"id":"sci6p1","k":"mcq","q":"Which is soluble in water?","o":["sand","salt","chalk","oil"],"a":1,"e":"Dissolves.","imp":true},{"id":"sci6p2","k":"mcq","q":"Lustrous material:","o":["wood","copper","paper","cotton"],"a":1,"e":"Metals shine.","imp":true},{"id":"sci6p3","k":"mcq","q":"Which floats?","o":["stone","iron nail","wood","coin"],"a":2,"e":"Lighter than water.","imp":false},{"id":"sci6p4","k":"mcq","q":"Opaque material:","o":["glass","water","cardboard","air"],"a":2,"e":"Blocks light.","imp":false},{"id":"sci6p5","k":"mcq","q":"Pan handles are plastic because plastic:","o":["shines","is a poor conductor of heat","floats","is transparent"],"a":1,"e":"Stays cool.","imp":true},{"id":"sci6p6","k":"mcq","q":"Object made of many materials:","o":["bicycle","glass tumbler","iron nail","wooden spoon"],"a":0,"e":"Metal, rubber, plastic.","imp":false},{"id":"sci6p7","k":"mcq","q":"Hard material:","o":["sponge","cotton","stone","wool"],"a":2,"e":"Difficult to scratch.","imp":false},{"id":"sci6t0","k":"tf","q":"All metals are lustrous.","a":0,"e":"Freshly cut/cleaned."},{"id":"sci6t1","k":"tf","q":"Oil dissolves in water.","a":1,"e":"Insoluble; floats."},{"id":"sci6t2","k":"tf","q":"Frosted glass is transparent.","a":1,"e":"Translucent."},{"id":"sci6t3","k":"tf","q":"One object can be made of different materials.","a":0,"e":""},{"id":"sci6t4","k":"tf","q":"Wood sinks in water.","a":1,"e":"Usually floats."},{"id":"sci6a0","k":"ar","A":"Sugar disappears in water.","R":"Sugar is soluble.","a":0,"e":"R explains A."},{"id":"sci6a1","k":"ar","A":"We can see clearly through butter paper.","R":"Butter paper lets some light pass.","a":3,"e":"A false; R true."},{"id":"sci6x0","k":"mcq","q":"Materials that allow light to pass completely are:","o":["transparent","opaque","translucent","lustrous"],"a":0,"e":"e.g. clear glass.","sh":1,"x":1},{"id":"sci6x1","k":"mcq","q":"Butter paper allows some light to pass. It is:","o":["translucent","transparent","opaque","soluble"],"a":0,"e":"Partly lets light through.","sh":1,"x":1},{"id":"sci6x2","k":"mcq","q":"Wood is:","o":["opaque","transparent","translucent","lustrous"],"a":0,"e":"No light passes through.","sh":1,"x":1},{"id":"sci6x3","k":"mcq","q":"Shiny metals like gold are said to be:","o":["lustrous","dull","opaque only","soluble"],"a":0,"e":"Lustre = shine.","sh":1,"x":1},{"id":"sci6x4","k":"mcq","q":"Which dissolves in water?","o":["Sugar","Sand","Chalk powder","Sawdust"],"a":0,"e":"Soluble in water.","sh":1,"x":1},{"id":"sci6x5","k":"mcq","q":"Which floats on water?","o":["Cork","Stone","Iron nail","Coin"],"a":0,"e":"Lighter than water for its size.","sh":1,"x":1},{"id":"sci6x6","k":"mcq","q":"Which material is hard?","o":["Iron","Cotton","Sponge","Rubber"],"a":0,"e":"Cannot be easily scratched or compressed.","sh":1,"x":1},{"id":"sci6x7","k":"mcq","q":"Grouping materials helps us to:","o":["study their properties easily","make them heavier","change their colour","melt them"],"a":0,"e":"Classification makes study easy.","sh":1,"x":1},{"id":"sci6x8","k":"mcq","q":"Oil and water when mixed:","o":["do not mix","mix completely","turn into sugar","disappear"],"a":0,"e":"Oil forms a separate layer.","sh":1,"x":1},{"id":"sci6x9","k":"mcq","q":"Which is an object made from glass?","o":["Tumbler","Wooden chair","Cotton shirt","Leather belt"],"a":0,"e":"Same object can be made of many materials.","sh":1,"x":1},{"id":"sci6y0","k":"tf","q":"Objects and materials are the same thing.","a":1,"e":"A tumbler is an object; glass is the material.","x":1},{"id":"sci6y1","k":"tf","q":"Clear glass is transparent.","a":0,"e":"","x":1},{"id":"sci6y2","k":"tf","q":"Some objects float and some sink in water.","a":0,"e":"","x":1},{"id":"sci6m0","k":"mcq","q":"Frosted glass is:","o":["translucent","transparent","opaque","lustrous"],"a":0,"e":"Some light passes.","sh":1,"x":1},{"id":"sci6m1","k":"mcq","q":"Which is insoluble in water?","o":["Sand","Salt","Sugar","Lemon juice"],"a":0,"e":"It settles at the bottom.","sh":1,"x":1},{"id":"sci6m2","k":"mcq","q":"Metals are usually:","o":["lustrous","dull","soft like cotton","soluble"],"a":0,"e":"Shiny surface.","sh":1,"x":1},{"id":"sci6m3","k":"mcq","q":"Which material is used to make a window so we can see out?","o":["Clear glass","Wood","Cardboard","Iron sheet"],"a":0,"e":"Transparent.","sh":1,"x":1},{"id":"sci6m4","k":"mcq","q":"A stone in water:","o":["sinks","floats","dissolves","evaporates"],"a":0,"e":"Heavier for its size.","sh":1,"x":1},{"id":"sci6f0","k":"mcq","fill":1,"q":"Materials through which we cannot see at all are ___.","o":["opaque","transparent","translucent","lustrous"],"a":0,"e":"","sh":1,"x":1},{"id":"sci6f1","k":"mcq","fill":1,"q":"Sugar is ___ in water.","o":["soluble","insoluble","opaque","magnetic"],"a":0,"e":"","sh":1,"x":1},{"id":"sci6f2","k":"mcq","fill":1,"q":"Shiny materials are said to have ___.","o":["lustre","hardness","solubility","weight"],"a":0,"e":"","sh":1,"x":1},{"id":"sci6c01","k":"mcq","q":"Rahul’s kitchen: Rahul noticed sugar disappearing in tea, oil floating in his dal water, steel spoons shining, and light coming through the frosted kitchen window. — Oil is:","o":["soluble and sinks","insoluble and floats","soluble and floats","insoluble and sinks"],"a":1,"e":"(b)."}],"top":[{"q":"Differentiate between an object and a material with examples.","m":2,"imp":true,"a":["An object is a thing with a definite shape and use (chair, bottle); a material is what the object is made of (wood, plastic, glass). A chair can be made of wood, plastic or metal; wood can make chairs, tables, doors."],"k":"Both definitions + examples.","cm":"Calling ‘chair’ a material."},{"q":"What are lustrous materials? Give examples.","m":2,"imp":true,"a":["Materials with a natural shine are lustrous — mostly metals like gold, silver, copper, aluminium, iron (freshly cut/cleaned). Wood, paper, cloth are non-lustrous (dull)."],"k":"Meaning + examples.","cm":"Calling polished wood lustrous by nature."},{"q":"Explain transparent, translucent and opaque materials with examples.","m":3,"imp":true,"a":["Transparent: let light pass completely; objects seen clearly — clear glass, water, air.","Translucent: let light pass partly; objects seen not clearly — butter paper, frosted glass, oiled paper.","Opaque: do not let light pass; objects cannot be seen — wood, cardboard, metal sheet."],"k":"Three definitions + example each.","cm":"Calling butter paper transparent."},{"q":"What are soluble and insoluble substances? Give examples.","m":2,"imp":true,"a":["Soluble: completely mix/disappear in water — sugar, salt, lemon juice. Insoluble: do not mix even after stirring — sand, chalk powder, sawdust, oil."],"k":"Definitions + examples.","cm":"Saying oil is soluble in water."},{"q":"Why do some objects float and others sink? Give examples.","m":2,"imp":true,"a":["Objects lighter than the same amount of water (less dense) float — wood, dry leaf, oil, plastic ball, ice; heavier ones sink — stone, iron nail, coin."],"k":"Idea of comparison with water + examples.","cm":"Saying ‘big things sink’."},{"q":"Why are cooking pans made of metal but their handles of plastic or wood?","m":2,"imp":true,"a":["Metals conduct heat well, so food cooks quickly. Plastic/wood are poor conductors, so handles stay cool and safe to hold."],"k":"Two reasons.","cm":"Saying plastic looks nicer."},{"q":"What is hardness? Classify: iron nail, cotton, stone, sponge.","m":2,"imp":false,"a":["Hardness: difficulty in scratching or compressing a material. Hard: iron nail, stone. Soft: cotton, sponge."],"k":"Definition + classification.","cm":"Calling sponge hard."},{"q":"Why is grouping materials useful?","m":2,"imp":false,"a":["Grouping makes it easy to find, store and study materials, and to choose the right material for a purpose (e.g. transparent glass for windows)."],"k":"Two uses.","cm":"One-word answer."},{"q":"Why are windows made of glass and doors of wood?","m":2,"imp":false,"a":["Glass is transparent, letting in light and letting us see outside. Wood is strong and opaque, giving privacy and security."],"k":"Property + use for each.","cm":"Answering without properties."}],"prac":[{"lv":"Level 1: Basic","q":"Name a transparent material.","a":"Glass/water."},{"lv":"Level 1: Basic","q":"Is sand soluble in water?","a":"No."},{"lv":"Level 1: Basic","q":"Name a lustrous material.","a":"Gold/copper."},{"lv":"Level 1: Basic","q":"Does a stone float?","a":"No, it sinks."},{"lv":"Level 2: Exam Standard","q":"Classify: butter paper, mirror, wood, clear plastic.","a":"Translucent; opaque; opaque; transparent."},{"lv":"Level 2: Exam Standard","q":"Why are ornaments made of gold and silver?","a":"They are lustrous and do not rust."},{"lv":"Level 2: Exam Standard","q":"Name two liquids that do not mix with water.","a":"Oil, kerosene."},{"lv":"Level 2: Exam Standard","q":"Why is a raincoat made of plastic?","a":"Water does not pass through."},{"lv":"Level 3: Competency / Application","q":"Which material would you use for a lunch box: paper, plastic/steel or glass? Why?","a":"Steel/plastic — strong, waterproof, does not break easily."},{"lv":"Level 3: Competency / Application","q":"Why is frosted glass used in bathrooms?","a":"Translucent — lets light in but gives privacy."},{"lv":"Level 3: Competency / Application","q":"How can you separate oil floating on water?","a":"Pour off the top layer carefully (decantation) or use a separating method."},{"lv":"Level 4: Challenge","q":"A candle floats in water, but a small coin sinks. Is ‘size’ the deciding factor? Explain.","a":"No — floating depends on how heavy the material is compared with the same amount of water, not size."},{"lv":"Level 4: Challenge","q":"Suggest materials for a greenhouse wall and explain.","a":"Transparent glass/plastic — lets sunlight in for plants."}],"comp":[{"q":"You need to see a candle flame without being dazzled. Which sheet: glass, butter paper or cardboard?","a":"Butter paper — translucent; it dims the light but still shows the flame."},{"q":"Plan a quick test to find which of five powders dissolve in water.","a":"Same amount of water in five glasses; same spoonful of each powder; stir equally; observe after 2 minutes."},{"q":"Why are electric wires made of copper covered with plastic?","a":"Copper conducts electricity; plastic does not, so it keeps us safe."}],"case":[{"t":"Rahul’s kitchen","p":"Rahul noticed sugar disappearing in tea, oil floating in his dal water, steel spoons shining, and light coming through the frosted kitchen window.","q":["(i) Is sugar soluble?","(ii) Oil is: (a) soluble and sinks (b) insoluble and floats (c) soluble and floats (d) insoluble and sinks","(iii) Which property makes the spoon shine?","(iv) The frosted window is:"],"a":["(i) Yes.","(ii) (b).","(iii) Lustre.","(iv) Translucent."]}],"conc":[{"c":"Material","e":"What an object is made of.","x":"Glass.","cf":"Objects are not materials.","t":""},{"c":"Lustre","e":"Natural shine.","x":"Copper wire.","cf":"Rust/coating hides lustre.","t":""},{"c":"Translucent","e":"Partly lets light through.","x":"Butter paper.","cf":"Not the same as transparent.","t":"TRANS-parent: through clearly; TRANS-lucent: through a little"},{"c":"Solubility","e":"Ability to dissolve.","x":"Sugar in water.","cf":"Stirring doesn’t make sand dissolve.","t":""}],"notes":[{"h":"Objects and materials","t":"Objects are things (chair, tumbler); materials are what they are made of (wood, glass, plastic). One object can be made of different materials and one material can make many objects."},{"h":"Properties","t":"Appearance (lustrous/shiny or dull), hardness (hard/soft), soluble or insoluble in water, floats or sinks, transparent/translucent/opaque, attracted by magnet or not."},{"h":"Light through materials","t":"Transparent: see clearly through (clear glass, water). Translucent: see partly (butter paper, frosted glass). Opaque: cannot see through (wood, metal, cardboard)."},{"h":"Solubility","t":"Soluble in water: sugar, salt. Insoluble: sand, chalk, sawdust. Some liquids mix (vinegar, lemon juice) and some don’t (oil)."},{"h":"Grouping materials","t":"We group materials by common properties to study them easily and choose the right material for a job."}]},{"n":7,"t":"Temperature and its Measurement","intro":"Why touch is unreliable, the two thermometers (clinical and laboratory), how to use and read them, and the Celsius–Kelvin link. Comparison tables and precautions give easy marks.","prio":[{"t":"Touch is not reliable to judge hotness (three-bowl activity)","s":3},{"t":"Temperature = degree of hotness or coldness; unit °C (SI unit kelvin, K)","s":3},{"t":"Clinical thermometer: 35–42 °C, kink, shake before use; normal body temperature 37 °C","s":3},{"t":"Laboratory thermometer: −10 °C to 110 °C, no kink, read while in contact, keep vertical","s":3},{"t":"Reading a thermometer: range, smallest division, eye level","s":3},{"t":"K = °C + 273.15; digital thermometers are safer than mercury ones","s":2}],"traps":[{"m":"37 °F","c":"37 °C (98.6 °F)","t":"Body = 37 Celsius"},{"m":"Kink in lab thermometer","c":"Kink only in clinical","t":"Kink = Keep reading"},{"m":"Removing lab thermometer to read","c":"Read in position","t":"Stay to read"},{"m":"Writing °K","c":"Kelvin written as K","t":"No degree with K"},{"m":"Counting lines not spaces","c":"Divide by number of spaces","t":"Spaces count"}],"rq":[{"q":"Why is a clinical thermometer’s range only 35–42 °C?","a":"Human body temperature normally stays within this range."},{"q":"Why read at eye level?","a":"To avoid errors from looking at an angle."}],"mock":[{"q":"What is temperature?","m":1,"a":"Degree of hotness or coldness."},{"q":"Give four differences between clinical and lab thermometers.","m":4,"a":"Use, range, kink, shaking/reading."},{"q":"What is the use of the kink?","m":2,"a":"Stops liquid falling back; read after removal."},{"q":"List three precautions for using a lab thermometer.","m":3,"a":"Vertical; bulb surrounded, not touching; read in position."},{"q":"Convert 37 °C to kelvin.","m":2,"a":"310.15 K."},{"q":"Why is touch not reliable to judge hotness?","m":2,"a":"Same water feels different (three-bowl activity)."},{"q":"Draw a clinical thermometer and label the kink and bulb.","m":3,"a":"Correct diagram."},{"q":"Why are digital thermometers preferred?","m":1,"a":"No toxic mercury; easy to read."}],"qs":[{"id":"sci7p0","k":"mcq","q":"Normal human body temperature:","o":["35 °C","37 °C","40 °C","98.6 °C"],"a":1,"e":"≈ 98.6 °F.","imp":true},{"id":"sci7p1","k":"mcq","q":"Clinical thermometer range:","o":["0–100 °C","35–42 °C","−10–110 °C","20–50 °C"],"a":1,"e":"Body range.","imp":true},{"id":"sci7p2","k":"mcq","q":"Kink is present in:","o":["lab thermometer","clinical thermometer","both","neither"],"a":1,"e":"Keeps reading.","imp":true},{"id":"sci7p3","k":"mcq","q":"SI unit of temperature:","o":["°C","°F","K","J"],"a":2,"e":"Kelvin.","imp":false},{"id":"sci7p4","k":"mcq","q":"0 °C in kelvin:","o":["0 K","100 K","273.15 K","−273.15 K"],"a":2,"e":"Add 273.15.","imp":true},{"id":"sci7p5","k":"mcq","q":"Lab thermometer is read:","o":["after removing","while in the liquid","after shaking","upside down"],"a":1,"e":"No kink.","imp":false},{"id":"sci7p6","k":"mcq","q":"Bulb of lab thermometer should:","o":["touch the bottom","touch the side","be surrounded by liquid, not touching","be outside"],"a":2,"e":"Correct reading.","imp":false},{"id":"sci7p7","k":"mcq","q":"Why is touch unreliable?","o":["hands are small","the same water feels different to different hands","skin is dry","water is clear"],"a":1,"e":"Three-bowl activity.","imp":false},{"id":"sci7t0","k":"tf","q":"A clinical thermometer can measure boiling water.","a":1,"e":"Range only to 42 °C."},{"id":"sci7t1","k":"tf","q":"Lab thermometers have a kink.","a":1,"e":"Clinical thermometers have it."},{"id":"sci7t2","k":"tf","q":"K = °C + 273.15.","a":0,"e":""},{"id":"sci7t3","k":"tf","q":"Mercury is harmful.","a":0,"e":""},{"id":"sci7t4","k":"tf","q":"We should hold the thermometer by its bulb.","a":1,"e":"Hold by the stem."},{"id":"sci7a0","k":"ar","A":"A clinical thermometer is read after removing from the mouth.","R":"Its kink stops the liquid from falling back.","a":0,"e":"R explains A."},{"id":"sci7a1","k":"ar","A":"A lab thermometer can measure 100 °C water.","R":"Its range goes up to 110 °C.","a":0,"e":"R explains A."},{"id":"sci7a2","k":"ar","A":"Touch is a reliable way to measure temperature.","R":"Hands may feel the same water differently.","a":3,"e":"A false; R true."},{"id":"sci7x0","k":"mcq","q":"Normal human body temperature is:","o":["37 °C","98 °C","100 °C","27 °C"],"a":0,"e":"About 98.6 °F.","sh":1,"x":1},{"id":"sci7x1","k":"mcq","q":"The range of a clinical thermometer is:","o":["35 °C to 42 °C","−10 °C to 110 °C","0 °C to 100 °C","20 °C to 50 °C"],"a":0,"e":"Human body range.","sh":1,"x":1},{"id":"sci7x2","k":"mcq","q":"The range of a laboratory thermometer is usually:","o":["−10 °C to 110 °C","35 °C to 42 °C","0 °C to 50 °C","50 °C to 150 °C"],"a":0,"e":"For experiments.","sh":1,"x":1},{"id":"sci7x3","k":"mcq","q":"The kink in a clinical thermometer:","o":["stops the mercury level from falling","helps to hold it","makes it look nice","measures faster"],"a":0,"e":"So we can read it after removing.","sh":1,"x":1},{"id":"sci7x4","k":"mcq","q":"SI unit of temperature is:","o":["kelvin","degree Celsius","degree Fahrenheit","joule"],"a":0,"e":"Symbol K.","sh":1,"x":1},{"id":"sci7x5","k":"mcq","q":"Why is touch not a reliable way to measure temperature?","o":["Our sense of hot and cold can mislead us","Hands are always cold","Skin cannot feel","Touch is too fast"],"a":0,"e":"Three-bowl activity shows this.","sh":1,"x":1},{"id":"sci7x6","k":"mcq","q":"Water boils at:","o":["100 °C","0 °C","37 °C","50 °C"],"a":0,"e":"At normal pressure.","sh":1,"x":1},{"id":"sci7x7","k":"mcq","q":"Ice melts at:","o":["0 °C","100 °C","37 °C","−10 °C"],"a":0,"e":"Melting point of ice.","sh":1,"x":1},{"id":"sci7x8","k":"mcq","q":"While reading a laboratory thermometer, its bulb should:","o":["stay in the liquid being measured","be taken out","touch the bottom of the beaker","be held in the hand"],"a":0,"e":"Read while in contact.","sh":1,"x":1},{"id":"sci7x9","k":"mcq","q":"Digital thermometers are safer because:","o":["they don’t use mercury","they are heavy","they are made of glass","they are cheap only"],"a":0,"e":"Mercury is poisonous.","sh":1,"x":1},{"id":"sci7x10","k":"mcq","q":"Convert 100 °C to kelvin:","o":["373.15 K","100 K","273.15 K","173.15 K"],"a":0,"e":"Add 273.15.","sh":1,"x":1},{"id":"sci7y0","k":"tf","q":"A clinical thermometer can measure the temperature of boiling water.","a":1,"e":"Its range is only up to 42 °C.","x":1},{"id":"sci7y1","k":"tf","q":"We should shake a clinical thermometer before use.","a":0,"e":"","x":1},{"id":"sci7y2","k":"tf","q":"Temperature tells how hot or cold something is.","a":0,"e":"","x":1},{"id":"sci7m0","k":"mcq","q":"A doctor uses a:","o":["clinical thermometer","laboratory thermometer","ruler","compass"],"a":0,"e":"For body temperature.","sh":1,"x":1},{"id":"sci7m1","k":"mcq","q":"Laboratory thermometers have:","o":["no kink","a kink","range 35–42 °C","no bulb"],"a":0,"e":"Read while in the liquid.","sh":1,"x":1},{"id":"sci7m2","k":"mcq","q":"Mercury in thermometers is:","o":["poisonous","healthy","edible","a gas"],"a":0,"e":"Digital ones are safer.","sh":1,"x":1},{"id":"sci7m3","k":"mcq","q":"Water freezes at:","o":["0 °C","100 °C","37 °C","273 °C"],"a":0,"e":"Same as ice melting point.","sh":1,"x":1},{"id":"sci7m4","k":"mcq","q":"To read a thermometer the eye should be:","o":["level with the top of the liquid","above it","below it","closed"],"a":0,"e":"Avoids error.","sh":1,"x":1},{"id":"sci7f0","k":"mcq","fill":1,"q":"The SI unit of temperature is ___.","o":["kelvin","degree Celsius","metre","gram"],"a":0,"e":"","sh":1,"x":1},{"id":"sci7f1","k":"mcq","fill":1,"q":"Normal human body temperature is about ___.","o":["37 °C","42 °C","100 °C","0 °C"],"a":0,"e":"","sh":1,"x":1},{"id":"sci7f2","k":"mcq","fill":1,"q":"A clinical thermometer has a ___ that stops the mercury from falling back.","o":["kink","bulb","scale","cap"],"a":0,"e":"","sh":1,"x":1},{"id":"sci7c02","k":"mcq","q":"Fever check: Anu felt hot. Her mother washed a clinical thermometer, shook it, placed it under Anu’s tongue for a minute and read 38.6 °C. — Why does the level not fall after removal?","o":["bulb","kink","glass","scale"],"a":1,"e":"(b) kink."}],"top":[{"q":"Why can’t we rely on touch to find how hot something is? Describe an activity.","m":3,"imp":true,"a":["Take three bowls: hot (bearable), normal (tap) and cold (ice) water.","Keep one hand in hot and the other in cold water for 2 minutes, then put both in the normal water.","The hand from hot water feels it cold; the hand from cold water feels it warm — the same water feels different. So touch is not reliable; we need a thermometer."],"k":"Activity + observation + conclusion.","cm":"Describing only one hand."},{"q":"Give four differences between a clinical and a laboratory thermometer.","m":4,"imp":true,"a":["Use: clinical — body temperature; lab — temperature of other things (water, liquids).","Range: clinical 35 °C to 42 °C; lab −10 °C to 110 °C.","Kink: clinical has a kink that stops the liquid falling back, so it can be read after removal; lab has no kink — read while it is still in the substance.","Before use: clinical must be shaken to bring the level below 35 °C; lab is not shaken."],"k":"Four bases (1 each).","cm":"Using a clinical thermometer to measure boiling water — it would break."},{"q":"What is the function of the kink in a clinical thermometer?","m":2,"imp":true,"a":["The kink (narrow bend) prevents the liquid from falling back into the bulb when the thermometer is taken out of the mouth, so the reading stays and can be read after removing it."],"k":"Prevents fall + read later.","cm":"Saying the kink makes the liquid rise."},{"q":"List the precautions while using a clinical thermometer.","m":3,"imp":true,"a":["Wash it (preferably with antiseptic) before and after use.","Shake it so the level is below 35 °C.","Keep the bulb under the tongue (or in the armpit) for about 1 minute; do not hold it by the bulb.","Read with the level at eye level; handle carefully — it breaks easily."],"k":"Any three precautions.","cm":"Forgetting to shake it before use."},{"q":"List the precautions while using a laboratory thermometer.","m":3,"imp":true,"a":["Keep it upright (vertical), not tilted.","The bulb must be surrounded by the substance but not touch the bottom or sides of the container.","Read while it is still in the substance, with the eye level with the top of the liquid."],"k":"Three precautions.","cm":"Taking it out to read."},{"q":"What is the normal temperature of the human body? Why is a mercury thermometer being replaced by digital ones?","m":2,"imp":true,"a":["Normal body temperature is about 37 °C (≈ 98.6 °F). Mercury is toxic; if a mercury thermometer breaks it harms people and the environment. Digital thermometers are safer and easier to read."],"k":"37 °C + mercury toxic.","cm":"Writing 37 °F."},{"q":"Convert: (a) 27 °C to kelvin (b) 373.15 K to °C.","m":2,"imp":true,"a":["K = °C + 273.15: (a) 27 + 273.15 = 300.15 K.","(b) 373.15 − 273.15 = 100 °C. Final answer: 300.15 K; 100 °C"],"k":"Formula + answers.","cm":"Writing °K."},{"q":"A thermometer scale has 10 small divisions between 30 °C and 40 °C. What is its smallest division? If the level is 4 divisions above 30, what is the reading?","m":2,"imp":true,"a":["Smallest division = (40 − 30) ÷ 10 = 1 °C.","Reading = 30 + 4 × 1 = 34 °C. Final answer: 1 °C; 34 °C"],"k":"Division (1) + reading (1).","cm":"Counting the 30 mark as division 1."},{"q":"Why should a clinical thermometer not be used to measure the temperature of boiling water?","m":2,"imp":false,"a":["Its range is only up to 42 °C; boiling water (100 °C) would push the liquid beyond the scale and break the thermometer."],"k":"Range limit + breaks.","cm":"Saying ‘it’s not accurate’."},{"q":"What is temperature? Name its units.","m":2,"imp":false,"a":["Temperature is the degree of hotness or coldness of a body. It is measured in degree Celsius (°C); the SI unit is kelvin (K)."],"k":"Definition + units.","cm":"Confusing temperature with heat."}],"prac":[{"lv":"Level 1: Basic","q":"Normal body temperature?","a":"37 °C."},{"lv":"Level 1: Basic","q":"Range of a clinical thermometer?","a":"35–42 °C."},{"lv":"Level 1: Basic","q":"SI unit of temperature?","a":"Kelvin."},{"lv":"Level 1: Basic","q":"Which thermometer has a kink?","a":"Clinical."},{"lv":"Level 2: Exam Standard","q":"Convert 50 °C to K.","a":"323.15 K."},{"lv":"Level 2: Exam Standard","q":"Why is a clinical thermometer shaken before use?","a":"To bring the level back below 35 °C."},{"lv":"Level 2: Exam Standard","q":"Why must the bulb not touch the beaker?","a":"The beaker’s temperature may differ; reading would be wrong."},{"lv":"Level 2: Exam Standard","q":"Range of a lab thermometer?","a":"−10 °C to 110 °C."},{"lv":"Level 3: Competency / Application","q":"A child’s temperature is 39.2 °C. Is it normal? How much above normal?","a":"No, fever; 39.2 − 37 = 2.2 °C above."},{"lv":"Level 3: Competency / Application","q":"Between 20 °C and 30 °C there are 20 small divisions. What is one division?","a":"0.5 °C."},{"lv":"Level 3: Competency / Application","q":"Why is a digital thermometer better for home use?","a":"No mercury (safe), quick, easy to read."},{"lv":"Level 4: Challenge","q":"Why can’t a lab thermometer be used to measure body temperature easily?","a":"No kink — level drops as soon as it is removed; also its range is wide so divisions are coarse and it is hard to keep in the mouth."},{"lv":"Level 4: Challenge","q":"Water boils at 100 °C. Express in kelvin and explain why kelvin values are never negative.","a":"373.15 K. Kelvin starts at absolute zero, the lowest possible temperature."}],"comp":[{"q":"Your friend reads a lab thermometer after taking it out of hot tea. What error did he make?","a":"The level falls immediately — lab thermometers must be read while still in the liquid."},{"q":"A doctor measures 38 °C for a patient. Should the patient worry? What should the family check next?","a":"Mild fever (above 37 °C); recheck after some time, rest, fluids, consult the doctor if it rises."},{"q":"Plan how to find which cools faster: water in a steel cup or a clay cup.","a":"Same amount of hot water in both; measure temperature with a lab thermometer every 5 minutes; compare drops."}],"case":[{"t":"Fever check","p":"Anu felt hot. Her mother washed a clinical thermometer, shook it, placed it under Anu’s tongue for a minute and read 38.6 °C.","q":["(i) Why did she shake it?","(ii) Is Anu’s temperature normal?","(iii) Why does the level not fall after removal? (a) bulb (b) kink (c) glass (d) scale","(iv) Give one safety point."],"a":["(i) To bring the level below 35 °C.","(ii) No — normal is about 37 °C; she has a fever.","(iii) (b) kink.","(iv) Wash before/after use; handle carefully; prefer digital."]}],"conc":[{"c":"Temperature","e":"How hot or cold something is.","x":"Water at 25 °C.","cf":"Temperature ≠ heat.","t":""},{"c":"Kink","e":"Bend in the clinical thermometer’s tube.","x":"Keeps 38.5 °C reading after removal.","cf":"Lab thermometer has no kink.","t":"Kink = Keep"},{"c":"Range","e":"Lowest to highest temperature a thermometer measures.","x":"35–42 °C.","cf":"Do not exceed range.","t":""},{"c":"Smallest division","e":"Value of one small mark.","x":"0.1 °C in clinical.","cf":"Count spaces, not lines.","t":"(Big gap) ÷ (spaces)"}],"notes":[{"h":"Hot and cold","t":"Temperature is the degree of hotness or coldness. Touch is not reliable (three-bowl activity shows the same water feels hot to one hand and cold to the other)."},{"h":"Units","t":"Degree Celsius (°C) used daily; SI unit is kelvin (K). K = °C + 273.15. Normal body temperature ≈ 37 °C (98.6 °F)."},{"h":"Clinical thermometer","t":"Measures body temperature, range 35–42 °C, has a kink to stop mercury falling back. Shake it before use; keep under tongue/armpit for about a minute."},{"h":"Laboratory thermometer","t":"Range about −10 °C to 110 °C, no kink. Keep the bulb in the liquid, hold it upright, read while it is still in the liquid, eye level with the top of the liquid column."},{"h":"Reading a thermometer","t":"Find the range and the smallest division (difference between two numbered marks ÷ number of spaces). Digital thermometers are safer — no mercury."}]},{"n":8,"t":"A Journey through States of Water","intro":"Three states of water, changes between them, evaporation (and its factors), cooling by evaporation and the water cycle. Diagram of the water cycle is almost certain.","prio":[{"t":"Three states: solid (ice), liquid (water), gas (water vapour)","s":3},{"t":"Changes: melting, freezing, evaporation, boiling, condensation","s":3},{"t":"Ice melts at 0 °C; water boils at 100 °C (at sea level)","s":3},{"t":"Evaporation at all temperatures; factors: temperature, surface area, wind, humidity","s":3},{"t":"Cooling by evaporation: matka, sweating","s":3},{"t":"Water cycle: evaporation → condensation (clouds) → precipitation","s":3},{"t":"Droplets on a cold glass = condensation","s":2}],"traps":[{"m":"Evaporation only at 100 °C","c":"Any temperature","t":"Puddles dry in winter too"},{"m":"Steam = vapour","c":"Visible ’steam’ is droplets","t":"Vapour is invisible"},{"m":"Droplets leak through glass","c":"Air vapour condenses","t":"From outside air"},{"m":"Humidity speeds evaporation","c":"Slows it","t":"Wet air is full"},{"m":"Water cycle without arrows/labels","c":"Label E, C, P","t":"E-C-P"}],"rq":[{"q":"Why do we feel cold after a bath under a fan?","a":"Water on skin evaporates quickly, taking heat."},{"q":"Why is the temperature constant while ice melts?","a":"Heat is used to change ice into water, not to raise temperature."}]
