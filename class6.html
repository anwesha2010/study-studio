","sh":1,"x":1},{"id":"sci8x6","k":"mcq","q":"Ice floats on water because ice is:","o":["lighter than the same volume of water","heavier than water","a gas","hot"],"a":0,"e":"Water expands on freezing.","sh":1,"x":1},{"id":"sci8x7","k":"mcq","q":"The gaseous form of water is called:","o":["water vapour","steam ice","cloud only","dew"],"a":0,"e":"Invisible gas.","sh":1,"x":1},{"id":"sci8x8","k":"mcq","q":"Sweating cools our body because:","o":["sweat evaporates and takes heat away","sweat is cold","sweat freezes","we drink water"],"a":0,"e":"Cooling by evaporation.","sh":1,"x":1},{"id":"sci8x9","k":"mcq","q":"Evaporation happens:","o":["at all temperatures","only at 100 °C","only at 0 °C","only in summer"],"a":0,"e":"Even from ice-cold water slowly.","sh":1,"x":1},{"id":"sci8x10","k":"mcq","q":"Moisture present in air is called:","o":["humidity","rain","condensation","steam"],"a":0,"e":"More humidity → slower drying.","sh":1,"x":1},{"id":"sci8y0","k":"tf","q":"Clouds are made of tiny water droplets.","a":0,"e":"","x":1},{"id":"sci8y1","k":"tf","q":"Evaporation is faster when air is humid.","a":1,"e":"Dry air speeds it up.","x":1},{"id":"sci8y2","k":"tf","q":"Water exists in three states: solid, liquid and gas.","a":0,"e":"","x":1},{"id":"sci8m0","k":"mcq","q":"Dew forms by:","o":["condensation","evaporation","melting","freezing"],"a":0,"e":"Vapour cools on grass at night.","sh":1,"x":1},{"id":"sci8m1","k":"mcq","q":"Puddles dry up after rain due to:","o":["evaporation","condensation","freezing","melting"],"a":0,"e":"Water becomes vapour.","sh":1,"x":1},{"id":"sci8m2","k":"mcq","q":"Which dries clothes fastest?","o":["Hot, dry, windy day","Cold, humid day","Rainy day","Still, cloudy day"],"a":0,"e":"All factors increase evaporation.","sh":1,"x":1},{"id":"sci8m3","k":"mcq","q":"Water boils at:","o":["100 °C","0 °C","50 °C","37 °C"],"a":0,"e":"At sea level.","sh":1,"x":1},{"id":"sci8m4","k":"mcq","q":"Clouds are formed by:","o":["condensation of water vapour","melting of ice","evaporation of clouds","freezing of air"],"a":0,"e":"Vapour cools high up.","sh":1,"x":1},{"id":"sci8f0","k":"mcq","fill":1,"q":"Water vapour changing into water is called ___.","o":["condensation","evaporation","melting","boiling"],"a":0,"e":"","sh":1,"x":1},{"id":"sci8f1","k":"mcq","fill":1,"q":"Evaporation causes ___.","o":["cooling","heating","melting","freezing"],"a":0,"e":"","sh":1,"x":1},{"id":"sci8f2","k":"mcq","fill":1,"q":"The amount of water vapour in air is called ___.","o":["humidity","pressure","rain","dew"],"a":0,"e":"","sh":1,"x":1},{"id":"sci8c02","k":"mcq","q":"Summer in a village: In May, the village pond shrinks, clothes dry within an hour, and families keep drinking water in matkas. In July, the pond fills again with rain. — How does the matka cool water?","o":["clay is cold","evaporation through pores","shade","ice"],"a":1,"e":"(b)."}],"top":[{"q":"Name the three states of water and describe the changes between them.","m":5,"imp":true,"a":["Solid (ice), liquid (water), gas (water vapour).","Melting: ice → water on heating (at 0 °C).","Freezing: water → ice on cooling (at 0 °C).","Evaporation/boiling: water → water vapour on heating (boiling at 100 °C).","Condensation: water vapour → water on cooling."],"k":"States (1) + four changes (1 each).","cm":"Calling steam ‘smoke’."},{"q":"What is evaporation? Name the factors that affect it.","m":3,"imp":true,"a":["Evaporation is the change of water into water vapour at any temperature, from the surface of the water.","It is faster when: temperature is higher, surface area is larger, there is more wind, and humidity is lower (dry air)."],"k":"Definition (1) + four factors (2).","cm":"Saying evaporation happens only at 100 °C."},{"q":"Differentiate between evaporation and boiling.","m":3,"imp":true,"a":["Temperature: evaporation at any temperature; boiling at a fixed temperature (100 °C for water).","Where: evaporation only from the surface; boiling from the whole liquid (bubbles form).","Speed: evaporation is slow; boiling is fast."],"k":"Three bases.","cm":"Treating them as the same."},{"q":"Why do water droplets appear on the outside of a glass of ice water?","m":2,"imp":true,"a":["Water vapour in the air touches the cold surface of the glass, cools and condenses into tiny water droplets. The water does not leak from inside."],"k":"Vapour from air + condenses on cold surface.","cm":"Saying water seeps through the glass."},{"q":"How does an earthen pot (matka) keep water cool?","m":3,"imp":true,"a":["A matka has tiny pores; water seeps out and evaporates from its outer surface. Evaporation takes heat from the pot and the water inside, so the water becomes cool. We feel cool when sweat evaporates for the same reason."],"k":"Pores + evaporation + takes heat.","cm":"Saying clay is cold by nature."},{"q":"Explain the water cycle with a labelled diagram.","m":5,"imp":true,"a":["Evaporation: heat of the Sun evaporates water from oceans, rivers, lakes; plants also give off vapour (transpiration).","Condensation: vapour rises, cools and condenses into tiny droplets forming clouds.","Precipitation: droplets join, become heavy and fall as rain, snow or hail.","Water returns to oceans, rivers and underground (collection), and the cycle repeats."],"k":"Diagram with labels (2) + three processes explained (3).","cm":"Missing the Sun or arrows."},{"q":"Why do wet clothes dry faster on a sunny, windy day?","m":2,"imp":true,"a":["Higher temperature (sun) and wind both increase the rate of evaporation, so water leaves the clothes quickly. Spreading them out increases surface area too."],"k":"Two factors.","cm":"Saying ‘sun sucks water’."},{"q":"Why do clothes take longer to dry in the rainy season?","m":2,"imp":false,"a":["The air already has a lot of water vapour (high humidity), so it cannot take in much more — evaporation is slow."],"k":"Humidity + slow evaporation.","cm":"Saying ‘no sun’ only."},{"q":"At what temperatures does ice melt and water boil? What happens to the temperature while ice is melting?","m":3,"imp":false,"a":["Ice melts at 0 °C; water boils at 100 °C (at sea level). While ice is melting, the temperature stays at 0 °C until all the ice has melted."],"k":"Two values + constant temperature.","cm":"Saying temperature rises steadily while melting."},{"q":"Why is water vapour invisible, but we see ‘steam’ above a kettle?","m":2,"imp":false,"a":["Water vapour is an invisible gas. The white cloud we see above a kettle is made of tiny water droplets formed when vapour condenses in the cooler air."],"k":"Vapour invisible + droplets.","cm":"Calling the white cloud water vapour."}],"prac":[{"lv":"Level 1: Basic","q":"Solid form of water?","a":"Ice."},{"lv":"Level 1: Basic","q":"Water → vapour is called?","a":"Evaporation."},{"lv":"Level 1: Basic","q":"Boiling point of water?","a":"100 °C."},{"lv":"Level 1: Basic","q":"Clouds form by?","a":"Condensation."},{"lv":"Level 2: Exam Standard","q":"Give two factors that increase evaporation.","a":"Higher temperature, wind (or larger surface area, low humidity)."},{"lv":"Level 2: Exam Standard","q":"Why do we feel cool after sweating?","a":"Sweat evaporates, taking heat from the body."},{"lv":"Level 2: Exam Standard","q":"What is precipitation?","a":"Water falling from clouds as rain, snow, hail."},{"lv":"Level 2: Exam Standard","q":"Is freezing the reverse of melting?","a":"Yes."},{"lv":"Level 3: Competency / Application","q":"Why is a wet floor wiped and spread out to dry faster?","a":"Spreading increases surface area → faster evaporation."},{"lv":"Level 3: Competency / Application","q":"Why does a mirror in the bathroom fog up after a hot shower?","a":"Vapour from hot water condenses on the cooler mirror."},{"lv":"Level 3: Competency / Application","q":"Why is water stored in a matka cooler in summer than in a steel bottle?","a":"Evaporation through the pores cools it; steel has no pores."},{"lv":"Level 4: Challenge","q":"If evaporation stopped, what would happen to rain? Explain.","a":"No vapour → no clouds → no rain; the water cycle would stop."},{"lv":"Level 4: Challenge","q":"Why does a puddle dry faster on a hot, dry, windy day than on a cool humid day?","a":"All three factors (heat, low humidity, wind) increase evaporation."}],"comp":[{"q":"Suggest two ways to dry clothes faster indoors in the rainy season.","a":"Use a fan (wind); spread clothes wide (surface area); keep in a warm place."},{"q":"How can villagers get drinking water from salty water using the sun?","a":"Solar still: water evaporates, vapour condenses on a cool cover and is collected — salt stays behind."},{"q":"Why should we save water if the water cycle keeps renewing it?","a":"Usable fresh water in a place at a time is limited; overuse empties rivers and groundwater faster than rain refills them."}],"case":[{"t":"Summer in a village","p":"In May, the village pond shrinks, clothes dry within an hour, and families keep drinking water in matkas. In July, the pond fills again with rain.","q":["(i) Why does the pond shrink in May?","(ii) Why do clothes dry quickly?","(iii) How does the matka cool water? (a) clay is cold (b) evaporation through pores (c) shade (d) ice","(iv) Which process refills the pond in July?"],"a":["(i) High temperature → more evaporation.","(ii) Heat and wind speed up evaporation.","(iii) (b).","(iv) Precipitation (rain) — part of the water cycle."]}],"conc":[{"c":"Evaporation","e":"Liquid → vapour at any temperature, from surface.","x":"Puddles drying.","cf":"Not the same as boiling.","t":"T-S-W-H: Temperature, Surface, Wind, Humidity"},{"c":"Condensation","e":"Vapour → liquid on cooling.","x":"Droplets on cold glass.","cf":"Water does not leak through glass.","t":""},{"c":"Humidity","e":"Amount of water vapour in air.","x":"Sticky monsoon air.","cf":"High humidity slows evaporation.","t":""},{"c":"Water cycle","e":"Continuous movement of water between Earth and sky.","x":"Rain.","cf":"The Sun drives it.","t":"E-C-P"}],"notes":[{"h":"Three states","t":"Solid (ice): fixed shape. Liquid (water): flows, takes the shape of the container. Gas (water vapour): spreads everywhere, invisible."},{"h":"Changes of state","t":"Melting: ice → water (0 °C). Freezing: water → ice. Evaporation: water → vapour (any temperature, from the surface). Boiling: rapid change at 100 °C. Condensation: vapour → water on cooling."},{"h":"Evaporation speeds up with","t":"Higher temperature, more wind, larger surface area, lower humidity (dry air)."},{"h":"Cooling by evaporation","t":"Evaporation takes heat away: water in a matka stays cool, sweating cools our body, wet cloth on forehead."},{"h":"Condensation examples","t":"Droplets outside a cold glass, dew on grass, mist on mirrors, clouds."},{"h":"Ice floats","t":"Water expands on freezing, so ice is lighter than the same volume of water and floats — fish survive under frozen lakes."}]},{"n":9,"t":"Methods of Separation in Everyday Life","intro":"The whole chapter is ’which method for which mixture, and why’. Learn each method with its principle and one example; practise sequences (sedimentation → decantation → filtration → evaporation).","prio":[{"t":"Why separate: remove harmful/unwanted parts, get useful parts","s":3},{"t":"Handpicking, threshing, winnowing, sieving","s":3},{"t":"Sedimentation, decantation, filtration","s":3},{"t":"Evaporation and condensation","s":3},{"t":"Churning; magnetic separation","s":2},{"t":"Using more than one method in sequence (e.g. salt + sand)","s":3}],"traps":[{"m":"Filtration for dissolved salt","c":"Evaporation","t":"Dissolved → evaporate"},{"m":"Winnowing = sieving","c":"Wind vs size","t":"Wind = winnow"},{"m":"Wrong order in muddy water","c":"S→D→F","t":"Settle, Decant, Filter"},{"m":"Filtered water safe","c":"Also boil/purify","t":"Filter ̸= germ-free"},{"m":"Residue/filtrate swap","c":"Residue on paper","t":"Residue remains"}],"rq":[{"q":"Why does husk fly away in winnowing?","a":"It is lighter than grain, so wind carries it farther."},{"q":"Why is the water boiled after filtration for drinking?","a":"To kill germs that pass through filters."}],"mock":[{"q":"Name the method for: husk from grain; bran from flour.","m":2,"a":"Winnowing; sieving."},{"q":"Explain sedimentation and decantation.","m":2,"a":"Heavy particles settle; clear liquid poured off."},{"q":"How will you separate salt and sand?","m":3,"a":"Dissolve, filter, evaporate."},{"q":"Draw a labelled filtration set-up.","m":4,"a":"Glass rod, funnel, filter paper, residue, beaker, filtrate."},{"q":"How is salt obtained from sea water?","m":2,"a":"Evaporation in shallow pans."},{"q":"How can butter be obtained from curd?","m":2,"a":"Churning."},{"q":"What are residue and filtrate?","m":2,"a":"Solid left on paper; clear liquid passed."},{"q":"Why is filtered water boiled before drinking?","m":1,"a":"To kill germs."}],"qs":[{"id":"sci9p0","k":"mcq","q":"Husk is separated from grain by:","o":["sieving","winnowing","filtration","churning"],"a":1,"e":"Wind.","imp":true},{"id":"sci9p1","k":"mcq","q":"Tea leaves are separated by:","o":["filtration","evaporation","magnet","winnowing"],"a":0,"e":"Strainer.","imp":true},{"id":"sci9p2","k":"mcq","q":"Salt from sea water:","o":["filtration","sedimentation","evaporation","sieving"],"a":2,"e":"Salt pans.","imp":true},{"id":"sci9p3","k":"mcq","q":"Iron pins from sand:","o":["magnet","sieve","water","wind"],"a":0,"e":"Magnetic.","imp":true},{"id":"sci9p4","k":"mcq","q":"Clear liquid after filtration:","o":["residue","filtrate","sediment","decant"],"a":1,"e":"Passes through.","imp":false},{"id":"sci9p5","k":"mcq","q":"Butter from curd:","o":["winnowing","churning","sieving","threshing"],"a":1,"e":"Churning.","imp":false},{"id":"sci9p6","k":"mcq","q":"Pouring off clear liquid is:","o":["sedimentation","decantation","filtration","evaporation"],"a":1,"e":"After settling.","imp":false},{"id":"sci9p7","k":"mcq","q":"Stones from rice:","o":["handpicking","evaporation","condensation","filtration"],"a":0,"e":"Few, visible.","imp":false},{"id":"sci9t0","k":"tf","q":"Filtration removes dissolved salt from water.","a":1,"e":"Evaporation is needed."},{"id":"sci9t1","k":"tf","q":"Winnowing uses wind.","a":0,"e":""},{"id":"sci9t2","k":"tf","q":"Decantation comes before sedimentation.","a":1,"e":"After."},{"id":"sci9t3","k":"tf","q":"Sieving separates by size.","a":0,"e":""},{"id":"sci9t4","k":"tf","q":"Churning separates butter.","a":0,"e":""},{"id":"sci9a0","k":"ar","A":"Salt is obtained from sea water by evaporation.","R":"Salt is soluble in water.","a":0,"e":"Dissolved solids need evaporation."},{"id":"sci9a1","k":"ar","A":"Filtration can separate sand from water.","R":"Sand is insoluble.","a":0,"e":"R explains A."},{"id":"sci9a2","k":"ar","A":"Handpicking is used to remove bran from flour.","R":"Bran particles are larger.","a":3,"e":"A false (sieving); R true."},{"id":"sci9x0","k":"mcq","q":"Separating stones from rice by hand is:","o":["handpicking","winnowing","sieving","filtration"],"a":0,"e":"Used for small amounts of big impurities.","sh":1,"x":1},{"id":"sci9x1","k":"mcq","q":"Separating husk from grain using wind is:","o":["winnowing","threshing","sieving","decantation"],"a":0,"e":"Light husk blows away.","sh":1,"x":1},{"id":"sci9x2","k":"mcq","q":"Beating stalks to separate grains is:","o":["threshing","winnowing","sieving","churning"],"a":0,"e":"Done after harvesting.","sh":1,"x":1},{"id":"sci9x3","k":"mcq","q":"Flour and bran are separated by:","o":["sieving","filtration","evaporation","magnet"],"a":0,"e":"Different particle sizes.","sh":1,"x":1},{"id":"sci9x4","k":"mcq","q":"Salt is obtained from sea water by:","o":["evaporation","filtration","sieving","handpicking"],"a":0,"e":"Water evaporates, salt is left.","sh":1,"x":1},{"id":"sci9x5","k":"mcq","q":"Heavy insoluble particles settling at the bottom is:","o":["sedimentation","decantation","condensation","evaporation"],"a":0,"e":"Then pour off the liquid.","sh":1,"x":1},{"id":"sci9x6","k":"mcq","q":"Pouring off clear liquid without disturbing the sediment is:","o":["decantation","filtration","sieving","threshing"],"a":0,"e":"Follows sedimentation.","sh":1,"x":1},{"id":"sci9x7","k":"mcq","q":"Tea leaves are separated from tea using a:","o":["strainer (filtration)","magnet","winnowing basket","sieve for flour"],"a":0,"e":"Filtration.","sh":1,"x":1},{"id":"sci9x8","k":"mcq","q":"Iron filings are separated from sand using a:","o":["magnet","sieve","filter paper","winnowing"],"a":0,"e":"Iron is magnetic.","sh":1,"x":1},{"id":"sci9x9","k":"mcq","q":"Butter is separated from curd by:","o":["churning","winnowing","evaporation","sieving"],"a":0,"e":"Fast stirring separates butter.","sh":1,"x":1},{"id":"sci9x10","k":"mcq","q":"Which mixture can be separated by filtration?","o":["Chalk and water","Salt and water","Sugar and water","Ink and water"],"a":0,"e":"Insoluble solid in liquid.","sh":1,"x":1},{"id":"sci9y0","k":"tf","q":"Filtration can separate salt dissolved in water.","a":1,"e":"Use evaporation.","x":1},{"id":"sci9y1","k":"tf","q":"Sedimentation is usually followed by decantation.","a":0,"e":"","x":1},{"id":"sci9y2","k":"tf","q":"Winnowing works because husk is lighter than grain.","a":0,"e":"","x":1},{"id":"sci9m0","k":"mcq","q":"Bran is removed from flour by:","o":["sieving","winnowing","evaporation","magnet"],"a":0,"e":"Particle size differs.","sh":1,"x":1},{"id":"sci9m1","k":"mcq","q":"Mud and water can be separated by:","o":["sedimentation and decantation","winnowing","magnet","churning"],"a":0,"e":"Mud settles.","sh":1,"x":1},{"id":"sci9m2","k":"mcq","q":"Salt pans use:","o":["evaporation","filtration","threshing","sieving"],"a":0,"e":"Sun evaporates sea water.","sh":1,"x":1},{"id":"sci9m3","k":"mcq","q":"Grain separated from stalks by beating is:","o":["threshing","winnowing","handpicking","sieving"],"a":0,"e":"Done after harvest.","sh":1,"x":1},{"id":"sci9m4","k":"mcq","q":"Iron pins mixed with sand are removed by:","o":["a magnet","filtration","evaporation","winnowing"],"a":0,"e":"Iron is magnetic.","sh":1,"x":1},{"id":"sci9f0","k":"mcq","fill":1,"q":"Separating husk from grain using wind is called ___.","o":["winnowing","threshing","sieving","churning"],"a":0,"e":"","sh":1,"x":1},{"id":"sci9f1","k":"mcq","fill":1,"q":"Pouring off clear liquid after the solid settles is ___.","o":["decantation","sedimentation","filtration","evaporation"],"a":0,"e":"","sh":1,"x":1},{"id":"sci9f2","k":"mcq","fill":1,"q":"Butter is separated from curd by ___.","o":["churning","winnowing","sieving","evaporation"],"a":0,"e":"","sh":1,"x":1},{"id":"sci9c01","k":"mcq","q":"Salt from the sea: In coastal Gujarat, workers let sea water into shallow pans. After weeks of sunshine, white crystals of salt remain. The salt is then washed and packed. — Why are pans shallow?","o":["to save water","more surface area for faster evaporation","to stop fish","for colour"],"a":1,"e":"(b)."}],"top":[{"q":"Why do we need to separate substances? Give three reasons.","m":3,"imp":true,"a":["To remove unwanted or harmful parts (stones from rice, dirt from water).","To obtain useful components (butter from curd, salt from sea water).","To get a substance in pure form or separate two useful parts (grain and husk)."],"k":"Three reasons with examples.","cm":"Giving only examples without reasons."},{"q":"Explain winnowing and threshing.","m":3,"imp":true,"a":["Threshing: separating grains from stalks by beating the stalks (or using animals/threshers).","Winnowing: separating heavier grains from lighter husk/chaff using wind: the mixture is dropped from a height; wind blows the light husk away and grains fall near the heap."],"k":"Both processes + principle.","cm":"Swapping the two."},{"q":"Explain sieving with two examples.","m":2,"imp":true,"a":["Sieving separates particles of different sizes using a sieve: small particles pass through, bigger ones stay. Examples: removing bran from flour; separating pebbles from sand at construction sites."],"k":"Principle + two examples.","cm":"Using sieving for salt in water."},{"q":"How will you get clear water from muddy water? Name and explain the methods.","m":5,"imp":true,"a":["Sedimentation: leave the muddy water undisturbed; heavier mud settles at the bottom (sediment).","Decantation: gently pour off the clear water from the top without disturbing the sediment.","Filtration: pass the water through a filter paper (or cloth) in a funnel; fine particles stay on the paper (residue) and clear filtrate passes through.","(For drinking, it must also be boiled or purified to kill germs.)"],"k":"Three methods in order with meaning (4) + note on germs (1).","cm":"Saying filtered water is safe to drink without purification."},{"q":"How is salt obtained from sea water?","m":3,"imp":true,"a":["Sea water is let into shallow pits (salt pans). The Sun’s heat evaporates the water; salt is left behind, collected and purified. This is evaporation."],"k":"Shallow pans + evaporation + salt left.","cm":"Calling it filtration."},{"q":"How will you separate a mixture of salt and sand?","m":3,"imp":true,"a":["Add water and stir — salt dissolves, sand does not.","Filter (or decant) — sand stays on the filter paper.","Evaporate the filtrate — salt is left."],"k":"Dissolve + filter + evaporate.","cm":"Trying to sieve salt from sand."},{"q":"How is butter separated from curd?","m":2,"imp":true,"a":["By churning: curd is stirred fast (with a madhani/churner); the lighter butter separates and floats on top, leaving buttermilk."],"k":"Churning + butter floats.","cm":"Saying filtration."},{"q":"How can iron pins mixed with sand be separated?","m":2,"imp":true,"a":["Move a magnet through the mixture: iron pins (magnetic) stick to the magnet; sand (non-magnetic) is left."],"k":"Magnet + reason.","cm":"Suggesting handpicking for many pins."},{"q":"Name the method used: (a) stones from rice (b) tea leaves from tea (c) husk from grains (d) mud from river water.","m":4,"imp":true,"a":["(a) Handpicking.","(b) Filtration (with a strainer).","(c) Winnowing.","(d) Sedimentation and decantation (then filtration)."],"k":"1 each.","cm":"Tea leaves by sedimentation only."},{"q":"What are residue and filtrate?","m":2,"imp":false,"a":["In filtration, the solid left on the filter paper is the residue; the clear liquid that passes through is the filtrate."],"k":"Both terms.","cm":"Reversing them."}],"prac":[{"lv":"Level 1: Basic","q":"Method to separate butter from curd?","a":"Churning."},{"lv":"Level 1: Basic","q":"Solid left on filter paper is called?","a":"Residue."},{"lv":"Level 1: Basic","q":"Method for salt from sea water?","a":"Evaporation."},{"lv":"Level 1: Basic","q":"Method for bran from flour?","a":"Sieving."},{"lv":"Level 2: Exam Standard","q":"Name the method to separate grains from stalks.","a":"Threshing."},{"lv":"Level 2: Exam Standard","q":"Why is decantation done after sedimentation?","a":"The solid must settle first so clear liquid can be poured off."},{"lv":"Level 2: Exam Standard","q":"Can filtration separate sugar from water?","a":"No; sugar is dissolved — use evaporation."},{"lv":"Level 2: Exam Standard","q":"Give one use of a magnet in separation.","a":"Iron filings/pins from sand/scrap."},{"lv":"Level 3: Competency / Application","q":"Separate a mixture of sand, iron filings and salt.","a":"Magnet removes iron; add water, filter out sand; evaporate filtrate for salt."},{"lv":"Level 3: Competency / Application","q":"Paheli’s dal has a few stones. Which method? Would you use it for 100 kg of dal?","a":"Handpicking; for large amounts, machines/sieves would be used."},{"lv":"Level 3: Competency / Application","q":"Why is filtered pond water not always safe to drink?","a":"Germs and dissolved harmful substances pass through filter paper."},{"lv":"Level 4: Challenge","q":"Oil and water are mixed. Suggest a method.","a":"Let them settle into layers and decant the top oil layer (or use a separating funnel)."},{"lv":"Level 4: Challenge","q":"Why does winnowing need wind but sieving does not?","a":"Winnowing separates by weight (wind carries light husk); sieving separates by size."}],"comp":[{"q":"You spilled rice into a bowl of sand. How would you separate them quickly?","a":"Sieve — sand passes through, rice grains stay."},{"q":"A town gets muddy tap water after heavy rain. Suggest a home method to make it clear and safe.","a":"Let it settle, decant, filter through cloth/filter, then boil it."},{"q":"How are cars and scrap iron sorted in scrapyards?","a":"Large electromagnets lift iron/steel parts away from non-magnetic scrap."}],"case":[{"t":"Salt from the sea","p":"In coastal Gujarat, workers let sea water into shallow pans. After weeks of sunshine, white crystals of salt remain. The salt is then washed and packed.","q":["(i) Which method is used?","(ii) Why are pans shallow? (a) to save water (b) more surface area for faster evaporation (c) to stop fish (d) for colour","(iii) Can filtration be used instead?","(iv) Name one more thing obtained by evaporation."],"a":["(i) Evaporation.","(ii) (b).","(iii) No — salt is dissolved and passes through the filter.","(iv) Sugar crystals / residue of any dissolved solid."]}],"conc":[{"c":"Mixture","e":"Two or more substances mixed, not joined chemically.","x":"Sand + salt.","cf":"Components keep their properties.","t":""},{"c":"Winnowing","e":"Wind separates light husk from heavy grain.","x":"Farmers with a supa.","cf":"Not sieving.","t":"Wind = winnow"},{"c":"Filtration","e":"Filter paper separates insoluble solids from liquid.","x":"Tea strainer.","cf":"No — dissolved salt passes through.","t":""},{"c":"Evaporation","e":"Liquid removed as vapour; dissolved solid left.","x":"Salt pans.","cf":"Different from filtration.","t":""}],"notes":[{"h":"Why separate?","t":"To remove unwanted or harmful parts, or to get useful parts (e.g. stones from rice, butter from curd, salt from sea water)."},{"h":"Methods for solids","t":"Handpicking (stones from dal) · Threshing (beating stalks to get grain) · Winnowing (wind blows away light husk) · Sieving (flour from bran, by size) · Magnet (iron from sand)."},{"h":"Insoluble solid in liquid","t":"Sedimentation (heavy particles settle) → Decantation (pour off clear liquid) → Filtration (filter paper/strainer). Order: Settle, Decant, Filter."},{"h":"Dissolved solid","t":"Evaporation: heat the solution; water goes away, the solid is left (salt from sea water in salt pans)."},{"h":"Churning","t":"Rapid stirring separates lighter butter from buttermilk."},{"h":"Choosing the method","t":"Depends on size, weight, solubility and magnetic property of the parts of the mixture."}]},{"n":10,"t":"Living Creatures: Exploring their Characteristics","intro":"Characteristics of living things, living vs non-living, seed germination conditions and life cycles (frog, mosquito, plants). Diagrams of life cycles and the germination set-up earn big marks.","prio":[{"t":"Characteristics of living things: movement, need food, growth, respiration (breathing), response to stimuli, excretion, reproduction, life span","s":3},{"t":"Living vs non-living (car moves but is not alive — why?)","s":3},{"t":"Seed germination needs water, air, suitable temperature","s":3},{"t":"Life cycle of a frog: egg → tadpole → froglet → adult","s":3},{"t":"Life cycle of a mosquito: egg → larva → pupa → adult","s":3},{"t":"Plants are living: they grow, respond (sunflower, touch-me-not), reproduce, respire","s":2}],"traps":[{"m":"Movement alone = living","c":"Need all characteristics","t":"All or none"},{"m":"Light needed for germination","c":"Water, air, temperature","t":"W-A-T"},{"m":"Frog vs mosquito stages mixed","c":"Frog: tadpole; mosquito: larva, pupa","t":"T for Toad/frog"},{"m":"Plants don’t breathe","c":"All living things respire","t":"Plants breathe too"},{"m":"Unlabelled life-cycle arrows","c":"Label + arrows","t":"Circle with arrows"}],"rq":[{"q":"Why are seeds considered living?","a":"They can germinate and grow into plants when conditions are right."},{"q":"Why do we cover water containers?","a":"To stop mosquitoes laying eggs."}],"mock":[{"q":"List any five characteristics of living things.","m":3,"a":"Food, growth, respiration, response, reproduction, excretion, life span (any five)."},{"q":"Is a car living? Give two reasons.","m":2,"a":"No — cannot grow, reproduce."},{"q":"What conditions do seeds need to germinate?","m":3,"a":"Water, air, suitable temperature."},{"q":"Draw the life cycle of a frog.","m":4,"a":"Egg → tadpole → froglet → frog."},{"q":"Name the stages of a mosquito’s life cycle.","m":2,"a":"Egg, larva, pupa, adult."},{"q":"What is a stimulus? Give one example from plants.","m":2,"a":"Change that causes response; touch-me-not."},{"q":"Why should we not let water collect in coolers?","m":2,"a":"Mosquitoes breed there."}],"qs":[{"id":"sci10p0","k":"mcq","q":"Which is NOT a characteristic of living things?","o":["growth","reproduction","being made of metal","respiration"],"a":2,"e":"Not a life feature.","imp":true},{"id":"sci10p1","k":"mcq","q":"Seeds need for germination:","o":["light, soil, water","water, air, suitable temperature","only water","only soil"],"a":1,"e":"W-A-T.","imp":true},{"id":"sci10p2","k":"mcq","q":"Frog life cycle stage after egg:","o":["froglet","tadpole","pupa","larva"],"a":1,"e":"Tadpole.","imp":true},{"id":"sci10p3","k":"mcq","q":"Mosquito stage before adult:","o":["larva","egg","pupa","tadpole"],"a":2,"e":"Pupa.","imp":true},{"id":"sci10p4","k":"mcq","q":"Touch-me-not responds to:","o":["sound","touch","smell","taste"],"a":1,"e":"Leaves fold.","imp":false},{"id":"sci10p5","k":"mcq","q":"Breathing is part of:","o":["excretion","respiration","reproduction","growth"],"a":1,"e":"Gas exchange.","imp":false},{"id":"sci10p6","k":"mcq","q":"Mosquitoes breed in:","o":["dry sand","stagnant water","running rivers only","trees"],"a":1,"e":"Larvae in water.","imp":false},{"id":"sci10p7","k":"mcq","q":"Which is living?","o":["car","cloud","seed","candle"],"a":2,"e":"Can germinate.","imp":false},{"id":"sci10t0","k":"tf","q":"All living things can move from place to place.","a":1,"e":"Plants don’t move place to place, but parts move."},{"id":"sci10t1","k":"tf","q":"Plants respire.","a":0,"e":""},{"id":"sci10t2","k":"tf","q":"Light is essential for germination.","a":1,"e":"Not essential."},{"id":"sci10t3","k":"tf","q":"A tadpole breathes through gills.","a":0,"e":""},{"id":"sci10t4","k":"tf","q":"A mosquito’s larva lives in water.","a":0,"e":""},{"id":"sci10a0","k":"ar","A":"A car is non-living.","R":"It cannot grow or reproduce.","a":0,"e":"R explains A."},{"id":"sci10a1","k":"ar","A":"Seeds kept in a fridge germinate quickly.","R":"Germination needs a suitable temperature.","a":3,"e":"A false; R true."},{"id":"sci10a2","k":"ar","A":"Tadpoles live in water.","R":"They breathe through gills.","a":0,"e":"R explains A."},{"id":"sci10x0","k":"mcq","q":"Which is NOT a characteristic of living things?","o":["They do not grow","They need food","They respire","They respond to stimuli"],"a":0,"e":"All living things grow.","sh":1,"x":1},{"id":"sci10x1","k":"mcq","q":"A seed starts to grow into a seedling. This is:","o":["germination","reproduction","excretion","pollination"],"a":0,"e":"Needs water, air and warmth.","sh":1,"x":1},{"id":"sci10x2","k":"mcq","q":"Conditions needed for seed germination:","o":["water, air and suitable temperature","only soil","only sunlight","only fertiliser"],"a":0,"e":"Soil is not necessary.","sh":1,"x":1},{"id":"sci10x3","k":"mcq","q":"Removing waste from the body is called:","o":["excretion","respiration","nutrition","growth"],"a":0,"e":"Sweat and urine are wastes.","sh":1,"x":1},{"id":"sci10x4","k":"mcq","q":"Pulling your hand back from a hot pan is a:","o":["response to a stimulus","growth","reproduction","excretion"],"a":0,"e":"Stimulus = hot pan.","sh":1,"x":1},{"id":"sci10x5","k":"mcq","q":"The correct life cycle of a frog:","o":["egg → tadpole → froglet → adult frog","tadpole → egg → frog","frog → froglet → egg","egg → larva → pupa → frog"],"a":0,"e":"Tadpoles live in water.","sh":1,"x":1},{"id":"sci10x6","k":"mcq","q":"Mosquito life cycle stages:","o":["egg → larva → pupa → adult","egg → tadpole → adult","egg → adult","larva → egg → adult"],"a":0,"e":"Larva and pupa live in water.","sh":1,"x":1},{"id":"sci10x7","k":"mcq","q":"Living things produce young ones of their own kind. This is:","o":["reproduction","respiration","excretion","movement"],"a":0,"e":"Keeps the species going.","sh":1,"x":1},{"id":"sci10x8","k":"mcq","q":"Which is non-living?","o":["Stone","Ant","Mango tree","Mushroom"],"a":0,"e":"It does not grow or breathe.","sh":1,"x":1},{"id":"sci10x9","k":"mcq","q":"Plants respond to light by:","o":["bending towards it","walking to it","crying","sleeping"],"a":0,"e":"Shoot grows towards light.","sh":1,"x":1},{"id":"sci10x10","k":"mcq","q":"Living things take in oxygen and give out carbon dioxide during:","o":["respiration","excretion","germination","growth only"],"a":0,"e":"Respiration releases energy.","sh":1,"x":1},{"id":"sci10y0","k":"tf","q":"Plants are living even though they do not move from place to place.","a":0,"e":"","x":1},{"id":"sci10y1","k":"tf","q":"Seeds need soil to germinate.","a":1,"e":"Seeds can germinate on wet cotton.","x":1},{"id":"sci10y2","k":"tf","q":"All living things need food.","a":0,"e":"","x":1},{"id":"sci10m0","k":"mcq","q":"Touch-me-not leaves folding when touched shows:","o":["response to stimulus","growth","reproduction","excretion"],"a":0,"e":"A quick response.","sh":1,"x":1},{"id":"sci10m1","k":"mcq","q":"A seed does NOT need ___ to germinate.","o":["soil","water","air","warmth"],"a":0,"e":"Wet cotton works too.","sh":1,"x":1},{"id":"sci10m2","k":"mcq","q":"The young one of a frog is a:","o":["tadpole","larva","pupa","chick"],"a":0,"e":"Lives in water.","sh":1,"x":1},{"id":"sci10m3","k":"mcq","q":"Which is a living thing?","o":["Mushroom","Car","Cloud","Fire"],"a":0,"e":"It grows and reproduces.","sh":1,"x":1},{"id":"sci10m4","k":"mcq","q":"Removal of waste from the body is:","o":["excretion","respiration","nutrition","germination"],"a":0,"e":"Through sweat, urine.","sh":1,"x":1},{"id":"sci10f0","k":"mcq","fill":1,"q":"Sprouting of a seed is called ___.","o":["germination","respiration","excretion","pollination"],"a":0,"e":"","sh":1,"x":1},{"id":"sci10f1","k":"mcq","fill":1,"q":"A mosquito larva changes into a ___.","o":["pupa","tadpole","egg","seed"],"a":0,"e":"","sh":1,"x":1},{"id":"sci10f2","k":"mcq","fill":1,"q":"Living things produce young ones by ___.","o":["reproduction","respiration","excretion","growth"],"a":0,"e":"","sh":1,"x":1},{"id":"sci10c02","k":"mcq","q":"The school pond: Students found jelly-like eggs in the school pond in July. A few weeks later, small creatures with tails swam around; later some had legs. — Order of stages:","o":["egg–froglet–tadpole–frog","egg–tadpole–froglet–frog","tadpole–egg– frog","egg–frog–tadpole"],"a":1,"e":"(b)."}],"top":[{"q":"List the characteristics of living things.","m":4,"imp":true,"a":["They need food (energy) and water.","They grow and move (on their own).","They respire (take in air/oxygen and release energy) — breathing in animals.","They respond to stimuli (light, touch, heat).","They excrete wastes, reproduce their own kind, and have a life span (they die)."],"k":"At least 7 characteristics (½ each, max 4).","cm":"Listing ‘movement’ alone as proof of life."},{"q":"A car moves, uses fuel and gives out smoke. Is it living? Explain.","m":3,"imp":true,"a":["No. A car shows a few features only when a person drives it, but it does not grow, does not reproduce, does not respond to stimuli on its own, and does not respire like living beings. A living thing shows all the characteristics."],"k":"No + 2–3 missing characteristics.","cm":"Saying ‘yes, because it moves and uses fuel’."},{"q":"How will you show that seeds need water, air and suitable temperature to germinate?","m":5,"imp":true,"a":["Take 4 containers with an equal number of similar seeds (e.g. moong).","A: dry cotton (no water). B: moist cotton, kept at room temperature (water + air + warmth). C: seeds fully under boiled-and-cooled water (no air). D: moist cotton in the refrigerator (cold).","After 3–4 days: only B germinates.","So seeds need water, air and a suitable temperature to germinate."],"k":"Set-up (2) + observation (1) + conclusion (2).","cm":"Changing more than one condition in a container."},{"q":"Describe the life cycle of a frog.","m":3,"imp":true,"a":["Eggs laid in water (frogspawn).","Eggs hatch into tadpoles — live in water, breathe through gills, have a tail.","Tadpoles grow legs and lose the tail → froglet.","Froglet becomes an adult frog that lives on land and in water."],"k":"Four stages in order (+ diagram).","cm":"Missing the tadpole stage."},{"q":"Describe the life cycle of a mosquito. Why should we not let water collect in coolers and pots?","m":4,"imp":true,"a":["Egg → larva → pupa → adult; the first three stages live in water.","Stagnant water in coolers, pots, tyres lets mosquitoes breed. Adult mosquitoes spread malaria, dengue. Removing standing water stops their life cycle."],"k":"Stages (2) + reason (2).","cm":"Listing tadpole in a mosquito cycle."},{"q":"What is a stimulus? Give examples of plants and animals responding to stimuli.","m":3,"imp":true,"a":["A stimulus is a change in the surroundings that a living thing responds to.","Plants: touch-me-not (mimosa) leaves fold when touched; plants bend towards light; sunflower faces the Sun.","Animals: we pull our hand back from a hot object; a cat runs when a dog barks."],"k":"Definition + plant example + animal example.","cm":"Saying plants cannot respond."},{"q":"How do we know that plants are living?","m":3,"imp":true,"a":["Plants grow from seeds, make their own food (need water, sunlight, air), respire, respond to light and touch, reproduce (seeds), and die at the end of their life span."],"k":"Three or more characteristics.","cm":"Saying plants do not breathe."},{"q":"What is germination? Draw the stages of a germinating seed.","m":3,"imp":false,"a":["Germination is the process by which a seed starts growing into a young plant (seedling). Stages: seed swells with water → root comes out first and grows down → shoot grows up → leaves appear."],"k":"Definition + ordered stages.","cm":"Showing the shoot before the root."},{"q":"What is meant by life span? Give examples.","m":2,"imp":false,"a":["Life span is the period from birth to death of a living thing. It differs: a mosquito lives a few weeks; a dog about 10–15 years; humans about 70+ years; some trees for hundreds of years."],"k":"Definition + examples.","cm":"Saying non-living things have a life span."},{"q":"Why do living things need food and respiration?","m":2,"imp":false,"a":["Food gives energy and materials for growth. Respiration releases the energy from food (using oxygen) so the body can move, grow and repair."],"k":"Food → energy; respiration releases it.","cm":"Confusing breathing and eating."}],"prac":[{"lv":"Level 1: Basic","q":"Name the first stage in a frog’s life cycle.","a":"Egg."},{"lv":"Level 1: Basic","q":"Name the stage between larva and adult in a mosquito.","a":"Pupa."},{"lv":"Level 1: Basic","q":"Is light necessary for germination?","a":"No."},{"lv":"Level 1: Basic","q":"Name a plant that responds to touch.","a":"Touch-me-not (Mimosa)."},{"lv":"Level 2: Exam Standard","q":"Give three characteristics of living things.","a":"Growth, respiration, reproduction (any three)."},{"lv":"Level 2: Exam Standard","q":"Why did seeds under boiled water not germinate?","a":"No air (boiling removes dissolved air)."},{"lv":"Level 2: Exam Standard","q":"What is a tadpole?","a":"Young stage of a frog living in water."},{"lv":"Level 2: Exam Standard","q":"What is excretion?","a":"Removal of waste from the body."},{"lv":"Level 3: Competency / Application","q":"A robot can walk, talk and respond to commands. Is it alive?","a":"No — it does not grow, reproduce, respire or need food; it follows programs."},{"lv":"Level 3: Competency / Application","q":"Why do dengue cases rise after the rainy season?","a":"Stagnant water helps mosquitoes breed."},{"lv":"Level 3: Competency / Application","q":"Why is moong sprouted in a warm place, not the fridge?","a":"Germination needs suitable (warm) temperature."},{"lv":"Level 4: Challenge","q":"Seeds kept in the dark but with water, air and warmth germinate. What does this show?","a":"Light is not needed for germination (though seedlings need light later to make food)."},{"lv":"Level 4: Challenge","q":"Why is a burning candle not living though it ‘breathes’ oxygen and ‘grows’ smaller?","a":"It lacks growth, reproduction, response and life span; burning is a chemical change, not respiration of a living being."}],"comp":[{"q":"Plan an experiment to check whether seeds need soil to germinate.","a":"Keep seeds on moist cotton (no soil) and in moist soil, same conditions; both germinate → soil not needed for germination."},{"q":"Your school water tank has wriggling tiny creatures. What are they and what should be done?","a":"Mosquito larvae; clean the tank and keep it covered."},{"q":"Classify: mushroom, stone, seed, cloud, earthworm.","a":"Living: mushroom, seed (alive, dormant), earthworm; non-living: stone, cloud."}],"case":[{"t":"The school pond","p":"Students found jelly-like eggs in the school pond in July. A few weeks later, small creatures with tails swam around; later some had legs.","q":["(i) What were the eggs?","(ii) What are the creatures with tails?","(iii) Order of stages: (a) egg–froglet–tadpole–frog (b) egg–tadpole–froglet–frog (c) tadpole–egg– frog (d) egg–frog–tadpole","(iv) Why is the pond important for frogs?"],"a":["(i) Frog eggs (frogspawn).","(ii) Tadpoles.","(iii) (b).","(iv) Eggs and tadpoles need water."]}],"conc":[{"c":"Stimulus","e":"Change that causes a response.","x":"Light, touch.","cf":"Response is not always movement from place to place.","t":""},{"c":"Germination","e":"Seed begins growing.","x":"Moong sprouts.","cf":"Light is not essential for germination.","t":"W-A-T: Water, Air, Temperature"},{"c":"Life cycle","e":"Stages from birth to adult to reproduction.","x":"Frog.","cf":"Not all animals have larva stage.","t":"E-T-F-A frog; E-L-P-A mosquito"},{"c":"Metamorphosis","e":"Big change in body form during life cycle.","x":"Tadpole → frog.","cf":"Humans don’t undergo it.","t":""}],"notes":[{"h":"Characteristics of living things","t":"Need food (nutrition), breathe (respiration), grow, respond to stimuli, remove waste (excretion), reproduce, may move, and have a life span."},{"h":"Living vs non-living","t":"A car moves but is non-living — it does not grow, reproduce or breathe. A tree does not walk but is living."},{"h":"Seed germination","t":"A seed needs water, air and a suitable temperature to germinate. Soil and light are not needed for germination (seeds sprout on wet cotton)."},{"h":"Life cycles","t":"Frog: egg → tadpole → froglet → adult frog. Mosquito: egg → larva → pupa → adult (larva and pupa live in water — don’t let water collect!). Plants: seed → seedling → plant → flower → fruit/seed."},{"h":"Response to stimuli","t":"Plants bend towards light; touch-me-not leaves fold when touched; we blink in bright light."}]},{"n":11,"t":"Nature’s Treasures","intro":"Natural resources, renewable vs non-renewable, air and its uses, fossil fuels, and conservation. Differences and ’how to conserve’ answers carry most marks.","prio":[{"t":"Natural resources: air, water, sunlight, soil, forests, minerals, fossil fuels","s":3},{"t":"Renewable (sunlight, wind, water, forests if used wisely) vs non-renewable (coal, petroleum, natural gas, minerals)","s":3},{"t":"Air: nitrogen ≈ 78%, oxygen ≈ 21%, others ≈ 1% (CO₂ ≈ 0.04%); uses of air and wind","s":3},{"t":"Fossil fuels: formed from dead plants/animals over millions of years","s":3},{"t":"Conservation: reduce, reuse, recycle; saving water, electricity, fuel","s":3},{"t":"Respect for nature in Indian traditions (sacred groves etc.)","s":1}],"traps":[{"m":"Oxygen largest in air","c":"Nitrogen 78%","t":"N is No. 1"},{"m":"Coal renewable","c":"Non-renewable","t":"Coal = cannot come again soon"},{"m":"Vague conservation answers","c":"Give specific actions","t":"Action words"},{"m":"Reuse vs recycle confusion","c":"Reuse = use again as is; recycle = remake","t":"Re-make = recycle"}],"rq":[{"q":"Why should we plant trees?","a":"They give oxygen, prevent soil erosion, give food/wood and homes for animals."},{"q":"Why is petrol expensive and to be used carefully?","a":"It is non-renewable and limited."}],"mock":[{"q":"What are natural resources?","m":1,"a":"Useful things from nature."},{"q":"Differentiate between renewable and non-renewable resources.","m":3,"a":"See table."},{"q":"Give the percentage of nitrogen and oxygen in air.","m":2,"a":"78%; 21%."},{"q":"What are fossil fuels? Give two examples.","m":2,"a":"Fuels from ancient life; coal, petroleum."},{"q":"Give four ways to conserve resources.","m":4,"a":"Reduce, reuse, recycle, public transport, solar."},{"q":"Give two uses of wind.","m":2,"a":"Windmills, sailing."},{"q":"Why are forests important?","m":2,"a":"Oxygen, wood, wildlife, prevent erosion."}],"qs":[{"id":"sci11p0","k":"mcq","q":"Renewable resource:","o":["coal","petroleum","sunlight","natural gas"],"a":2,"e":"Never runs out.","imp":true},{"id":"sci11p1","k":"mcq","q":"Nitrogen in air:","o":["21%","78%","1%","50%"],"a":1,"e":"Largest part.","imp":true},{"id":"sci11p2","k":"mcq","q":"Fossil fuels formed from:","o":["rocks","dead plants and animals","sea water","sand"],"a":1,"e":"Millions of years.","imp":true},{"id":"sci11p3","k":"mcq","q":"Oxygen in air:","o":["78%","0.04%","21%","10%"],"a":2,"e":"About one-fifth.","imp":false},{"id":"sci11p4","k":"mcq","q":"Windmills use:","o":["moving air","coal","petrol","steam"],"a":0,"e":"Wind energy.","imp":false},{"id":"sci11p5","k":"mcq","q":"Using a cloth bag again and again is:","o":["reduce","reuse","recycle","refuse"],"a":1,"e":"Reuse.","imp":true},{"id":"sci11p6","k":"mcq","q":"Non-renewable:","o":["wind","water","coal","sunlight"],"a":2,"e":"Limited.","imp":false},{"id":"sci11t0","k":"tf","q":"Coal is renewable.","a":1,"e":"Non-renewable."},{"id":"sci11t1","k":"tf","q":"Air is mostly nitrogen.","a":0,"e":""},{"id":"sci11t2","k":"tf","q":"Fossil fuels form in a few years.","a":1,"e":"Millions of years."},{"id":"sci11t3","k":"tf","q":"Recycling helps save resources.","a":0,"e":""},{"id":"sci11t4","k":"tf","q":"Sunlight is a non-renewable resource.","a":1,"e":"Renewable."},{"id":"sci11a0","k":"ar","A":"Coal is non-renewable.","R":"It takes millions of years to form.","a":0,"e":"R explains A."},{"id":"sci11a1","k":"ar","A":"Air is mostly oxygen.","R":"Oxygen is needed for breathing.","a":3,"e":"A false (nitrogen 78%); R true."},{"id":"sci11a2","k":"ar","A":"Solar energy is renewable.","R":"The Sun will keep shining for billions of years.","a":0,"e":"R explains A."},{"id":"sci11x0","k":"mcq","q":"Nitrogen makes up about ___ of air.","o":["78%","21%","1%","50%"],"a":0,"e":"Most abundant gas.","sh":1,"x":1},{"id":"sci11x1","k":"mcq","q":"Oxygen makes up about ___ of air.","o":["21%","78%","0.04%","50%"],"a":0,"e":"Needed for breathing and burning.","sh":1,"x":1},{"id":"sci11x2","k":"mcq","q":"Which is a renewable resource?","o":["Sunlight","Coal","Petroleum","Natural gas"],"a":0,"e":"Will not run out.","sh":1,"x":1},{"id":"sci11x3","k":"mcq","q":"Coal, petroleum and natural gas are called:","o":["fossil fuels","renewable fuels","biofuels only","green fuels"],"a":0,"e":"Formed from remains of ancient living things.","sh":1,"x":1},{"id":"sci11x4","k":"mcq","q":"Which is a non-renewable resource?","o":["Petroleum","Wind","Sunlight","Water flow"],"a":0,"e":"Takes millions of years to form.","sh":1,"x":1},{"id":"sci11x5","k":"mcq","q":"Windmills use wind energy to:","o":["generate electricity or pump water","make coal","make rain","grow plants"],"a":0,"e":"Clean energy.","sh":1,"x":1},{"id":"sci11x6","k":"mcq","q":"Burning fossil fuels causes:","o":["air pollution","more oxygen","cleaner air","less smoke"],"a":0,"e":"Releases smoke and harmful gases.","sh":1,"x":1},{"id":"sci11x7","k":"mcq","q":"Forests help us by:","o":["giving oxygen, wood and preventing soil erosion","causing floods","polluting air","making deserts"],"a":0,"e":"Forests are treasures.","sh":1,"x":1},{"id":"sci11x8","k":"mcq","q":"Saving resources for future generations is:","o":["conservation","pollution","erosion","wastage"],"a":0,"e":"Reduce, reuse, recycle.","sh":1,"x":1},{"id":"sci11x9","k":"mcq","q":"Solar panels change sunlight into:","o":["electricity","coal","petrol","wind"],"a":0,"e":"Solar energy is renewable.","sh":1,"x":1},{"id":"sci11x10","k":"mcq","q":"Which gas do plants use to make food?","o":["Carbon dioxide","Nitrogen","Oxygen","Helium"],"a":0,"e":"Used in photosynthesis.","sh":1,"x":1},{"id":"sci11y0","k":"tf","q":"Fossil fuels will last forever.","a":1,"e":"They are non-renewable and limited.","x":1},{"id":"sci11y1","k":"tf","q":"Water is a natural resource.","a":0,"e":"","x":1},{"id":"sci11y2","k":"tf","q":"Switching off lights when not in use helps conserve resources.","a":0,"e":"","x":1},{"id":"sci11m0","k":"mcq","q":"Which gas is most abundant in air?","o":["Nitrogen","Oxygen","Carbon dioxide","Helium"],"a":0,"e":"About 78%.","sh":1,"x":1},{"id":"sci11m1","k":"mcq","q":"Solar energy is:","o":["renewable","non-renewable","a fossil fuel","polluting"],"a":0,"e":"Sun keeps shining.","sh":1,"x":1},{"id":"sci11m2","k":"mcq","q":"Petroleum is formed from:","o":["remains of ancient living things","sea salt","sand","air"],"a":0,"e":"Over millions of years.","sh":1,"x":1},{"id":"sci11m3","k":"mcq","q":"Which helps conserve resources?","o":["Fixing a leaking tap","Leaving lights on","Wasting paper","Burning plastic"],"a":0,"e":"Saves water.","sh":1,"x":1},{"id":"sci11m4","k":"mcq","q":"Coal is a ___ resource.","o":["non-renewable","renewable","man-made","unlimited"],"a":0,"e":"Limited stock.","sh":1,"x":1},{"id":"sci11f0","k":"mcq","fill":1,"q":"Air contains about ___% oxygen.","o":["21","78","1","50"],"a":0,"e":"","sh":1,"x":1},{"id":"sci11f1","k":"mcq","fill":1,"q":"Resources that can be replaced naturally are ___.","o":["renewable","non-renewable","fossil","mineral"],"a":0,"e":"","sh":1,"x":1},{"id":"sci11f2","k":"mcq","fill":1,"q":"Coal, petroleum and natural gas are ___ fuels.","o":["fossil","solar","wind","green"],"a":0,"e":"","sh":1,"x":1},{"id":"sci11c02","k":"mcq","q":"Energy in our town: A town gets most electricity from a coal power plant. The council plans to put solar panels on school roofs. — Burning coal adds which gas to air?","o":["nitrogen","oxygen","carbon dioxide","argon"],"a":2,"e":"(c)."}],"top":[{"q":"What are natural resources? Give examples.","m":2,"imp":true,"a":["Natural resources are materials and energy we get from nature that are useful to us: air, water, sunlight, soil, forests, minerals, coal, petroleum, natural gas."],"k":"Definition + four examples.","cm":"Listing man-made things like plastic."},{"q":"Differentiate between renewable and non-renewable resources with examples.","m":3,"imp":true,"a":["Renewable: can be replaced naturally in a short time or will not run out — sunlight, wind, water (through the water cycle), forests (if replanted).","Non-renewable: limited; take millions of years to form and will run out — coal, petroleum, natural gas, minerals."],"k":"Meaning + examples of each.","cm":"Calling coal renewable."},{"q":"What is the composition of air? Give two uses of each main gas.","m":3,"imp":true,"a":["Nitrogen ≈ 78%, oxygen ≈ 21%, other gases ≈ 1% (argon, carbon dioxide ≈ 0.04%, water vapour).","Oxygen: breathing, burning.","Carbon dioxide: plants use it to make food.","Nitrogen: needed for plant growth (proteins)."],"k":"Percentages (1) + uses (2).","cm":"Saying oxygen is the largest part of air."},{"q":"What are fossil fuels? Why are they called non-renewable?","m":3,"imp":true,"a":["Coal, petroleum and natural gas are fossil fuels, formed from dead plants and animals buried under the earth for millions of years, under heat and pressure. They are non-renewable because we use them much faster than they can form; once used, they are gone."],"k":"Examples + formation + reason.","cm":"Saying they form in a few years."},{"q":"How can we conserve natural resources? Give five ways.","m":5,"imp":true,"a":["Reduce use — switch off lights and fans; close taps.","Reuse — use both sides of paper, reuse bags and bottles.","Recycle — paper, plastic, metal, glass.","Use public transport, cycles, carpools to save fuel.","Use solar and wind energy; plant trees; harvest rainwater."],"k":"Five practical ways.","cm":"Vague answers like ‘save nature’."},{"q":"Give three uses of wind (moving air).","m":3,"imp":false,"a":["Windmills generate electricity / pump water.","Moves sailing boats; helps winnowing of grain.","Helps drying clothes, pollination and seed dispersal, cools us."],"k":"Three uses.","cm":"Repeating one idea."},{"q":"Why is sunlight called the main source of energy on Earth?","m":2,"imp":false,"a":["Plants use sunlight to make food; animals depend on plants; sunlight drives the water cycle and winds; even fossil fuels store energy from ancient sunlight."],"k":"Two chains.","cm":"Only ‘gives light’."},{"q":"Why are forests called a treasure?","m":3,"imp":false,"a":["Forests give oxygen, wood, fruits, medicines, fodder; they are home to wildlife, prevent soil erosion and floods, bring rain and keep the air cool."],"k":"Three benefits.","cm":"Only ‘wood’."},{"q":"What will happen if we keep using fossil fuels at today’s rate?","m":3,"imp":false,"a":["They will run out for future generations.","Burning them pollutes air (smoke, harmful gases) and adds carbon dioxide, causing global warming.","So we must use alternatives like solar and wind."],"k":"Depletion + pollution + solution.","cm":"Only one effect."}],"prac":[{"lv":"Level 1: Basic","q":"Name a renewable resource.","a":"Sunlight/wind."},{"lv":"Level 1: Basic","q":"Largest gas in air?","a":"Nitrogen."},{"lv":"Level 1: Basic","q":"Name a fossil fuel.","a":"Coal."},{"lv":"Level 1: Basic","q":"What does the first R stand for?","a":"Reduce."},{"lv":"Level 2: Exam Standard","q":"Percentage of oxygen in air?","a":"About 21%."},{"lv":"Level 2: Exam Standard","q":"Why is natural gas non-renewable?","a":"Takes millions of years to form; limited."},{"lv":"Level 2: Exam Standard","q":"Give two uses of forests.","a":"Wood, oxygen, medicines."},{"lv":"Level 2: Exam Standard","q":"Give one example of recycling.","a":"Old paper → new paper."},{"lv":"Level 3: Competency / Application","q":"Your school uses a lot of paper. Suggest three ways to reduce it.","a":"Use both sides, digital notices, recycle bins."},{"lv":"Level 3: Competency / Application","q":"Why is solar energy better than coal for electricity?","a":"Renewable, no smoke, never runs out."},{"lv":"Level 3: Competency / Application","q":"If there were no nitrogen in air, what would happen to plants?","a":"They could not make proteins; growth would suffer."},{"lv":"Level 4: Challenge","q":"Is water truly renewable in every place? Explain.","a":"Globally the water cycle renews it, but groundwater in a region can be used faster than rain refills it — so it can run short locally."},{"lv":"Level 4: Challenge","q":"How do sacred groves help conservation?","a":"Communities protect them from cutting, saving trees, water sources and wildlife."}],"comp":[{"q":"Make a ‘save resources’ plan for your home with one action each for water, electricity and fuel.","a":"• Water: fix leaks, bucket bath. • Electricity: switch off unused lights/fans. • Fuel: walk/cycle short distances, use pressure cooker."},{"q":"A village plans a windmill. What conditions make the place suitable?","a":"Strong, steady winds most of the year (open areas, coasts, hills)."},{"q":"Why are electric vehicles being encouraged?","a":"They reduce use of petrol/diesel (non-renewable) and air pollution in cities."}],"case":[{"t":"Energy in our town","p":"A town gets most electricity from a coal power plant. The council plans to put solar panels on school roofs.","q":["(i) Is coal renewable?","(ii) One benefit of solar panels?","(iii) Burning coal adds which gas to air? (a) nitrogen (b) oxygen (c) carbon dioxide (d) argon","(iv) Suggest one more step to save electricity."],"a":["(i) No.","(ii) Renewable; no smoke/pollution.","(iii) (c).","(iv) Switch off lights/fans; LED bulbs."]}],"conc":[{"c":"Natural resource","e":"Useful things from nature.","x":"Water.","cf":"Man-made from petroleum.","t":""},{"c":"Renewable","e":"Replenished naturally.","x":"Sunlight, wind.","cf":"Still must not be wasted.","t":"Re-new = comes again"},{"c":"Non-renewable","e":"Limited; formed over millions of years.","x":"Coal.","cf":"Not made again quickly.","t":""},{"c":"3 Rs","e":"Reduce, reuse, recycle.","x":"Cloth bag.","cf":"Reduce comes first.","t":"Reduce > Reuse > Recycle"}],"notes":[{"h":"Natural resources","t":"Things from nature that we use: air, water, sunlight, soil, forests, minerals, fossil fuels."},{"h":"Renewable vs non-renewable","t":"Renewable: replaced naturally (sunlight, wind, water, forests if managed). Non-renewable: limited, take millions of years to form (coal, petroleum, natural gas, minerals)."},{"h":"Air","t":"Mixture of gases: nitrogen ≈ 78%, oxygen ≈ 21%, others ≈ 1% (carbon dioxide ≈ 0.04%, water vapour). Moving air (wind) runs windmills and helps pollination and seed dispersal."},{"h":"Fossil fuels","t":"Formed from remains of ancient plants and animals buried deep under the earth. Burning them causes air pollution and releases carbon dioxide."},{"h":"Conservation","t":"Reduce, reuse, recycle; switch off lights and fans; fix leaking taps; use public transport; plant trees; use solar energy."}]},{"n":12,"t":"Beyond Earth","intro":"Stars, constellations, the Pole Star, the Solar System and India’s space missions. Learn planet order and one fact per planet; draw the Saptarishi–Pole Star figure.","prio":[{"t":"Stars: huge hot glowing balls of gas; the Sun is our nearest star","s":3},{"t":"Constellations: Saptarishi (Ursa Major/Big Dipper), Orion (Mriga), Cassiopeia","s":3},{"t":"Pole Star (Dhruva tara): found using the pointer stars of Saptarishi; appears fixed","s":3},{"t":"Solar System: Sun + 8 planets in order + moons, asteroids, comets","s":3},{"t":"Planets vs stars; inner rocky vs outer giant planets","s":3},{"t":"Moon (natural satellite); artificial satellites; Chandrayaan-3","s":2},{"t":"Stars appear to move east to west due to Earth’s rotation; light pollution","s":2}],"traps":[{"m":"Pluto in planet list","c":"8 planets only","t":"MVEMJSUN"},{"m":"Pole Star = brightest","c":"Not the brightest; appears fixed","t":"Fixed, not brightest"},{"m":"Mercury hottest","c":"Venus hottest","t":"Venus = very hot"},{"m":"Planets glow","c":"Reflect","t":"Stars glow, planets show"},{"m":"Asteroids Earth–Mars","c":"Mars–Jupiter","t":"M–J belt"}],"rq":[{"q":"Why can’t we see stars in the daytime?","a":"Bright sunlight hides their faint light."},{"q":"Why does Mars look red?","a":"Its soil is rich in iron oxide (rust)."}],"mock":[{"q":"Name the planets in order from the Sun.","m":2,"a":"Mercury → Neptune."},{"q":"Give two differences between a star and a planet.","m":2,"a":"Own light vs reflected; hot vs cooler."},{"q":"What is a constellation? Name two.","m":2,"a":"Star pattern; Saptarishi, Orion."},{"q":"Draw Saptarishi and show how to find the Pole Star.","m":4,"a":"Pointer line extended ~5 times."},{"q":"Why do stars appear to move east to west?","m":2,"a":"Earth rotates west to east."},{"q":"Name the largest and hottest planets.","m":2,"a":"Jupiter; Venus."},{"q":"What is an artificial satellite? Give one use.","m":2,"a":"Man-made orbiting body; weather/communication."}],"qs":[{"id":"sci12p0","k":"mcq","q":"Nearest star to Earth:","o":["Pole Star","Sun","Sirius","Moon"],"a":1,"e":"Our star.","imp":true}, ight.","a":1,"e":"It reflects sunlight.","x":1},{"id":"sci12y2","k":"tf","q":"Aditya-L1 is India’s mission to study the Sun.","a":0,"e":"","x":1},{"id":"sci12m0","k":"mcq","q":"Planet with famous rings:","o":["Saturn","Mars","Mercury","Venus"],"a":0,"e":"Bright rings of ice and rock.","sh":1,"x":1},{"id":"sci12m1","k":"mcq","q":"The asteroid belt lies between:","o":["Mars and Jupiter","Earth and Mars","Jupiter and Saturn","Venus and Earth"],"a":0,"e":"Rocky pieces orbiting the Sun.","sh":1,"x":1},{"id":"sci12m2","k":"mcq","q":"Dhruva Tara helps find:","o":["north","south","east","west"],"a":0,"e":"Pole Star.","sh":1,"x":1},{"id":"sci12m3","k":"mcq","q":"Mangalyaan was India’s mission to:","o":["Mars","the Moon","the Sun","Venus"],"a":0,"e":"Mars Orbiter Mission, 2014.","sh":1,"x":1},{"id":"sci12m4","k":"mcq","q":"Stars give light because:","o":["they are hot glowing gas","they reflect sunlight","they are made of ice","the Moon shines on them"],"a":0,"e":"Own light.","sh":1,"x":1},{"id":"sci12f0","k":"mcq","fill":1,"q":"The hottest planet in our Solar System is ___.","o":["Venus","Mercury","Mars","Jupiter"],"a":0,"e":"","sh":1,"x":1},{"id":"sci12f1","k":"mcq","fill":1,"q":"A pattern of stars in the sky is a ___.","o":["constellation","planet","comet","satellite"],"a":0,"e":"","sh":1,"x":1},{"id":"sci12f2","k":"mcq","fill":1,"q":"The Moon is a ___ satellite of the Earth.","o":["natural","artificial","man-made","hot"],"a":0,"e":"","sh":1,"x":1},{"id":"sci12c02","k":"mcq","q":"Night camp: At a school camp, students saw seven bright stars forming a ladle. Their teacher showed them how to find a star that stayed in the same place all night. — The Pole Star shows which direction?","o":["East","West","North","South"],"a":2,"e":"(c) North."}],"top":[{"q":"Name the planets of the Solar System in order from the Sun.","m":2,"imp":true,"a":["Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Memory trick: ‘My Very Educated Mother Just Served Us Noodles’."],"k":"Correct order.","cm":"Including Pluto (now a dwarf planet)."},{"q":"Differentiate between a star and a planet.","m":3,"imp":true,"a":["Light: a star has its own light; a planet reflects light from a star.","Heat: stars are extremely hot; planets are cooler.","Twinkling/position: stars appear to twinkle and keep their pattern; planets mostly shine steadily and change position against the stars over time."],"k":"Three bases.","cm":"Saying planets have their own light."},{"q":"What is a constellation? Name three.","m":3,"imp":true,"a":["A constellation is a group of stars that seem to form a recognisable pattern in the sky. Examples: Saptarishi (Ursa Major/Big Dipper), Orion (Mriga/Kalpurush), Cassiopeia."],"k":"Definition + three names.","cm":"Calling a single bright star a constellation."},{"q":"How can you locate the Pole Star? Why does it seem not to move?","m":3,"imp":true,"a":["Find Saptarishi (seven stars like a big ladle). The two stars at the end of the bowl are the pointer stars.","Draw an imaginary line through them and extend it about five times the distance between them — it reaches the Pole Star.","The Pole Star lies almost directly above the Earth’s axis (in the north), so it seems fixed while other stars appear to move around it."],"k":"Pointer method (2) + reason (1).","cm":"Saying the Pole Star is the brightest star."},{"q":"Why do stars appear to move from east to west during the night?","m":2,"imp":true,"a":["The Earth rotates from west to east on its axis, so the stars (and the Sun and Moon) appear to move from east to west across the sky."],"k":"Earth’s rotation W→E.","cm":"Saying stars actually move around the Earth."},{"q":"Write one special feature each of Mercury, Venus, Earth, Mars, Jupiter and Saturn.","m":3,"imp":true,"a":["Mercury: closest to the Sun, smallest planet.","Venus: hottest and brightest planet; seen as morning/evening ‘star’.","Earth: only known planet with life; liquid water.","Mars: red planet (iron-rich soil).","Jupiter: largest planet.","Saturn: famous bright rings."],"k":"½ each.","cm":"Calling Mercury the hottest."},{"q":"What is a satellite? Differentiate between natural and artificial satellites.","m":3,"imp":true,"a":["A satellite is a body that revolves around a planet.","Natural: e.g. the Moon (Earth’s natural satellite).","Artificial: made and launched by humans for communication, weather, navigation, research — e.g. INSAT, Chandrayaan orbiters."],"k":"Definition + two types with examples.","cm":"Calling the Moon a planet."},{"q":"What did Chandrayaan-3 achieve?","m":2,"imp":false,"a":["Chandrayaan-3 (ISRO) made a soft landing near the Moon’s south pole on 23 August 2023 — India became the first country to land near the lunar south pole. 23 August is celebrated as National Space Day."],"k":"Landing near south pole + date/first.","cm":"Saying it landed on Mars."},{"q":"What are asteroids and comets?","m":2,"imp":false,"a":["Asteroids: small rocky bodies orbiting the Sun, mostly in a belt between Mars and Jupiter. Comets: icy bodies with long orbits; near the Sun they develop a glowing tail pointing away from the Sun (e.g. Halley’s comet)."],"k":"Both with location/feature.","cm":"Placing the asteroid belt between Earth and Mars."},{"q":"What is light pollution? How does it affect stargazing?","m":2,"imp":false,"a":["Light pollution is excess artificial light at night (street lights, buildings) that brightens the sky, so fewer stars can be seen; it also disturbs animals and birds."],"k":"Meaning + effect.","cm":"Confusing with air pollution."}],"prac":[{"lv":"Level 1: Basic","q":"Nearest star to the Earth?","a":"The Sun."},{"lv":"Level 1: Basic","q":"Largest planet?","a":"Jupiter."},{"lv":"Level 1: Basic","q":"Earth’s natural satellite?","a":"The Moon."},{"lv":"Level 1: Basic","q":"Red planet?","a":"Mars."},{"lv":"Level 2: Exam Standard","q":"Which planet is closest to the Sun?","a":"Mercury."},{"lv":"Level 2: Exam Standard","q":"Why do planets shine?","a":"They reflect sunlight."},{
