":"ar","A":"There are 199 years between 100 BCE and 100 CE.","R":"There is no year 0.","a":0,"e":"No year 0 makes it 199, not 200."},{"id":"sst4a2","k":"ar","A":"Early humans settled in villages at once.","R":"They hunted and gathered food.","a":3,"e":"A false — they moved around; R true."},{"id":"sst4a3","k":"ar","A":"Archaeologists excavate carefully.","R":"Layers show the order in which things were left.","a":0,"e":"Careful digging preserves layer order."},{"id":"sst4x0","k":"mcq","q":"BCE means:","o":["Before Common Era","Before Christ Era","Begin Common Era","Before Current Event"],"a":0,"e":"Years counted backwards.","sh":1,"x":1},{"id":"sst4x1","k":"mcq","q":"A century is a period of:","o":["100 years","10 years","1000 years","50 years"],"a":0,"e":"Decade = 10, millennium = 1000.","sh":1,"x":1},{"id":"sst4x2","k":"mcq","q":"The 21st century includes the years:","o":["2001–2100","2000–2099","2100–2199","1901–2000"],"a":0,"e":"Centuries start at year 1.","sh":1,"x":1},{"id":"sst4x3","k":"mcq","q":"Bhimbetka rock shelters are in:","o":["Madhya Pradesh","Gujarat","Odisha","Kerala"],"a":0,"e":"Famous rock paintings.","sh":1,"x":1},{"id":"sst4x4","k":"mcq","q":"Coins, inscriptions and monuments are:","o":["archaeological sources","literary sources","oral sources only","maps"],"a":0,"e":"Physical remains.","sh":1,"x":1},{"id":"sst4x5","k":"mcq","q":"Manuscripts are:","o":["handwritten texts","stone tools","coins","buildings"],"a":0,"e":"Literary source.","sh":1,"x":1},{"id":"sst4x6","k":"mcq","q":"Mehrgarh is known for:","o":["early farming and domestication","steel factories","temples","coins"],"a":0,"e":"In present-day Pakistan (Balochistan).","sh":1,"x":1},{"id":"sst4x7","k":"mcq","q":"People who study the past by digging up remains are:","o":["archaeologists","astronauts","geologists only","engineers"],"a":0,"e":"Excavation.","sh":1,"x":1},{"id":"sst4x8","k":"mcq","q":"How many years from 200 BCE to 300 CE?","o":["499","500","100","501"],"a":0,"e":"No year 0: 200 + 300 − 1.","sh":1,"x":1},{"id":"sst4x9","k":"mcq","q":"Early humans who moved for food were:","o":["hunter-gatherers","farmers","traders","kings"],"a":0,"e":"Hunted animals, gathered plants.","sh":1,"x":1},{"id":"sst4x10","k":"mcq","q":"Which is older: 500 BCE or 300 BCE?","o":["500 BCE","300 BCE","Both same","Cannot say"],"a":0,"e":"In BCE, bigger number is older.","sh":1,"x":1},{"id":"sst4x11","k":"mcq","q":"Vikram Samvat begins in:","o":["57 BCE","78 CE","1 CE","2000 CE"],"a":0,"e":"Shaka Samvat begins in 78 CE.","sh":1,"x":1},{"id":"sst4y0","k":"tf","q":"There is a year 0 in the calendar.","a":1,"e":"1 BCE is followed by 1 CE.","x":1},{"id":"sst4y1","k":"tf","q":"Folk songs and stories passed down by word of mouth are oral sources.","a":0,"e":"","x":1},{"id":"sst4y2","k":"tf","q":"A millennium is 1000 years.","a":0,"e":"","x":1},{"id":"sst4m0","k":"mcq","q":"How many years in a millennium?","o":["1000","100","10","10,000"],"a":0,"e":"Mille = thousand.","sh":1,"x":1},{"id":"sst4m1","k":"mcq","q":"Which is the oldest?","o":["1000 BCE","500 BCE","100 CE","2000 CE"],"a":0,"e":"Biggest BCE number.","sh":1,"x":1},{"id":"sst4m2","k":"mcq","q":"Inscriptions on stone are a:","o":["archaeological source","oral source","literary source","map"],"a":0,"e":"Physical remains.","sh":1,"x":1},{"id":"sst4m3","k":"mcq","q":"Bhimbetka is famous for:","o":["rock paintings","harbours","steel","temples"],"a":0,"e":"Prehistoric art.","sh":1,"x":1},{"id":"sst4m4","k":"mcq","q":"The 19th century covers:","o":["1801–1900","1901–2000","1800–1899","1701–1800"],"a":0,"e":"Centuries start at year 1.","sh":1,"x":1},{"id":"sst4f0","k":"mcq","fill":1,"q":"Years counted backwards are marked ___.","o":["BCE","CE","AD","PM"],"a":0,"e":"","sh":1,"x":1},{"id":"sst4f1","k":"mcq","fill":1,"q":"Digging up a site to find remains is called ___.","o":["excavation","exploration","erosion","inscription"],"a":0,"e":"","sh":1,"x":1},{"id":"sst4f2","k":"mcq","fill":1,"q":"Shaka Samvat starts in ___ CE.","o":["78","57","1","2000"],"a":0,"e":"","sh":1,"x":1}],"top":[{"q":"What do BCE and CE mean? How are years counted in each?","m":3,"imp":true,"a":["CE = Common Era; BCE = Before Common Era. The dividing point is the traditionally accepted birth year of Jesus Christ. (Older terms: AD and BC.)","In CE, years are counted forward: 1 CE, 2 CE . . . 2026 CE.","In BCE, years are counted backward: 500 BCE is earlier than 100 BCE.","There is no year 0: 1 BCE is followed directly by 1 CE."],"k":"Full forms + counting direction in each + no year 0.","cm":"Thinking 500 BCE is more recent than 100 BCE."},{"q":"How many years passed between 300 BCE and 200 CE? Show working.","m":2,"imp":true,"a":["From 300 BCE to 1 BCE = 299 years; from 1 BCE to 1 CE = 1 year; from 1 CE to 200 CE = 199 years.","Total = 299 + 1 + 199 = 499 years.","Shortcut: BCE year + CE year − 1 (because there is no year 0) = 300 + 200 − 1 = 499."],"k":"Show the split or the formula; mention no year 0. (Some schools accept the simpler 300 + 200 = 500 — follow your teacher’s method, but know why 499 is exact.)","cm":"Subtracting (300 − 200 = 100) when the years are on opposite sides."},{"q":"What is a century? Which years form the 21st century and the 3rd century BCE?","m":2,"imp":true,"a":["A century is a period of 100 years; a decade is 10 years; a millennium is 1,000 years.","21st century CE: 2001 to 2100.","3rd century BCE: 300 BCE to 201 BCE (counting backward)."],"k":"Definitions + correct start and end years.","cm":"Writing the 21st century as 2100–2199 or 2000–2099."},{"q":"What are the sources of history? Classify them with examples.","m":5,"imp":true,"a":["Archaeological sources — physical remains: artefacts (tools, pots, ornaments, toys), monuments/buildings, coins, inscriptions on stone or metal, bones and seeds.","Literary (written) sources — manuscripts on palm leaf or birch bark, religious and nonreligious texts, travellers’ accounts.","Oral traditions — stories, songs, legends passed down by word of mouth from one generation to the next.","Scientists also help: e.g. dating old materials, studying ancient DNA and plant remains.","Using many sources together gives a more reliable picture."],"k":"Two/three categories + at least two examples each.","cm":"Calling coins ‘literary sources’."},{"q":"Who is an archaeologist? What do archaeologists do?","m":3,"imp":true,"a":["An archaeologist studies the past from material remains. They explore sites, excavate (dig carefully), record the layers in which objects are found, study artefacts, buildings, bones and seeds, and use them to understand how people lived, worked and what they ate."],"k":"Studies material remains + excavation + what they conclude.","cm":"Saying archaeologists read only books."},{"q":"What is an inscription? Why are inscriptions valuable?","m":2,"imp":false,"a":["An inscription is writing carved on a hard surface such as stone, metal or rock. It is valuable because it records orders of kings, events, gifts and dates directly from that time and lasts for a very long time."],"k":"Hard surface + what it records + durable/first-hand.","cm":"Confusing inscriptions with manuscripts (written on palm leaf/paper)."},{"q":"Describe the life of early humans (hunter-gatherers).","m":3,"imp":true,"a":["Early humans were hunter-gatherers: they hunted animals and gathered fruits, roots, nuts and seeds.","They moved from place to place in search of food and water, following animals and seasons.","They made stone tools (choppers, hand axes, blades) and later learnt to use fire for cooking, warmth and protection.","They lived in rock shelters and caves, e.g. Bhimbetka (Madhya Pradesh), and made rock paintings of animals, hunting and dancing."],"k":"Food, movement, tools, fire, shelter with example.","cm":"Saying early humans farmed from the start."},{"q":"Why is Bhimbetka important?","m":2,"imp":true,"a":["Bhimbetka, near Bhopal in Madhya Pradesh, has hundreds of rock shelters used by early humans. Their walls have rock paintings of animals, hunting, dancing and daily life, some thousands of years old. It is a UNESCO World Heritage Site and shows us how early people lived and what they saw around them."],"k":"Location + rock shelters + paintings + what they tell us.","cm":"Placing Bhimbetka in Rajasthan."},{"q":"How did the beginning of farming change human life?","m":3,"imp":true,"a":["People began to grow crops (wheat, barley) and domesticate animals (sheep, goats, cattle), roughly 10,000 years ago.","They settled in one place to look after crops → villages developed, e.g. Mehrgarh (in present-day Pakistan), one of the earliest farming villages of the subcontinent.","Surplus food could be stored in pots; people had time for crafts; population grew."],"k":"Crops + animals + settled life + surplus/storage.","cm":"Mixing up Mehrgarh (farming village) and Mohenjo-daro (Harappan city)."},{"q":"What are oral traditions? Give one advantage and one limitation.","m":2,"imp":false,"a":["Oral traditions are stories, songs, poems and knowledge passed on by word of mouth. Advantage: preserve the history of communities that did not write. Limitation: details may change over time as they are retold."],"k":"Definition + one advantage + one limitation.","cm":"Saying oral traditions are written."},{"q":"Name two Indian calendars and the year each begins from.","m":2,"imp":false,"a":["Vikram Samvat — begins in 57 BCE. Shaka Samvat — begins in 78 CE; it is the basis of India’s national calendar."],"k":"Both names + both starting years with BCE/CE.","cm":"Swapping the two dates."},{"q":"What is a timeline? Draw a timeline showing 3000 BCE, 1500 BCE, 1 CE and 1500 CE.","m":3,"imp":false,"a":["A timeline is a line on which events are marked in the order in which they happened, at equal intervals for equal periods. Draw a horizontal line; mark 3000 BCE at the far left, then 1500 BCE, then a mark for the BCE | CE divide, then 1 CE, then 1500 CE on the right, with arrows showing time moving left to right."],"k":"Definition + correct left-to-right order + BCE/CE divide.","cm":"Putting 1500 BCE to the left of 3000 BCE."}],"prac":[{"lv":"Level 1: Basic","q":"What does CE stand for?","a":"Common Era."},{"lv":"Level 1: Basic","q":"How many years make a millennium?","a":"1,000 years."},{"lv":"Level 1: Basic","q":"Where is Bhimbetka?","a":"Near Bhopal, Madhya Pradesh."},{"lv":"Level 1: Basic","q":"Which is older: 800 BCE or 300 BCE?","a":"800 BCE."},{"lv":"Level 2: Exam Standard","q":"In which century is the year 1947?","a":"20th century CE (1901–2000)."},{"lv":"Level 2: Exam Standard","q":"Give two examples of archaeological sources.","a":"Coins, inscriptions, tools, pottery, monuments (any two)."},{"lv":"Level 2: Exam Standard","q":"How many years from 150 BCE to 150 CE?","a":"150 + 150 − 1 = 299 years."},{"lv":"Level 2: Exam Standard","q":"Why did early humans live near rivers and lakes?","a":"For water, and because animals came there to drink, making hunting easier."},{"lv":"Level 3: Competency / Application","q":"Your grandmother tells stories about your village’s festival from long ago. What kind of source is this? Give one way to check it.","a":"Oral tradition. It can be checked against old photos, records, inscriptions or other elders’ accounts."},{"lv":"Level 3: Competency / Application","q":"A coin shows a king’s name and the date 120 CE. What two things can a historian learn from it?","a":"Who ruled and when; also trade/economy, language/script and art of that time."},{"lv":"Level 3: Competency / Application","q":"Arrange in order, oldest first: Shaka Samvat begins, Mehrgarh farming, Vikram Samvat begins, Bhimbetka paintings.","a":"Bhimbetka paintings → Mehrgarh farming → Vikram Samvat (57 BCE) → Shaka Samvat (78 CE)."},{"lv":"Level 4: Challenge","q":"A student says, ‘From 1 BCE to 1 CE is 2 years.’ Is she right? Explain.","a":"No. There is no year 0, so 1 BCE is followed directly by 1 CE — the gap is only 1 year."},{"lv":"Level 4: Challenge","q":"Why do historians prefer to use several sources instead of one?","a":"One source may be incomplete, biased or damaged; comparing many sources gives a more reliable and complete picture."}],"comp":[{"q":"You find an old palm-leaf book in your grandparents’ house. Is it an archaeological or a literary source? How should it be protected?","a":"It is a literary source (manuscript). Protect it from moisture, insects and sunlight; handle gently; give it to a museum or library for preservation/digitisation."},{"q":"Make a mini-timeline of your own life with 4 events. Why are equal gaps important?","a":"Example: born 2015 → started school 2019 → learnt cycling 2021 → joined Class 6 2026. Equal gaps show correctly how much time passed between events."},{"q":"A museum label says ‘Pot, c. 2500 BCE’. What does ‘c.’ mean, and about how old is the pot in 2026?","a":"‘c.’ = circa, about. Age ≈ 2500 + 2026 − 1 = about 4,525 years."}],"case":[{"t":"Paintings on the rocks","p":"In the forests near Bhopal lie the rock shelters of Bhimbetka. On their walls are paintings of bison, deer, elephants, people hunting with bows, and people dancing together. Some of these paintings are thousands of years old.","q":["(i) In which state is Bhimbetka?","(ii) What do the paintings tell us about early humans? Give two points.","(iii) Is a rock painting an archaeological or literary source?","(iv) Why must visitors not touch or scratch these paintings?"],"a":["(i) Madhya Pradesh.","(ii) They hunted animals with bows and arrows; they lived in groups and danced/celebrated; they observed animals closely.","(iii) Archaeological source.","(iv) They are fragile, irreplaceable heritage; damage destroys evidence of our past."]},{"t":"Counting the years","p":"The Buddha lived around the 5th century BCE. Emperor Ashoka ruled in the 3rd century BCE. The Shaka era began in 78 CE.","q":["(i) Who lived earlier, the Buddha or Ashoka?","(ii) Which years make up the 3rd century BCE?","(iii) How many years from 78 CE to 2026 CE?","(iv) Why is there no subtraction of 1 in (iii)?"],"a":["(i) The Buddha (5th century BCE is earlier than 3rd century BCE).","(ii) 300 BCE to 201 BCE.","(iii) 2026 − 78 = 1,948 years.","(iv) Both years are in CE, so we do not cross the missing year 0."]}],"conc":[{"c":"BCE/CE","e":"Two eras separated by the traditional birth year of Jesus.","x":"Buddha lived around the 5th century BCE.","cf":"Bigger BCE number = older.","t":"BCE = Backward Counting Era"},{"c":"No year 0 Century","e":"The calendar jumps from 1 BCE to 1 CE.","x":"300 BCE → 200 CE = 499 years. 100-year period; 1st century = 1–100. Example: 21st century = 2001–2100.","cf":"Many students add directly.","t":"Cross the line? Add, then −1 Exam Q: In which century is 1857? Confusion: Century number = first two digits + 1 (for years not ending in 00). Trick: 1857 → 18 + 1 = 19th"},{"c":"Primary vs secondary source","e":"Primary: from that time (coin, inscription). Secondary: written later about it (a textbook).","x":"Ashoka’s edict = primary.","cf":"A textbook is not a primary source.","t":""},{"c":"Huntergatherer","e":"Person who gets food by hunting and gathering, moving often.","x":"Early people at Bhimbetka.","cf":"They were not farmers.","t":""}],"notes":[{"h":"Counting years","t":"BCE (Before Common Era) years are counted backwards: 500 BCE is older than 300 BCE. CE years count forwards. There is no year 0 (1 BCE → 1 CE)."},{"h":"Time units","t":"Decade = 10 years · Century = 100 years · Millennium = 1000 years. 21st century = 2001–2100."},{"h":"Years between dates","t":"Same era: subtract. Across BCE/CE: add, then subtract 1 (200 BCE to 300 CE = 499 years)."},{"h":"Sources of history","t":"Archaeological: tools, pottery, coins, inscriptions, monuments, bones. Literary: manuscripts, books, texts. Oral: songs, stories, traditions passed by word of mouth."},{"h":"Archaeology","t":"Archaeologists excavate (dig) sites carefully and study remains to understand the past."},{"h":"Early humans","t":"Hunter-gatherers using stone tools and fire; lived in caves and rock shelters. Bhimbetka (Madhya Pradesh): rock paintings over 10,000 years old."},{"h":"Farming begins","t":"Domestication of plants and animals led to settled villages. Mehrgarh (Balochistan) is an early farming site (about 7000 BCE)."}]},{"n":5,"t":"India, That Is Bharat","intro":"A short chapter about the names of our country and where they come from. Learn each name with its source — that is exactly how questions are framed.","prio":[{"t":"Constitution, Article 1: ’India, that is Bharat, shall be a Union of States’","s":3},{"t":"Sapta Sindhava — ’land of seven rivers’ (Rig Veda)","s":3},{"t":"Bharata / Bharatavarsha — from the Bharata people; Vishnu Purana verse (north of the ocean, south of the snowy mountains)","s":3},{"t":"Jambudvipa — ’island of the jamun tree’; used by Emperor Ashoka","s":3},{"t":"Foreign names: Hindu (Persian, from Sindhu), Indos/India (Greek), Yindu (Chinese), Al-Hind (Arabic), Hindustan","s":3},{"t":"Why names changed: sound changes between languages","s":2}],"traps":[{"m":"Hindustan as an official name","c":"Official: India and Bharat (Article 1)","t":"Article ONE → TWO names"},{"m":"Yindu = Arabic","c":"Yindu = Chinese; Al-Hind = Arabic","t":"Al = Arabic article"},{"m":"Sapta Sindhava = seven seas","c":"Seven rivers","t":"Sindhu = river"},{"m":"Megasthenes = Chinese","c":"Megasthenes = Greek (Indika)","t":"Mega = Greek word"},{"m":"Jambudvipa used by Akbar","c":"Used by Ashoka","t":"A for Ashoka and jAmun"},{"m":"India came from English","c":"India ← Greek Indos ← Persian Hindu ← Sindhu","t":"S-H-I chain"}],"rq":[{"q":"Why did Persians say ’Hindu’ instead of ’Sindhu’?","a":"In Old Persian the ’s’ sound regularly changed to ’h’."},{"q":"Why is Article 1 important for the name question?","a":"It is the highest law and officially recognises both names."},{"q":"Why were rivers used to name lands?","a":"Rivers were major landmarks for travellers and traders."}],"mock":[],"qs":[{"id":"sst5p0","k":"mcq","q":"Article 1 of the Constitution says:","o":["India is Hindustan","India, that is Bharat, shall be a Union of States","Bharat is Jambudvipa","India is a republic of rivers"],"a":1,"e":"Exact wording.","imp":true},{"id":"sst5p1","k":"mcq","q":"Sapta Sindhava means:","o":["seven seas","seven rivers","seven hills","seven kings"],"a":1,"e":"Land of seven rivers.","imp":true},{"id":"sst5p2","k":"mcq","q":"Jambudvipa is named after:","o":["mango","banyan","jamun","neem"],"a":2,"e":"Jamun tree.","imp":true},{"id":"sst5p3","k":"mcq","q":"Which text describes Bharata as north of the ocean and south of the snowy mountains?","o":["Rig Veda","Vishnu Purana","Indika","Arthashastra"],"a":1,"e":"Vishnu Purana verse.","imp":false},{"id":"sst5p4","k":"mcq","q":"The Persians called the land:","o":["Indos","Hindu","Yindu","Al-Hind"],"a":1,"e":"S → H sound change.","imp":true},{"id":"sst5p5","k":"mcq","q":"The Greeks called it:","o":["Indos/Indikē","Hindustan","Jambudvipa","Bharat"],"a":0,"e":"Source of ’India’.","imp":false},{"id":"sst5p6","k":"mcq","q":"Al-Hind was used by the:","o":["Chinese","Greeks","Arabs","Persians"],"a":2,"e":"Arabic name.","imp":false},{"id":"sst5p7","k":"mcq","q":"Xuanzang came from:","o":["Greece","Persia","China","Arabia"],"a":2,"e":"Chinese pilgrim.","imp":false},{"id":"sst5p8","k":"mcq","q":"’Bharata’ is linked to a people mentioned in the:","o":["Rig Veda","Ramayana only","Constitution only","Indika"],"a":0,"e":"The Bharatas.","imp":false},{"id":"sst5p9","k":"mcq","q":"Which emperor used ’Jambudvipa’ in an inscription?","o":["Chandragupta","Ashoka","Akbar","Samudragupta"],"a":1,"e":"3rd century BCE.","imp":false},{"id":"sst5p10","k":"mcq","q":"The river that gave India its foreign names is the:","o":["Ganga","Sindhu","Kaveri","Brahmaputra"],"a":1,"e":"Indus/Sindhu.","imp":true},{"id":"sst5p11","k":"mcq","q":"The book ’Indika’ was written by:","o":["Xuanzang","Megasthenes","Ashoka","Darius"],"a":1,"e":"Greek ambassador.","imp":false},{"id":"sst5t0","k":"tf","q":"Both India and Bharat are official names.","a":0,"e":""},{"id":"sst5t1","k":"tf","q":"Sapta Sindhava is mentioned in the Rig Veda.","a":0,"e":""},{"id":"sst5t2","k":"tf","q":"The name India came from English.","a":1,"e":"From Greek Indos/Indikē, from Sindhu."},{"id":"sst5t3","k":"tf","q":"Jambudvipa means land of the mango tree.","a":1,"e":"Jamun tree."},{"id":"sst5t4","k":"tf","q":"Arabs called India Yindu.","a":1,"e":"Arabs: Al-Hind; Chinese: Yindu."},{"id":"sst5t5","k":"tf","q":"Early Persian use of ’Hindu’ was geographical.","a":0,"e":""},{"id":"sst5t6","k":"tf","q":"Bharatavarsha lies south of the ocean.","a":1,"e":"North of the ocean, south of the Himalayas."},{"id":"sst5t7","k":"tf","q":"Megasthenes was a Chinese traveller.","a":1,"e":"He was a Greek ambassador."},{"id":"sst5a0","k":"ar","A":"The Greeks called the land Indos.","R":"They dropped the ’h’ sound of the Persian word Hindu.","a":0,"e":"Sound change explains the Greek form."},{"id":"sst5a1","k":"ar","A":"Jambudvipa is an ancient name of India.","R":"Ashoka used it in an inscription.","a":1,"e":"Both true; Ashoka’s use is evidence, not the reason for the name."},{"id":"sst5a2","k":"ar","A":"India has only one official name.","R":"Article 1 mentions India and Bharat.","a":3,"e":"A false; R true."},{"id":"sst5a3","k":"ar","A":"Sapta Sindhava referred to north-west India.","R":"The Sindhu and other rivers flow there.","a":0,"e":"The rivers give the name."},{"id":"sst5x0","k":"mcq","q":"Article 1 of the Constitution says:","o":["India, that is Bharat, shall be a Union of States","India is Hindustan","Bharat is a state","India has no name"],"a":0,"e":"Two official names.","sh":1,"x":1},{"id":"sst5x1","k":"mcq","q":"Ancient texts often called our land:","o":["Jambudvipa","Atlantis","Mesopotamia","Gondwana"],"a":0,"e":"‘Island of the jambu tree’.","sh":1,"x":1},{"id":"sst5x2","k":"mcq","q":"The name ‘India’ came from the Greeks who called the land after the river:","o":["Indus (Sindhu)","Ganga","Yamuna","Narmada"],"a":0,"e":"Sindhu → Hindu → Indos.","sh":1,"x":1},{"id":"sst5x3","k":"mcq","q":"The Chinese traveller Xuanzang called India:","o":["Yindu","Hindustan","Bharata","Al-Hind"],"a":0,"e":"Chinese name.","sh":1,"x":1},{"id":"sst5x4","k":"mcq","q":"The Arabs called India:","o":["Al-Hind","Indos","Yindu","Tianzhu"],"a":0,"e":"Arabic name.","sh":1,"x":1},{"id":"sst5x5","k":"mcq","q":"‘Bharata’ comes from the name of an ancient:","o":["tribe/clan (the Bharatas)","ocean","mountain","bird"],"a":0,"e":"Mentioned in the Rig Veda.","sh":1,"x":1},{"id":"sst5x6","k":"mcq","q":"The Vishnu Purana says Bharata lies north of the ocean and south of the:","o":["Himalayas","Vindhyas","Ganga","Thar"],"a":0,"e":"Snowy mountains.","sh":1,"x":1},{"id":"sst5x7","k":"mcq","q":"Bharata is often described as:","o":["the land between the Himalayas and the ocean","a desert","an island in Africa","a single city"],"a":0,"e":"Geographic idea of India.","sh":1,"x":1},{"id":"sst5x8","k":"mcq","q":"Persians pronounced ‘S’ as ‘H’, so Sindhu became:","o":["Hindu","Indus","Yindu","Bharata"],"a":0,"e":"Sound change.","sh":1,"x":1},{"id":"sst5y0","k":"tf","q":"India has two official names: India and Bharat.","a":0,"e":"","x":1},{"id":"sst5y1","k":"tf","q":"‘Hindustan’ is an official name in the Constitution.","a":1,"e":"Only India and Bharat are official.","x":1},{"id":"sst5y2","k":"tf","q":"The Greeks named India after the Sindhu river.","a":0,"e":"","x":1},{"id":"sst5m0","k":"mcq","q":"Xuanzang came to India from:","o":["China","Greece","Persia","Arabia"],"a":0,"e":"7th-century traveller.","sh":1,"x":1},{"id":"sst5m1","k":"mcq","q":"The name ‘India’ comes from:","o":["the river Indus","a king","a mountain","a festival"],"a":0,"e":"Greeks named it.","sh":1,"x":1},{"id":"sst5m2","k":"mcq","q":"Which Article of the Constitution names India and Bharat?","o":["Article 1","Article 21","Article 370","Article 51"],"a":0,"e":"First article.","sh":1,"x":1},{"id":"sst5m3","k":"mcq","q":"Jambudvipa refers to the:","o":["jamun tree","Ganga river","Himalayas","ocean"],"a":0,"e":"‘Island of the jambu tree’.","sh":1,"x":1},{"id":"sst5f0","k":"mcq","fill":1,"q":"The Arabs called India ___.","o":["Al-Hind","Yindu","Indos","Jambudvipa"],"a":0,"e":"","sh":1,"x":1},{"id":"sst5f1","k":"mcq","fill":1,"q":"In Persian, Sindhu became ___.","o":["Hindu","Indus","India","Bharat"],"a":0,"e":"","sh":1,"x":1},{"id":"sst5f2","k":"mcq","fill":1,"q":"Bharata were an ancient ___ mentioned in the Rig Veda.","o":["clan","river","mountain","ocean"],"a":0,"e":"","sh":1,"x":1},{"id":"sst5c02","k":"mcq","q":"A traveller’s name: In the 7th century CE, a Chinese monk walked thousands of kilometres to India to study Buddhism at Nalanda. He called the land ‘Yindu’. Centuries earlier, a Greek ambassador at the Mauryan court had written a book about the land, calling it ‘Indika’. — From which river are both these names derived?","o":["Ganga","Sindhu","Yamuna","Narmada"],"a":1,"e":"(b) Sindhu."}],"top":[{"q":"What does Article 1 of the Constitution of India say about the name of our country?","m":1,"imp":true,"a":["Article 1 says: ‘India, that is Bharat, shall be a Union of States.’ So our country has two official names — India and Bharat."],"k":"Exact wording + both names official.","cm":"Writing ‘Hindustan’ as an official name."},{"q":"What does ‘Sapta Sindhava’ mean? Where is this name found?","m":2,"imp":true,"a":["Sapta Sindhava means ‘land of seven rivers’. It is found in the Rig Veda, the oldest Indian text, and refers to the north-western region watered by the Sindhu (Indus) and other rivers."],"k":"Meaning + Rig Veda + north-west region.","cm":"Saying it means ‘seven seas’."},{"q":"How did our country get the name ‘Bharata’? Quote the Vishnu Purana description.","m":3,"imp":true,"a":["The name comes from the Bharatas, a prominent people/clan mentioned in the Rig Veda; later texts link it to a king named Bharata.","The Vishnu Purana describes Bharatam/Bharatavarsha as the land north of the ocean and south of the snowy mountains, where the descendants of Bharata live.","The Mahabharata also uses Bharatavarsha for the whole land."],"k":"Bharata people + Vishnu Purana description + wider use.","cm":"Saying the name was given by the British."},{"q":"What is Jambudvipa? Who used this name?","m":2,"imp":true,"a":["Jambudvipa means ‘the island (land) of the jamun tree’. It was an ancient name for the Indian subcontinent. Emperor Ashoka used it in one of his inscriptions (3rd century BCE)."],"k":"Meaning + Ashoka’s inscription.","cm":"Linking it to mango trees."},{"q":"How did the names ‘Hindu’ and ‘India’ come from ‘Sindhu’?","m":3,"imp":true,"a":["The river Sindhu (Indus) gave its name to the land around it.","In the Persian language the ‘s’ sound changed to ‘h’, so Sindhu became Hindu; Persian inscriptions of Darius (about 6th century BCE) call the region ‘Hindu’ — a geographical name. Later: Hindustan.","The Greeks dropped the ‘h’ and said Indos/Indikē; from this came India. Megasthenes wrote a book called Indika."],"k":"Sindhu → Hindu (Persian) → Indos/India (Greek) with sound change.","cm":"Saying ‘India’ came from English."},{"q":"List the names by which foreign visitors called India.","m":3,"imp":true,"a":["Persians: Hindu, later Hindustan.","Greeks: Indos / Indikē (→ India).","Chinese: Yindu (used by the traveller Xuanzang); also Shendu earlier.","Arabs: Al-Hind."],"k":"Four peoples with their names.","cm":"Mixing Al-Hind (Arabic) with Yindu (Chinese)."},{"q":"Why do you think the land was named after a river?","m":2,"imp":false,"a":["The Sindhu was the first great river that visitors from the north-west (Persia, Greece) crossed or saw. Rivers were important landmarks for travellers and traders, so the land beyond it was named after the river."],"k":"Landmark + first seen by visitors from the west.","cm":"Answering only ‘because it was big’."},{"q":"Why does our country have many names? What does this show?","m":3,"imp":false,"a":["People inside India used names from their own texts (Bharata, Jambudvipa, Sapta Sindhava).","Foreign visitors named it in their own languages, usually from the Sindhu river (Hindu, Indos, Yindu, Al-Hind).","It shows India’s long history, its contact with many lands through trade and travel, and how it was admired by the world."],"k":"Internal names + external names + what it shows.","cm":"Writing only a list without explaining."},{"q":"What are the boundaries of Bharatavarsha as described in old texts?","m":2,"imp":false,"a":["North: the snowy mountains (Himalayas). South: the ocean. So Bharatavarsha was the land between the Himalayas and the seas — roughly the whole subcontinent."],"k":"Himalaya in north + ocean in south.","cm":"Giving present-day state boundaries."},{"q":"Who was Xuanzang and what name did he use for India?","m":2,"imp":false,"a":["Xuanzang was a Chinese Buddhist pilgrim who travelled to India in the 7th century CE to study and collect Buddhist texts. He used the name Yindu for India."],"k":"Chinese pilgrim + Yindu.","cm":"Calling him a Greek traveller."}],"prac":[{"lv":"Level 1: Basic","q":"What does ‘Sapta Sindhava’ mean?","a":"Land of seven rivers."},{"lv":"Level 1: Basic","q":"Which Article of the Constitution names India and Bharat?","a":"Article 1."},{"lv":"Level 1: Basic","q":"What did the Arabs call India?","a":"Al-Hind."},{"lv":"Level 1: Basic","q":"Which emperor used the word Jambudvipa?","a":"Ashoka."},{"lv":"Level 2: Exam Standard","q":"Name two names of India found in Indian texts.","a":"Bharata/Bharatavarsha, Jambudvipa, Sapta Sindhava (any two)."},{"lv":"Level 2: Exam Standard","q":"From which river do the names Hindu and India come?","a":"Sindhu (Indus)."},{"lv":"Level 2: Exam Standard","q":"Who wrote Indika?","a":"Megasthenes, a Greek ambassador."},{"lv":"Level 2: Exam Standard","q":"What is meant by ‘Union of States’?","a":"India is made of states joined together under one country/government."},{"lv":"Level 3: Competency / Application","q":"Your cousin abroad asks why India has two official names. Explain in 2–3 lines.","a":"The Constitution (Article 1) says ‘India, that is Bharat’. Bharat comes from our ancient texts; India comes from the Greek name for the land of the Sindhu. Both are official."},{"lv":"Level 3: Competency / Application","q":"Complete: Sindhu → ____ (Persian) → ____ (Greek).","a":"Hindu; Indos (→ India)."},{"lv":"Level 3: Competency / Application","q":"Which name for India is linked to a tree? What does it tell us about ancient people?","a":"Jambudvipa (jamun tree). They named lands after familiar natural features they valued."},{"lv":"Level 4: Challenge","q":"Why might foreigners and Indians have used different names for the same land?","a":"Each named it in their own language and from their own point of view — Indians from their texts and people (Bharatas), foreigners from the river they first met (Sindhu)."},{"lv":"Level 4: Challenge","q":"Is ‘Hindu’ in Darius’s inscription a religious name? Explain.","a":"No. There it was a geographical name for the land/people beyond the Sindhu river."}],"comp":[{"q":"A signboard at the airport says ‘Welcome to Bharat’ in Hindi and ‘Welcome to India’ in English. Is this correct? Why?","a":"Yes. Article 1 makes both India and Bharat official names, so either can be used."},{"q":"Make a table of four foreign names for India with the people who used them.","a":"• Persians — Hindu/Hindustan • Greeks — Indos/Indikē • Chinese — Yindu • Arabs — Al-Hind"},{"q":"Why is it useful for historians to know old names of places?","a":"Old texts, inscriptions and travellers’ accounts use those names; knowing them helps historians understand which place a source is talking about."}],"case":[{"t":"A traveller’s name","p":"In the 7th century CE, a Chinese monk walked thousands of kilometres to India to study Buddhism at Nalanda. He called the land ‘Yindu’. Centuries earlier, a Greek ambassador at the Mauryan court had written a book about the land, calling it ‘Indika’.","q":["(i) Name the Chinese monk.","(ii) Name the Greek ambassador.","(iii) From which river are both these names derived? (a) Ganga (b) Sindhu (c) Yamuna (d) Narmada","(iv) What does this tell us about India’s links with other lands?"],"a":["(i) Xuanzang.","(ii) Megasthenes.","(iii) (b) Sindhu.","(iv) India was well known abroad; there was travel, learning and trade with China and Greece."]}],"conc":[{"c":"Sound change","e":"When a word moves to another language its sounds change.","x":"Sindhu → Hindu (s → h) → Indos (h dropped).","cf":"The meaning stays linked to the river.","t":"S → H → (drop) = Sindhu → Hindu → Indu/India"},{"c":"Geographical name","e":"A name based on a place or river, not on religion.","x":"Persian ‘Hindu’ meant people/land beyond the Sindhu.","cf":"Its early meaning was about location.","t":""},{"c":"Bharatavarsha","e":"Land of the Bharatas; between Himalayas and the ocean.","x":"Vishnu Purana verse.","cf":"Not the same as a modern state.","t":"Bharat = Between Himalaya And sea"}],"notes":[{"h":"Official names","t":"Article 1 of the Constitution: “India, that is Bharat, shall be a Union of States.” Two official names: India and Bharat."},{"h":"Ancient names","t":"Jambudvipa (island of the jambu/jamun tree), Bharata/Bharatavarsha (land of the Bharatas, an ancient clan in the Rig Veda), Aryavarta."},{"h":"Vishnu Purana","t":"Describes Bharata as the land north of the ocean and south of the snowy mountains (Himalayas)."},{"h":"Names given by others","t":"Persians: Hindu (Sindhu → Hindu, ‘s’ became ‘h’). Greeks: Indos/India (from Indus). Chinese: Yindu, Tianzhu (Xuanzang). Arabs: Al-Hind."},{"h":"Geographical origin","t":"Names like Hindu and India came from the river Sindhu (Indus) — they described a place, not a religion."}]},{"n":6,"t":"The Beginnings of Indian Civilisation","intro":"The Harappan (Sindhu–Sarasvati) civilisation produces long answers, map work and case studies. Learn city features + 4 sites + decline first.","prio":[{"t":"Meaning of civilisation; Harappan / Sindhu–Sarasvati civilisation; mature phase c. 2600–1900 BCE","s":3},{"t":"Main sites: Harappa, Mohenjo-daro, Dholavira, Lothal, Kalibangan, Rakhigarhi","s":3},{"t":"Town planning: grid streets, drainage, baked bricks, citadel + lower town","s":3},{"t":"Great Bath, granaries, Dholavira water system, Lothal dockyard","s":3},{"t":"Economy: farming (wheat, barley, cotton), crafts (beads, seals), trade with Mesopotamia","s":3},{"t":"Script on seals — not yet deciphered; weights and measures","s":2},{"t":"Decline (c. 1900 BCE): climate change, drying of Sarasvati, decline of trade","s":3},{"t":"Legacy: what continues in Indian life today","s":2}],"traps":[{"m":"Great Bath at Harappa","c":"Great Bath = Mohenjo-daro","t":"M for Mohenjo, M for Mega bath"},{"m":"Lothal = Rajasthan","c":"Lothal and Dholavira = Gujarat","t":"L & D = Gujarat duo"},{"m":"Script ’deciphered’","c":"Not deciphered","t":"Still a puzzle"},{"m":"Iron tools","c":"Copper and bronze only","t":"Bronze Age"},{"m":"Single cause of decline","c":"Several causes; gradual","t":"C-R-T"},{"m":"Harappa in Indian Punjab","c":"Harappa in Pakistan’s Punjab (Ravi)","t":"Both big cities now in Pakistan"},{"m":"Forgetting drains in town planning","c":"Always include drainage","t":"Drains = full marks"},{"m":"Mohenjo-daro ’mound of the living’","c":"Mound of the dead","t":""}],"rq":[{"q":"Why were Harappan cities called ’planned’?","a":"Grid streets, standard bricks, drains and separate areas show they were designed in advance."},{"q":"Why were houses built with baked bricks?","a":"Baked bricks are strong and last long, even in floods."},{"q":"Why were reservoirs important at Dholavira?","a":"The area was dry, so rainwater had to be stored."},{"q":"Why were standard weights needed?","a":"For fair and uniform trade."}],"mock":[],"qs":[{"id":"sst6p0","k":"mcq","q":"The Great Bath was found at:","o":["Harappa","Lothal","Mohenjo-daro","Kalibangan"],"a":2,"e":"In the citadel." :0,"e":""},{"id":"sst6t3","k":"tf","q":"The Great Bath is at Harappa.","a":1,"e":"It is at Mohenjo-daro."},{"id":"sst6t4","k":"tf","q":"Dholavira is in Gujarat.","a":0,"e":""},{"id":"sst6t5","k":"tf","q":"Harappan cities used iron tools.","a":1,"e":"They used copper and bronze; iron came much later."},{"id":"sst6t6","k":"tf","q":"The decline was sudden, in one year.","a":1,"e":"It was gradual."},{"id":"sst6t7","k":"tf","q":"Harappans traded with Mesopotamia.","a":0,"e":""},{"id":"sst6a0","k":"ar","A":"Harappan cities had excellent drainage.","R":"Drains were covered and had inspection holes.","a":0,"e":"R describes why the drainage was excellent."},{"id":"sst6a1","k":"ar","A":"Dholavira built large reservoirs.","R":"It lay in a dry region.","a":0,"e":"Dryness made storage necessary."},{"id":"sst6a2","k":"ar","A":"Lothal was an inland town without trade.","R":"It had a dockyard.","a":3,"e":"A false — Lothal was a port; R true."},{"id":"sst6a3","k":"ar","A":"We know the Harappans’ language fully.","R":"Their seals carry a script.","a":3,"e":"A false — script not deciphered; R true."},{"id":"sst6x0","k":"mcq","q":"The Harappan civilisation is also called the:","o":["Sindhu–Sarasvati civilisation","Vedic civilisation","Gupta civilisation","Mughal civilisation"],"a":0,"e":"Along both rivers.","sh":1,"x":1},{"id":"sst6x1","k":"mcq","q":"The Great Bath was found at:","o":["Mohenjo-daro","Lothal","Kalibangan","Dholavira"],"a":0,"e":"Public bathing tank.","sh":1,"x":1},{"id":"sst6x2","k":"mcq","q":"A dockyard was found at:","o":["Lothal","Harappa","Rakhigarhi","Mohenjo-daro"],"a":0,"e":"In Gujarat — shows sea trade.","sh":1,"x":1},{"id":"sst6x3","k":"mcq","q":"Dholavira is famous for its:","o":["water reservoirs","pyramids","temples of gold","iron factories"],"a":0,"e":"Smart water management.","sh":1,"x":1},{"id":"sst6x4","k":"mcq","q":"Harappan cities had:","o":["planned streets and covered drains","no drains","only mud huts","no houses"],"a":0,"e":"Grid pattern.","sh":1,"x":1},{"id":"sst6x5","k":"mcq","q":"Harappans used ___ for writing.","o":["a script on seals (not yet deciphered)","English","Hindi","Brahmi fully read"],"a":0,"e":"Still a mystery.","sh":1,"x":1},{"id":"sst6x6","k":"mcq","q":"The largest Harappan site in India is:","o":["Rakhigarhi","Lothal","Kalibangan","Banawali"],"a":0,"e":"In Haryana.","sh":1,"x":1},{"id":"sst6x7","k":"mcq","q":"Ploughed fields were found at:","o":["Kalibangan","Lothal","Dholavira","Mohenjo-daro"],"a":0,"e":"Rajasthan.","sh":1,"x":1},{"id":"sst6x8","k":"mcq","q":"One reason for the decline of Harappan cities:","o":["climate change and drying of the Sarasvati river","invasion by the British","earthquakes only","too much gold"],"a":0,"e":"Gradual decline after ~1900 BCE.","sh":1,"x":1},{"id":"sst6x9","k":"mcq","q":"Harappan bricks were:","o":["of standard size","all different sizes","made of iron","made of glass"],"a":0,"e":"Standard ratio 1:2:4.","sh":1,"x":1},{"id":"sst6x10","k":"mcq","q":"Harappans traded with:","o":["Mesopotamia","America","Australia","Japan"],"a":0,"e":"Seals found there.","sh":1,"x":1},{"id":"sst6y0","k":"tf","q":"Harappan cities had a good drainage system.","a":0,"e":"","x":1},{"id":"sst6y1","k":"tf","q":"The Harappan script has been fully read.","a":1,"e":"It has not been deciphered yet.","x":1},{"id":"sst6y2","k":"tf","q":"Harappans were skilled in making beads and pottery.","a":0,"e":"","x":1},{"id":"sst6m0","k":"mcq","q":"The ‘dancing girl’ figurine is made of:","o":["bronze","gold","wood","clay only"],"a":0,"e":"Found at Mohenjo-daro.","sh":1,"x":1},{"id":"sst6m1","k":"mcq","q":"Harappan seals often show:","o":["animals like the unicorn and bull","kings on horses","ships with sails only","temples"],"a":0,"e":"Square stone seals.","sh":1,"x":1},{"id":"sst6m2","k":"mcq","q":"Harappa was first excavated in:","o":["1921","1947","1857","2000"],"a":0,"e":"By archaeologists.","sh":1,"x":1},{"id":"sst6m3","k":"mcq","q":"Lothal is in:","o":["Gujarat","Punjab","Haryana","Rajasthan"],"a":0,"e":"Dockyard site.","sh":1,"x":1},{"id":"sst6m4","k":"mcq","q":"Harappan bricks were:","o":["baked and of standard size","of iron","unbaked only","different everywhere"],"a":0,"e":"Ratio 1:2:4.","sh":1,"x":1},{"id":"sst6f0","k":"mcq","fill":1,"q":"The Great Bath was found at ___.","o":["Mohenjo-daro","Lothal","Dholavira","Harappa"],"a":0,"e":"","sh":1,"x":1},{"id":"sst6f1","k":"mcq","fill":1,"q":"The Harappan civilisation is also called the Sindhu–___ civilisation.","o":["Sarasvati","Ganga","Narmada","Yamuna"],"a":0,"e":"","sh":1,"x":1},{"id":"sst6f2","k":"mcq","fill":1,"q":"Kalibangan is famous for evidence of a ___ field.","o":["ploughed","football","rice","wheat"],"a":0,"e":"","sh":1,"x":1},{"id":"sst6c02","k":"mcq","q":"A city in the desert: Dholavira lies on an island in the Rann of Kutch, a dry region. Its people cut huge reservoirs into stone and built channels to collect every drop of rain. Near the city gate, archaeologists found ten large Harappan signs, like a signboard. — What is special about the ‘signboard’?","o":["It is in Brahmi","It uses Harappan script signs","It is a coin","It is a painting"],"a":1,"e":"(b) It uses Harappan script signs."}],"top":[{"q":"What is a civilisation? Why is the Harappan civilisation called a civilisation?","m":3,"imp":true,"a":["A civilisation is a large, organised society with cities, a system of governance, writing, crafts, trade and shared culture.","The Harappans had planned cities, a script, standard weights, long-distance trade, skilled crafts and organised water and drainage systems — so they formed a civilisation."],"k":"Features of a civilisation + matching Harappan evidence.","cm":"Defining civilisation as ‘good manners’."},{"q":"Why is it called the Harappan or Sindhu–Sarasvati civilisation?","m":2,"imp":true,"a":["Harappan — because Harappa was the first site to be excavated (1920s). Sindhu– Sarasvati — because most of its sites lie along the Sindhu (Indus) and the Sarasvati river system (today’s Ghaggar–Hakra)."],"k":"Both reasons.","cm":"Saying Harappa was the largest city."},{"q":"Describe the town planning of Harappan cities.","m":5,"imp":true,"a":["Cities were planned on a grid: streets crossed at right angles.","Many cities had two parts: a raised citadel (upper town) and a larger lower town where most people lived.","Houses were built of baked (burnt) bricks of standard size (ratio 1:2:4); many had courtyards, wells and bathrooms.","An excellent drainage system: covered drains along streets, with inspection holes, carried waste water away.","Public buildings: Great Bath (Mohenjo-daro), granaries/warehouses, reservoirs (Dholavira)."],"k":"Grid, citadel/lower town, standard bricks, drains, public buildings — five points.","cm":"Describing only houses; forgetting the drains."},{"q":"Write a short note on the Great Bath of Mohenjo-daro.","m":3,"imp":true,"a":["The Great Bath is a large rectangular tank in the citadel of Mohenjo-daro, about 12 m × 7 m and 2.4 m deep. It was made watertight with fitted bricks and a layer of natural tar (bitumen); there were steps on two sides and rooms around it. It was probably used for special or ritual bathing."],"k":"Location + size/waterproofing + steps + purpose.","cm":"Calling it a swimming pool for sport."},{"q":"What was special about the water management at Dholavira?","m":3,"imp":true,"a":["Dholavira (Rann of Kutch, Gujarat) lay in a dry region with little rain.","People built large stone reservoirs, channels and dams to collect and store rainwater and stream water.","This shows advanced engineering and planning — a lesson for water conservation today. Dholavira is a UNESCO World Heritage Site and also had a large ‘signboard’ with Harappan letters."],"k":"Dry area + reservoirs/channels + purpose.","cm":"Placing Dholavira in Rajasthan."},{"q":"Why is Lothal important?","m":2,"imp":true,"a":["Lothal in Gujarat was a port town. It had a large brick structure believed to be a dockyard where boats came in for trade, and workshops for making beads."],"k":"Gujarat + dockyard + trade/beads.","cm":"Saying Lothal had the Great Bath."},{"q":"Describe the occupations and trade of the Harappans.","m":5,"imp":true,"a":["Farming: wheat, barley, pulses, millets; they were among the first to grow cotton.","Animal rearing: cattle, sheep, goats, buffaloes.","Crafts: beautiful beads (carnelian), pottery, seals, bronze and copper tools, ornaments, the bronze ‘dancing girl’.","Trade: inside the subcontinent and with Mesopotamia (where the region was probably called Meluhha); goods went by land and sea.","Standard weights and measures helped fair trade."],"k":"Farming + animals + crafts + trade with Mesopotamia + weights.","cm":"Forgetting cotton and the Mesopotamia link."},{"q":"What were Harappan seals? What do they tell us?","m":3,"imp":false,"a":["Seals were small, flat pieces, usually of steatite (soft stone), carved with animals (e.g. a unicorn-like animal, bull, elephant) and signs of the Harappan script. They were probably used to mark goods in trade. They show that the Harappans had a script (still not deciphered) and organised trade."],"k":"Material + carvings + use + script undeciphered.","cm":"Saying the script has been read."},{"q":"What were the reasons for the decline of Harappan cities?","m":3,"imp":true,"a":["Climate change: less rainfall over a long period.","The Sarasvati river dried up, and some rivers changed course; other places suffered floods.","Trade with Mesopotamia declined, so cities became poorer.","People gradually left the cities and moved to villages further east and south — cities declined (de-urbanisation) around 1900 BCE, but the people and their skills did not vanish."],"k":"Climate + river drying/floods + trade decline + people moved (not sudden end).","cm":"Stating one single cause as certain."},{"q":"Name any four Harappan sites with the present-day state/country.","m":2,"imp":true,"a":["Harappa (Punjab, Pakistan), Mohenjo-daro (Sindh, Pakistan), Dholavira and Lothal (Gujarat, India), Kalibangan (Rajasthan), Rakhigarhi (Haryana)."],"k":"Four correct site–place pairs.","cm":"Placing Harappa in Indian Punjab."},{"q":"Mention some features of Harappan culture that continue in India today.","m":3,"imp":false,"a":["Use of bangles and ornaments; bullock carts; similar pottery.","Figurines in postures like namaste and yoga-like sitting.","Games like dice/board games; standard weights; planned drains and water harvesting ideas.","Crops like cotton and barley still grown in the same region."],"k":"Any three continuities with examples.","cm":"Saying nothing of the Harappans survived."},{"q":"What does the evidence from Kalibangan tell us about Harappan farming?","m":2,"imp":false,"a":["At Kalibangan (Rajasthan) archaeologists found a ploughed field with furrows in two directions, showing that Harappans used the plough and may have grown two crops together."],"k":"Ploughed field + plough use.","cm":"Saying Kalibangan had a dockyard."}],"prac":[{"lv":"Level 1: Basic","q":"Which was the first Harappan site to be excavated?","a":"Harappa."},{"lv":"Level 1: Basic","q":"Where is the Great Bath?","a":"Mohenjo-daro."},{"lv":"Level 1: Basic","q":"Name the Harappan port town with a dockyard.","a":"Lothal."},{"lv":"Level 1: Basic","q":"Which crop were the Harappans among the first to grow?","a":"Cotton."},{"lv":"Level 2: Exam Standard","q":"Give two features of Harappan drains.","a":"Covered; laid along streets; connected to houses; had inspection holes (any two)."},{"lv":"Level 2: Exam Standard","q":"What was the citadel?","a":"The raised part of a city with important buildings like the Great Bath/granary."},{"lv":"Level 2: Exam Standard","q":"With which region did the Harappans trade overseas?","a":"Mesopotamia."},{"lv":"Level 2: Exam Standard","q":"Why can’t we read Harappan seals fully?","a":"The script has not been deciphered yet."},{"lv":"Level 3: Competency / Application","q":"A town today floods every monsoon because drains are blocked. What can it learn from Harappan cities?","a":"Build covered, connected drains; keep them clean with inspection points; plan streets and drainage before building."},{"lv":"Level 3: Competency / Application","q":"Dholavira stored water in reservoirs. Suggest one way your school can store rainwater.","a":"Rooftop rainwater harvesting into a tank or recharge pit."},{"lv":"Level 3: Competency / Application","q":"Standard weights were found at many sites. How did they help traders?","a":"Goods could be measured fairly and in the same way everywhere, building trust in trade."},{"lv":"Level 4: Challenge","q":"Why do historians say the Harappan ‘decline’ was not the ‘end’ of its people?","a":"People moved to smaller villages east and south and continued farming and crafts; many practices carried on into later Indian life."},{"lv":"Level 4: Challenge","q":"If you find beads made in Gujarat at a site in Mesopotamia, what two conclusions can you draw?","a":"There was long-distance trade; Harappan crafts were valued abroad; transport by sea/land existed."}],"comp":[{"q":"Look at this list: grid streets, covered drains, standard bricks, public bath. What single quality of Harappan cities do these show?","a":"They show careful planning and organisation — someone planned and managed the city’s layout and services."},{"q":"A museum shows a bronze statue of a young woman with bangles on her arm. Which famous Harappan object is this and what does it tell us?","a":"The ‘dancing girl’ from Mohenjo-daro. It shows skill in metal casting and that bangles/ornaments were worn."},{"q":"Imagine you are a Harappan trader going to Mesopotamia. Name two goods you might carry and how you would travel.","a":"Beads (carnelian), cotton cloth, timber/ivory; travel by boat from Lothal along the coast, or by land routes."}],"case":[{"t":"A city in the desert","p":"Dholavira lies on an island in the Rann of Kutch, a dry region. Its people cut huge reservoirs into stone and built channels to collect every drop of rain. Near the city gate, archaeologists found ten large Harappan signs, like a signboard.","q":["(i) In which state is Dholavira?","(ii) Why did Dholavira need reservoirs?","(iii) What is special about the ‘signboard’? (a) It is in Brahmi (b) It uses Harappan script signs (c) It is a coin (d) It is a painting","(iv) Give one lesson Dholavira offers today."],"a":["(i) Gujarat.","(ii) It lay in a dry region with little rain, so water had to be stored.","(iii) (b) It uses Harappan script signs.","(iv) Harvest and store rainwater; plan water use carefully in dry areas."]},{"t":"Why did the cities empty?","p":"After about 1900 BCE, many Harappan cities were slowly abandoned. Scientists studying old lake beds and river channels have found that rainfall became less over many years and the Sarasvati river dried up. Trade with Mesopotamia also fell.","q":["(i) Around when did the decline begin?","(ii) Name the river that dried up.","(iii) Give two reasons for decline mentioned in the passage.","(iv) Where did many people go?"],"a":["(i) About 1900 BCE.","(ii) Sarasvati (Ghaggar–Hakra).","(iii) Less rainfall/climate change; drying of Sarasvati; fall in trade (any two).","(iv) To smaller villages further east and south."]}],"conc":[{"c":"Citadel and lower town","e":"Citadel: raised western part with big buildings; lower town: houses of most people.","x":"Mohenjo-daro’s citadel has the Great Bath.","cf":"Not every city had both parts in the same way.","t":""},{"c":"Drainage system","e":"Covered street drains linked to house drains.","x":"Mohenjo-daro.","cf":"It is about waste water, not rivers.","t":"Drains = Discipline + Design"},{"c":"Standard bricks","e":"Bricks of the same proportion (1:2:4) everywhere.","x":"Across many sites.","cf":"It suggests organisation, not one single ruler for certain.","t":"1:2:4 — height, width, length"},{"c":"Trade","e":"Exchange of goods over long distances.","x":"Beads found in Mesopotamia.","cf":"Meluhha is a Mesopotamian name, not a Harappan city.","t":""},{"c":"Decline","e":"Gradual abandonment of cities around 1900 BCE.","x":"Drying of Sarasvati.","cf":"It was gradual, not a sudden disappearance.","t":"C-R-T: Climate, Rivers, Trade"}],"notes":[{"h":"Name and time","t":"Harappan or Sindhu–Sarasvati civilisation, about 2600–1900 BCE (mature phase). First discovered at Harappa (1921)."},{"h":"Important sites","t":"Harappa, Mohenjo-daro (Great Bath), Lothal (dockyard, Gujarat), Dholavira (water reservoirs, Gujarat), Kalibangan (ploughed field, Rajasthan), Rakhigarhi (largest in India, Haryana)."},{"h":"City planning","t":"Grid-pattern streets, covered drains, baked bricks of standard size, houses with wells and bathrooms, citadel and lower town."},{"h":"Economy","t":"Farming (wheat, barley, cotton), trade with Mesopotamia by land and sea, seals, standard weights, beads, pottery, bronze (dancing girl figurine)."},{"h":"Script and culture","t":"Script on seals not yet deciphered. Seals show animals like the unicorn and bull."},{"h":"Decline (after ~1900 BCE)","t":"Climate change, drying of the Sarasvati river, floods and shifting rivers — people moved to villages, cities were slowly abandoned."}]},{"n":7,"t":"India’s Cultural Roots","intro":"Six ’branches’ of India’s cultural tree: Vedas, Upanishads, schools of philosophy, Buddhism, Jainism, and folk and tribal traditions. Learn one core idea + one key person for each.","prio":[{"t":"Vedas: four (Rig, Sama, Yajur, Atharva); Rig Veda oldest; passed on orally","s":3},{"t":"Vedic seers: rishis and rishikas (e.g. Lopamudra, Ghosha); idea ’Truth is one, the wise call it by many names’","s":3},{"t":"Upanishads: Brahman and Atman; questioning and dialogue (e.g. Nachiketa)","s":3},{"t":"Buddhism: Siddhartha Gautama; Lumbini, Bodh Gaya, Sarnath; Middle Path; compassion; Sangha","s":3},{"t":"Jainism: Mahavira, 24th tirthankara; ahimsa, anekantavada, aparigraha","s":3},{"t":"Six schools of philosophy (darshanas)","s":2},{"t":"Folk and tribal traditions: nature worship, sacred groves; e.g. Donyi-Polo","s":2},{"t":"Big idea: many schools of thought grew side by side and borrowed from each other","s":2}],"traps":[{"m":"Enlightenment at Sarnath","c":"Bodh Gaya = enlightenment; Sarnath = first sermon","t":"B–E, S–S (Bodh–Enlightened, Sarnath–Sermon)"},{"m":"Upanishads = 5th Veda","c":"Four Vedas only; Upanishads are later texts","t":"4 Vedas, many Upanishads"},{"m":"Anekantavada vs aparigraha mix-up","c":"Anek = many sides; aparigraha = non-possession","t":"Anek = many; A-pari = no grabbing"},{"m":"Mahavira = founder of Jainism","c":"He was the 24th tirthankara; the tradition is older","t":"24th, not 1st"},{"m":"Brahman = Brahmin","c":"Brahman = universal reality","t":"Brahman is Big (universe)"},{"m":"Darshanas include Buddhism","c":"Six darshanas: Nyaya, Vaisheshika, Sankhya, Yoga, Mimamsa, Vedanta","t":"N-V-S-Y-M-V"},{"m":"Stories without the lesson","c":"Always end with the teaching/moral","t":"Story + Lesson = marks"},{"m":"Ignoring folk/tribal traditions","c":"They are one of the cultural roots","t":"Roots include forests too"}],"rq":[{"q":"Why did the Buddha teach the Middle Path?","a":"He had tried both luxury and extreme hardship and found neither ended suffering."},{"q":"Why are Jain monks careful where they walk?","a":"To avoid harming even tiny creatures, following ahimsa."},{"q":"Why is the oral tradition of the Vedas remarkable?","a":"Huge texts were kept unchanged for centuries by memory alone."},{"q":"Why did tribal communities protect sacred groves?","a":"They saw nature as sacred; it also protected their water, food and forests."}],"mock":[],"qs":[{"id":"sst7p0","k":"mcq","q":"The oldest Veda is the:","o":["Sama Veda","Rig Veda","Atharva Veda","Yajur Veda"],"a":1,"e":"Hymns; oldest text.","imp":true},{"id":"sst7p1","k":"mcq","q":"The Vedas were first preserved:","o":["on paper","orally","on coins","in paintings"],"a":1,"e":"Memorised and chanted.","imp":true},{"id":"sst7p2","k":"mcq","q":"Lopamudra was a:","o":["queen","rishika","trader","tirthankara"],"a":1,"e":"Woman seer.","imp":false},{"id":"sst7p3","k":"mcq","q":"The Buddha attained enlightenment at:","o":["Lumbini","Sarnath","Bodh Gaya","Vaishali"],"a":2,"e":"Under the Bodhi tree.","imp":true},{"id":"sst7p4","k":"mcq","q":"The first sermon was given at:","o":["Bodh Gaya","Sarnath","Kushinagar","Lumbini"],"a":1,"e":"Near Varanasi.","imp":false},{"id":"sst7p5","k":"mcq","q":"’Many-sidedness of truth’ is:","o":["ahimsa","aparigraha","anekantavada","karuna"],"a":2,"e":"Anek = many.","imp":true},{"id":"sst7p6","k":"mcq","q":"Non-possession in Jainism is:","o":["aparigraha","ahimsa","moksha","dharma"],"a":0,"e":"Limit belongings.","imp":true},{"id":"sst7p7","k":"mcq","q":"Mahavira was the ____ tirthankara.","o":["1st","12th","23rd","24th"],"a":3,"e":"Rishabhanatha was 1st.","imp":false},{"id":"sst7p8","k":"mcq","q":"The Upanishads mainly contain:","o":["laws of kings","philosophical dialogues","trade records","maps"],"a":1,"e":"Questions about life and reality.","imp":false},{"id":"sst7p9","k":"mcq","q":"Which is NOT one of the six darshanas?","o":["Nyaya","Yoga","Vedanta","Sangha"],"a":3,"e":"Sangha is the Buddhist community.","imp":false},{"id":"sst7p10","k":"mcq","q":"Donyi-Polo is a tradition of:","o":["Kerala","Arunachal Pradesh","Punjab","Gujarat"],"a":1,"e":"Sun–Moon worship.","imp":true},{"id":"sst7p11","k":"mcq","q":"The Buddha taught in:","o":["Sanskrit only","Pali","Persian","Greek"],"a":1,"e":"People’s language.","imp":true},{"id":"sst7t0","k":"tf","q":"There are four Vedas.","a":0,"e":""},{"id":"sst7t1","k":"tf","q":"Only men composed Vedic hymns.","a":1,"e":"Rishikas like Lopamudra and Ghosha also did."},{"id":"sst7t2","k":"tf","q":"The Buddha was born at Bodh Gaya.","a":1,"e":"Born at Lumbini; enlightened at Bodh Gaya."},{"id":"sst7t3","k":"tf","q":"Anekantavada means non-violence.","a":1,"e":"It means many-sidedness of truth; ahimsa = non-violence."},{"id":"sst7t4","k":"tf","q":"The Upanishads discuss Atman and Brahman.","a":0,"e":""},{"id":"sst7t5","k":"tf","q":"Sacred groves are protected by local communities.","a":0,"e":""},{"id":"sst7t6","k":"tf","q":"Mahavira taught in Prakrit.","a":0,"e":""},{"id":"sst7t7","k":"tf","q":"Nachiketa asked Yama for wealth.","a":1,"e":"He refused wealth and asked about death and the self."},{"id":"sst7a0","k":"ar","A":"The Buddha taught in Pali.","R":"He wanted ordinary people to understand him.","a":0,"e":"The people’s language made teachings reachable."},{"id":"sst7a1","k":"ar","A":"Jainism stresses ahimsa strictly.","R":"Jains believe all living beings have life and feel pain.","a":0,"e":"Respect for all life explains strict ahimsa."},{"id":"sst7a2","k":"ar","A":"The Vedas were first written on paper.","R":"They were preserved orally for centuries.","a":3,"e":"A false; R true."},{"id":"sst7a3","k":"ar","A":"Anekantavada encourages tolerance.","R":"It says truth has many sides.","a":0,"e":"Seeing many sides leads to tolerance."},{"id":"sst7x0","k":"mcq","q":"The oldest of the Vedas is the:","o":["Rig Veda","Sama Veda","Yajur Veda","Atharva Veda"],"a":0,"e":"Hymns to nature gods.","sh":1,"x":1},{"id":"sst7x1","k":"mcq","q":"The number of Vedas is:","o":["4","2","3","6"],"a":0,"e":"Rig, Sama, Yajur, Atharva.","sh":1,"x":1},{"id":"sst7x2","k":"mcq","q":"Women scholars mentioned in Vedic texts include:","o":["Gargi and Maitreyi","Razia and Noor","Rani Lakshmibai","Indira"],"a":0,"e":"Learned women of ancient India.","sh":1,"x":1},{"id":"sst7x3","k":"mcq","q":"The Upanishads discuss ideas like:","o":["Brahman and Atman","cricket","trade only","farming tools"],"a":0,"e":"Deep questions about life.","sh":1,"x":1},{"id":"sst7x4","k":"mcq","q":"Gautama Buddha attained enlightenment at:","o":["Bodh Gaya","Sarnath","Lumbini","Kushinagar"],"a":0,"e":"Under the Bodhi tree.","sh":1,"x":1},{"id":"sst7x5","k":"mcq","q":"Buddha gave his first sermon at:","o":["Sarnath","Bodh Gaya","Lumbini","Patna"],"a":0,"e":"Near Varanasi.","sh":1,"x":1},{"id":"sst7x6","k":"mcq","q":"Vardhamana Mahavira was the ___ tirthankara of Jainism.","o":["24th","1st","10th","12th"],"a":0,"e":"Rishabhanatha was the first.","sh":1,"x":1},{"id":"sst7x7","k":"mcq","q":"Ahimsa means:","o":["non-violence","truth","wealth","prayer"],"a":0,"e":"Common to Buddhism and Jainism.","sh":1,"x":1},{"id":"sst7x8","k":"mcq","q":"Anekantavada (Jainism) teaches that:","o":["truth has many sides","there is one way only","violence is good","nothing is true"],"a":0,"e":"Respect different views.","sh":1,"x":1},{"id":"sst7x9","k":"mcq","q":"‘Ekam sat vipra bahudha vadanti’ means:","o":["Truth is one, the wise call it by many names","Work is worship","Knowledge is power","Mother is god"],"a":0,"e":"From the Rig Veda.","sh":1,"x":1},{"id":"sst7x10","k":"mcq","q":"Buddha was born at:","o":["Lumbini","Sarnath","Bodh Gaya","Ujjain"],"a":0,"e":"In present-day Nepal.","sh":1,"x":1},{"id":"sst7x11","k":"mcq","q":"Folk and tribal traditions show:","o":["respect for nature, e.g. sacred groves","no beliefs","only city life","only kings"],"a":0,"e":"Part of India’s cultural roots.","sh":1,"x":1},{"id":"sst7y0","k":"tf","q":"The Vedas were first passed on orally.","a":0,"e":"","x":1},{"id":"sst7y1","k":"tf","q":"Buddhism teaches the Middle Path.","a":0,"e":"","x":1},{"id":"sst7y2","k":"tf","q":"Mahavira was the first tirthankara.","a":1,"e":"He was the 24th.","x":1},{"id":"sst7m0","k":"mcq","q":"‘Tat tvam asi’ comes from the:","o":["Upanishads","Rig Veda hymns to Indra","Jataka tales","Constitution"],"a":0,"e":"Uddalaka teaches Shvetaketu.","sh":1,"x":1},{"id":"sst7m1","k":"mcq","q":"The Middle Path was taught by:","o":["Gautama Buddha","Mahavira","Gargi","Ashoka"],"a":0,"e":"Avoid extremes.","sh":1,"x":1},{"id":"sst7m2","k":"mcq","q":"The Sama Veda is mainly about:","o":["melodies and chants","farming","war","maps"],"a":0,"e":"Music in rituals.","sh":1,"x":1},{"id":"sst7m3","k":"mcq","q":"Women scholars in Vedic times:","o":["Gargi and Maitreyi","Sita and Gita","Razia and Meera","Rani and Durga"],"a":0,"e":"Debated deep questions.","sh":1,"x":1},{"id":"sst7m4","k":"mcq","q":"Mahavira was born in:","o":["Vaishali (Kundagrama)","Lumbini","Varanasi","Delhi"],"a":0,"e":"In present-day Bihar.","sh":1,"x":1},{"id":"sst7f0","k":"mcq","fill":1,"q":"The oldest Veda is the ___ Veda.","o":["Rig","Sama","Yajur","Atharva"],"a":0,"e":"","sh":1,"x":1},{"id":"sst7f1","k":"mcq","fill":1,"q":"Buddha gave his first sermon at ___.","o":["Sarnath","Bodh Gaya","Lumbini","Kushinagar"],"a":0,"e":"","sh":1,"x":1},{"id":"sst7f2","k":"mcq","fill":1,"q":"Non-violence is called ___.","o":["ahimsa","satya","dharma","karma"],"a":0,"e":"","sh":1,"x":1},{"id":"sst7c01","k":"mcq","q":"Which teaching of the Buddha does this story show?","o":["Ahimsa","Suffering is part of life","Aparigraha","Brahman"],"a":1,"e":"(b) Suffering is part of life."}],"top":[{"q":"What are the Vedas? Name the four Vedas.","m":3,"imp":true,"a":["The Vedas are India’s oldest texts, composed in Sanskrit; ‘Veda’ means knowledge.","The four Vedas: Rig Veda (hymns; the oldest), Sama Veda (melodies for singing), Yajur Veda (rituals and procedures), Atharva Veda (everyday life, healing, charms).","For many centuries they were passed on orally with great accuracy before being written down."],"k":"Meaning + four names + oral transmission.","cm":"Counting the Upanishads as a fifth Veda."},{"q":"How were the Vedas preserved for so long without writing?","m":3,"imp":true,"a":["Teachers taught students to memorise and chant the hymns exactly, using special recitation methods (reciting words in different orders and patterns) so that not a single sound changed. This oral tradition was passed from generation to generation; Vedic chanting is recognised by UNESCO as an intangible cultural heritage."],"k":"Memorisation + recitation techniques + generations + accuracy.","cm":"Saying they were written on paper from the start."},{"q":"Who were the rishis and rishikas? Name two rishikas.","m":2,"imp":true,"a":["Rishis were seers/sages who composed the Vedic hymns; rishikas were women seers. Examples of rishikas: Lopamudra, Ghosha (also later women thinkers such as Gargi and Maitreyi in the Upanishads)."],"k":"Meaning of both + two names.","cm":"Thinking only men composed hymns."},{"q":"What is meant by ‘Ekam sat vipra bahudha vadanti’?","m":2,"imp":true,"a":["It is a line from the Rig Veda: ‘Truth is one; the wise call it by many names.’ It means different people may describe the highest reality in different ways, so we should respect different views."],"k":"Meaning + source + message of respect.","cm":"Translating it as ‘there are many truths’."},{"q":"What are the Upanishads? Explain the ideas of Brahman and Atman.","m":3,"imp":true,"a":["The Upanishads are later texts attached to the Vedas; they contain discussions and dialogues between teachers and students about deep questions of life.","Brahman: the one universal reality/spirit present in everything.","Atman: the self/soul in each being. The Upanishads teach that Atman and Brahman are one — so all beings are connected."],"k":"What they are + both terms + their oneness.","cm":"Swapping the meanings of Atman and Brahman."},{"q":"Narrate the story of Nachiketa briefly. What does it teach?","m":3,"imp":false,"a":["In the Katha Upanishad, young Nachiketa goes to Yama (god of death). Yama offers him three boons. For the third, Nachiketa asks what happens after death. Yama tempts him with riches instead, but Nachiketa refuses and insists on knowledge. Yama then teaches him about the eternal self (Atman). Lesson: true knowledge is more valuable than wealth; ask questions fearlessly."],"k":"Characters + his question + refusal of wealth + lesson.","cm":"Missing the moral."},{"q":"Describe the life and main teachings of the Buddha.","m":5,"imp":true,"a":["Born as Siddhartha Gautama at Lumbini (Nepal) in a royal family; saw old age, sickness and death and left home to seek the end of suffering.","Attained enlightenment under a pipal (Bodhi) tree at Bodh Gaya (Bihar) and became the Buddha (’awakened one’).","Gave his first sermon at Sarnath near Varanasi; taught in Pali/Prakrit, the language of ordinary people.","Teachings: life has suffering, caused by desire/craving; follow the Middle Path (avoid extremes); practise compassion (karuna), non-violence, right conduct.","Founded the Sangha — community of monks and nuns."],"k":"Birth, enlightenment, first sermon (with places) + at least three teachings + Sangha.","cm":"Placing enlightenment at Sarnath."},{"q":"What is the story of Kisa Gotami? What did the Buddha teach through it?","m":3,"imp":false,"a":["Kisa Gotami’s child died; she begged the Buddha to bring him back. The Buddha asked her to bring mustard seeds from a house where no one had ever died. She could not find such a house. She understood that death comes to everyone, accepted her loss and became his follower. Lesson: suffering and death are part of life; accept them with understanding."],"k":"Story in brief + lesson.","cm":"Writing that the Buddha revived the child."},{"q":"Who was Mahavira? State the three main principles of Jainism.","m":5,"imp":true,"a":["Vardhamana Mahavira was the 24th tirthankara of Jainism (Rishabhanatha was the first). He was born in a royal family near Vaishali, left home and attained kevala jnana (complete knowledge).","Ahimsa: non-violence towards all living beings, even insects.","Anekantavada: truth has many sides; no one view has the whole truth (like the blind men and the elephant).","Aparigraha: non-possession — limit your belongings and desires.","He taught in Prakrit, the language of ordinary people."],"k":"Who he was + all three principles explained.","cm":"Mixing up anekantavada and aparigraha."},{"q":"Explain anekantavada using the story of the blind men and the elephant.","m":3,"imp":false,"a":["Several blind men touch different parts of an elephant: one feels the trunk and says ‘it is a snake’, another the leg and says ‘a pillar’, another the ear and says ‘a fan’. Each is partly right but no one sees the whole. Anekantavada teaches that truth has many sides, so we should listen to others’ views and avoid being stubborn."],"k":"Story + meaning + value of tolerance.","cm":"Explaining the story without the principle."},{"q":"Compare Buddhism and Jainism.","m":3,"imp":true,"a":["Founder/teacher: Buddha (Siddhartha) | Mahavira (24th tirthankara).","Non-violence: both value it; Jainism is very strict about it (all living beings).","Key ideas: Middle Path, compassion | ahimsa, anekantavada, aparigraha.","Language: Pali/Prakrit | Prakrit — both used people’s languages.","Common: both questioned rituals, stressed right conduct, welcomed people of all backgrounds."],"k":"At least four matching points including similarities.","cm":"Writing only differences, forgetting similarities."},{"q":"What are sacred groves? How do folk and tribal traditions show respect for nature?","m":3,"imp":false,"a":["Sacred groves are patches of forest protected by communities because they are believed to be sacred; trees there are not cut (e.g. devrai in Maharashtra, sarna in Jharkhand).","Many tribal traditions worship nature — the Sun, Moon, rivers, mountains, trees. Example: the Donyi-Polo (Sun–Moon) tradition of Arunachal Pradesh.","These beliefs help conserve forests, water and wildlife."],"k":"Definition + example + nature worship + conservation effect.","cm":"Calling sacred groves ‘national parks’."},{"q":"Name the six schools of Indian philosophy (darshanas).","m":2,"imp":false,"a":["Nyaya, Vaisheshika, Sankhya, Yoga, Mimamsa, Vedanta."],"k":"All six names.","cm":"Including Buddhism/Jainism in the six (they are separate traditions)."}],"prac":[{"lv":"Level 1: Basic","q":"Which is the oldest Veda?","a":"Rig Veda."},{"lv":"Level 1: Basic","q":"Where did the Buddha give his first sermon?","a":"Sarnath."},{"lv":"Level 1: Basic","q":"Who was the 24th tirthankara?","a":"Mahavira."},{"lv":"Level 1: Basic","q":"What does ahimsa mean?","a":"Non-violence."},{"lv":"Level 2: Exam Standard","q":"Name two women seers of the Vedic period.","a":"Lopamudra and Ghosha."},{"lv":"Level 2: Exam Standard","q":"What is the Sangha?","a":"The community of Buddhist monks and nuns."},{"lv":"Level 2: Exam Standard","q":"Why did the Buddha and Mahavira teach in Pali/Prakrit?","a":"So that ordinary people could understand, not only scholars who knew Sanskrit."},{"lv":"Level 2: Exam Standard","q":"What is a sacred grove?","a":"A patch of forest protected by a community for religious reasons."},{"lv":"Level 3: Competency / Application","q":"Two friends argue about whether a glass is half-full or half-empty. Which Jain idea helps them? Explain.","a":"Anekantavada — both are describing the same truth from different sides; both are partly right."},{"lv":"Level 3: Competency / Application","q":"Your class wants to reduce waste. Which Jain principle can guide you and how?","a":"Aparigraha — buy/own only what you need, share and reuse things."},{"lv":"Level 3: Competency / Application","q":"How do sacred groves help the environment today?","a":"They protect old trees, springs and wildlife, and conserve biodiversity."},{"lv":"Level 4: Challenge","q":"How does the idea ‘Truth is one; the wise call it by many names’ help a diverse country like India?","a":"It teaches respect for different beliefs and paths, supporting peaceful living together."},{"lv":"Level 4: Challenge","q":"Why do you think both the Buddha and Mahavira rejected harsh extremes and violence?","a":"They believed suffering is reduced through right conduct, compassion and self-control, not through rituals, violence or extreme hardship."}],"comp":[{"q":"A classmate is teased for having a different opinion. Using any teaching from this chapter, explain how the class should behave.","a":"Using anekantavada (truth has many sides) or ‘Truth is one; the wise call it by many names’, the class should listen and respect different views instead of teasing."},{"q":"Your village plans to cut a sacred grove to build a parking lot. Give two arguments to save it.","a":"• It is a community’s sacred place and heritage. • It protects trees, water sources and animals; cutting it harms the environment."},{"q":"Match: (i) Bodh Gaya (ii) Sarnath (iii) Lumbini — with birth, enlightenment, first sermon.","a":"(i) Bodh Gaya — enlightenment; (ii) Sarnath — first sermon; (iii) Lumbini — birth."}],"case":[{"t":"The mustard seed","p":"A young mother, Kisa Gotami, carried her dead child to the Buddha and begged him to bring the child back to life. The Buddha asked her to bring a handful of mustard seeds from a house where no one had ever died. She went from house to house but could not find such a house.","q":["(i) What did Kisa Gotami realise?","(ii) Which teaching of the Buddha does this story show? (a) Ahimsa (b) Suffering is part of life (c) Aparigraha (d) Brahman","(iii) Why didn’t the Buddha simply give a speech?","(iv) Name the place where the Buddha attained enlightenment."],"a":["(i) Death comes to every family; it is part of life.","(ii) (b) Suffering is part of life.","(iii) Learning through her own experience helped her understand deeply and accept her loss.","(iv) Bodh Gaya."]},{"t":"The elephant in the dark","p":"Six blind men touched an elephant. One touched its side and said, ‘It is a wall.’ Another touched the tusk and said, ‘It is a spear.’ A third touched the tail and said, ‘It is a rope.’ They began to quarrel.","q":["(i) Which Jain principle does this story explain?","(ii) Were the men right or wrong? Explain.","(iii) How could they have avoided the quarrel?","(iv) Who is the 24th tirthankara?"],"a":["(i) Anekantavada.","(ii) Each was partly right, but none knew the whole truth.","(iii) By listening to each other and combining their views.","(iv) Mahavira."]}],"conc":[{"c":"Oral tradition","e":"Knowledge passed on by speaking and memorising.","x":"Vedic chanting.","cf":"Oral ≠ careless; it was very precise.","t":""},{"c":"Brahman/Atman","e":"Universal spirit / individual self; ultimately one.","x":"Upanishads.","cf":"Brahman (reality) is not the same as Brahmin (a person).","t":"Atman = ‘A’ll in me; Brahman = ‘B’ig universal"},{"c":"Middle Path","e":"Avoid both luxury and harsh self-punishment.","x":"Buddha’s own life.","cf":"It is not about being lazy or half-hearted.","t":""},{"c":"Ahimsa","e":"Non-violence in thought, word and deed.","x":"Jain monks sweep the path to avoid killing insects.","cf":"Both traditions value it; Jainism is strictest.","t":""},{"c":"Anekantavada","e":"Truth has many sides.","x":"Blind men and the elephant.","cf":"Different from aparigraha (non-possession).","t":"Anek = many"},{"c":"Aparigraha","e":"Non-possession; limit belongings.","x":"Owning only what you need.","cf":"","t":"A-pari-graha = not grabbing"}],"notes":[{"h":"The Vedas","t":"Four Vedas: Rig (oldest, hymns), Sama (melodies), Yajur (rituals), Atharva (daily life, healing). Passed down orally with great care. Sages: rishis; women scholars (rishikas): Gargi, Maitreyi, Lopamudra."},{"h":"Big ideas","t":"“Ekam sat vipra bahudha vadanti” — Truth is one; the wise call it by many names. Respect for nature (rivers, sun, trees)."},{"h":"Upanishads","t":"Discuss deep questions: Brahman (the universal self) and Atman (inner self). Story of Uddalaka and Shvetaketu: “Tat tvam asi” (You are that)."},{"h":"Buddhism","t":"Gautama Buddha: born Lumbini, enlightenment at Bodh Gaya, first sermon at Sarnath. Teachings: Four Noble Truths, Middle Path, non-violence, compassion."},{"h":"Jainism","t":"Vardhamana Mahavira, the 24th tirthankara. Teachings: ahimsa (non-violence), truth, non-stealing, non-possession; anekantavada (truth has many sides)."},{"h":"Folk and tribal traditions","t":"Worship of nature, sacred groves, local deities, festivals linked to harvest — they are also roots of Indian culture."}]},{"n":8,"t":"Unity in Diversity, or ‘Many in the One’","intro":"Every answer here needs examples. Learn 2 examples each for food, clothing, festivals, languages and epics — and always end by showing the common thread (unity).","prio":[{"t":"Meaning of diversity and unity; ’many in the one’","s":3},{"t":"Diversity in food, clothing (saree, dhoti), textiles, languages","s":3},{"t":"Harvest festivals across India (Pongal, Bihu, Lohri, Makar Sankranti, Onam, Baisakhi)","s":3},{"t":"Ramayana and Mahabharata in many languages (Kamba Ramayanam, Ramcharitmanas, etc.) and abroad","s":3},{"t":"Sacred geography and pilgrimages that link the country","s":2},{"t":"Unity shown through shared values, stories and celebrations","s":3}],"traps":[{"m":"Only listing examples","c":"Always add the common thread (unity)","t":"List + Link"},{"m":"Onam = Tamil Nadu","c":"Onam = Kerala; Pongal = Tamil Nadu","t":"O-K, P-T"},{"m":"Ramcharitmanas = Tamil","c":"Awadhi (Tulsidas)","t":"T-T: Tulsidas ̸= Tamil"},{"m":"Ramakien = Indonesia","c":"Thailand","t":"Ram-a-KIEN, Thai-land"},{"m":"Wrong saree–state pair","c":"Kanchipuram TN, Banarasi UP, Patola Gujarat, Pochampally Telangana","t":"K-B-P-P"},{"m":"Diversity = division","c":"Diversity = variety","t":"Different ̸= divided"}],"rq":[{"q":"Why do different regions have different foods?","a":"Climate and soil decide which crops grow — rice in wet areas, wheat in drier areas."},{"q":"Why are the epics called a common thread?","a":"They are known, retold and loved in every region and language."},{"q":"Why should we respect other people’s customs?","a":"Respect keeps peace and lets us learn from each other; it is the basis of unity."}],"mock":[],"qs":[{"id":"sst8p0","k":"mcq","q":"Bihu is celebrated in:","o":["Assam","Kerala","Punjab","Gujarat"],"a":0,"e":"Harvest festival of Assam.","imp":true},{"id":"sst8p1","k":"mcq","q":"Onam is a festival of:","o":["Tamil Nadu","Kerala","Odisha","Bihar"],"a":1,"e":"Kerala.","imp":true},{"id":"sst8p2","k":"mcq","q":"Ramcharitmanas was written in:","o":["Tamil","Awadhi","Bengali","Marathi"],"a":1,"e":"By Tulsidas.","imp":true},{"id":"sst8p3","k":"mcq","q":"Kamba Ramayanam is in:","o":["Telugu","Tamil","Kannada","Malayalam"],"a":1,"e":"By Kamban.","imp":false},{"id":"sst8p4","k":"mcq","q":"Kanchipuram sarees come from:","o":["Uttar Pradesh","Tamil Nadu","Gujarat","Assam"],"a":1,"e":"Silk weave of TN.","imp":false},{"id":"sst8p5","k":"mcq","q":"Which is NOT a Char Dham?","o":["Badrinath","Puri","Dwarka","Shimla"],"a":3,"e":"Shimla is not a dham.","imp":false},{"id":"sst8p6","k":"mcq","q":"The Constitution lists how many scheduled languages?","o":["14","18","22","28"],"a":2,"e":"Eighth Schedule.","imp":true},{"id":"sst8p7","k":"mcq","q":"’Many in the one’ means:","o":["everyone is the same","one idea in many forms","many countries","one language"],"a":1,"e":"Unity in diversity.","imp":true},{"id":"sst8p8","k":"mcq","q":"Lohri is celebrated mainly in:","o":["Punjab","Tamil Nadu","Assam","Kerala"],"a":0,"e":"Bonfire festival.","imp":false},{"id":"sst8p9","k":"mcq","q":"The Panchatantra is a collection of:","o":["laws","animal fables","maps","hymns"],"a":1,"e":"Stories teaching wisdom.","imp":false},{"id":"sst8p10","k":"mcq","q":"Patola sarees are from:","o":["Gujarat","Bengal","Kerala","Punjab"],"a":0,"e":"Double-ikat weave.","imp":false},{"id":"sst8p11","k":"mcq","q":"Harvest festivals mainly celebrate:","o":["independence","crops and nature","birthdays","sports"],"a":1,"e":"Thanksgiving for harvest.","imp":true},{"id":"sst8t0","k":"tf","q":"Diversity means division.","a":1,"e":"Diversity means variety; it can coexist with unity."},{"id":"sst8t1","k":"tf","q":"The saree is draped in many different ways.","a":0,"e":""},{"id":"sst8t2","k":"tf","q":"Pongal is a harvest festival of Kerala.","a":1,"e":"Pongal — Tamil Nadu; Onam — Kerala."},{"id":"sst8t3","k":"tf","q":"The Ramayana is found only in Sanskrit.","a":1,"e":"Retold in many Indian and foreign languages."},{"id":"sst8t4","k":"tf","q":"Pilgrimages help people feel connected to the whole land.","a":0,"e":""},{"id":"sst8t5","k":"
