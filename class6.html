tf","q":"India has 22 scheduled languages.","a":0,"e":""},{"id":"sst8t6","k":"tf","q":"Ramakien is from Indonesia.","a":1,"e":"Ramakien is Thai."},{"id":"sst8t7","k":"tf","q":"Different regions eat the same staple everywhere.","a":1,"e":"Rice in east/south, wheat in north/west."},{"id":"sst8a0","k":"ar","A":"Harvest festivals have different names in different states.","R":"Each region has its own language and customs.","a":0,"e":"Regional culture gives different names."},{"id":"sst8a1","k":"ar","A":"The saree shows unity in diversity.","R":"It is one garment draped in many regional styles.","a":0,"e":"R explains A."},{"id":"sst8a2","k":"ar","A":"The Ramayana is known only in North India.","R":"Kamban wrote a Tamil version.","a":3,"e":"A false; R true."},{"id":"sst8a3","k":"ar","A":"India’s diversity makes it culturally rich.","R":"People share and borrow food, words and art.","a":0,"e":"Exchange enriches culture."},{"id":"sst8x0","k":"mcq","q":"India’s unity in diversity means:","o":["many differences but a shared culture","everyone is the same","no festivals","one language only"],"a":0,"e":"‘Many in the One’.","sh":1,"x":1},{"id":"sst8x1","k":"mcq","q":"The saree is:","o":["an unstitched cloth draped in many styles","a stitched coat","only worn in one state","a modern dress"],"a":0,"e":"Shows diversity and unity.","sh":1,"x":1},{"id":"sst8x2","k":"mcq","q":"The main food grain of eastern and southern India is:","o":["rice","wheat","maize","barley"],"a":0,"e":"Wheat is more common in the north.","sh":1,"x":1},{"id":"sst8x3","k":"mcq","q":"Which festival marks the harvest in different names across India?","o":["Pongal / Bihu / Lohri / Makar Sankranti","Christmas only","Eid only","New Year"],"a":0,"e":"Same idea, different names.","sh":1,"x":1},{"id":"sst8x4","k":"mcq","q":"The Ramayana and Mahabharata are:","o":["epics known all over India in many versions","foreign books","science books","laws"],"a":0,"e":"Many regional versions.","sh":1,"x":1},{"id":"sst8x5","k":"mcq","q":"Unity in diversity can be seen in:","o":["food, clothes, festivals and stories","only in food","only in one city","nothing"],"a":0,"e":"Many examples needed in answers.","sh":1,"x":1},{"id":"sst8x6","k":"mcq","q":"Which is a millet?","o":["Ragi","Rice","Wheat","Potato"],"a":0,"e":"Nutri-cereals.","sh":1,"x":1},{"id":"sst8x7","k":"mcq","q":"Many Indian languages share:","o":["words and stories","nothing","one alphabet only","one name"],"a":0,"e":"Shared heritage.","sh":1,"x":1},{"id":"sst8x8","k":"mcq","q":"Diversity means:","o":["variety","sameness","conflict","poverty"],"a":0,"e":"Many kinds.","sh":1,"x":1},{"id":"sst8x9","k":"mcq","q":"The phrase ‘Many in the One’ suggests:","o":["many forms together in one nation","one person","only one religion","many countries"],"a":0,"e":"Theme of the chapter.","sh":1,"x":1},{"id":"sst8y0","k":"tf","q":"Diversity is a strength of India.","a":0,"e":"","x":1},{"id":"sst8y1","k":"tf","q":"All Indians wear the same clothes and eat the same food.","a":1,"e":"There is great variety.","x":1},{"id":"sst8y2","k":"tf","q":"Festivals bring communities together.","a":0,"e":"","x":1},{"id":"sst8m0","k":"mcq","q":"Bihu is a harvest festival of:","o":["Assam","Punjab","Kerala","Gujarat"],"a":0,"e":"Celebrated in mid-January/April.","sh":1,"x":1},{"id":"sst8m1","k":"mcq","q":"Onam is celebrated in:","o":["Kerala","Odisha","Bihar","Punjab"],"a":0,"e":"Harvest festival.","sh":1,"x":1},{"id":"sst8m2","k":"mcq","q":"The Panchatantra is a collection of:","o":["animal fables with morals","laws","maps","songs"],"a":0,"e":"Ancient Indian tales.","sh":1,"x":1},{"id":"sst8m3","k":"mcq","q":"‘Many in the One’ means:","o":["diversity within unity","only one culture","no differences","many countries"],"a":0,"e":"India’s strength.","sh":1,"x":1},{"id":"sst8f0","k":"mcq","fill":1,"q":"Pongal is celebrated mainly in ___.","o":["Tamil Nadu","Assam","Punjab","Odisha"],"a":0,"e":"","sh":1,"x":1},{"id":"sst8f1","k":"mcq","fill":1,"q":"The Ramayana is retold in ___ Indian languages.","o":["many","only one","no","two"],"a":0,"e":"","sh":1,"x":1},{"id":"sst8f2","k":"mcq","fill":1,"q":"Variety of cultures in a country is called ___.","o":["diversity","unity","uniformity","poverty"],"a":0,"e":"","sh":1,"x":1},{"id":"sst8c01","k":"mcq","q":"One story, many voices: In Tamil Nadu, children hear the Ramayana through Kamban’s poem. In Varanasi, Ramlila plays are performed every autumn. In Thailand, dancers perform the Ramakien. In each place the story is a little different, but the heroes and their values are loved by all. — What is the Thai version called?","o":["Ramlila","Ramakien","Kathakali","Manas"],"a":1,"e":"(b) Ramakien."}],"top":[{"q":"What is meant by ‘unity in diversity’?","m":2,"imp":true,"a":["India has great diversity — many languages, foods, clothes, festivals, beliefs and landscapes. Yet people share common values, stories, festivals and a sense of belonging to one country. This coming together of many differences into one whole is unity in diversity, or ‘many in the one’."],"k":"Diversity examples + common threads + one whole.","cm":"Writing only about diversity without unity."},{"q":"Give examples to show diversity and unity in Indian food.","m":3,"imp":true,"a":["Diversity: rice is the staple in the east and south (e.g. dosa, idli, fish-rice), wheat in the north and west (roti, paratha); regional dishes differ widely.","Unity: similar ideas run through all — use of spices, dal, seasonal and local produce, sharing food at festivals, and offering food to guests.","Many dishes (like khichdi) exist in different forms all over India."],"k":"Two diversity examples + two unity points.","cm":"Listing dishes without explaining the unity."},{"q":"How does the saree show unity in diversity?","m":3,"imp":true,"a":["The saree is an unstitched length of cloth worn by women across India — this is the common element (unity).","It is draped in many different ways (e.g. the nivi style, Bengali style, Maharashtrian nauvari) and woven in different regional styles — Kanchipuram (TN), Banarasi (UP), Patola (Gujarat), Pochampally (Telangana) — this is diversity."],"k":"Unstitched cloth everywhere + different drapes + regional weaves.","cm":"Naming weaves with the wrong states."},{"q":"Name four harvest festivals of India and the states where they are celebrated.","m":2,"imp":true,"a":["Pongal — Tamil Nadu","Bihu — Assam","Lohri — Punjab","Onam — Kerala","Baisakhi — Punjab/Haryana","Makar Sankranti / Uttarayan — many states incl. Gujarat, Maharashtra"],"k":"Four correct festival–state pairs.","cm":"Onam in Tamil Nadu (it is Kerala)."},{"q":"How do harvest festivals show unity in diversity?","m":3,"imp":true,"a":["Harvest festivals have different names, foods and customs in each region (diversity), but they all celebrate the harvest, thank the Sun/nature, and bring families and communities together — many fall around the same time of year (mid-January or mid-April). So the same idea is expressed in many forms."],"k":"Different forms + same purpose + same season.","cm":"Only listing festivals."},{"q":"How do the Ramayana and Mahabharata unite India?","m":3,"imp":true,"a":["The epics are known in every part of India and have been retold in many languages: Kamba Ramayanam (Tamil, Kamban), Ramcharitmanas (Awadhi, Tulsidas), Krittivasi Ramayan (Bengali), and others.","They appear in folk songs, dance, drama (Ramlila), puppetry and paintings across regions.","They have travelled abroad — e.g. Ramakien in Thailand, and versions in Indonesia and other Southeast Asian countries.","Their values (duty, truth, loyalty) are shared by people of different regions — a common cultural thread."],"k":"Many languages (with 2 examples) + art forms + abroad + shared values.","cm":"Matching Ramcharitmanas with Tamil."},{"q":"What is meant by India’s ‘sacred geography’? Give examples.","m":3,"imp":false,"a":["Holy places are spread across the whole country, and pilgrims travel from one end to another to visit them. Examples: the Char Dham (Badrinath in the north, Puri in the east, Rameswaram in the south, Dwarka in the west), the twelve Jyotirlingas, the Kumbh Mela. Such journeys make people feel the whole land is one."],"k":"Meaning + examples in all four directions + unity effect.","cm":"Giving only one place."},{"q":"India has many languages. How is this a strength?","m":3,"imp":false,"a":["India has hundreds of languages and dialects; the Constitution lists 22 scheduled languages.","Each language has rich literature, songs and knowledge; people often speak more than one language.","Languages borrow words from each other and share stories (e.g. the epics, Panchatantra) — showing unity through exchange."],"k":"Number + richness + borrowing/sharing.","cm":"Saying diversity of language causes only problems."},{"q":"What is the Panchatantra? Why is it an example of shared culture?","m":2,"imp":false,"a":["The Panchatantra is a collection of animal fables teaching wisdom and good conduct. Its stories are known across India in many languages and have been translated into many foreign languages, so it is shared by people everywhere."],"k":"What it is + spread.","cm":"Calling it an epic."},{"q":"Suggest three ways students can strengthen unity in diversity in school.","m":3,"imp":false,"a":["Celebrate festivals of different regions together; hold a food/dress day.","Learn a few words or songs in another Indian language.","Respect classmates’ customs and never mock differences; work in mixed groups."],"k":"Three practical actions.","cm":"Giving vague answers like ‘be good’."}],"prac":[{"lv":"Level 1: Basic","q":"Which festival is celebrated in Assam at harvest time?","a":"Bihu."},{"lv":"Level 1: Basic","q":"Who wrote the Ramcharitmanas?","a":"Tulsidas."},{"lv":"Level 1: Basic","q":"What is a saree?","a":"An unstitched length of cloth draped as a garment."},{"lv":"Level 1: Basic","q":"Name the Thai version of the Ramayana.","a":"Ramakien."},{"lv":"Level 2: Exam Standard","q":"Name two saree weaves with their states.","a":"Kanchipuram – Tamil Nadu; Banarasi – Uttar Pradesh (or Patola – Gujarat)."},{"lv":"Level 2: Exam Standard","q":"What do all harvest festivals celebrate?","a":"The harvest / thanks to nature and the Sun for crops."},{"lv":"Level 2: Exam Standard","q":"Name the Char Dham.","a":"Badrinath, Puri, Rameswaram, Dwarka."},{"lv":"Level 2: Exam Standard","q":"Name the Tamil version of the Ramayana and its author.","a":"Kamba Ramayanam by Kamban."},{"lv":"Level 3: Competency / Application","q":"A new student from Mizoram joins your class. Suggest two things you can do to make her feel at home.","a":"Invite her to share her festivals/food; learn a greeting in her language; include her in group work."},{"lv":"Level 3: Competency / Application","q":"Your school is holding a ‘One India’ day. Plan three stalls that show unity in diversity.","a":"Harvest-festival stall; saree/dress-drape stall; stall of the Ramayana in different languages/art forms."},{"lv":"Level 3: Competency / Application","q":"How can the same story (the Ramayana) be told differently in two regions? Give an example.","a":"Different languages, songs and art forms — e.g. Ramlila plays in the north, Kathakali performances in Kerala, Tholu Bommalata puppetry in Andhra."},{"lv":"Level 4: Challenge","q":"Is diversity a weakness or a strength? Give two arguments for your view.","a":"Strength: it gives rich languages, arts, foods and ideas; exchange between cultures creates new knowledge. (Accept balanced answers noting need for respect to avoid conflict.)"},{"lv":"Level 4: Challenge","q":"Why do you think harvest festivals in different states fall at about the same time?","a":"Crops are harvested in similar seasons across India, and many festivals follow the Sun’s movement (e.g. Makar Sankranti in mid-January)."}],"comp":[{"q":"Look at: Pongal, Bihu, Lohri, Makar Sankranti. What is common, and what is different?","a":"Common: all are harvest festivals in mid-January, thanking the Sun/nature. Different: names, foods, dances and customs (e.g. bonfire in Lohri, boiling rice in Pongal)."},{"q":"A tourist says, ‘India is too different from place to place to be one country.’ Give a two-point reply.","a":"• Shared stories (Ramayana, Mahabharata), values and festivals are found everywhere. • Pilgrimages and trade have linked all regions for centuries; the Constitution unites us as citizens."},{"q":"Your family eats rice, your friend’s eats roti. Is this diversity or division? Explain.","a":"It is diversity — a natural difference due to region and crops; it does not divide us. Both share meals with family and guests, which is a common value."}],"case":[{"t":"One story, many voices","p":"In Tamil Nadu, children hear the Ramayana through Kamban’s poem. In Varanasi, Ramlila plays are performed every autumn. In Thailand, dancers perform the Ramakien. In each place the story is a little different, but the heroes and their values are loved by all.","q":["(i) Who wrote the Tamil Ramayana?","(ii) What is the Thai version called? (a) Ramlila (b) Ramakien (c) Kathakali (d) Manas","(iii) How does this passage show ‘many in the one’?","(iv) Give one value the Ramayana teaches."],"a":["(i) Kamban.","(ii) (b) Ramakien.","(iii) One story (Ramayana) is told in many languages and forms.","(iv) Duty/truthfulness/loyalty/respect for elders."]}],"conc":[{"c":"Diversity","e":"Variety/differences among people and regions.","x":"Different languages and foods.","cf":"Diversity is not division.","t":""},{"c":"Unity","e":"Common bonds that hold people together.","x":"Shared festivals, stories, values.","cf":"Unity doesn’t mean everyone is the same.","t":"Unity = Understanding + Respect"},{"c":"Many in the one","e":"One core idea expressed in many regional forms.","x":"Saree: one garment, many drapes.","cf":"","t":""},{"c":"Sacred geography","e":"Holy places spread across the country linking regions.","x":"Char Dham.","cf":"It is about the whole land, not one state.","t":"Char Dham = 4 directions"}],"notes":[{"h":"Unity in diversity","t":"India has many languages, foods, clothes, festivals and religions, yet people share common values and a sense of belonging — “Many in the One”."},{"h":"Food","t":"Rice in the east and south, wheat in the north, millets across many states; common spices and many shared dishes with local names."},{"h":"Clothing","t":"The saree, dhoti and other unstitched garments are draped in many regional styles; the idea is shared, the style varies."},{"h":"Festivals","t":"Harvest festivals with different names: Pongal (Tamil Nadu), Bihu (Assam), Lohri (Punjab), Makar Sankranti, Onam (Kerala). Diwali, Eid, Christmas, Guru Purab are celebrated by many together."},{"h":"Shared stories and ideas","t":"Ramayana and Mahabharata exist in many languages and versions; Panchatantra tales travelled across India and the world."}]},{"n":9,"t":"Family and Community","intro":"A values-based chapter. Examiners reward answers with clear examples from real life. Learn the types of family, the roles/values in a family, and how communities help.","prio":[{"t":"Family: meaning; joint vs nuclear family","s":3},{"t":"Roles and values in a family: care, respect, sharing, responsibility","s":3},{"t":"Community: meaning; how communities help (festivals, disasters, common resources)","s":3},{"t":"Example: Halma tradition of the Bhil community (Jhabua, MP)","s":2},{"t":"Vasudhaiva Kutumbakam — the world is one family","s":3},{"t":"Interdependence: family ↔ community ↔ society","s":2}],"traps":[{"m":"Nuclear = large family","c":"Nuclear = parents + children","t":"Nucleus = small centre"},{"m":"Halma = festival","c":"Halma = collective help tradition","t":"Halma = Help All"},{"m":"One-sided opinion answers","c":"Give both sides, then your view","t":"Pros + Cons + View"},{"m":"Values without examples","c":"Every value + one real example","t":"Value + Example"},{"m":"Vasudhaiva Kutumbakam wrong meaning","c":"World is one family","t":"Vasudha = Earth"}],"rq":[{"q":"Why is the family important for society?","a":"It raises caring, responsible citizens who make up society."},{"q":"Why do communities share common resources like ponds?","a":"No single family can build/maintain them alone; sharing benefits all."},{"q":"Why should household work be shared?","a":"It reduces burden on one person and teaches responsibility and fairness."}],"mock":[],"qs":[{"id":"sst9p0","k":"mcq","q":"A family with grandparents, parents and children together is:","o":["nuclear","joint","single","extended only by friends"],"a":1,"e":"Many generations.","imp":true},{"id":"sst9p1","k":"mcq","q":"Halma is practised by the:","o":["Gond","Bhil","Santhal","Toda"],"a":1,"e":"Jhabua, MP.","imp":true},{"id":"sst9p2","k":"mcq","q":"’Vasudhaiva Kutumbakam’ means:","o":["family first","world is one family","my home is my country","unity is strength"],"a":1,"e":"Whole world = family.","imp":true},{"id":"sst9p3","k":"mcq","q":"The first school of a child is:","o":["the village","the family","the library","the market"],"a":1,"e":"First learning happens at home.","imp":false},{"id":"sst9p4","k":"mcq","q":"A community kitchen in a gurudwara is called:","o":["langar","mela","haat","sabha"],"a":0,"e":"Free food for all.","imp":false},{"id":"sst9p5","k":"mcq","q":"Nuclear families are more common in:","o":["villages only","cities","forests","deserts"],"a":1,"e":"Job migration.","imp":false},{"id":"sst9p6","k":"mcq","q":"Which is NOT a value learnt in a family?","o":["sharing","respect","greed","care"],"a":2,"e":"Greed is not a value.","imp":false},{"id":"sst9p7","k":"mcq","q":"Community help in Halma is:","o":["paid","voluntary and free","forced by law","done by the government"],"a":1,"e":"Unpaid cooperation.","imp":true},{"id":"sst9p8","k":"mcq","q":"People who share a place and help each other form a:","o":["crowd","community","company","committee"],"a":1,"e":"Definition of community.","imp":false},{"id":"sst9p9","k":"mcq","q":"India’s G20 theme in 2023 was based on:","o":["Satyameva Jayate","Vasudhaiva Kutumbakam","Jai Hind","Ahimsa"],"a":1,"e":"One Earth, One Family, One Future.","imp":false},{"id":"sst9t0","k":"tf","q":"A nuclear family has three generations.","a":1,"e":"Nuclear = parents + children."},{"id":"sst9t1","k":"tf","q":"Halma involves paid workers.","a":1,"e":"It is free, voluntary help."},{"id":"sst9t2","k":"tf","q":"Communities help during disasters.","a":0,"e":""},{"id":"sst9t3","k":"tf","q":"Family is the first place where children learn values.","a":0,"e":""},{"id":"sst9t4","k":"tf","q":"Vasudhaiva Kutumbakam means ’only my family matters’.","a":1,"e":"It means the whole world is one family."},{"id":"sst9t5","k":"tf","q":"Children can contribute to family by sharing chores.","a":0,"e":""},{"id":"sst9a0","k":"ar","A":"Joint families give strong support in difficult times.","R":"Many members share work and resources.","a":0,"e":"Sharing among many explains support."},{"id":"sst9a1","k":"ar","A":"Halma shows cooperation.","R":"Villagers work for free to help a family.","a":0,"e":"Free collective work = cooperation."},{"id":"sst9a2","k":"ar","A":"Communities are not needed in cities.","R":"Cities have many services.","a":3,"e":"A false — city people still need neighbours and communities; R true."},{"id":"sst9x0","k":"mcq","q":"A family with parents and their children only is a:","o":["nuclear family","joint family","community","panchayat"],"a":0,"e":"Small family.","sh":1,"x":1},{"id":"sst9x1","k":"mcq","q":"A family where grandparents, uncles and aunts live together is a:","o":["joint family","nuclear family","club","team"],"a":0,"e":"Extended family.","sh":1,"x":1},{"id":"sst9x2","k":"mcq","q":"Values learnt in families include:","o":["sharing, respect and caring","cheating","being rude","wasting food"],"a":0,"e":"Family is the first school.","sh":1,"x":1},{"id":"sst9x3","k":"mcq","q":"A group of people living in an area and helping each other is a:","o":["community","company","ministry","family only"],"a":0,"e":"e.g. a village or a colony.","sh":1,"x":1},{"id":"sst9x4","k":"mcq","q":"Caring for elders at home is an example of:","o":["family values","selfishness","business","tax"],"a":0,"e":"Respect for elders.","sh":1,"x":1},{"id":"sst9x5","k":"mcq","q":"During festivals, communities often:","o":["come together and celebrate","stop talking","close schools forever","move abroad"],"a":0,"e":"Shared joy.","sh":1,"x":1},{"id":"sst9x6","k":"mcq","q":"‘Vasudhaiva Kutumbakam’ means:","o":["the world is one family","work is worship","truth alone wins","health is wealth"],"a":0,"e":"From ancient texts.","sh":1,"x":1},{"id":"sst9x7","k":"mcq","q":"Helping a neighbour during a flood shows:","o":["community spirit","competition","laziness","anger"],"a":0,"e":"Mutual help.","sh":1,"x":1},{"id":"sst9x8","k":"mcq","q":"Who generally teaches us our first lessons?","o":["Family","Government","Market","TV only"],"a":0,"e":"Family is the first teacher.","sh":1,"x":1},{"id":"sst9y0","k":"tf","q":"Families teach us values like honesty and sharing.","a":0,"e":"","x":1},{"id":"sst9y1","k":"tf","q":"Only rich families can care for each other.","a":1,"e":"Caring has nothing to do with money.","x":1},{"id":"sst9y2","k":"tf","q":"Communities help when someone is in trouble.","a":0,"e":"","x":1},{"id":"sst9m0","k":"mcq","q":"Halma is a tradition of the:","o":["Bhil community","Toda community","Naga community","Santhal community"],"a":0,"e":"Collective help.","sh":1,"x":1},{"id":"sst9m1","k":"mcq","q":"Children learn values first from:","o":["family","television","market","internet"],"a":0,"e":"First school.","sh":1,"x":1},{"id":"sst9m2","k":"mcq","q":"Volunteers helping during floods show:","o":["community spirit","selfishness","competition","laziness"],"a":0,"e":"Mutual help.","sh":1,"x":1},{"id":"sst9m3","k":"mcq","q":"A family with grandparents, uncles and cousins together is:","o":["joint","nuclear","single","small"],"a":0,"e":"Many generations.","sh":1,"x":1},{"id":"sst9f0","k":"mcq","fill":1,"q":"‘Vasudhaiva Kutumbakam’ means the world is one ___.","o":["family","country","school","village"],"a":0,"e":"","sh":1,"x":1},{"id":"sst9f1","k":"mcq","fill":1,"q":"A ___ family has only parents and their children.","o":["nuclear","joint","extended","large"],"a":0,"e":"","sh":1,"x":1},{"id":"sst9f2","k":"mcq","fill":1,"q":"People who share a place and help each other form a ___.","o":["community","company","council","court"],"a":0,"e":"","sh":1,"x":1},{"id":"sst9c01","k":"mcq","q":"The village comes together: In Jhabua, a Bhil farmer’s well dried up and he could not afford to build a new water structure. He called for Halma. The next morning, families from the whole village arrived with tools. By evening, they had dug a new pond. No one asked for money. — In which state is Jhabua?","o":["Rajasthan","Madhya Pradesh","Gujarat","Odisha"],"a":1,"e":"(b) Madhya Pradesh."}],"top":[{"q":"What is a family? Why is it called the first school of a child?","m":3,"imp":true,"a":["A family is a group of people related by birth, marriage or adoption who usually live together and care for each other.","It is the first school because a child first learns language, habits, values (honesty, sharing, respect), and traditions from family members, especially parents and grandparents."],"k":"Definition + what children learn.","cm":"Defining family only as ‘people in a house’."},{"q":"Differentiate between a joint family and a nuclear family.","m":3,"imp":true,"a":["Joint family: two or three generations (grandparents, parents, uncles/aunts, children) live together; share resources and work; children learn from elders; more support in difficult times.","Nuclear family: parents and their children only; smaller; more common in cities; members may have more independence but less daily support from elders."],"k":"Members + size + one advantage each.","cm":"Saying one type is ‘good’ and the other ‘bad’."},{"q":"What values do we learn in a family? Give examples.","m":3,"imp":true,"a":["Care and love: looking after the sick or elderly.","Respect: for elders and each other’s opinions.","Sharing and cooperation: dividing household work, sharing food.","Responsibility: children doing their part — keeping their things tidy, helping at home.","Honesty and discipline."],"k":"Three values each with an example.","cm":"Listing values without examples."},{"q":"What is a community? Give two examples of how a community helps its members.","m":3,"imp":true,"a":["A community is a group of people living in the same area or sharing common interests, beliefs or ways of life, who help and depend on each other.","Examples: neighbours help during floods or illness; people celebrate festivals and weddings together; communities look after common resources like ponds, wells and forests; community kitchens (like langar) feed everyone."],"k":"Definition + two concrete examples.","cm":"Confusing community with ‘crowd’."},{"q":"What is the Halma tradition? What does it teach us?","m":3,"imp":false,"a":["Halma is a tradition of the Bhil community in Jhabua (Madhya Pradesh). When a family is in difficulty and cannot manage alone, it calls for Halma; the whole village comes to help with free labour — for example building a house or making water-harvesting structures. It teaches cooperation, collective effort and helping without expecting payment."],"k":"Community + place + what happens + lesson.","cm":"Saying Halma is a festival or paid work."},{"q":"What is the meaning of ‘Vasudhaiva Kutumbakam’?","m":2,"imp":true,"a":["‘Vasudhaiva Kutumbakam’ means ‘the whole world is one family’. It comes from ancient Indian texts (the Maha Upanishad) and teaches us to treat all people with care, as we treat our family. India used it as the theme of the G20 in 2023."],"k":"Meaning + message.","cm":"Translating it as ‘my family is my world’."},{"q":"How do family and community depend on each other?","m":3,"imp":false,"a":["Families need the community for shops, schools, doctors, security, help during emergencies.","The community depends on families to raise responsible, caring members who follow rules and help others.","Together they share festivals, traditions and common resources."],"k":"Both directions + one shared element.","cm":"Explaining only one direction."},{"q":"How should children contribute to their family?","m":2,"imp":false,"a":["Help with household chores (laying the table, cleaning their room).","Respect and care for elders; spend time with grandparents.","Use water and electricity carefully; study sincerely; share responsibilities."],"k":"Three practical contributions.","cm":"Writing only ‘obey parents’."},{"q":"Why do we need communities in times of disaster?","m":2,"imp":false,"a":["In disasters like floods or earthquakes, government help may take time. Neighbours and community members are first to rescue, share food and shelter, and support each other — so strong communities save lives."],"k":"First responders + sharing + example.","cm":"Saying only the government helps."},{"q":"What changes are happening in families today? Are they good or bad?","m":3,"imp":false,"a":["More nuclear families in cities because people move for jobs and education.","Both parents often work; children may spend less time with grandparents.","Balanced view: nuclear families give independence, but we must keep in touch with elders and relatives through visits and calls to keep family bonds strong."],"k":"Two changes + balanced opinion.","cm":"One-sided answer."}],"prac":[{"lv":"Level 1: Basic","q":"What is a nuclear family?","a":"A family of parents and their children."},{"lv":"Level 1: Basic","q":"Which community practises Halma?","a":"The Bhil community (Jhabua, MP)."},{"lv":"Level 1: Basic","q":"What does Vasudhaiva Kutumbakam mean?","a":"The world is one family."},{"lv":"Level 1: Basic","q":"Name one value learnt in a family.","a":"Respect/care/sharing/honesty (any one)."},{"lv":"Level 2: Exam Standard","q":"Give two advantages of a joint family.","a":"Support from elders; shared work and expenses; children learn traditions (any two)."},{"lv":"Level 2: Exam Standard","q":"Give two ways a community helps its members.","a":"Helps in emergencies; celebrates festivals together; protects shared resources (any two)."},{"lv":"Level 2: Exam Standard","q":"Why are nuclear families increasing in cities?","a":"People move to cities for jobs and education; smaller homes."},{"lv":"Level 2: Exam Standard","q":"What is a community kitchen?","a":"A kitchen where food is cooked and served free to all, like a langar."},{"lv":"Level 3: Competency / Application","q":"Your elderly neighbour lives alone and is unwell. Suggest two ways your family can help.","a":"Buy medicines/groceries for her; check on her daily; take her to the doctor."},{"lv":"Level 3: Competency / Application","q":"How can a school be like a community?","a":"Students and teachers share space, rules and goals, help each other and celebrate together."},{"lv":"Level 3: Competency / Application","q":"A village pond is getting dirty. How can the community solve this together, like Halma?","a":"Hold a shramdaan day to clean it; agree on rules not to dump waste; build a fence/steps; take turns maintaining it."},{"lv":"Level 4: Challenge","q":"How does the idea of Vasudhaiva Kutumbakam apply to international disasters?","a":"Countries send doctors, food and rescue teams to help, treating other nations like family members in trouble."},{"lv":"Level 4: Challenge","q":"Do nuclear families mean the end of family values? Give your view with reasons.","a":"No — values depend on how members behave; nuclear families can keep values by staying in touch with elders, sharing work and caring for each other."}],"comp":[{"q":"After a flood in your town, many houses are damaged. List three ways the community can act before government help arrives.","a":"• Rescue people and move them to safe places. • Share food, water and clothes; run a community kitchen. • Help clean and repair homes together."},{"q":"Draw a quick table: ‘work at home’ vs ‘who does it’ for your family. What does it show about sharing?","a":"The table often shows work done mainly by one person; sharing chores fairly reduces burden and teaches responsibility."},{"q":"Why is it important for children to spend time with grandparents?","a":"They learn stories, traditions and values; elders feel loved and less lonely; bonds across generations grow."}],"case":[{"t":"The village comes together","p":"In Jhabua, a Bhil farmer’s well dried up and he could not afford to build a new water structure. He called for Halma. The next morning, families from the whole village arrived with tools. By evening, they had dug a new pond. No one asked for money.","q":["(i) What is Halma?","(ii) In which state is Jhabua? (a) Rajasthan (b) Madhya Pradesh (c) Gujarat (d) Odisha","(iii) Name two values shown in this story.","(iv) How can your class use the Halma idea?"],"a":["(i) A Bhil tradition in which the whole community helps a family in need with free labour.","(ii) (b) Madhya Pradesh.","(iii) Cooperation, helpfulness, unity, selflessness (any two).","(iv) Work together to clean the school garden or help a classmate who is behind in studies."]}],"conc":[{"c":"Family","e":"People related by birth, marriage or adoption, caring for each other.","x":"Parents, grandparents, siblings.","cf":"Family is not only people living under one roof (tenants are not family).","t":""},{"c":"Joint vs nuclear","e":"Many generations together vs parents + children.","x":"Grandparents living with you = joint.","cf":"Neither is ‘better’ in all ways.","t":"Joint = Generations Join"},{"c":"Community","e":"People sharing a place/interests who help each other.","x":"Neighbours, village.","cf":"Community ≠ random crowd.","t":""},{"c":"Halma","e":"Bhil community’s collective help to a family in need.","x":"Villagers build water structures for free.","cf":"It is unpaid, voluntary help.","t":"Halma = Help All"},{"c":"Vasudhaiva Kutumbakam","e":"The world is one family.","x":"Helping people of other countries in disasters.","cf":"","t":""}],"notes":[{"h":"Family","t":"People related by birth, marriage or adoption who care for each other. Nuclear family: parents + children. Joint family: several generations living together."},{"h":"Values learnt","t":"Sharing, caring, respect for elders, responsibility, honesty, helping in household work. Family is our first school."},{"h":"Community","t":"A group of people sharing a place or interest who help each other — neighbours, village, colony."},{"h":"Community help","t":"Halma: Bhil tradition where the community helps a family in need (e.g. building water structures). Langar, community kitchens and volunteers during floods."},{"h":"Vasudhaiva Kutumbakam","t":"“The world is one family” — India helping other countries during disasters shows this idea."}]},{"n":10,"t":"Grassroots Democracy 1: Governance","intro":"This chapter sets up the next two. Learn the three organs and three levels of government — draw them as a chart — and the meaning of democracy.","prio":[{"t":"Why we need rules/laws and governance","s":3},{"t":"Three organs: Legislature (makes laws), Executive (implements), Judiciary (interprets, settles disputes)","s":3},{"t":"Separation of powers — why powers are divided","s":3},{"t":"Three levels: Union (central), State, Local","s":3},{"t":"Democracy: rule by the people through elected representatives; universal adult franchise (18+)","s":3},{"t":"Early democratic traditions: Vaishali, Uttaramerur inscriptions (Tamil Nadu)","s":2}],"traps":[{"m":"Mixing organs and levels","c":"Organs = Legislature/Executive/Judiciary; Levels = Union/State/Local","t":"Organs = work; Levels = place"},{"m":"Voting age 21","c":"18 years","t":"18 = adult"},{"m":"Judiciary makes laws","c":"Judiciary interprets; Legislature makes","t":"L-E-J = Law, Enforce, Justice"},{"m":"Police in judiciary","c":"Police = executive","t":"Police Put laws into action"},{"m":"Uttaramerur in Bihar","c":"Tamil Nadu (Chola)","t":"U-T: Uttaramerur – Tamil"},{"m":"Democracy = only voting","c":"Also rights, equality, participation, accountability","t":"Vote + Voice"}],"rq":[{"q":"Why is local government important in a big country like India?","a":"Local problems are best understood and solved by people living there."},{"q":"Why do we need a judiciary?","a":"To settle disputes fairly, interpret laws and protect rights."},{"q":"Why is voting called both a right and a duty?","a":"It is a right given by the Constitution and a duty because good government depends on citizens choosing wisely."}],"mock":[],"qs":[{"id":"sst10p0","k":"mcq","q":"Which organ makes laws?","o":["Executive","Judiciary","Legislature","Police"],"a":2,"e":"Parliament/Assembly.","imp":true},{"id":"sst10p1","k":"mcq","q":"The executive’s main job is to:","o":["make laws","implement laws","interpret laws","elect judges"],"a":1,"e":"Carry out laws.","imp":true},{"id":"sst10p2","k":"mcq","q":"Courts belong to the:","o":["legislature","executive","judiciary","local body"],"a":2,"e":"Justice and interpretation.","imp":false},{"id":"sst10p3","k":"mcq","q":"Minimum voting age in India:","o":["16","18","21","25"],"a":1,"e":"Universal adult franchise.","imp":true},{"id":"sst10p4","k":"mcq","q":"Which is NOT a level of government?","o":["Union","State","Local","Judiciary"],"a":3,"e":"Judiciary is an organ.","imp":false},{"id":"sst10p5","k":"mcq","q":"Uttaramerur inscriptions are in:","o":["Bihar","Tamil Nadu","Gujarat","Punjab"],"a":1,"e":"Chola period.","imp":true},{"id":"sst10p6","k":"mcq","q":"The Licchavi republic had its capital at:","o":["Vaishali","Pataliputra","Ujjain","Taxila"],"a":0,"e":"Bihar.","imp":false},{"id":"sst10p7","k":"mcq","q":"Separation of powers prevents:","o":["elections","misuse of power","taxes","laws"],"a":1,"e":"Checks and balances.","imp":true},{"id":"sst10p8","k":"mcq","q":"Panchayats and Municipalities are:","o":["Union government","State government","Local government","Courts"],"a":2,"e":"Grassroots level.","imp":false},{"id":"sst10p9","k":"mcq","q":"In a democracy, power ultimately lies with the:","o":["king","army","people","judges"],"a":2,"e":"Rule by the people.","imp":false},{"id":"sst10t0","k":"tf","q":"The judiciary makes laws.","a":1,"e":"Legislature makes laws; judiciary interprets them."},{"id":"sst10t1","k":"tf","q":"India has three levels of government.","a":0,"e":""},{"id":"sst10t2","k":"tf","q":"Only educated people can vote.","a":1,"e":"All citizens 18+ can vote."},{"id":"sst10t3","k":"tf","q":"Police are part of the executive.","a":0,"e":""},{"id":"sst10t4","k":"tf","q":"Uttaramerur is in Bihar.","a":1,"e":"Tamil Nadu; Vaishali is in Bihar."},{"id":"sst10t5","k":"tf","q":"Separation of powers protects people’s rights.","a":0,"e":""},{"id":"sst10a0","k":"ar","A":"Power is divided among three organs.","R":"This prevents misuse of power.","a":0,"e":"Prevention of misuse is the reason."},{"id":"sst10a1","k":"ar","A":"Every citizen aged 18+ can vote.","R":"India follows universal adult franchise.","a":0,"e":"R explains A."},{"id":"sst10a2","k":"ar","A":"The executive interprets laws.","R":"The police are part of the executive.","a":3,"e":"A false — the judiciary interprets laws; R true."},{"id":"sst10x0","k":"mcq","q":"The organ of government that makes laws is the:","o":["legislature","executive","judiciary","police"],"a":0,"e":"Parliament at the national level.","sh":1,"x":1},{"id":"sst10x1","k":"mcq","q":"The organ that implements laws is the:","o":["executive","legislature","judiciary","press"],"a":0,"e":"Carries out laws.","sh":1,"x":1},{"id":"sst10x2","k":"mcq","q":"The organ that interprets laws and gives justice is the:","o":["judiciary","executive","legislature","army"],"a":0,"e":"Courts.","sh":1,"x":1},{"id":"sst10x3","k":"mcq","q":"The three levels of government in India are:","o":["central, state and local","village, town and city","north, south and east","rich, poor and middle"],"a":0,"e":"Union, State, Local.","sh":1,"x":1},{"id":"sst10x4","k":"mcq","q":"Democracy means:","o":["government by the people","rule of one king","rule of the army","no government"],"a":0,"e":"People choose leaders.","sh":1,"x":1},{"id":"sst10x5","k":"mcq","q":"Keeping the three organs separate is called:","o":["separation of powers","unity of powers","monarchy","taxation"],"a":0,"e":"Prevents misuse of power.","sh":1,"x":1},{"id":"sst10x6","k":"mcq","q":"The highest court in India is the:","o":["Supreme Court","High Court","District Court","Panchayat"],"a":0,"e":"In New Delhi.","sh":1,"x":1},{"id":"sst10x7","k":"mcq","q":"Local government works at the level of:","o":["villages and towns","whole country","whole state","foreign countries"],"a":0,"e":"Grassroots level.","sh":1,"x":1},{"id":"sst10x8","k":"mcq","q":"Grassroots democracy means:","o":["people take part at the local level","only Parliament decides","no elections","only judges decide"],"a":0,"e":"Closest to people.","sh":1,"x":1},{"id":"sst10x9","k":"mcq","q":"Laws for the whole country are made by:","o":["Parliament","Gram Sabha","Municipality","High Court"],"a":0,"e":"Central legislature.","sh":1,"x":1},{"id":"sst10y0","k":"tf","q":"The judiciary makes laws.","a":1,"e":"The legislature makes laws; the judiciary interprets them.","x":1},{"id":"sst10y1","k":"tf","q":"India is a democracy.","a":0,"e":"","x":1},{"id":"sst10y2","k":"tf","q":"Local governments solve problems close to the people.","a":0,"e":"","x":1},{"id":"sst10m0","k":"mcq","q":"Laws for a state are made by the:","o":["State Legislative Assembly","Supreme Court","Gram Sabha","District Collector"],"a":0,"e":"State legislature.","sh":1,"x":1},{"id":"sst10m1","k":"mcq","q":"The executive at the national level is headed by the:","o":["Prime Minister (with the Council of Ministers)","Chief Justice","Speaker","Mayor"],"a":0,"e":"Carries out laws.","sh":1,"x":1},{"id":"sst10m2","k":"mcq","q":"Voting age in India:","o":["18 years","21 years","16 years","25 years"],"a":0,"e":"Universal adult franchise.","sh":1,"x":1},{"id":"sst10m3","k":"mcq","q":"Which organ settles disputes?","o":["Judiciary","Legislature","Executive","Panchayat Samiti"],"a":0,"e":"Courts.","sh":1,"x":1},{"id":"sst10f0","k":"mcq","fill":1,"q":"The organ that makes laws is the ___.","o":["legislature","executive","judiciary","police"],"a":0,"e":"","sh":1,"x":1},{"id":"sst10f1","k":"mcq","fill":1,"q":"The highest court in India is the ___ Court.","o":["Supreme","High","District","Family"],"a":0,"e":"","sh":1,"x":1},{"id":"sst10f2","k":"mcq","fill":1,"q":"Government at the level of villages and towns is called ___ government.","o":["local","state","union","foreign"],"a":0,"e":"","sh":1,"x":1},{"id":"sst10c00","k":"mcq","q":"Which dynasty’s time are these inscriptions from?","o":["Mauryas","Cholas","Mughals","Guptas"],"a":1,"e":"(b) Cholas."}],"top":[{"q":"Why do we need rules and a government?","m":3,"imp":true,"a":["Without rules there would be confusion, conflict and unfairness (e.g. traffic without signals).","A government makes and enforces rules so that people can live safely and peacefully.","It also provides services — roads, schools, hospitals, water — and protects people’s rights and settles disputes."],"k":"Order + safety + services + rights.","cm":"Saying government is only for collecting taxes."},{"q":"What is governance?","m":2,"imp":true,"a":["Governance is the process of making decisions, making rules and putting them into action for a society — including how a school, a village or a country is run so that everyone’s needs are met fairly."],"k":"Decision-making + rules + implementation.","cm":"Treating governance as the same as ‘the government building’."},{"q":"Name the three organs of government and state the work of each.","m":3,"imp":true,"a":["Legislature: makes laws (e.g. Parliament at the Union level, Legislative Assembly in a state).","Executive: implements (carries out) laws and runs the day-to-day administration (e.g. Prime Minister and ministers, officials, police).","Judiciary: interprets laws, settles disputes and punishes those who break laws; protects citizens’ rights (courts, Supreme Court)."],"k":"Name + function + example for each.","cm":"Saying the judiciary makes laws."},{"q":"What is separation of powers? Why is it important?","m":3,"imp":true,"a":["Separation of powers means the work of government is divided among the legislature, executive and judiciary, and each checks the others. It is important so that no single person or group has all the power, which prevents misuse of power and protects people’s rights and freedoms."],"k":"Division among three + checks + prevents misuse.","cm":"Explaining only the meaning, not the reason."},{"q":"What are the three levels of government in India? Give one example of work at each level.","m":3,"imp":true,"a":["Union (central) government: for the whole country — defence, currency, railways, foreign affairs.","State government: for a state — police, state roads, state hospitals.","Local government: for villages and towns — Panchayats (rural) and Municipalities (urban) — water supply, cleanliness, street lights."],"k":"Three levels + one example each.","cm":"Mixing levels with organs."},{"q":"What is democracy? What are its main features?","m":3,"imp":true,"a":["Democracy is a form of government in which people rule — they elect representatives who make decisions on their behalf.","Regular, free and fair elections; universal adult franchise — every citizen aged 18 or above can vote, whatever their gender, religion, caste or wealth.","Equality before law; rights and freedoms (speech, religion); representatives are accountable to people.","People can take part directly at the local level (Gram Sabha, ward committees)."],"k":"Definition + three features.","cm":"Saying only rich/educated people can vote."},{"q":"What is universal adult franchise?","m":2,"imp":true,"a":["Universal adult franchise means every adult citizen (18 years or above) has the right to vote, without discrimination on the basis of gender, religion, caste, education or wealth. India gave this right to all from the first elections."],"k":"18+ + all citizens + no discrimination.","cm":"Writing 21 years."},{"q":"What do the Uttaramerur inscriptions tell us about democracy in early India?","m":3,"imp":false,"a":["The Uttaramerur inscriptions (Tamil Nadu), from the time of the Chola rulers (about 10th century CE), describe how a village assembly chose its members. Names of eligible people were written on palm-leaf tickets, put into a pot (kudavolai), and a young boy drew them out. They also set qualifications (such as owning land/house, knowledge, good conduct) and disqualifications (e.g. for corruption). This shows local self-government and rules for elections existed long ago."],"k":"Place + period + method + qualifications.","cm":"Linking Uttaramerur with Vaishali."},{"q":"Why was Vaishali important in ancient India?","m":2,"imp":false,"a":["Vaishali (in present-day Bihar) was the capital of the Licchavis, a gana/sangha — a state where decisions were taken by an assembly of many representatives rather than by a single king. It is often called one of the earliest republics."],"k":"Bihar + Licchavis + assembly decisions.","cm":"Calling it a monarchy."},{"q":"How can citizens take part in governance?","m":3,"imp":false,"a":["Voting in elections (after 18).","Attending Gram Sabha/ward meetings, giving suggestions and raising problems.","Following laws, paying taxes, keeping surroundings clean, and informing authorities about problems (e.g. broken street lights)."],"k":"Three ways.","cm":"Only ‘voting’."}],"prac":[{"lv":"Level 1: Basic","q":"Which organ makes laws?","a":"Legislature."},{"lv":"Level 1: Basic","q":"What is the minimum voting age in India?","a":"18 years."},{"lv":"Level 1: Basic","q":"Name the three levels of government.","a":"Union, State, Local."},{"lv":"Level 1: Basic","q":"Which organ settles disputes?","a":"Judiciary."},{"lv":"Level 2: Exam Standard","q":"Why is power divided among three organs?","a":"To prevent misuse of power; each organ checks the others."},{"lv":"Level 2: Exam Standard","q":"Give one function of the Union government.","a":"Defence / foreign affairs / currency / railways."},{"lv":"Level 2: Exam Standard","q":"What was the kudavolai system?","a":"A village election method at Uttaramerur where names on palm-leaf tickets were put in a pot and drawn."},{"lv":"Level 2: Exam Standard","q":"What is democracy?","a":"Government by the people through elected representatives."},{"lv":"Level 3: Competency / Application","q":"A new rule bans plastic bags in your city. Which organ made it, which enforces it, and where can a shopkeeper challenge it?","a":"Legislature/local council makes it; executive (municipal officials/police) enforces; judiciary (court) hears challenges."},{"lv":"Level 3: Competency / Application","q":"Your class elects a monitor. How is this like a democracy?","a":"Students vote freely, the one with most votes represents them, and the monitor should be accountable to the class."},{"lv":"Level 3: Competency / Application","q":"Why is local government called ‘grassroots democracy’?","a":"It is closest to the people; they take part directly in decisions about their own area."},{"lv":"Level 4: Challenge","q":"What might happen if one person made laws, enforced them and judged cases?","a":"Power could be misused; laws might be unfair; no one could challenge wrong decisions — rights would not be safe."},{"lv":"Level 4: Challenge","q":"Compare the Uttaramerur system with elections today (one similarity, one difference).","a":"Similarity: rules for who can stand, and a fair method of choosing. Difference: today all adults vote secretly with EVMs; then names were drawn by lot from a pot."}],"comp":[{"q":"A pothole on your street is not repaired for months. Which level of government is responsible, and what can citizens do?","a":"Local government (Municipality/Panchayat). Citizens can complain to the ward councillor or sarpanch, raise it at a ward/Gram Sabha meeting, or use the civic body’s helpline/app."},{"q":"Match the work to the organ: (i) a judge decides a land dispute (ii) Parliament passes a law (iii) police stop a car for over-speeding.","a":"(i) Judiciary (ii) Legislature (iii) Executive."},{"q":"Your school forms a student council with a ‘rules committee’, ‘action team’ and ‘discipline panel’. Which organs do they resemble?","a":"Rules committee — Legislature; action team — Executive; discipline panel — Judiciary."}],"case":[{"t":"Choosing by the pot","p":"More than a thousand years ago, in the village of Uttaramerur in Tamil Nadu, the villagers wrote the names of eligible candidates on palm leaves and placed them in a pot. A young boy drew out the leaves one by one. The inscriptions also say that anyone who had taken bribes could not stand for the committee.","q":["(i) Which dynasty’s time are these inscriptions from? (a) Mauryas (b) Cholas (c) Mughals (d) Guptas","(ii) Why was a young boy chosen to draw the names?","(iii) Give one disqualification mentioned.","(iv) What does this tell us about early India?"],"a":["(i) (b) Cholas.","(ii) So the choice would be fair and unbiased.","(iii) Taking bribes / corruption.","(iv) Local self-government with rules for fair selection existed long ago."]}],"conc":[{"c":"Legislature","e":"Law-making body.","x":"Parliament; State Legislative Assembly.","cf":"Legislature ≠ Judiciary.","t":"L = Laws made"},{"c":"Executive","e":"Carries out laws; runs administration.","x":"PM, ministers, police, officials.","cf":"Police belong to the executive, not the judiciary.","t":"E = Enforce"},{"c":"Judiciary","e":"Interprets laws, settles disputes.","x":"Supreme Court, High Courts.","cf":"Judges do not make laws.","t":"J = Justice"},{"c":"Separation of powers","e":"Powers divided so each organ checks others.","x":"Court can stop an unfair action of executive.","cf":"It is not the same as three levels.","t":""},{"c":"Levels of government","e":"Union, State, Local.","x":"Panchayat is local level.","cf":"Levels = where; organs = what work.","t":"U-S-L: Union, State, Local"}],"notes":[{"h":"Government","t":"An organised system that makes and carries out rules, keeps order and provides services for the people."},{"h":"Three organs","t":"Legislature: makes laws (Parliament, State Assemblies). Executive: carries out laws (Prime Minister/Chief Minister, ministers, officials). Judiciary: interprets laws and gives justice (courts; Supreme Court is the highest)."},{"h":"Separation of powers","t":"Each organ does its own work and checks the others, so no one misuses power."},{"h":"Three levels","t":"Union (Central) government for the whole country, State governments, Local governments (panchayats, municipalities)."},{"h":"Democracy","t":"Rule by the people through elected representatives. Universal adult franchise: every citizen aged 18+ can vote."},{"h":"Grassroots democracy","t":"People take part in decisions at the local level — closest to their daily lives."}]},{"n":11,"t":"Grassroots Democracy 2: Rural Local Government","intro":"The three-tier Panchayati Raj flowchart is the heart of this chapter. Draw it, then learn Gram Sabha vs Gram Panchayat and the functions.","prio":[{"t":"Panchayati Raj: three tiers — Gram Panchayat (village), Panchayat Samiti (block), Zila Parishad (district)","s":3},{"t":"Gram Sabha: all adults (18+) of the village on the voters’ list","s":3},{"t":"Gram Sabha vs Gram Panchayat (difference)","s":3},{"t":"Gram Panchayat: Sarpanch/Pradhan, ward members (panch), secretary; elected for 5 years","s":3},{"t":"Functions and sources of income of the Panchayat","s":3},{"t":"73rd Amendment (1992); reservation: at least one-third seats for women; SC/ST","s":3},{"t":"Why local self-government matters","s":2}],"traps":[{"m":"Gram Sabha = Gram Panchayat","c":"Sabha = all adult voters; Panchayat = elected council","t":"Sabha = Sab (all)"},{"m":"Gram Sabha counted as a tier","c":"Three tiers: GP, PS, ZP","t":"G-P-Z"},{"m":"73rd vs 74th Amendment","c":"73rd rural; 74th urban","t":"3 for ‘gram’, 4 for ‘city’"},{"m":"Secretary elected","c":"Secretary appointed by","t":"Secretary = Selected govt"},{"m":"Zila Parishad at block","c":"Zila = district","t":"Zila = Zilla (district)"},{"m":"Reservation 50% everywhere","c":"At least one-third by law; many states 50%","t":"1/3 minimum"}],"rq":[{"q":"Why must the Gram Sabha meet regularly?","a":"To keep the Panchayat accountable, share information and let everyone participate."},{"q":"Why does the Panchayat need government grants?","a":"Local taxes are not enough for big works like roads, schools and water projects."},{"q":"Why is a three-tier system useful?","a":"Village, block and district problems differ; each tier handles its level and coordinates with the others."}],"mock":[],"qs":[{"id":"sst11p0","k":"mcq","q":"The lowest tier of Panchayati Raj is the:","o":["Zila Parishad","Panchayat Samiti","Gram Panchayat","Gram Sabha"],"a":2,"e":"Village-level elected body.","imp":true},{"id":"sst11p1","k":"mcq","q":"The Gram Sabha consists of:","o":["only the Sarpanch","all adult voters of the village","government officials","ward members only"],"a":1,"e":"All 18+ voters.","imp":true},{"id":"sst11p2","k":"mcq","q":"The Panchayat Samiti works at the:","o":["village level","block level","district level","state level"],"a":1,"e":"Block.","imp":true},{"id":"sst11p3","k":"mcq","q":"The term of a Panchayat is:","o":["2 years","4 years","5 years","6 years"],"a":2,"e":"Five years.","imp":false},{"id":"sst11p4","k":"mcq","q":"The Panchayat Secretary is:","o":["elected by villagers","appointed by government","the Sarpanch’s son","a judge"],"a":1,"e":"Appointed official.","imp":false},{"id":"sst11p5","k":"mcq","q":"Panchayati Raj got constitutional status by the:","o":["42nd Amendment","73rd Amendment","74th Amendment","86th Amendment"],"a":1,"e":"1992.","imp":true},{"id":"sst11p6","k":"mcq","q":"At least ____ seats are reserved for women.","o":["one-fourth","one-third","one-half in all states","none"],"a":1,"e":"Many states give 50%.","imp":false},{"id":"sst11p7","k":"mcq","q":"National Panchayati Raj Day is on:","o":["26 January","24 April","15 August","2 October"],"a":1,"e":"73rd Amendment in force.","imp":false},{"id":"sst11p8","k":"mcq","q":"Which is NOT a Panchayat function?","o":["street lights","village roads","printing currency","drinking water"],"a":2,"e":"Union subject.","imp":false},{"id":"sst11p9","k":"mcq","q":"The head of the Gram Panchayat is the:","o":["Mayor","Sarpanch","Collector","Commissioner"],"a":1,"e":"Also called Pradhan.","imp":true},{"id":"sst11t0","k":"tf","q":"The Gram Sabha is one of the three tiers.","a":1,"e":"Tiers: Gram Panchayat, Panchayat Samiti, Zila Parishad; Gram Sabha is the general body of voters."},{"id":"sst11t1","k":"tf","q":"The Zila Parishad works at the district level.","a":0,"e":""},{"id":"sst11t2","k":"tf","q":"Panchayat elections are held every 5 years.","a":0,"e":""},{"id":"sst11t3","k":"tf","q":"The Secretary of the Panchayat is elected.","a":1,"e":"Appointed by the government."},{"id":"sst11t4","k":"tf","q":"Panchayats can collect some taxes.","a":0,"e":""},{"id":"sst11t5","k":"tf","q":"The 74th Amendment is about Panchayats.","a":1,"e":"73rd = rural; 74th = urban."},{"id":"sst11a0","k":"ar","A":"The Gram Sabha keeps the Panchayat accountable.","R":"It can question the Panchayat about its work and accounts.","a":0,"e":"Questioning = accountability."},{"id":"sst11a1","k":"ar","A":"Seats are reserved for women in Panchayats.","R":"Women were earlier left out of decision-making.","a":0,"e":"Reservation corrects this."},{"id":"sst11a2","k":"ar","A":"The Panchayat Samiti is at the district level.","R":"The Zila Parishad coordinates Panchayat Samitis.","a":3,"e":"A false — Samiti is at block level; R true."},{"id":"sst11x0","k":"mcq","q":"All adults (18+) of a village together form the:","o":["Gram Sabha","Gram Panchayat","Zila Parishad","Panchayat Samiti"],"a":0,"e":"Village assembly.","sh":1,"x":1},{"id":"sst11x1","k":"mcq","q":"The head of a Gram Panchayat is the:","o":["Sarpanch (Pradhan)","Mayor","Collector","MLA"],"a":0,"e":"Elected by villagers.","sh":1,"x":1},{"id":"sst11x2","k":"mcq","q":"Panchayati Raj at the block level is the:","o":["Panchayat Samiti","Gram Sabha","Zila Parishad","Municipality"],"a":0,"e":"Middle tier.","sh":1,"x":1},{"id":"sst11x3","k":"mcq","q":"Panchayati Raj at the district level is the:","o":["Zila Parishad","Panchayat Samiti","Gram Panchayat","Nagar Nigam"],"a":0,"e":"Top tier.","sh":1,"x":1},{"id":"sst11x4","k":"mcq","q":"The Panchayati Raj system has ___ tiers.","o":["3","2","4","5"],"a":0,"e":"Village, block, district.","sh":1,"x":1},{"id":"sst11x5","k":"mcq","q":"The 73rd Amendment (1992) is about:","o":["Panchayati Raj (rural local government)","urban bodies","Supreme Court","elections to Parliament"],"a":0,"e":"Constitutional status for panchayats.","sh":1,"x":1},{"id":"sst11x6","k":"mcq","q":"By law, at least ___ of panchayat seats are reserved for women.","o":["one-third","half","one-fourth","none"],"a":0,"e":"Many states give 50%.","sh":1,"x":1},{"id":"sst11x7","k":"mcq","q":"Members of the Gram Panchayat are called:","o":["Panch","Councillor","Mayor","Minister"],"a":0,"e":"Elected from wards.","sh":1,"x":1},{"id":"sst11x8","k":"mcq","q":"The Gram Panchayat secretary is:","o":["appointed by the government","elected by villagers","the Sarpanch","a judge"],"a":0,"e":"Keeps records.","sh":1,"x":1},{"id":"sst11x9","k":"mcq","q":"One function of a Gram Panchayat:","o":["building village roads and wells","making national laws","running the army","printing money"],"a":0,"e":"Local works.","sh":1,"x":1},{"id":"sst11x10","k":"mcq","q":"The Gram Sabha’s main role is to:","o":["check the work of the Gram Panchayat","run Parliament","make currency","judge criminal cases"],"a":0,"e":"Keeps panchayat accountable.","sh":1,"x":1},{"id":"sst11y0","k":"tf","q":"Every adult of the village is a member of the Gram Sabha.","a":0,"e":"","x":1},{"id":"sst11y1","k":"tf","q":"The Zila Parishad works at the village level.","a":1,"e":"It works at the district level.","x":1},{"id":"sst11y2","k":"tf","q":"Panchayat elections are held every 5 years.","a":0,"e":"","x":1},{"id":"sst11m0","k":"mcq","q":"The middle tier of Panchayati Raj is the:","o":["Panchayat Samiti","Gram Sabha","Zila Parishad","Gram Panchayat"],"a":0,"e":"At the block level.","sh":1,"x":1},{"id":"sst11m1","k":"mcq","q":"Panchayat members are elected for:","o":["5 years","2 years","10 years","1 year"],"a":0,"e":"Fixed term.","sh":1,"x":1},{"id":"sst11m2","k":"mcq","q":"Who keeps the records of the Gram Panchayat?","o":["Secretary","Sarpanch","Collector","MLA"],"a":0,"e":"Appointed official.","sh":1,"x":1},{"id":"sst11m3","k":"mcq","q":"Which amendment gave constitutional status to panchayats?","o":["73rd","74th","42nd","86th"],"a":0,"e":"1992.","sh":1,"x":1},{"id":"sst11f0","k":"mcq","fill":1,"q":"The head of the Gram Panchayat is the ___.","o":["Sarpanch","Mayor","Collector","Governor"],"a":0,"e":"","sh":1,"x":1},{"id":"sst11f1","k":"mcq","fill":1,"q":"All adult voters of a village form the ___.","o":["Gram Sabha","Zila Parishad","Panchayat Samiti","Municipality"],"a":0,"e":"","sh":1,"x":1},{"id":"sst11f2","k":"mcq","fill":1,"q":"The district-level body of Panchayati Raj is the ___.","o":["Zila Parishad","Gram Sabha","Panchayat Samiti","Nagar Panchayat"],"a":0,"e":"","sh":1,"x":1},{"id":"sst11c01","k":"mcq","q":"Who presented the accounts?","o":["Collector","Sarpanch","MLA","Judge"],"a":1,"e":"(b) Sarpanch."}],"top":[{"q":"What is Panchayati Raj? Name its three tiers.","m":3,"imp":true,"a":["Panchayati Raj is the system of local self-government in rural areas, through which villagers take part in decisions about their own area.","Three tiers: Gram Panchayat at the village level → Panchayat Samiti (Block/Janpad/Mandal) at the block level → Zila Parishad at the district level.","It was given constitutional status by the 73rd Amendment (1992)."],"k":"Definition + three tiers with levels.","cm":"Putting Gram Sabha as one of the three tiers."},{"q":"What is the Gram Sabha? Why is it important?","m":3,"imp":true,"a":["The Gram Sabha is a meeting of all adults (18 years and above) who live in the village and whose names are on the voters’ list.","It elects the Gram Panchayat members, discusses village problems, approves plans and the budget, and checks the work of the Panchayat.","It is important because it makes the Panchayat accountable and lets every villager participate directly — the base of grassroots democracy."],"k":"Membership + functions + why important (accountability).","cm":"Saying only elected members are in the Gram Sabha."},{"q":"Differentiate between the Gram Sabha and the Gram Panchayat.","m":3,"imp":true,"a":["Gram Sabha: all adult voters of the village; a general body that meets a few times a year; elects and supervises the Panchayat.","Gram Panchayat: a small elected body (Sarpanch + ward members + secretary); meets regularly; carries out development work; is answerable to the Gram Sabha."],"k":"Membership + role + relationship.","cm":"Using the two terms as the same thing."},{"q":"Describe the composition of a Gram Panchayat.","m":3,"imp":true,"a":["The village is divided into wards; each ward elects a ward member (panch).","The head is the Sarpanch/Pradhan (with an Upa-Sarpanch deputy), elected by the voters or by the members as per state law.","A Panchayat Secretary, appointed by the government (not elected), keeps records and calls meetings.","Members are elected for 5 years; at least one-third seats are reserved for women, and seats are reserved for SC/ST in proportion to population."],"k":"Wards/panch + Sarpanch + Secretary (appointed) + 5 years + reservation.","cm":"Saying the secretary is elected."},{"q":"State the main functions of a Gram Panchayat.","m":3,"imp":true,"a":["Water: construct and maintain wells, hand-pumps, ponds, drinking-water supply.","Roads and lights: village roads, drains, street lights.","Sanitation and health: cleanliness, toilets, waste disposal; support to health centres.","Education: help run primary schools, anganwadis.","Welfare: carry out government schemes (e.g. rural employment, housing); keep records of births and deaths; settle small local disputes; care of common lands/grazing grounds."],"k":"At least five different functions.","cm":"Listing Union-level work like defence."},{"q":"How does a Panchayat get money for its work?","m":3,"imp":false,"a":["Taxes and fees — on houses, market places/weekly haats, water, vehicles, etc.","Grants from the state and central governments for development schemes.","Donations and income from community resources (e.g. leasing a pond for fishing)."],"k":"Taxes + government grants + other income.","cm":"Saying Panchayats print money."},{"q":"What are the Panchayat Samiti and Zila Parishad?","m":3,"imp":false,"a":["Panchayat Samiti (Block Samiti/Janpad Panchayat/Mandal): works at the block level, links several Gram Panchayats, plans and coordinates their work and passes on funds.","Zila Parishad: works at the district level; coordinates all Panchayat Samitis, makes district development plans, and distributes government funds; members include elected representatives."],"k":"Level + main role of each.","cm":"Swapping block and district levels."},{"q":"Why are seats reserved for women and SC/ST in Panchayats?","m":3,"imp":true,"a":["To ensure equal participation of groups who were left out of decision-making in the past.","Women and SC/ST members bring their problems and viewpoints (water, health, schools) to the Panchayat.","It builds leadership, confidence and equality. At least one-third seats (many states 50%) are reserved for women."],"k":"Reason + benefit + figure.","cm":"Writing ‘because they are weak’."},{"q":"Why is local self-government called ‘grassroots democracy’?","m":2,"imp":true,"a":["Just as grass has its roots in the soil, democracy starts at the lowest level — the village. People directly take part in decisions that affect their daily lives (water, roads, schools) and can question their representatives in the Gram Sabha."],"k":"Lowest level + direct participation.","cm":"Explaining without the idea of ‘lowest level’."},{"q":"What was the 73rd Constitutional Amendment? What did it change?","m":2,"imp":false,"a":["The 73rd Amendment (1992, in force from 24 April 1993) gave constitutional status to Panchayati Raj. It made the three-tier system, regular elections every 5 years, Gram Sabhas, and reservation for women (at least one-third) and SC/ST compulsory across states. 24 April is celebrated as National Panchayati Raj Day."],"k":"Year + what became compulsory.","cm":"Mixing it up with the 74th (urban)."}],"prac":[{"lv":"Level 1: Basic","q":"Who heads the Gram Panchayat?","a":"The Sarpanch/Pradhan."},{"lv":"Level 1: Basic","q":"At which level does the Zila Parishad work?","a":"District level."},{"lv":"Level 1: Basic","q":"What is the term of a Panchayat?","a":"5 years."},{"lv":"Level 1: Basic","q":"Who can be a member of the Gram Sabha?","a":"Every adult (18+) whose name is on the village voters’ list."},{"lv":"Level 2: Exam Standard","q":"Give three functions of a Gram Panchayat.","a":"Drinking water, village roads, cleanliness/drains, street lights, birth/death records, schemes (any three)."},{"lv":"Level 2: Exam Standard","q":"Who appoints the Panchayat Secretary?","a":"The (state) government."},{"lv":"Level 2: Exam Standard","q":"Which Amendment made Panchayati Raj part of the Constitution?","a":"The 73rd Amendment (1992)."},{"lv":"Level 2: Exam Standard","q":"Give two sources of income of a Panchayat.","a":"Taxes/fees on houses, markets; government grants (any two)."},{"lv":"Level 3: Competency / Application","q":"The village hand-pump has been broken for a month. What can villagers do through the Gram Sabha?","a":"Raise it at the Gram Sabha meeting, ask the Panchayat to repair it from its funds, and check that the work is done."},{"lv":"Level 3: Competency / Application","q":"A newly elected woman sarpanch builds toilets and a water tank first. Why might she choose these?","a":"Women and girls face the most hardship without water and toilets — she understands these needs; it improves health and safety."},{"lv":"Level 3: Competency / Application","q":"Arrange in order from village to district: Zila Parishad, Gram Panchayat, Panchayat Samiti.","a":"Gram Panchayat → Panchayat Samiti → Zila Parishad."},{"lv":"Level 4: Challenge","q":"If the Gram Sabha never met, what could go wrong in the village?","a":"Panchayat members may misuse funds or ignore needs; villagers lose their say; no one checks accounts — democracy weakens."},{"lv":"Level 4: Challenge","q":"Why is it better for villagers, rather than officials in a far-off city, to decide on a new village pond?","a":"Villagers know local needs, land and water sources; they will use and maintain it; local decisions are faster and more suitable."}],"comp":[{"q":"Read: ‘In a Gram Sabha meeting, villagers found that money for a road had been spent but the road was not built.’ Which power of the Gram Sabha is shown? What should they do next?","a":"The Gram Sabha’s power to check the work and accounts of the Panchayat. They should demand an explanation, record it in the minutes, and complain to the Block/District officials if needed."},{"q":"Draw the Panchayati Raj structure as a pyramid with the level of each tier.","a":"Top: Zila Parishad (district); middle: Panchayat Samiti (block); base: Gram Panchayat (village), elected by the Gram Sabha."},{"q":"Your village needs a library. Plan how you would get it through the Panchayat (3 steps).","a":"• Collect support and raise the demand in the Gram Sabha. • Ask the Panchayat to include it in the village plan/budget and seek government grants. • Form a volunteer committee to run and maintain it."}],"case":[{"t":"The Gram Sabha meeting","p":"In Chandpur village, the Gram Sabha met in the school ground. The Sarpanch read out the year’s accounts. An old farmer asked why the drain in his lane was still open. Several women demanded a new hand-pump near the anganwadi. The Panchayat agreed to take up both works.","q":["(i) Who can attend the Gram Sabha?","(ii) Who presented the accounts? (a) Collector (b) Sarpanch (c) MLA (d) Judge","(iii) How does this meeting show accountability?","(iv) Name one function of the Panchayat seen here."],"a":["(i) All adults (18+) of the village on the voters’ list.","(ii) (b) Sarpanch.","(iii) The Panchayat had to explain its spending and answer villagers’ questions.","(iv) Drains/sanitation or drinking water (hand-pump)."]}],"conc":[{"c":"Gram Sabha","e":"All adult voters of a village.","x":"Villagers meeting to approve the budget.","cf":"It is NOT one of the three tiers.","t":"Sabha = Sab (all) adults"},{"c":"Gram Panchayat","e":"Elected village council.","x":"Sarpanch + panches + secretary.","cf":"Secretary is appointed, not elected.","t":"Panchayat = Panch (elected few)"},{"c":"Three tiers","e":"Village → Block → District.","x":"Gram Panchayat → Panchayat Samiti → Zila Parishad.","cf":"Zila = district.","t":"G-P-Z (village-block-district)"},{"c":"Reservation","e":"Seats kept aside for women and SC/ST.","x":"At least one-third for women.","cf":"Reservation ≠ nomination; they are still elected.","t":"1/3 minimum"}],"notes":[{"h":"Panchayati Raj","t":"Three tiers of rural local government: Gram Panchayat (village), Panchayat Samiti (block), Zila Parishad (district). Given constitutional status by the 73rd Amendment (1992)."},{"h":"Gram Sabha","t":"All adults (18+) of the village on the voters’ list. Meets regularly, approves plans and budgets, checks the Gram Panchayat’s work — keeps it accountable."},{"h":"Gram Panchayat","t":"Sarpanch/Pradhan (head) + Panches (ward members), elected for 5 years. Secretary is appointed by the government and keeps records."},{"h":"Functions","t":"Roads, drains, drinking water, street lights, school buildings, health centres, recording births and deaths, implementing government schemes."},{"h":"Funds","t":"Taxes on houses and markets, fees, and grants from the state and central governments."},{"h":"Women in panchayats","t":"At least one-third of seats reserved for women by law; many states (including Odisha) reserve 50%."}]},{"n":12,"t":"Grassroots Democracy 3: Urban Local Government","intro":"Mirror of Chapter 11 for towns and cities. Learn the three types of urban bodies, ward/councillor, Mayor vs Commissioner, functions and income.","prio":[{"t":"Three types: Municipal Corporation (big cities), Municipal Council/Nagar Palika (smaller cities/towns), Nagar Panchayat (areas changing from rural to urban)","s":3},{"t":"City divided into wards; each elects a councillor/corporator","s":3},{"t":"Mayor (elected head) vs Municipal Commissioner (appointed administrative head)","s":3},{"t":"Functions: water, waste, drains, roads, street lights, parks, health, birth/death records","s":3},{"t":"Income: property tax, water tax, fees + state grants","s":2},{"t":"74th Amendment (1992); ward committees; citizens’ role","s":3}],"traps":[{"m":"Mayor appointed / Commissioner elected","c":"Mayor elected; Commissioner appointed","t":"Mayor = Majority chose"},{"m":"73rd for urban","c":"74th = urban","t":"4 for city (more)"},{"m":"Nagar Panchayat is rural","c":"Urban (transitional)","t":"Nagar = town"},{"m":"Income tax as municipal income","c":"Property tax","t":"Property → City"},{"m":"Defence/police as municipal function","c":"Water, waste, lights, roads, health, records","t":"WWLRHR"},{"m":"Only ’voting’ as participation","c":"Also ward committees, RWAs, complaints, segregation","t":"Vote + Voice + Values"}],"rq":[{"q":"Why is waste segregation important?","a":"Wet waste can be composted and dry waste recycled; it reduces landfill and pollution."},{"q":"Why are cities divided into wards?","a":"Smaller areas are easier to manage and each has a representative for local problems."},{"q":"Why does the corporation need grants from the state?","a":"Its own taxes are not enough for big projects like metro, bridges, water plants."}],"mock":[],"qs":[{"id":"sst12p0","k":"mcq","q":"The elected head of a Municipal Corporation is the:","o":["Commissioner","Mayor","Sarpanch","Collector"],"a":1,"e":"Elected by/among councillors.","imp":true},{"id":"sst12p1","k":"mcq","q":"The Municipal Commissioner is:","o":["elected","appointed by the state government","chosen by lottery","a judge"],"a":1,"e":"Often an IAS officer.","imp":true},{"id":"sst12p2","k":"mcq","q":"Urban local bodies got constitutional status by the:","o":["73rd Amendment","74th Amendment","42nd Amendment","61st Amendment"],"a":1,"e":"1992.","imp":true},{"id":"sst12p3","k":"mcq","q":"A city is divided into:","o":["blocks","wards","districts","tiers"],"a":1,"e":"Each elects a councillor.","imp":false},{"id":"sst12p4","k":"mcq","q":"Main source of income of a corporation:","o":["income tax","property tax","GST only","customs duty"],"a":1,"e":"Paid by property owners.","imp":true},{"id":"sst12p5","k":"mcq","q":"Local body for an area changing from rural to urban:","o":["Gram Panchayat","Nagar Panchayat","Zila Parishad","Municipal Corporation"],"a":1,"e":"Transitional area.","imp":false},{"id":"sst12p6","k":"mcq","q":"Which is NOT a municipal function?","o":["garbage collection","street lights","defence","water supply"],"a":2,"e":"Union subject.","imp":false},{"id":"sst12p7","k":"mcq","q":"Head of a Municipal Council is the:","o":["Mayor","Chairperson","Sarpanch","Governor"],"a":1,"e":"Also President in some states.","imp":false},{"id":"sst12p8","k":"mcq","q":"Indore is famous for:","o":["cleanliness","largest port","highest dam","oldest university"],"a":0,"e":"Swachh Survekshan rank.","imp":false},{"id":"sst12p9","k":"mcq","q":"Ward councillors are elected for:","o":["2 years","3 years","5 years","life"],"a":2,"e":"Five years.","imp":false},{"id":"sst12t0","k":"tf","q":"The Mayor is appointed by the state government.","a":1,"e":"Mayor is elected; the Commissioner is appointed."},{"id":"sst12t1","k":"tf","q":"Big cities have Municipal Corporations.","a":0,"e":""},{"id":"sst12t2","k":"tf","q":"Property tax is collected by the Union government.","a":1,"e":"By the municipal body."},{"id":"sst12t3","k":"tf","q":"The 74th Amendment deals with urban local bodies.","a":0,"e":""},{"id":"sst12t4","k":"tf","q":"Citizens have no role in keeping cities clean.","a":1,"e":"Citizens’ cooperation is essential."},{"id":"sst12t5","k":"tf","q":"A Nagar Panchayat is a rural body.","a":1,"e":"It is an urban body for transitional areas."},{"id":"sst12a0","k":"ar","A":"The Commissioner is the administrative head of a corporation.","R":"He/she is an appointed officer who carries out decisions.","a":0,"e":"R explains A."},{"id":"sst12a1","k":"ar","A":"Cities need special local bodies.","R":"Urban problems like waste and traffic are large and complex.","a":0,"e":"Complex problems need specialised bodies."},{"id":"sst12a2","k":"ar","A":"Nagar Panchayats are part of Panchayati Raj.","R":"They are set up in areas changing from rural to urban.","a":3,"e":"A false — they are urban bodies; R true."},{"id":"sst12x0","k":"mcq","q":"Local government of a big city is the:","o":["Municipal Corporation","Gram Panchayat","Zila Parishad","Nagar Panchayat"],"a":0,"e":"e.g. Bhubaneswar, Delhi.","sh":1,"x":1},{"id":"sst12x1","k":"mcq","q":"The head of a Municipal Corporation is the:","o":["Mayor","Sarpanch","Governor","Collector"],"a":0,"e":"Elected head.","sh":1,"x":1},{"id":"sst12x2","k":"mcq","q":"A city is divided into ___ for elections.","o":["wards","blocks","districts","villages"],"a":0,"e":"Each ward elects a councillor.","sh":1,"x":1},{"id":"sst12x3","k":"mcq","q":"An elected member of a ward is a:","o":["councillor","panch","MLA","MP"],"a":0,"e":"Represents the ward.","sh":1,"x":1},{"id":"sst12x4","k":"mcq","q":"The officer who runs the administration of a corporation is the:","o":["Municipal Commissioner","Mayor","Sarpanch","Speaker"],"a":0,"e":"Appointed (IAS officer).","sh":1,"x":1},{"id":"sst12x5","k":"mcq","q":"Smaller towns have a:","o":["Municipal Council","Municipal Corporation","Gram Sabha","Zila Parishad"],"a":0,"e":"Nagar Palika.","sh":1,"x":1},{"id":"sst12x6","k":"mcq","q":"An area changing from rural to urban has a:","o":["Nagar Panchayat","Municipal Corporation","Gram Sabha","High Court"],"a":0,"e":"Transitional area.","sh":1,"x":1},{"id":"sst12x7","k":"mcq","q":"The 74th Amendment deals with:","o":["urban local bodies","rural local bodies","Supreme Court","Parliament"],"a":0,"e":"73 rural, 74 urban.","sh":1,"x":1},{"id":"sst12x8","k":"mcq","q":"A major source of income for municipalities is:","o":["property tax","income tax","customs duty","GST only"],"a":0,"e":"Paid by house owners.","sh":1,"x":1},{"id":"sst12x9","k":"mcq","q":"Garbage collection in a city is done by the:","o":["municipality","Parliament","Supreme Court","Gram Sabha"],"a":0,"e":"Civic service.","sh":1,"x":1},{"id":"sst12y0","k":"tf","q":"The Mayor heads a Gram Panchayat.","a":1,"e":"The Mayor heads a Municipal Corporation.","x":1},{"id":"sst12y1","k":"tf","q":"Citizens can help by not littering and paying taxes on time.","a":0,"e":"","x":1},{"id":"sst12y2","k":"tf","q":"Urban local bodies provide water supply and street lights.","a":0,"e":"","x":1},{"id":"sst12m0","k":"mcq","q":"Each ward of a city elects a:","o":["councillor","sarpanch","panch","MP"],"a":0,"e":"Ward representative.","sh":1,"x":1},{"id":"sst12m1","k":"mcq","q":"Who runs the day-to-day administration of a Municipal Corporation?","o":["Municipal Commissioner","Mayor","Councillors’ children","Chief Justice"],"a":0,"e":"Appointed officer.","sh":1,"x":1},{"id":"sst12m2","k":"mcq","q":"Smaller towns are governed by a:","o":["Municipal Council (Nagar Palika)","Municipal Corporation","Gram Sabha","Zila Parishad"],"a":0,"e":"Medium-sized body.","sh":1,"x":1},{"id":"sst12m3","k":"mcq","q":"Which is a function of a municipality?","o":["Garbage collection","Making national laws","Printing currency","Running the army"],"a":0,"e":"Civic service.","sh":1,"x":1},{"id":"sst12f0","k":"mcq","fill":1,"q":"The head of a Municipal Corporation is the ___.","o":["Mayor","Sarpanch","Collector","Governor"],"a":0,"e":"","sh":1,"x":1},{"id":"sst12f1","k":"mcq","fill":1,"q":"The ___ Amendment deals with urban local bodies.","o":["74th","73rd","42nd","1st"],"a":0,"e":"","sh":1,"x":1},{"id":"sst12f2","k":"mcq","fill":1,"q":"A city is divided into ___ for elections.","o":["wards","blocks","villages","districts"],"a":0,"e":"","sh":1,"x":1},{"id":"sst12c02","k":"mcq","q":"What was made from wet waste?","o":["Plastic","Compost","Bricks","Glass"],"a":1,"e":"(b) Compost."}],"top":[{"q":"Name the three types of urban local bodies and where each is found.","m":3,"imp":true,"a":["Municipal Corporation (Nagar Nigam): in large cities (e.g. Delhi, Mumbai, Bhubaneswar).","Municipal Council (Nagar Palika/Municipality): in smaller cities and towns.","Nagar Panchayat: in areas changing from rural to urban (transitional areas)."],"k":"Three names + where each is found.","cm":"Calling a Nagar Panchayat a village panchayat."},{"q":"What is a ward? Who is a ward councillor?","m":2,"imp":true,"a":["A city is divided into smaller areas called wards. The people of each ward elect a representative called a ward councillor (corporator) for 5 years, who raises the ward’s problems in the council and gets work done."],"k":"Ward = part of city + elected councillor + role.","cm":"Saying councillors are appointed."},{"q":"Distinguish between the Mayor and the Municipal Commissioner.","m":3,"imp":true,"a":["Mayor: the elected head of the Municipal Corporation; presides over meetings of the council; represents the city on important occasions; chosen from/by the councillors (or directly in some states).","Municipal Commissioner: an appointed govern
