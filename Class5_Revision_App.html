<title>Class 5 Revision Studio</title>
<style>
:root{
  --bg:#f6f4ff; --card:#ffffff; --ink:#1e1b3a; --muted:#6b6890; --line:#e6e2f7;
  --brand:#0f766e; --brand2:#14b8a6; --good:#12a150; --goodbg:#e7f8ee; --bad:#e0384b; --badbg:#fdecee;
  --gold:#f5a524; --math:#4f46e5; --sci:#059669; --sst:#d97706;
  --r:20px; --shadow:0 6px 24px rgba(60,40,160,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
html,body{width:100%;min-height:100%;overscroll-behavior-y:none}
.wrap{max-width:1240px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 120px max(18px,env(safe-area-inset-left))}
@media (min-width:1000px){.wrap{padding-left:32px;padding-right:32px}.g2.wide3{grid-template-columns:repeat(3,1fr)}}
.fsbtn{position:absolute;right:14px;top:14px;z-index:2;background:rgba(255,255,255,.22);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.dtcard{border-radius:24px;padding:20px;background:linear-gradient(135deg,#0f766e,#10b981);color:#fff;position:relative;overflow:hidden;margin-top:14px}
.dtcard h3{font-size:21px}
.dtcard .chs{display:grid;gap:8px;margin:12px 0 14px}
.dtcard .chs div{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 12px;font-size:15px}
.dtcard .btn{background:#fff;color:#0f766e}
.bigbadge{font-size:96px;line-height:1;animation:pop .5s}
.shelf{display:flex;gap:10px;flex-wrap:wrap}
.shelf .b{flex:1;min-width:110px;text-align:center;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.shelf .b span{font-size:34px;display:block}
.shelf .b b{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal div{background:#f1eefc;border-radius:12px;text-align:center;padding:6px 2px;font-size:11px;color:var(--muted)}
.cal div span{display:block;font-size:22px;height:28px}
.subres{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
h1,h2,h3{margin:0;line-height:1.2}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:22px;display:grid;place-items:center;flex:none}
.top h2{font-size:22px}
.top .sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:700px){.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.hero{background:linear-gradient(135deg,#5b4bdb,#8b5cf6 60%,#c084fc);color:#fff;border-radius:26px;padding:22px 22px 20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .hi{font-size:15px;opacity:.9}
.hero h1{font-size:30px;margin:2px 0 6px}
.hero .date{font-size:14px;opacity:.85}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;font-size:14px;backdrop-filter:blur(4px)}
.stat b{font-size:18px;display:block}
.moral{margin-top:14px;border-radius:22px;padding:18px 18px 16px;background:#fff8e6;border:2px solid #fde7b0;position:relative}
.moral .tag{font-size:12px;font-weight:800;letter-spacing:.08em;color:#b7791f;text-transform:uppercase}
.moral h3{font-size:20px;margin:6px 0 6px;color:#7a4b00}
.moral p{margin:0 0 10px;color:#5d4510}
.moral .task{background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;color:#6b4e12;border:1px dashed #f0cf7a}
.moral .quote{font-style:italic;color:#8a6a24;font-size:15px;margin-top:10px}
.sec{margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:end}
.sec h3{font-size:19px}
.sec span{color:var(--muted);font-size:14px}
.subj{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-align:left;width:100%;border-left:7px solid var(--c)}
.subj .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 14%,#fff);flex:none}
.subj .nm{font-weight:800;font-size:18px}
.subj .bk{color:var(--muted);font-size:13px}
.bar{height:9px;background:#eeeaf9;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--c,var(--brand));border-radius:9px;transition:width .6s}
.pct{font-weight:800;font-size:15px;color:var(--c)}
.action{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:left;width:100%}
.action .ic{font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.action b{display:block;font-size:17px}
.action small{color:var(--muted);font-size:13.5px}
.chap{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);width:100%;text-align:left}
.ring{--p:0;--c:var(--brand);width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#eeeaf9 0);font-size:13px;font-weight:800}
.ring span{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center}
.chap .t{font-weight:700}
.chap .m{color:var(--muted);font-size:13px}
.stars{color:var(--gold);letter-spacing:1px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tab{padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;white-space:nowrap;font-size:15px}
.tab.on{background:var(--c,var(--brand));color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:800;background:var(--brand);color:#fff;font-size:17px;min-height:52px}
.btn.alt{background:#efeafd;color:var(--brand)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#efeafd;color:var(--brand)}
.pill.x{background:#e3f6ff;color:#0369a1}
.pill.imp{background:#fff1d6;color:#b45309}
ul.clean{list-style:none;padding:0;margin:0}
.prio li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prio li:last-child{border:0}
.prio .n{width:30px;height:30px;border-radius:10px;background:#efeafd;color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.trap{border-radius:16px;padding:14px;background:#fff;box-shadow:var(--shadow);border-left:6px solid var(--bad)}
.trap .w{color:var(--bad);font-weight:700}
.trap .r{color:var(--good);font-weight:700;margin-top:6px}
.trap .k{margin-top:8px;font-size:14px;background:#f6f4ff;border-radius:10px;padding:8px 10px;color:var(--brand)}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;border-radius:20px;padding:20px;background:#fff;box-shadow:var(--shadow);text-align:left;width:100%}
.flash .q{font-weight:700;font-size:18px}
.flash .a{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line);color:#14532d;display:none}
.flash.open .a{display:block}
.flash .hint{color:var(--muted);font-size:13px;margin-top:10px}
.flash.open .hint{display:none}
.selfmark{display:none;gap:8px;margin-top:12px}
.flash.open .selfmark{display:flex}
.selfmark button{flex:1;padding:10px;border-radius:12px;font-weight:800;font-size:14px}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qprog{flex:1;height:12px;background:#e9e5fa;border-radius:12px;overflow:hidden}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s}
.qcount{font-weight:800;color:var(--muted);font-size:15px;min-width:64px;text-align:right}
.timer{font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.qcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px}
.qcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qtext{font-size:21px;font-weight:700;line-height:1.4}
.ar{display:grid;gap:10px;margin-top:4px}
.ar div{background:#f6f4ff;border-radius:14px;padding:12px 14px;font-size:17px}
.ar b{color:var(--brand)}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:16px;border:2.5px solid var(--line);background:#fff;text-align:left;font-size:18px;min-height:58px;transition:transform .08s,border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt .l{width:34px;height:34px;border-radius:11px;background:#f1eefc;display:grid;place-items:center;font-weight:800;color:var(--brand);flex:none}
.opt.sel{border-color:var(--brand);background:#f3f0ff}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt.no .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tfopts{grid-template-columns:1fr 1fr}
.tfopts .opt{justify-content:center;font-weight:800;font-size:20px}
.feedback{margin-top:16px;border-radius:16px;padding:14px 16px;display:none}
.feedback.show{display:block;animation:pop .25s}
.feedback.good{background:var(--goodbg);color:#0f5132}
.feedback.bad{background:var(--badbg);color:#7a1020}
.feedback b{font-size:18px}
.qfoot{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.res{text-align:center;padding:26px 18px}
.res .big{font-size:64px;font-weight:900;background:linear-gradient(135deg,var(--brand),#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
.res .msg{font-size:20px;font-weight:800;margin:6px 0}
.rev{margin-top:12px;text-align:left}
.rev .item{padding:12px;border-radius:14px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px;font-size:15px}
.rev .item .y{color:var(--bad)} .rev .item .c{color:var(--good);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 10px;border-radius:12px;min-width:68px}
.nav button span{font-size:24px}
.nav button.on{color:var(--brand);background:#f1eefc}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:15px}
.chip.on{border-color:var(--brand);background:#f1eefc;color:var(--brand)}
.kpi{text-align:center}
.kpi b{display:block;font-size:28px;color:var(--brand)}
.kpi small{color:var(--muted)}
.week{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;height:70px;border-radius:10px;background:#eeeaf9;position:relative;overflow:hidden;margin-bottom:4px}
.week i em{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(var(--brand2),var(--brand));border-radius:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#1e1b3a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;transition:transform .35s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.small{font-size:14px;color:var(--muted)}
.note{background:#eef7ff;border-radius:14px;padding:12px 14px;color:#0b4a6f;font-size:15px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-weight:800;font-size:14px}
.note-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;border-top:5px solid var(--c)}
.note-card .nh{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.note-card .nn{width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;font-size:14px;flex:none}
.note-card .nt{font-size:16.5px;line-height:1.55}
.dot{color:var(--brand);font-weight:900;margin:0 6px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--brand);margin:0 4px;text-align:center}
.blank.filled{color:var(--good);border-color:var(--good);padding:0 6px}
.fcard{width:100%;min-height:340px;perspective:1200px;padding:0;display:block}
.fcard .fin{position:relative;width:100%;min-height:340px;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.fcard .ff,.fcard .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.fcard .ff{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#c084fc));color:#fff;text-align:center}
.fcard .ff .small{color:rgba(255,255,255,.85)}
.fcard .ft{font-size:26px;font-weight:900;margin-top:12px}
.fcard .fb{background:#fff;transform:rotateY(180deg);font-size:18px;line-height:1.6;text-align:left}
</style>
</head>

"45,032 < 45,302 < 45,320 < 54,230.","m":2},{"q":"Make the largest and smallest 5-digit numbers using 6, 0, 3, 9, 1 (each once). Find their difference.","a":"Largest 96,310; smallest 10,369; difference 85,941.","m":3},{"q":"A city has 3,48,625 people. Round this to the nearest thousand.","a":"3,49,000 (hundreds digit 6 ≥ 5).","m":2},{"q":"Write the place value of each 5 in 5,25,350.","a":"5,00,000; 5,000; 50.","m":2}],"rq":[],"traps":[{"m":"Writing 2,05,006 as 2,5,6 (dropping zeros)","c":"Zeros hold empty places — write every place.","t":"Read the place chart from left to right."},{"m":"Rounding 4,768 to 4,700 for the nearest hundred","c":"Look at the tens digit: 6 ≥ 5, so round up to 4,800.","t":"5 or more → go up."},{"m":"Putting the smallest digit 0 first for the smallest number","c":"A number can’t start with 0 — use the smallest non-zero digit first.","t":"—"}],"qs":[{"id":"math1m0","k":"mcq","q":"Place value of 7 in 4,73,215 is:","o":["70,000","7,000","7","7,00,000"],"a":0,"e":"7 is in the ten-thousands place.","sh":1},{"id":"math1m1","k":"mcq","q":"1 lakh =","o":["1,00,000","10,000","1,000","10,00,000"],"a":0,"e":"100 thousands make a lakh.","sh":1},{"id":"math1m2","k":"mcq","q":"Which number is greatest?","o":["52,310","52,301","52,103","51,999"],"a":0,"e":"Compare left to right.","sh":1},{"id":"math1m3","k":"mcq","q":"4,768 rounded to the nearest hundred is:","o":["4,800","4,700","4,770","5,000"],"a":0,"e":"Tens digit 6 ≥ 5, so round up.","sh":1},{"id":"math1m4","k":"mcq","q":"Smallest 5-digit number:","o":["10,000","99,999","11,111","10,001"],"a":0,"e":"Smallest 5-digit number.","sh":1},{"id":"math1m5","k":"mcq","q":"Expanded form of 30,405:","o":["30,000 + 400 + 5","3,000 + 400 + 5","30,000 + 4,000 + 5","300 + 40 + 5"],"a":0,"e":"No thousands and no tens.","sh":1},{"id":"math1m6","k":"mcq","q":"‘Two lakh five thousand six’ is written as:","o":["2,05,006","2,50,006","2,05,060","20,5006"],"a":0,"e":"2 lakh + 5 thousand + 6.","sh":1},{"id":"math1m7","k":"mcq","q":"Largest 4-digit number using 3, 8, 0, 5 once:","o":["8,530","8,503","5,830","8,350"],"a":0,"e":"Decreasing order.","sh":1},{"id":"math1m8","k":"mcq","q":"Predecessor of 50,000 is:","o":["49,999","50,001","49,000","40,999"],"a":0,"e":"50,000 − 1.","sh":1},{"id":"math1m9","k":"mcq","q":"Round 2,349 to the nearest thousand:","o":["2,000","3,000","2,300","2,400"],"a":0,"e":"Hundreds digit 3 < 5.","sh":1},{"id":"math1m10","k":"mcq","q":"Face value of 6 in 86,412 is:","o":["6","6,000","60,000","600"],"a":0,"e":"Face value is the digit itself.","sh":1},{"id":"math1m11","k":"mcq","q":"How many thousands make 1 lakh?","o":["100","10","1,000","10,000"],"a":0,"e":"1,00,000 ÷ 1,000.","sh":1},{"id":"math1t12","k":"tf","q":"In 5,62,380 the digit 2 is in the thousands place.","a":0,"e":"5 lakh 62 thousand…"},{"id":"math1t13","k":"tf","q":"Rounding 65 to the nearest ten gives 60.","a":1,"e":"5 or more → round up to 70."},{"id":"math1t14","k":"tf","q":"10,000 is the smallest 5-digit number.","a":0,"e":""},{"id":"math1t15","k":"tf","q":"0 has no use in a number.","a":1,"e":"0 is a place holder: 205 and 25 are different."},{"id":"math1f16","k":"mcq","fill":1,"q":"1,00,000 is read as one ___.","o":["lakh","thousand","million","crore"],"a":0,"e":"","sh":1},{"id":"math1f17","k":"mcq","fill":1,"q":"The value of a digit depending on its position is its ___ value.","o":["place","face","round","even"],"a":0,"e":"","sh":1},{"id":"math1f18","k":"mcq","fill":1,"q":"The successor of 9,999 is ___.","o":["10,000","9,998","10,001","9,990"],"a":0,"e":"","sh":1},{"id":"math1f19","k":"mcq","fill":1,"q":"7,450 rounded to the nearest thousand is ___.","o":["7,000","8,000","7,500","7,400"],"a":0,"e":"","sh":1}]},{"n":2,"t":"Fractions","intro":"Fractions as equal parts, equivalent fractions, comparing fractions and fractions greater than one.","prio":[{"t":"Numerator and denominator","s":3},{"t":"Equivalent fractions","s":3},{"t":"Comparing and ordering fractions","s":3},{"t":"Fractions greater tha quarter and full turns, right angles, clockwise and anticlockwise.","prio":[{"t":"Quarter, half, three-quarter and full turn","s":3},{"t":"Right angle and checking with a corner","s":3},{"t":"Clockwise and anticlockwise","s":3},{"t":"Angles smaller and greater than a right angle","s":2}],"notes":[{"h":"Angle","t":"An angle shows how much something turns. Two arms meet at a point called the vertex."},{"h":"Turns","t":"Quarter turn = 1 right angle = 90°. Half turn = 2 right angles = 180°. Three-quarter turn = 3 right angles = 270°. Full turn = 4 right angles = 360°."},{"h":"Clockwise and anticlockwise","t":"Clockwise: the way clock hands move. Anticlockwise: the opposite way."},{"h":"Right angle","t":"Like the corner of a book or page. Check angles using a paper corner (a ‘right-angle tester’)."},{"h":"Smaller and bigger","t":"Angle less than a right angle is acute (sharp corner). More than a right angle but less than a half turn is obtuse."},{"h":"Clock angles","t":"From 12 to 3 the minute hand makes a quarter turn. From 12 to 6 it makes a half turn."},{"h":"Directions","t":"Facing North, a quarter turn clockwise makes you face East; a half turn makes you face South."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Name 3 things around you that have right-angle corners.","a":"Book, door, table top, blackboard, window.","m":1},{"q":"Arjun faces North and turns three-quarters clockwise. Which way does he face now?","a":"West (N → E → S → W).","m":2},{"q":"How many right angles does the minute hand turn from 12 to 6? From 12 to 12?","a":"2 right angles; 4 right angles.","m":2}],"rq":[],"traps":[{"m":"Confusing clockwise and anticlockwise","c":"Clockwise follows clock hands: 12 → 3 → 6.","t":"Draw a little clock before you answer."},{"m":"Thinking a full turn ends somewhere new","c":"A full turn brings you back to the start.","t":"—"}],"qs":[{"id":"math3m0","k":"mcq","q":"A quarter turn equals:","o":["1 right angle","2 right angles","3 right angles","4 r Cemented city surfaces stop water from soaking in, so groundwater does not refill."},{"h":"Aquatic life","t":"Plants and animals living in water: fish (fins, gills), frogs, lotus and water lilies (floating leaves, waxy surface)."},{"h":"Saving water — the old way","t":"A johad is a small earthen dam in Rajasthan that stores rainwater and refills groundwater. Many regions have their own traditional methods."},{"h":"Condensation at home","t":"Water drops on the outside of a cold glass come from water vapour in the air turning back into liquid."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Explain the water cycle in 4 steps.","a":"1. Sun heats water → evaporation. 2. Vapour rises and cools → condensation, clouds form. 3. Water falls as rain/snow → precipitation. 4. Water flows back to rivers/seas and soaks into the ground.","m":3},{"q":"Why is groundwater going down in many cities?","a":"Roads and buildings are cemented, so rainwater cannot soak into the ground; also too much water is pumped out.","m":2},{"q":"Name three sources of freshwater.","a":"Rivers, lakes, ponds (also wells, glaciers, rain).","m":1},{"q":"Write two ways to save water at home.","a":"Close the tap while brushing; reuse washing water for plants; fix leaking taps; collect rainwater.","m":2}],"rq":[],"traps":[{"m":"Saying oceans are the main source of drinking water","c":"Ocean water is salty; we drink freshwater from rivers, lakes and underground.","t":"—"},{"m":"Mixing up evaporation and condensation","c":"Evaporation: liquid → vapour (heat). Condensation: vapour → liquid (cooling).","t":"E for Escape (goes up), C for Cloud."}],"qs":[{"id":"evs1m0","k":"mcq","q":"Most of the water on Earth is:","o":["salty sea water","freshwater","ice only","underground"],"a":0,"e":"Oceans hold most of it.","sh":1},{"id":"evs1m1","k":"mcq","q":"Water changing into vapour because of heat is:","o":["evaporation","condensation","precipitation","freezing"],"a":0,"e":"","sh":1},{"id":"evs1m2","k":"mcq","q":"Water vapour cooling to form clouds is:","o":["condensation","evaporation","melting","percolation"],"a":0,"e":"","sh":1},{"id":"evs1m3","k":"mcq","q":"Rain, snow and hail falling from clouds is called:","o":["precipitation","evaporation","condensation","transpiration"],"a":0,"e":"","sh":1},{"id":"evs1m4","k":"mcq","q":"A johad is found in:","o":["Rajasthan","Kerala","Assam","Punjab"],"a":0,"e":"Small earthen dam.","sh":1},{"id":"evs1m5","k":"mcq","q":"Water stored deep under the soil is:","o":["groundwater","sea water","rain water only","vapour"],"a":0,"e":"","sh":1},{"id":"evs1m6","k":"mcq","q":"Snow is water in which form?","o":["Solid","Liquid","Gas","None"],"a":0,"e":"","sh":1},{"id":"evs1m7","k":"mcq","q":"Drops on the outside of a cold glass come from:","o":["water vapour in the air","the glass leaking","ice melting inside","the table"],"a":0,"e":"Condensation.","sh":1},{"id":"evs1m8","k":"mcq","q":"Which is a freshwater source?","o":["Lake","Ocean","Sea","Salt pan"],"a":0,"e":"","sh":1},{"id":"evs1m9","k":"mcq","q":"Cemented ground in cities:","o":["stops rainwater soaking in","adds groundwater","cleans water","makes rain"],"a":0,"e":"","sh":1},{"id":"evs1m10","k":"mcq","q":"Animals that live in water are called:","o":["aquatic animals","land animals","desert animals","flying animals"],"a":0,"e":"","sh":1},{"id":"evs1m11","k":"mcq","q":"We get groundwater using:","o":["handpumps and wells","clouds","dams only","taps on the sea"],"a":0,"e":"","sh":1},{"id":"evs1t12","k":"tf","q":"We can drink ocean water directly.","a":1,"e":"It is too salty."},{"id":"evs1t13","k":"tf","q":"The water cycle never stops.","a":0,"e":"It is continuous."},{"id":"evs1t14","k":"tf","q":"Steam is the gas form of water.","a":0,"e":""},{"id":"evs1t15","k":"tf","q":"Only a small part of Earth’s water is freshwater.","a":0,"e":""},{"id":"evs1f16","k":"mcq","fill":1,"q":"The Sun’s heat changes water into ___.","o":["vapour","ice","salt","soil"],"a":0,"e":"","sh":1},{"id":"evs1f17","k":"mcq","fill":1,"q":"Clouds form by ___ of water vapour.","o":["condensation","evaporation","melting","boiling"],"a":0,"e":"","sh":1},{"id":"evs1f18","k":"mcq","fill":1,"q":"A small earthen dam to store rainwater in Rajasthan is a ___.","o":["johad","well","canal","tank"],"a":0,"e":"","sh":1},{"id":"evs1f19","k":"mcq","fill":1,"q":"Water in rivers and lakes is ___ water.","o":["fresh","salty","frozen","dirty"],"a":0,"e":"","sh":1}]},{"n":2,"t":"Journey of a River","intro":"Unit 1: Life Around Us. The journey of the Godavari river, tributaries, uses of rivers, dams, floods and droughts, and river pollution.","prio":[{"t":"Godavari: origin, path and where it meets the sea","s":3},{"t":"Tributary, delta, perennial and seasonal rivers","s":3},{"t":"Uses of river water and dams","s":3},{"t":"Floods, droughts and pollution","s":3}],"notes":[{"h":"The Godavari","t":"Starts at Trimbakeshwar in Maharashtra (Western Ghats) and flows east about 1,465 km to the Bay of Bengal. It is called ‘Dakshina Ganga’ — India’s second longest river after the Ganga."},{"h":"Tributaries","t":"Smaller rivers that join a bigger river: Godavari is joined by Manjira, Pranhita, Indravati and Sabari."},{"h":"Delta and mangroves","t":"Near the sea a river slows down, drops soil and splits into channels — a delta. The Godavari meets the sea near the Coringa mangrove forests."},{"h":"Perennial vs seasonal","t":"Perennial rivers flow all year. Seasonal rivers flow mainly in the rainy season."},{"h":"Godavari Pushkaram","t":"A festival held every 12 years when people bathe in the Godavari (e.g. at Nashik)."},{"h":"Dams and reservoirs","t":"Dams store water in reservoirs for irrigation, drinking and electricity. But they can flood forests and villages, making people and animals leave."},{"h":"Floods and droughts","t":"Too much rain → floods. Too little rain for long → drought, crop failure and water shortage."},{"h":"River pollution","t":"Plastic, garbage, sewage and factory/farm chemicals pollute rivers. Fertiliser runoff makes too many plants grow, blocking sunlight and harming fish."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Write two good effects and two problems of dams.","a":"Good: store water for irrigation/drinking, make electricity. Problems: forests and villages get flooded, people and animals lose homes.","m":3},{"q":"What makes river water polluted? Suggest two ways to keep rivers clean.","a":"Plastic, garbage, sewage, factory and farm chemicals. Don’t throw waste into rivers; treat sewage; use less fertiliser; join river clean-ups.","m":3},{"q":"What is a delta? How is it formed?","a":"Land near the sea where a river slows down, drops soil and divides into many channels.","m":2}],"rq":[],"traps":[{"m":"Thinking Godavari is India’s longest river","c":"Ganga is the longest; Godavari is the second longest.","t":"—"},{"m":"Thinking clean-looking water is safe","c":"Invisible germs and chemicals can be present.","t":"—"}],"qs":[{"id":"evs2m0","k":"mcq","q":"The Godavari starts at:","o":["Trimbakeshwar, Maharashtra","Gangotri, Uttarakhand","Amarkantak, Madhya Pradesh","Nashik, Gujarat"],"a":0,"e":"In the Western Ghats.","sh":1},{"id":"evs2m1","k":"mcq","q":"The Godavari flows into the:","o":["Bay of Bengal","Arabian Sea","Indian Ocean directly","Lake Chilika"],"a":0,"e":"East coast.","sh":1},{"id":"evs2m2","k":"mcq","q":"Godavari is also called:","o":["Dakshina Ganga","Ganga of the North","Brahmaputra","Sindhu"],"a":0,"e":"","sh":1},{"id":"evs2m3","k":"mcq","q":"India’s longest river is the:","o":["Ganga","Godavari","Yamuna","Narmada"],"a":0,"e":"Godavari is second.","sh":1},{"id":"evs2m4","k":"mcq","q":"A smaller river that joins a bigger river is a:","o":["tributary","delta","dam","reservoir"],"a":0,"e":"","sh":1},{"id":"evs2m5","k":"mcq","q":"Land formed where a river splits and drops soil before the sea:","o":["delta","plateau","glacier","valley"],"a":0,"e":"","sh":1},{"id":"evs2m6","k":"mcq","q":"A river that flows all year is:","o":["perennial","seasonal","dry","frozen"],"a":0,"e":"","sh":1},{"id":"evs2m7","k":"mcq","q":"A man-made lake behind a dam is a:","o":["reservoir","delta","pond","well"],"a":0,"e":"","sh":1},{"id":"evs2m8","k":"mcq","q":"Godavari Pushkaram is held every:","o":["12 years","1 year","4 years","50 years"],"a":0,"e":"","sh":1},{"id":"evs2m9","k":"mcq","q":"Which is a tributary of the Godavari?","o":["Indravati","Yamuna","Kaveri","Narmada"],"a":0,"e":"","sh":1},{"id":"evs2m10","k":"mcq","q":"Too little rain for a long time causes:","o":["drought","flood","tsunami","earthquake"],"a":0,"e":"","sh":1},{"id":"evs2m11","k":"mcq","q":"Fertiliser washed into rivers causes:","o":["too many water plants that block sunlight","cleaner water","more fish","colder water"],"a":0,"e":"","sh":1},{"id":"evs2t12","k":"tf","q":"Dams can make people leave their homes.","a":0,"e":"Villages may be flooded."},{"id":"evs2t13","k":"tf","q":"Clear-looking river water is always safe to drink.","a":1,"e":"It can still carry germs and chemicals."},{"id":"evs2t14","k":"tf","q":"The Godavari flows from east to west.","a":1,"e":"It flows west to east."},{"id":"evs2t15","k":"tf","q":"Water ATMs help people get clean drinking water.","a":0,"e":""},{"id":"evs2f16","k":"mcq","fill":1,"q":"The Godavari is about ___ km long.","o":["1,465","465","2,525","146"],"a":0,"e":"","sh":1},{"id":"evs2f17","k":"mcq","fill":1,"q":"A river that flows only in the rainy season is ___.","o":["seasonal","perennial","frozen","underground"],"a":0,"e":"","sh":1},{"id":"evs2f18","k":"mcq","fill":1,"q":"Dams store water for irrigation, drinking and ___.","o":["electricity","pollution","floods","plastic"],"a":0,"e":"","sh":1},{"id":"evs2f19","k":"mcq","fill":1,"q":"The Godavari meets the sea near the Coringa ___ forests.","o":["mangrove","pine","desert","bamboo"],"a":0,"e":"","sh":1}]},{"n":3,"t":"The Mystery of Food","intro":"Unit 2: Health and Well-being. Why food spoils, helpful and harmful microbes, ways to preserve food, our teeth and safe eating.","prio":[{"t":"Microbes and food spoilage","s":3},{"t":"Conditions microbes need: moisture, air, warmth","s":3},{"t":"Ways of preserving food","s":3},{"t":"Four types of teeth and their jobs","s":3},{"t":"Chewing well, choking and dental care","s":2}],"notes":[{"h":"Microbes","t":"Tiny living things in air, water, soil and our bodies — too small to see without a microscope."},{"h":"Food spoilage","t":"Microbes make food go bad: bad smell, coloured patches (mould), sour taste. Spoiled food can upset the stomach."},{"h":"Helpful microbes","t":"Microbes make idli/dosa batter rise (fermentation) and turn milk into curd. Curd and buttermilk help digestion."},{"h":"What microbes need","t":"Moisture, air and the right temperature. Remove any one and they grow slowly or stop."},{"h":"Preserving food","t":"Drying (chillies, papad) · Cold (refrigerator) · Oil (pickles) · Salt and sugar (pickles, jam) · Sealed packets. Ghee keeps longer than butter because it has no water."},{"h":"Our teeth","t":"Incisors cut · Canines tear · Premolars crush · Molars grind."},{"h":"Eat safely","t":"Chew well so saliva mixes with food. Eating fast, talking or laughing while eating can cause choking. Brush twice and eat fewer sweets to avoid cavities."},{"h":"Seasonal food","t":"Seasonal and local fruits and vegetables are fresher and tastier."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Why does food spoil? Write three ways to keep food from spoiling.","a":"Microbes grow on food when there is moisture, air and warmth. Keep food cold (fridge), dry it in the Sun, use salt/oil/sugar, store in sealed containers.","m":3},{"q":"Name the four types of teeth and the job of each.","a":"Incisors – cut; canines – tear; premolars – crush; molars – grind.","m":2},{"q":"Give two examples of microbes that are helpful.","a":"Microbes that turn milk into curd; microbes that make idli/dosa batter rise.","m":2}],"rq":[],"traps":[{"m":"Saying all microbes are bad","c": :0,"e":"","sh":1},{"id":"evs3t12","k":"tf","q":"All microbes are harmful.","a":1,"e":"Some are helpful, e.g. in curd."},{"id":"evs3t13","k":"tf","q":"A refrigerator slows down the growth of microbes.","a":0,"e":"Cold slows them."},{"id":"evs3t14","k":"tf","q":"Talking while eating can cause choking.","a":0,"e":""},{"id":"evs3t15","k":"tf","q":"Molars are used to cut food.","a":1,"e":"Molars grind; incisors cut."},{"id":"evs3f16","k":"mcq","fill":1,"q":"Keeping food cold in a ___ stops it from spoiling quickly.","o":["refrigerator","cupboard","sunny window","bag"],"a":0,"e":"","sh":1},{"id":"evs3f17","k":"mcq","fill":1,"q":"Microbes make idli batter ___.","o":["rise","dry","freeze","salty"],"a":0,"e":"","sh":1},{"id":"evs3f18","k":"mcq","fill":1,"q":"We have ___ types of teeth.","o":["4","2","3","6"],"a":0,"e":"","sh":1},{"id":"evs3f19","k":"mcq","fill":1,"q":"Saliva mixes with food when we ___ it well.","o":["chew","swallow","smell","cook"],"a":0,"e":"","sh":1}]},{"n":4,"t":"Our School – A Happy Place","intro":"Unit 2: Health and Well-being. What makes a school happy and green: saving water and electricity, managing waste, trees, and safety rules.","prio":[{"t":"What a green school does","s":3},{"t":"Dry waste vs wet waste and composting","s":3},{"t":"Reduce, Reuse, Recycle","s":3},{"t":"Keeping cool naturally: trees, white roofs","s":2},{"t":"Road and fire safety; kind behaviour","s":2}],"notes":[{"h":"A happy school","t":"Friendly teachers and classmates, kind words, helping others, clean and safe spaces."},{"h":"Green school","t":"A school that saves water, saves electricity, reduces waste and grows plants — students and teachers work together."},{"h":"Dry and wet waste","t":"Dry waste: paper, plastic, wrappers. Wet waste: fruit and vegetable peels, leftover food, garden waste. Keep them in separate bins."},{"h":"Compost","t":"Wet waste in a compost pit turns into natural manure for plants."},{"h":"Reduce, Reuse, Recycle","t":"Reduce: use less. Reuse: use again ( es, food, music and festivals, our national symbols and unity in diversity.","prio":[{"t":"Unity in diversity","s":3},{"t":"National symbols and their meaning","s":3},{"t":"National festivals: Republic Day and Independence Day","s":3},{"t":"Regional clothes, music and instruments","s":2}],"notes":[{"h":"Diversity","t":"India has many languages (more than a thousand spoken), foods, clothes, dances and festivals — yet we are one country."},{"h":"Unity in diversity","t":"Like many plants making one garden, different people together make India strong."},{"h":"National Flag","t":"Tricolour: saffron (strength and courage), white (peace and truth), green (growth and prosperity), with the Ashoka Chakra in navy blue."},{"h":"National symbols","t":"Emblem: three lions (strength) from the Lion Capital of Ashoka · National animal: tiger · National bird: peacock."},{"h":"National festivals","t":"Republic Day – 26 January · Independence Day – 15 August. Schools hoist the flag and sing the National Anthem."},{"h":"Regional dress and music","t":"Rajasthan: saafa (turban) · Himachal Pradesh: topi. Drums of India: nagara, tabla, dholak, mridangam, thavil."},{"h":"Our heritage on money","t":"Konark Sun Temple (Odisha) appears on the ₹10 note; many Indian languages are printed on currency notes."},{"h":"Every state has symbols","t":"Each state has its own state animal, bird, tree and flower."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Write the meanings of the three colours of our National Flag.","a":"Saffron – strength and courage; white – peace and truth; green – growth and prosperity.","m":3},{"q":"Why do we say India has ‘unity in diversity’?","a":"People speak different languages, wear different clothes and celebrate different festivals, yet live together as one nation.","m":2},{"q":"Name our National Animal, National Bird and the two national festivals with dates.","a":"Tiger, peacock; Republic Day 26 January, Independence Day 15 August.","m":2}],"rq":[],"tr ate bird and animal.","a":0,"e":""},{"id":"evs5t14","k":"tf","q":"The National Anthem is sung on Republic Day.","a":0,"e":""},{"id":"evs5t15","k":"tf","q":"Green in the flag stands for growth and prosperity.","a":0,"e":""},{"id":"evs5f16","k":"mcq","fill":1,"q":"The Ashoka Chakra is ___ in colour.","o":["navy blue","green","saffron","black"],"a":0,"e":"","sh":1},{"id":"evs5f17","k":"mcq","fill":1,"q":"India celebrates Independence Day on ___ August.","o":["15","26","2","14"],"a":0,"e":"","sh":1},{"id":"evs5f18","k":"mcq","fill":1,"q":"A ___ is the traditional cap of Himachal Pradesh.","o":["topi","saafa","pagdi","helmet"],"a":0,"e":"","sh":1},{"id":"evs5f19","k":"mcq","fill":1,"q":"Different cultures living together show unity in ___.","o":["diversity","difference","division","distance"],"a":0,"e":"","sh":1}]},{"n":6,"t":"Some Unique Places","intro":"Unit 3: Incredible India. Shanti’s journey to the Andaman and Nicobar Islands, the Sundarbans, Northeast India and the Western Ghats.","prio":[{"t":"Andaman & Nicobar Islands — location and features","s":3},{"t":"Sundarbans — mangroves and tigers","s":3},{"t":"Northeast India — living root bridges, Apatani farming","s":3},{"t":"Western Ghats — biodiversity and Silent Valley","s":3}],"notes":[{"h":"Andaman and Nicobar Islands","t":"A chain of over 1,000 islands in the Bay of Bengal. Capital: Sri Vijaya Puram. Indira Point is India’s southernmost tip. Coral reefs, dolphins; Andaman wood pigeon and hornbill are found only here."},{"h":"Sundarbans","t":"The largest mangrove forest in the world, where the Ganga meets the sea (West Bengal). Home of the Royal Bengal Tiger and crocodiles. Mangrove roots stick out of the mud to breathe and protect the coast from erosion."},{"h":"Life in the Sundarbans","t":"People collect honey, fish and wood; honey collectors wear masks on the back of their heads to confuse tigers."},{"h":"Northeast India","t":"Seven Sister States + Sikkim. Living root bridges of Meghalaya. The Apatani tribe (Arunachal Pradesh) grows rice and fish together. Bamboo houses on stilts in flood areas. Bhut Jolokia — one of the world’s hottest chillies. Sikkim is India’s first organic state."},{"h":"Western Ghats","t":"Hills running through six states (Gujarat to Tamil Nadu), source of many South Indian rivers, over 50 protected areas. Lion-tailed macaque is found only here."},{"h":"Silent Valley","t":"A rainforest in Kerala saved from a dam by the ‘Save Silent Valley’ movement."},{"h":"Hargila bird","t":"The Greater Adjutant Stork; communities in Assam protect its nests."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Why are the Sundarbans special? Write three points.","a":"Largest mangrove forest; home of Royal Bengal Tiger; mangroves protect the coast; people get honey, fish and wood.","m":3},{"q":"Write two unique things about Northeast India.","a":"Living root bridges of Meghalaya; Apatani rice-fish farming; Sikkim first organic state; Bhut Jolokia chilli.","m":2},{"q":"Why should we protect places like the Western Ghats?","a":"They have rare plants and animals found nowhere else, they are the source of many rivers, and they keep the environment healthy.","m":2}],"rq":[],"traps":[{"m":"Saying Kanyakumari is India’s southernmost point","c":"Indira Point (Andaman & Nicobar) is the southernmost tip; Kanyakumari is the southern tip of the mainland.","t":"—"}],"qs":[{"id":"evs6m0","k":"mcq","q":"The southernmost tip of India is:","o":["Indira Point","Kanyakumari","Rameswaram","Port Blair"],"a":0,"e":"In Great Nicobar.","sh":1},{"id":"evs6m1","k":"mcq","q":"The Andaman and Nicobar Islands are in the:","o":["Bay of Bengal","Arabian Sea","Indian Ocean only","Red Sea"],"a":0,"e":"","sh":1},{"id":"evs6m2","k":"mcq","q":"The largest mangrove forest in the world is the:","o":["Sundarbans","Silent Valley","Western Ghats","Gir"],"a":0,"e":"","sh":1},{"id":"evs6m3","k":"mcq","q":"Sundarbans is famous for the:","o":["Royal Bengal Tiger","Asiatic lion","one-horned rhino" s another name for the Greater Adjutant ___.","o":["Stork","Eagle","Peacock","Crow"],"a":0,"e":"","sh":1}]},{"n":7,"t":"Energy – How Things Work","intro":"Unit 4: Things Around Us. What energy is, sources of energy, clean and polluting energy, saving energy and electrical safety.","prio":[{"t":"Energy makes things move, glow, heat and make sound","s":3},{"t":"Sources: food, fuels, electricity, Sun, wind, water","s":3},{"t":"Clean vs polluting energy","s":3},{"t":"Saving energy and LED bulbs","s":2},{"t":"Electrical safety rules","s":3}],"notes":[{"h":"What is energy?","t":"Energy makes things move, make sound, give light and heat. We get our energy from food."},{"h":"Sources of energy","t":"Food (for living things) · Fuels: petrol, diesel, coal, wood, cooking gas · Electricity · Sun, wind and flowing water."},{"h":"Clean energy","t":"Sunlight (solar panels), wind (windmills) and water (watermills) do not pollute the air."},{"h":"Polluting energy","t":"Burning wood and coal makes smoke. Much of our electricity comes from burning coal, which harms the air."},{"h":"Solar power in India","t":"Bhadla Solar Park (Rajasthan) is a huge solar plant; Cochin Airport (Kerala) runs on solar energy."},{"h":"Save energy","t":"Use LED bulbs (less power, same light), switch off when not in use, reuse and recycle, walk or cycle for short trips."},{"h":"Electrical safety","t":"Never touch switches or wires with wet hands; never put objects into sockets; stay away from broken wires and electric poles; tell an adult at once."},{"h":"Energy in action","t":"A balloon rushing when released (air), a rubber-band guitar (sound), water in sunlight getting warm (heat)."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Write four sources of energy with one use of each.","a":"Food – gives us energy to play; petrol – runs vehicles; electricity – runs fans and lights; Sun – dries clothes/solar panels; wind – windmills.","m":3},{"q":"Write three electrical safety rules.","a":"Don’t touch switches with wet hands; don’t put objects into sockets; stay away from broken wires and poles; tell an adult.","m":3},{"q":"Why is solar energy better than coal?","a":"Solar energy is clean and does not run out; coal pollutes the air and will finish one day.","m":2}],"rq":[],"traps":[{"m":"Thinking only machines need energy","c":"All living things need energy too — from food.","t":"—"}],"qs":[{"id":"evs7m0","k":"mcq","q":"Living things get energy from:","o":["food","wires","batteries","plastic"],"a":0,"e":"","sh":1},{"id":"evs7m1","k":"mcq","q":"Solar panels change sunlight into:","o":["electricity","wind","coal","water"],"a":0,"e":"","sh":1},{"id":"evs7m2","k":"mcq","q":"Windmills use the energy of:","o":["moving air","sunlight","coal","petrol"],"a":0,"e":"","sh":1},{"id":"evs7m3","k":"mcq","q":"Which is a clean source of energy?","o":["Wind","Coal","Wood","Diesel"],"a":0,"e":"","sh":1},{"id":"evs7m4","k":"mcq","q":"Burning coal causes:","o":["air pollution","clean air","rain","more trees"],"a":0,"e":"","sh":1},{"id":"evs7m5","k":"mcq","q":"LED bulbs:","o":["use less electricity","use more electricity","give no light","are unsafe"],"a":0,"e":"","sh":1},{"id":"evs7m6","k":"mcq","q":"Which is a fuel?","o":["Petrol","Sunlight","Wind","Water"],"a":0,"e":"","sh":1},{"id":"evs7m7","k":"mcq","q":"We should never touch switches with:","o":["wet hands","dry hands","gloves","a dry cloth"],"a":0,"e":"","sh":1},{"id":"evs7m8","k":"mcq","q":"Bhadla Solar Park is in:","o":["Rajasthan","Kerala","Bihar","Assam"],"a":0,"e":"","sh":1},{"id":"evs7m9","k":"mcq","q":"A watermill uses the energy of:","o":["flowing water","coal","petrol","electricity"],"a":0,"e":"","sh":1},{"id":"evs7m10","k":"mcq","q":"Clothes dry in the Sun because of:","o":["heat from the Sun","wind only","electricity","moonlight"],"a":0,"e":"","sh":1},{"id":"evs7m11","k":"mcq","q":"To save energy we should:","o":["switch off lights when leaving a room","leave the TV on","open the fridge often","use old bulbs"],"a":0,"e":"","sh":1},{"id":"evs7t12","k":"tf","q":"Sunlight, wind and water are clean energy sources.","a":0,"e":""},{"id":"evs7t13","k":"tf","q":"It is safe to put a pin into a socket.","a":1,"e":"Never put objects into sockets."},{"id":"evs7t14","k":"tf","q":"A pressure cooker whistles because of steam energy.","a":0,"e":""},{"id":"evs7t15","k":"tf","q":"Most of our electricity comes from burning coal.","a":0,"e":"That is why saving electricity helps the air."},{"id":"evs7f16","k":"mcq","fill":1,"q":"Energy from the Sun is called ___ energy.","o":["solar","wind","coal","water"],"a":0,"e":"","sh":1},{"id":"evs7f17","k":"mcq","fill":1,"q":"A fan uses ___ energy to move air.","o":["electrical","food","wind","solar only"],"a":0,"e":"","sh":1},{"id":"evs7f18","k":"mcq","fill":1,"q":"Bulbs that save energy are ___ bulbs.","o":["LED","old","broken","big"],"a":0,"e":"","sh":1},{"id":"evs7f19","k":"mcq","fill":1,"q":"Petrol, diesel and coal are ___.","o":["fuels","foods","metals","plants"],"a":0,"e":"","sh":1}]},{"n":8,"t":"Clothes – How Things Are Made","intro":"Unit 4: Things Around Us. Natural and synthetic fibres, spinning, weaving, handlooms, khadi, nature’s weavers, silk moth and embroidery of India.","prio":[{"t":"Natural vs synthetic fibres","s":3},{"t":"Spinning and weaving (warp and weft)","s":3},{"t":"Khadi and Gandhiji","s":3},{"t":"Famous handlooms and embroideries with states","s":2},{"t":"Silk moth life cycle","s":2}],"notes":[{"h":"Fibres","t":"Thin strands that make thread. Natural: cotton (plant), jute (plant), silk (silk moth cocoon), wool (sheep, goats). Synthetic: nylon, polyester, rayon — made in factories from chemicals."},{"h":"From fibre to cloth","t":"Fibre → spinning (twisting into yarn, e.g. on a charkha) → weaving (crossing threads on a loom) → cloth → stitching."},{"h":"Warp and weft","t":"Weaving uses two sets of threads: warp (lengthwise/vertical) and weft (across/horizontal)."},{"h":"Khadi","t":"Gandhiji asked Indians to spin and weave their own cloth (khadi) on the charkha — a symbol of self-reliance during the freedom struggle."},{"h":"India’s weaving pride","t":"Over 4,000 years old. Kanjeevaram (Tamil Nadu), Pashmina (Kashmir), Ikat (Odisha, Gujarat), Patola (Gujarat — can take up to a year). Fine old muslin was called ‘woven air’. India is the largest producer of jute."},{"h":"Nature’s weavers","t":"The baya weaver bird weaves pouch-shaped nests with grass; the tailorbird stitches leaves together."},{"h":"Silk moth life cycle","t":"Egg → caterpillar (silkworm) → cocoon → adult moth."},{"h":"Embroidery of India","t":"Chikankari – Lucknow (UP) · Phulkari – Punjab · Kantha – West Bengal, Odisha · Banjara and Gota – Rajasthan · Toda – Tamil Nadu · Khneng – Meghalaya."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Write the steps from fibre to cloth.","a":"Fibre is cleaned → spun into yarn (spinning) → yarn woven on a loom (weaving) → cloth → stitched into clothes.","m":3},{"q":"Why did Gandhiji promote khadi?","a":"To make Indians self-reliant by spinning and weaving their own cloth instead of buying foreign cloth.","m":2},{"q":"Write the life cycle of the silk moth.","a":"Egg → caterpillar (silkworm) → cocoon → adult moth.","m":2}],"rq":[],"traps":[{"m":"Mixing up spinning and weaving","c":"Spinning makes thread from fibre; weaving makes cloth from thread.","t":"Spin first, then weave."}],"qs":[{"id":"evs8m0","k":"mcq","q":"Silk comes from the:","o":["cocoon of the silk moth","sheep","cotton plant","jute plant"],"a":0,"e":"","sh":1},{"id":"evs8m1","k":"mcq","q":"Wool comes from:","o":["sheep and goats","cotton plants","silkworms","factories"],"a":0,"e":"","sh":1},{"id":"evs8m2","k":"mcq","q":"Which is a synthetic fibre?","o":["Polyester","Cotton","Jute","Wool"],"a":0,"e":"","sh":1},{"id":"evs8m3","k":"mcq","q":"Twisting fibres into thread is called:","o":["spinning","weaving","stitching","knitting only"],"a":0,"e":"","sh":1},{"id":"evs8m4","k":"mcq","q":"Gandhiji encouraged people d night, the six Indian seasons (ritus), crops and festivals linked to seasons, and keeping a nature journal.","prio":[{"t":"Day and night — Earth’s rotation","s":3},{"t":"Six seasons (ritus) of India","s":3},{"t":"Crops and festivals of each season","s":3},{"t":"Nature signs and journaling","s":2}],"notes":[{"h":"Day and night","t":"The Earth rotates on its axis. The side facing the Sun has day; the other side has night. One full turn takes 24 hours."},{"h":"Six ritus","t":"Vasanta (spring, Mar–Apr) · Grishma (summer, May–Jun) · Varsha (monsoon, Jul–Sep) · Sharad (autumn, Oct–Nov) · Hemant (pre-winter, Nov–Dec) · Shishir (winter, Dec–Feb)."},{"h":"Seasons and crops","t":"Rice and sugarcane grow in the rainy season; wheat grows in winter."},{"h":"Seasons and festivals","t":"Holi – spring · Diwali – around winter · Pongal and Makar Sankranti – harvest after winter · Baisakhi, Vishu and Rongali Bihu – harvest time."},{"h":"Same season, different places","t":"Winter is mild in Kerala but snowy in Kashmir; monsoon is heavy in Assam and light in Rajasthan."},{"h":"Nature’s signs","t":"Ants carrying eggs to higher ground and the koel singing are signs of coming rain for farmers."},{"h":"Journaling","t":"Writing regular observations of plants, birds, water and weather helps us notice nature’s patterns."},{"h":"Earth’s surface","t":"About three-fourths of Earth is covered with water."}],"conc":[],"top":[],"prac":[],"comp":[],"case":[],"mock":[{"q":"Name the six Indian seasons in order.","a":"Vasanta (spring), Grishma (summer), Varsha (monsoon), Sharad (autumn), Hemant (pre-winter), Shishir (winter).","m":3},{"q":"How are day and night caused?","a":"The Earth spins on its axis; the part facing the Sun has day and the part away from it has night.","m":2},{"q":"Match: Holi, Pongal, Diwali with their seasons.","a":"Holi – spring; Pongal – harvest after winter (January); Diwali – around winter (autumn end).","m":2}],"rq":[],"traps":[{"m":"Saying the Sun goes round the Earth to m function streak(){let s=0;const d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);

function mk(q,ans,wrongs,e){const set=[String(ans)];for(const w of wrongs){const s=String(w);if(!set.includes(s)&&set.length<4)set.push(s)}
 const m=String(ans).match(/^(-?\d+)(.*)$/);let k=1;while(set.length<4&&k<40){const base=m?+m[1]:0,suf=m?m[2]:"";const v=(base+(k%2?1:-1)*Math.ceil(k/2)*(base>20?Math.max(1,Math.round(base/20)):1))+suf;if(!set.includes(v))set.push(v);k++}
 return {id:"gen",k:"mcq",q,o:set,a:0,e,sh:1,gen:1}}
const gcd=(a,b)=>b?gcd(b,a%b):a; const lcm=(a,b)=>a*b/gcd(a,b);
const frac=(n,d)=>{const g=gcd(Math.abs(n),d);n/=g;d/=g;return d===1?String(n):n+"/"+d};
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const GEN={
 1:[()=>{const n=ri(10000,999999),s=String(n),i=ri(0,s.length-1),d=+s[i],pv=d*10**(s.length-1-i);const names=["ones","tens","hundreds","thousands","ten thousands","lakhs"];return mk(`Place value of the digit ${d} at the ${names[s.length-1-i]} place in ${n.toLocaleString("en-IN")}:`,pv.toLocaleString("en-IN"),[d,(d*10**(s.length-i)).toLocaleString("en-IN"),(d*10**Math.max(0,s.length-2-i)).toLocaleString("en-IN")],`${d} × ${(10**(s.length-1-i)).toLocaleString("en-IN")}.`)},
    ()=>{const n=ri(1001,9999),p=pick([10,100,1000]);const r=Math.round(n/p)*p;return mk(`Round ${n.toLocaleString("en-IN")} to the nearest ${p}:`,r.toLocaleString("en-IN"),[(r+p).toLocaleString("en-IN"),(r-p).toLocaleString("en-IN"),n.toLocaleString("en-IN")],`Look at the digit to the right of the ${p}s place.`)},
    ()=>{const a=ri(10000,99999);let b;do{b=a+pick([-1,1])*pick([1,10,100,1000])}while(b===a);const g=Math.max(a,b);return mk(`Which is greater: ${a.toLocaleString("en-IN")} or ${b.toLocaleString("en-IN")}?`,g.toLocaleString("en-IN"),[Math.min(a,b).toLocaleString("en-IN"),"Both are equal","Cannot say"],`Compare digits from the left.`)}],
 2:[()=>{const d=pick([2,3,4,5,6,8,10]),n=ri(1,d-1),k=ri(2,9);return mk(`${n}/${d} of ${d*k} =`,n*k,[k,d*k-n,n*k+d],`${d*k} ÷ ${d} = ${k}, then × ${n}.`)},
    ()=>{const d=ri(3,9),n=ri(1,d-1),m=ri(2,5);return mk(`${n}/${d} = ?/${d*m}`,n*m,[n+m,n*m+1,d*m-n],`Multiply top and bottom by ${m}.`)},
    ()=>{const d=ri(5,12),a=ri(1,d-2),b=ri(1,d-1-a);return mk(`${a}/${d} + ${b}/${d} =`,`${a+b}/${d}`,[`${a+b}/${2*d}`,`${a*b}/${d}`,`${a+b+1}/${d}`],`Same denominator: add the numerators.`)}],
 3:[()=>{const D=["North","East","South","West"],s=ri(0,3),t=pick([1,2,3]),cw=ri(0,1);const e=D[(s+(cw?t:4-t))%4];return mk(`Facing ${D[s]}, you make ${["","a quarter","a half","a three-quarter"][t]} turn ${cw?"clockwise":"anticlockwise"}. You now face:`,e,D.filter(x=>x!==e),`Each quarter turn = 1 right angle.`)},
    ()=>{const t=pick([["quarter",1],["half",2],["three-quarter",3],["full",4]]);return mk(`How many right angles in a ${t[0]} turn?`,t[1],[1,2,3,4].filter(x=>x!==t[1]),`Quarter = 1, half = 2, three-quarter = 3, full = 4.`)}],
 4:[()=>{const a=ri(10000,59999),b=ri(1000,39999);return mk(`${a.toLocaleString("en-IN")} + ${b.toLocaleString("en-IN")} =`,(a+b).toLocaleString("en-IN"),[(a+b+10).toLocaleString("en-IN"),(a+b-100).toLocaleString("en-IN"),(a+b+1000).toLocaleString("en-IN")],`Add ones, tens, hundreds… carry when needed.`)},
    ()=>{const a=ri(20000,99999),b=ri(1000,a-1000);return mk(`${a.toLocaleString("en-IN")} − ${b.toLocaleString("en-IN")} =`,(a-b).toLocaleString("en-IN"),[(a-b+10).toLocaleString("en-IN"),(a-b-100).toLocaleString("en-IN"),(a-b+1000).toLocaleString("en-IN")],`Check: answer + ${b.toLocaleString("en-IN")} = ${a.toLocaleString("en-IN")}.`)},
    ()=>{const a=ri(11,999),b=ri(11,999);const e=(a+b)%2?"odd":"even";return mk(`Is ${a} + ${b} even or odd?`,e,[e==="odd"?"even":"odd","neither","both"],`even+even=even, odd+odd=even, even+odd=odd.`)}],
 5:[()=>{const m=ri(2,25);return mk(`${m} m = ? cm`,m*100,[m*10,m*1000,m+100],`1 m = 100 cm.`)},
    ()=>{const k=ri(2,15),m=pick([0,250,500,750]);return mk(`${k} km ${m} m = ? m`,(k*1000+m).toLocaleString("en-IN"),[(k*100+m).toLocaleString("en-IN"),(k*1000+m*10).toLocaleString("en-IN"),(k+m).toLocaleString("en-IN")],`1 km = 1,000 m.`)},
    ()=>{const c=ri(1,9)*100+pick([0,20,50]);return mk(`${c} cm = ?`,`${Math.floor(c/100)} m ${c%100} cm`,[`${c%100} m ${Math.floor(c/100)} cm`,`${Math.floor(c/10)} m ${c%10} cm`,`${c} m`],`100 cm = 1 m.`)}],
 6:[()=>{const a=ri(12,99),b=ri(3,9);return mk(`${a} × ${b} =`,a*b,[a*b+b,a*b-a,a+b],`Break it: ${Math.floor(a/10)*10} × ${b} + ${a%10} × ${b}.`)},
    ()=>{const a=ri(11,99),b=pick([10,100,1000]);return mk(`${a} × ${b} =`,(a*b).toLocaleString("en-IN"),[(a*b*10).toLocaleString("en-IN"),(a*b/10).toLocaleString("en-IN"),(a+b).toLocaleString("en-IN")],`Put ${String(b).length-1} zero(s) at the end.`)},
    ()=>{const a=ri(11,49),b=ri(11,29);return mk(`${a} × ${b} =`,a*b,[a*b+10,a*b-a,a*(b-10)],`${a} × ${Math.floor(b/10)*10} + ${a} × ${b%10}.`)}],
 7:[()=>{const s=ri(1,9),d=ri(2,9);const q=[s,s+d,s+2*d,s+3*d];return mk(`Next: ${q.join(", ")}, ?`,s+4*d,[s+4*d+1,s+3*d+2,s+5*d],`Add ${d} each time.`)},
    ()=>{const p=pick([["triangle",3],["square",4],["pentagon",5],["hexagon",6],["octagon",8]]);return mk(`How many sides does a ${p[0]} have?`,p[1],[3,4,5,6,8].filter(x=>x!==p[1]),`Sides = corners.`)},
    ()=>{const s=ri(1,5);const q=[s,s*2,s*4,s*8];return mk(`Next: ${q.join(", ")}, ?`,s*16,[s*10,s*12,s*9],`Doubles each time.`)}],
 8:[()=>{const k=ri(1,9),g=pick([0,50,250,500,750]);return mk(`${k} kg ${g} g = ? g`,(k*1000+g).toLocaleString("en-IN"),[(k*100+g).toLocaleString("en-IN"),(k*1000+g*10).toLocaleString("en-IN"),(k+g).toLocaleString("en-IN")],`1 kg = 1,000 g.`)},
    ()=>{const l=ri(1,9),m=pick([250,500,750]);return mk(`${(l*1000+m).toLocaleString("en-IN")} mL = ?`,`${l} L ${m} mL`,[`${l*10} L ${m} mL`,`${m} L ${l} mL`,`${l} L ${m/10} mL`],`1 L = 1,000 mL.`)},
    ()=>{const c=pick([250,200,500,100]),l=ri(1,5);return mk(`How many ${c} mL glasses can be filled from ${l} L?`,l*1000/c,[l*1000/c+1,l*1000/c-1,l*c/100],`${l*1000} ÷ ${c}.`)}],
 9:[()=>{const d=ri(2,9),q=ri(5,30),r=ri(0,d-1),n=d*q+r;return mk(`${n} ÷ ${d}: quotient and remainder?`,`Q ${q}, R ${r}`,[`Q ${q+1}, R ${r}`,`Q ${q}, R ${r+1}`,`Q ${q-1}, R ${r+d}`],`${d} × ${q} = ${d*q}; ${n} − ${d*q} = ${r}.`)},
    ()=>{const d=ri(2,9),q=ri(11,99);return mk(`${d*q} ÷ ${d} =`,q,[q+1,q-1,q+10],`Check: ${d} × ${q} = ${d*q}.`)},
    ()=>{const k=ri(2,9)*100;return mk(`${k*10} ÷ 100 =`,k/10,[k,k*10,k/100],`Remove two zeros.`)}],
 10:[()=>{const s=pick([["square",4],["rectangle",2],["equilateral triangle",3],["scalene triangle",0],["regular hexagon",6]]);return mk(`Lines of symmetry of a ${s[0]}:`,s[1],[0,2,3,4,6].filter(x=>x!==s[1]).slice(0,3),`Use the folding test.`)},

 11:[()=>{const l=ri(3,20),b=ri(2,l);return mk(`Area of a rectangle ${l} cm × ${b} cm:`,`${l*b} sq cm`,[`${2*(l+b)} sq cm`,`${l+b} sq cm`,`${l*b} cm`],`Area = length × breadth.`)},

let Q=null,timerId=null;
function prepare(q){q=Object.assign({},q);if(q.k==="mcq"){let idx=q.o.map((_,i)=>i);if(q.sh)idx=shuffle(idx);q.oo=idx.map(i=>q.o[i]);q.ca=idx.indexOf(q.a)}else if(q.k==="tf"){q.oo=q.sid==="hin"?["सही","गलत"]:["True","False"];q.ca=q.a}else{q.oo=AR_OPTS;q.ca=q.a}return q}
function startQuiz(list,opts={}){if(!list.length){toast("Nothing here yet! 🎉");return}
 Q={list:list.map(prepare),i:0,ans:[],title:opts.title||"Practice",back:opts.back||{v:"home"},exam:!!opts.exam,gen:opts.gen||null,time:opts.time||0,start:Date.now(),daily:!!opts.daily};
 go("quiz",{daily:!!opts.daily});if(Q.time)startTimer()}
function smartPick(qs,n){const w=q=>{const r=S.q[q.id];if(!r)return 3+Math.random();if(!r.l)return 4+Math.random();return Math.random()*(1/(r.c+1))};return qs.slice().sort((a,b)=>w(b)-w(a)).slice(0,n)}
function startChapter(sid,cn,mode){const s=subj(sid),ch=s.chapters.find(c=>c.n===cn);let l=ch.qs.map(q=>Object.assign({sid,cn},q));
 if(mode==="smart")l=shuffle(smartPick(l,15));else if(mode==="wrong")l=shuffle(l.filter(q=>S.q[q.id]&&!S.q[q.id].l));else if(mode==="tf")l=shuffle(l.filter(q=>q.k!=="mcq"));else if(mode==="fill")l=shuffle(l.filter(q=>q.fill));else l=shuffle(l);
 startQuiz(l,{title:`Ch ${cn} · ${ch.t}`,back:{v:"chapter",s:sid,c:cn,tab:"practice"}})}
function startSubjectMix(sid){const s=subj(sid);const l=ALL.filter(q=>q.sid===sid);startQuiz(shuffle(smartPick(l,20)),{title:`${s.name} mixed practice`,back:{v:"subject",s:sid}})}
function startDaily(){const per=5;let l=[];for(const s of DATA.subjects){l=l.concat(smartPick(ALL.filter(q=>q.sid===s.id),per))}startQuiz(shuffle(l),{title:"⚡ Daily 15 Challenge",back:{v:"home"},daily:true})}
function startGen(cn){const g=GEN[cn];const l=[];for(let i=0;i<10;i++)l.push(Object.assign({sid:"math",cn},pick(g)()));const ch=subj("math").chapters.find(c=>c.n===cn);startQuiz(l,{title:`♾️ Unlimited · Ch ${cn}`,back:{v:"chapter",s:"math",c:cn,tab:"practice"},gen:cn})}
function startTimer(){stopTimer();timerId=setInterval(()=>{const el=$("#tmr");if(!Q){stopTimer();return}const left=Q.time-Math.floor((Date.now()-Q.start)/1000);if(left<=0){stopTimer();finishQuiz();return}if(el)el.textContent=fmtT(left)},1000)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
const fmtT=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function vQuiz(el){const q=Q.list[Q.i];const n=Q.list.length;const answered=Q.ans[Q.i]!==undefined;const s=subj(q.sid);const ch=s&&s.chapters.find(c=>c.n===q.cn);
 const left=Q.time?Q.time-Math.floor((Date.now()-Q.start)/1000):0;
 const meta=`<span class="pill" style="background:color-mix(in srgb,${s.color} 15%,#fff);color:${s.color}">${s.icon} ${s.name} · Ch ${q.cn}</span>${q.fill?'<span class="pill" style="background:#f3e8ff;color:#7e22ce">Fill in the blank</span>':""}${q.k==="tf"?'<span class="pill">'+(q.sid==="hin"?"सही / गलत":"True / False")+'</span>':q.k==="ar"?'<span class="pill">Assertion–Reason</span>':""}${q.imp?'<span class="pill imp">★ Important</span>':""}${q.x||q.gen?'<span class="pill x">Extra practice</span>':""}`;
 const qtext=q.k==="ar"?`<div class="qtext" style="font-size:18px">Read both statements and choose the correct option.</div><div class="ar mt"><div><b>Assertion (A):</b> ${esc(q.A)}</div><div><b>Reason (R):</b> ${esc(q.R)}</div></div>`:`<div class="qtext">${q.fill?esc(q.q).replace(/_{3}/,answered&&!Q.exam?`<span class="blank filled">${esc(q.oo[q.ca])}</span>`:'<span class="blank">&nbsp;</span>'):esc(q.q)}</div>`;
 const chosen=Q.ans[Q.i];
 const opts=q.oo.map((o,i)=>{let c="";if(answered){if(Q.exam){if(i===chosen)c="sel"}else{if(i===q.ca)c="ok";else if(i===chosen)c="no"}}
  return `<button class="opt ${c}" ${answered&&!Q.exam?"disabled":""} onclick="answer(${i})">${q.k==="tf"?"":`<span class="l">${LET[i]}</span>`}<span>${q.k==="tf"?(i===0?"✔ ":"✘ ")+esc(o):esc(o)}</span></button>`}).join("");
 const right=chosen===q.ca;
 const fb=answered&&!Q.exam?`<div class="feedback show ${right?"good":"bad"}"><b>${right?pick(["Correct! 🎉","Super! ⭐","Well done! 👏","Yes! 💯","Brilliant! 🌟"]):"Not quite 🙂"}</b>${!right?`<div>Correct answer: <b>${q.k==="tf"?q.oo[q.ca]:LET[q.ca]+". "+esc(q.oo[q.ca])}</b></div>`:""}${q.e?`<div style="margin-top:4px">💡 ${esc(q.e)}</div>`:""}</div>`:"";
 el.innerHTML=`<div class="qhead"><button class="back" onclick="quitQuiz()">✕</button><div class="qprog"><i style="width:${(Q.i+(answered?1:0))*100/n}%"></i></div>${Q.time?`<div class="timer" id="tmr">⏱ ${fmtT(Math.max(0,left))}</div>`:""}<div class="qcount">${Q.i+1}/${n}</div></div>
 <div class="small" style="margin:-4px 4px 10px;font-weight:700">${esc(Q.title)}</div>
 <div class="qcard"><div class="meta">${meta}</div>${qtext}<div class="opts ${q.k==="tf"?"tfopts":""}">${opts}</div>${fb}</div>
 <div class="qfoot">${Q.exam?`<div class="row"><button class="btn alt" ${Q.i===0?"disabled":""} onclick="Q.i--;render()">‹ Back</button><div class="spacer"></div><button class="btn" onclick="nextQ()">${Q.i===n-1?"Submit test":"Next ›"}</button></div>`
  :`<button class="btn block" ${answered?"":"disabled"} onclick="nextQ()">${Q.i===n-1?"See my score":"Next question ›"}</button>`}</div>`;
}
function answer(i){if(Q.ans[Q.i]!==undefined&&!Q.exam)return;Q.ans[Q.i]=i;const q=Q.list[Q.i];
 if(!Q.exam){record(q,i===q.ca);if(i===q.ca){S.xp+=2}else if(navigator.vibrate){try{navigator.vibrate(80)}catch(e){}}save()}render()}
function record(q,ok){bumpDay();if(q.gen||q.id==="gen")return;const r=S.q[q.id]||{c:0,w:0,l:0};if(ok)r.c++;else r.w++;r.l=ok?1:0;r.t=Date.now();S.q[q.id]=r}
function nextQ(){if(Q.i<Q.list.length-1){Q.i++;render();window.scrollTo(0,0)}else{if(Q.exam&&Q.ans.filter(a=>a!==undefined).length<Q.list.length&&!confirm(`You have ${Q.list.length-Q.ans.filter(a=>a!==undefined).length} unanswered question(s). Submit anyway?`))return;finishQuiz()}}
function quitQuiz(){if(Q&&Q.ans.length&&!confirm("Leave this quiz? Answers so far are saved."))return;const b=Q.back;Q=null;go(b.v,b)}
function finishQuiz(){stopTimer();if(Q.dt){finishDT();return}if(Q.exam){Q.list.forEach((q,i)=>{if(Q.ans[i]!==undefined)record(q,Q.ans[i]===q.ca);else record(q,false)});}
 const correct=Q.list.filter((q,i)=>Q.ans[i]===q.ca).length;const pct=Math.round(correct*100/Q.list.length);
 if(Q.exam){S.xp+=correct*2;S.tests.push({d:today(),t:Q.title,p:pct,n:Q.list.length})}
 if(pct===100)S.xp+=10;save();
 Q.result={correct,pct};go("result");if(pct>=95)confetti()}
